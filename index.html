<head>

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#2A1A10">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="format-detection" content="telephone=no">
  <title>Moondrop Mountain</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html {
      --sat: env(safe-area-inset-top, 0px);
      --sar: env(safe-area-inset-right, 0px);
      --sab: env(safe-area-inset-bottom, 0px);
      --sal: env(safe-area-inset-left, 0px);
    }
    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      overscroll-behavior: none;
      -webkit-text-size-adjust: 100%;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none;
      user-select: none;
      background: #2A1A10;
    }
    body {
      position: fixed;
      inset: 0;
    }
    #frame {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #2A1A10;
    }
    #game {
      display: block;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      -ms-interpolation-mode: nearest-neighbor;
      background: #5FBF22;
    }
    #frame:fullscreen,
    #frame:-webkit-full-screen {
      width: 100%;
      height: 100%;
      background: #2A1A10;
    }
    #hudBtns {
      position: absolute;
      top: max(6px, var(--sat));
      right: max(6px, var(--sar));
      z-index: 5;
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 2px;
    }
    #hudBtns button {
      width: 36px;
      height: 36px;
      padding: 0;
      border: 0;
      background: transparent;
      cursor: pointer;
      -webkit-appearance: none;
      appearance: none;
      touch-action: manipulation;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #hudBtns canvas {
      display: block;
      width: 36px;
      height: 22px;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      pointer-events: none;
    }
    #hudBtns button:active canvas { filter: brightness(0.9); }
    #hudBtns button.is-off canvas { opacity: 0.55; }
  </style>
</head>
<body>

    <canvas id="game" width="640" height="384" role="application" aria-label="Moondrop Mountain"></canvas>
    <div id="hudBtns">

      <button type="button" id="rlBtn" aria-label="Reload farm">

    var m = /(?:\?|&)v=([^&]*)/.exec(location.search || "");

  }

  function bustUrl(url) {
    /* Always bust with THIS html's BUILD + atlas byte size — never a stale ?v= from an old version.json redirect */
    return url + (url.indexOf("?") >= 0 ? "&" : "?") + "v=" + encodeURIComponent(BUILD + "-" + ASSET_REV);
  }

  function buildRank(v) {
    var m = /^(\d{8})([a-z]*)$/i.exec(String(v || ""));
    if (!m) return { day: 0, tag: "" };
    return { day: parseInt(m[1], 10) || 0, tag: (m[2] || "").toLowerCase() };
  }

  function buildNewer(a, b) {
    /* true if a is a newer BUILD id than b (day first; longer letter tag wins: aa > z) */
    var A = buildRank(a), B = buildRank(b);
    if (A.day !== B.day) return A.day > B.day;
    if (A.tag.length !== B.tag.length) return A.tag.length > B.tag.length;
    return A.tag > B.tag;
  }

    persistSave();

  function checkFreshBuild() {
    fetch("assets/version.json?t=" + Date.now(), { cache: "no-store" }).then(function (r) {
      if (!r.ok) return null;
      return r.json();
    }).then(function (ver) {
      var remote;
      if (!ver || !ver.v || ver.v === BUILD) return;
      remote = String(ver.v);
      /* 20260905av: never "upgrade" to a STALE version.json (was pinning ?v=05x
         while HTML was 05au+, so CDN kept serving the old 1× atlas). */
      if (!buildNewer(remote, BUILD)) return;
      try {
        if (sessionStorage.getItem("moondrop-build") === remote) return;
        sessionStorage.setItem("moondrop-build", remote);
      } catch (err) {}
      persistSave();
      location.replace((location.pathname || "/") + "?v=" + encodeURIComponent(remote));

  function mineDecorWallBeside(tx, ty) {
    var g;
    if (!GROUND || ty < 0 || ty >= GROUND.length || !GROUND[ty]) return false;
    function wall(x, y) {
      if (y < 0 || y >= GROUND.length || !GROUND[y]) return true;
      if (x < 0 || x >= GROUND[y].length) return true;
      return GROUND[y][x] === "#";
    }
    g = GROUND[ty][tx];
    if (g !== "s") return false;
    return wall(tx - 1, ty) || wall(tx + 1, ty) || wall(tx, ty - 1) || wall(tx, ty + 1);
  }

  function mineDecorBlocked(props, floorKey, tx, ty, kind) {
    var i, p, spots, hk;
    if (tx < 0 || ty < 0) return true;
    if (!GROUND || ty >= GROUND.length || !GROUND[ty] || tx >= GROUND[ty].length) return true;
    if (GROUND[ty][tx] === "#") return true;
    if (mineDecorHas(props, kind, tx, ty)) return true;
    if (mineDecorTileTaken(props, tx, ty)) return true;
    spots = MINE_DECOR_CLEAR[floorKey];
    if (spots) {
      for (i = 0; i < spots.length; i++) {
        if (spots[i][0] === tx && spots[i][1] === ty) return true;
      }
    }
    for (i = 0; i < props.length; i++) {
      p = props[i];
      if (p && MINE_DECOR_BLOCK[p.kind] && p.tx === tx && p.ty === ty) return true;
    }
    hk = nodeKey(floorKey, tx, ty);
    if (harvestNodes[hk]) return true;
    if ((kind === "crate" || kind === "lantern") && !mineDecorWallBeside(tx, ty)) return true;
    return false;

    var plan, kinds, ki, kind, spots, si, tx, ty, item, pi;

    for (pi = 0; pi < props.length; pi++) {

        /* Quest mushroom at floor1 (27,3) stays unique; all others are snacks */
        if (!(mineFloor === 1 && props[pi].tx === 27 && props[pi].ty === 3)) props[pi].loose = true;
      }
    }
    plan = MINE_DECOR_SPOTS[floorKey];
    if (!plan) return;
    kinds = ["crate", "lantern", "mushroom"];
    for (ki = 0; ki < kinds.length; ki++) {
      kind = kinds[ki];
      spots = plan[kind];
      if (!spots) continue;
      for (si = 0; si < spots.length; si++) {
        tx = spots[si][0];

    }

  function applyPeakSummitOpen(g) {
    var cells, i, tx, ty, row;
    if (!g) return;
    /* Continue the painted dirt through the old rock choke (cols 18-20, rows 2-5). */
    cells = [
      [18, 5], [19, 5], [20, 5],
      [18, 4], [19, 4], [20, 4],
      [18, 3], [19, 3], [20, 3],
      [18, 2], [19, 2], [20, 2]
    ];
    for (i = 0; i < cells.length; i++) {
      tx = cells[i][0];
      ty = cells[i][1];
      if (ty < 0 || ty >= g.length) continue;
      row = g[ty];
      if (!row || tx < 0 || tx >= row.length) continue;
      row[tx] = "f";
    }

    var d = up ? climbUpSpot() : climbDownSpot();

      d = climbMouthSpot();
      highlight = d ? { tx: d.tx, ty: d.ty } : null;

    if (!d) return;
    highlight = { tx: d.tx, ty: d.ty };
    if (player.tx === d.tx && player.ty === d.ty) {

      else climbPeakDown();

  function tryPeakDoors() {
    var f;
    if (currentScene === "peak") {
      if (isPeakCave(player.tx, player.ty)) {
        enterClimbFloor(2, "mouth");
        return true;
      }
      if (isPeakRocks(player.tx, player.ty)) {
        talkPeakRocks();
        return true;
      }
      f = facingTile();
      if (isPeakCave(f.tx, f.ty)) {
        goPeakCave();
        return true;
      }
      if (isPeakRocks(f.tx, f.ty)) {
        goPeakRocks();
        return true;
      }
      return false;
    }
    if (isMinePeakStairs(player.tx, player.ty)) {
      enterClimbFloor(1, "up");
      return true;
    }
    if (currentScene === "mine" && mineFloor === 6) {
      f = facingTile();
      if (isMinePeakStairs(f.tx, f.ty)) {
        goMinePeakStairs();
        return true;
      }
    }
    if (currentScene !== "caveclimb") return false;
    if (isClimbDown(player.tx, player.ty)) {
      climbPeakDown();
      return true;
    }
    if (isClimbUp(player.tx, player.ty)) {
      climbPeakUp();
      return true;
    }
    if (isClimbMouth(player.tx, player.ty)) {
      enterPeak("mouth");
      return true;
    }
    f = facingTile();
    if (isClimbDown(f.tx, f.ty)) {
      goClimbShaft(false);
      return true;
    }
    if (isClimbUp(f.tx, f.ty) || isClimbMouth(f.tx, f.ty)) {
      goClimbShaft(true);
      return true;
    }
    return false;
  }

  /* 20260905bo: nearest sand/pier tile for docking the boat on the island */
  function nearestShoreF(tx, ty) {
    var r, x, y, nx, ny, maxR;
    tx = tx | 0;
    ty = ty | 0;
    if (inBounds(tx, ty) && cell(tx, ty) === "f") return { tx: tx, ty: ty };
    maxR = 16;
    for (r = 1; r <= maxR; r++) {
      for (x = -r; x <= r; x++) {
        y = r - Math.abs(x);
        nx = tx + x;
        ny = ty + y;
        if (inBounds(nx, ny) && cell(nx, ny) === "f") return { tx: nx, ty: ny };
        if (y) {
          ny = ty - y;
          if (inBounds(nx, ny) && cell(nx, ny) === "f") return { tx: nx, ty: ny };
        }
      }
    }
    return { tx: islandCaveIn.tx, ty: islandCaveIn.ty + 1 };
  }

  /* Dock + show boat on current ocean shore before leaving the scene while aboard */
  function dockBoatBeforeLeavingOcean() {
    var spot, b;
    if (!onBoat || currentScene !== "ocean") return;
    spot = nearestShoreF(player.tx, player.ty);
    b = dockBoatAt(spot.tx, spot.ty);
    if (b) {
      b.hidden = false;
      b.aboard = false;
    }
    onBoat = false;
    buildSolid();
  }

  /* After returning to ocean, boat must be visible at boatDock (island if that is where you left it) */
  function ensureBoatVisibleAtDock() {
    var b, spot;
    if (currentScene !== "ocean") return;
    if (!boatDock || typeof boatDock.tx !== "number" || typeof boatDock.ty !== "number") {
      spot = nearestShoreF(islandCaveIn.tx, islandCaveIn.ty);
      boatDock = { tx: spot.tx, ty: spot.ty };
    }
    b = ensureOceanBoat();
    if (!b) return;
    b.tx = boatDock.tx;
    b.ty = boatDock.ty;
    b.hidden = false;
    b.aboard = false;
  }

  function findRowboat() {
    var i, p;
    for (i = 0; i < PROPS.length; i++) {
      p = PROPS[i];
      if (p.kind === "rowboat") return p;
    }
    return null;
  }

  function ensureOceanBoat() {
    var b = findRowboat();
    var home;
    if (!b) {
      home = boatDock || boatHome;
      PROPS.push({ kind: "rowboat", tx: home.tx, ty: home.ty });
      b = findRowboat();
    }
    if (!b) return null;
    /* 20260905ad: never snap an existing boat back to the pier — it stays where you got off */
    if (onBoat) {
      b.hidden = true;
      b.aboard = true;
    } else {
      b.hidden = false;
      b.aboard = false;
    }
    return b;
  }

  function dockBoatAt(tx, ty) {
    var b, nx, ny, trySpots, i, s;
    b = ensureOceanBoat();
    if (!b) return null;
    trySpots = [
      { tx: tx, ty: ty },
      { tx: tx - 1, ty: ty },
      { tx: tx - 2, ty: ty },
      { tx: tx, ty: ty - 1 },
      { tx: tx - 1, ty: ty - 1 }
    ];
    for (i = 0; i < trySpots.length; i++) {
      s = trySpots[i];
      if (!inBounds(s.tx, s.ty)) continue;
      /* Prefer shore (f) so the hull sits on the beach/pier next to you */
      if (cell(s.tx, s.ty) === "f") {
        nx = s.tx;
        ny = s.ty;
        break;
      }
    }
    if (nx === undefined) {
      nx = tx;
      ny = ty;
    }
    b.tx = nx;
    b.ty = ny;
    boatDock = { tx: nx, ty: ny };
    return b;
  }

  function boatShoreSpot() {
    var spots, i, s;
    spots = [
      { tx: 26, ty: 21 }, { tx: 27, ty: 21 }, { tx: 26, ty: 24 }, { tx: 27, ty: 24 },
      { tx: 29, ty: 24 }, { tx: 28, ty: 24 }, { tx: 32, ty: 24 }, { tx: oceanLand.tx, ty: oceanLand.ty }
    ];
    for (i = 0; i < spots.length; i++) {
      s = spots[i];
      if (inBounds(s.tx, s.ty) && cell(s.tx, s.ty) === "f" && walkable(s.tx, s.ty)) return s;
    }
    for (i = 0; i < spots.length; i++) {
      s = spots[i];
      if (inBounds(s.tx, s.ty) && cell(s.tx, s.ty) === "f") return s;
    }
    return { tx: oceanLand.tx, ty: oceanLand.ty };
  }

  function boardBoat() {
    var b, wx, wy;
    if (onBoat || currentScene !== "ocean") return;
    b = ensureOceanBoat();
    if (!b) return;
    onBoat = true;
    b.hidden = true;
    b.aboard = true;
    pending = null;
    highlight = null;
    player.path = [];
    player.queuedWalk = null;
    player.moving = false;
    buildSolid();
    wx = b.tx;
    wy = b.ty + 1;
    if (!inBounds(wx, wy) || cell(wx, wy) !== "y") {
      wx = b.tx;
      wy = b.ty;
    }
    if (!walkable(wx, wy)) {
      wx = b.tx - 1;
      wy = b.ty;
    }
    if (!walkable(wx, wy)) {
      wx = b.tx + 3;
      wy = b.ty;
    }
    placePlayer(wx, wy, player.face || "down");

  /* Orthogonally adjacent shore sand/pier for getting out of the boat. */
  function adjacentShoreF(tx, ty) {
    var dirs, i, nx, ny;
    dirs = [[1, 0], [-1, 0], [0, 1], [0, -1]];
    for (i = 0; i < dirs.length; i++) {
      nx = (tx | 0) + dirs[i][0];
      ny = (ty | 0) + dirs[i][1];
      if (inBounds(nx, ny) && cell(nx, ny) === "f") return { tx: nx, ty: ny };
    }
    return null;
  }

  /* Where GET OUT should land: already on f, or water y next to f. */
  function leaveBoatShoreSpot(preferTx, preferTy) {
    var ch, spot;
    if (!onBoat || currentScene !== "ocean") return null;
    if (typeof preferTx === "number" && typeof preferTy === "number" &&
        inBounds(preferTx, preferTy) && cell(preferTx, preferTy) === "f") {
      if ((preferTx === player.tx && preferTy === player.ty) ||
          (Math.abs(preferTx - player.tx) + Math.abs(preferTy - player.ty) === 1)) {
        return { tx: preferTx, ty: preferTy };
      }
    }
    ch = cell(player.tx, player.ty);
    if (ch === "f") return { tx: player.tx, ty: player.ty };
    if (ch === "y") {
      spot = adjacentShoreF(player.tx, player.ty);
      if (spot) return spot;
    }
    return null;
  }

  function leaveBoat(ontoTx, ontoTy) {
    var b, shore;
    if (!onBoat || currentScene !== "ocean") return;
    shore = leaveBoatShoreSpot(ontoTx, ontoTy);

      showLineNote("TOO DEEP.");
      return;

    onBoat = false;
    b = dockBoatAt(shore.tx, shore.ty);
    if (b) {

    player.path = [];

  function tryOceanDoors() {
    var f;
    if (currentScene === "overworld") {
      if (isOceanEntrance(player.tx, player.ty)) {
        enterOcean();
        return true;

      f = facingTile();
      if (isOceanEntrance(f.tx, f.ty) || (propAt(f.tx, f.ty) && propAt(f.tx, f.ty).kind === "oceanSign") ||
          (propAt(player.tx, player.ty) && propAt(player.tx, player.ty).kind === "oceanSign")) {
        goEnterOcean();
        return true;
      }
      return false;
    }
    if (currentScene !== "ocean") return false;
    if (onBoat) {
      /* 20260905bp: Space at beach edge gets out (no inland rowing) */
      if (leaveBoatShoreSpot()) leaveBoat();
      else talkBoat();
      return true;
    }
    if (isOceanExit(player.tx, player.ty)) {
      exitOcean();
      return true;

    f = facingTile();
    if (isOceanExit(f.tx, f.ty)) {
      goExitOcean();
      return true;

    if (propAt(player.tx, player.ty) && propAt(player.tx, player.ty).kind === "rowboat") {
      talkBoat();
      return true;

    if (propAt(f.tx, f.ty) && propAt(f.tx, f.ty).kind === "rowboat") {
      goTalkBoat(propAt(f.tx, f.ty));
      return true;
    }
    return false;

    return {

  function critterOk(c, tx, ty) {
    if (currentScene !== (c.scene || "forest")) return false;
    if (!walkable(tx, ty) && !(tx === c.tx && ty === c.ty)) return false;
    if (tx < c.patio.x0 || tx > c.patio.x1 || ty < c.patio.y0 || ty > c.patio.y1) return false;
    if (playerOccupies(tx, ty)) return false;
    return true;
  }

  function critterYield(c, hopJuice) {
    var dirs = [[0, -1], [0, 1], [-1, 0], [1, 0]];
    var i, j, tmp, d, nx, ny;
    for (i = 3; i > 0; i--) {
      j = (Math.random() * (i + 1)) | 0;
      tmp = dirs[i]; dirs[i] = dirs[j]; dirs[j] = tmp;
    }
    for (i = 0; i < 4; i++) {
      d = dirs[i];
      nx = c.tx + d[0];
      ny = c.ty + d[1];
      if (critterOk(c, nx, ny)) {
        startWalk(c, [{ tx: nx, ty: ny }], c.kind === "deer" ? 1.1 : 1.85);
        /* 20260905dg: hop juice only when fleeing Orion (bump/tap), not idle wander */
        if (hopJuice) {
          c.react = 480;
          /* 20260905di: deer also puffs soft dust when fleeing Orion */
          if (c.kind === "rabbit" || c.kind === "squirrel" || c.kind === "deer") {
            spawnCritterHopDust(c.x, c.y - 4, c.kind);
          }
        }
        return true;
      }
    }
    return false;
  }

  function updateForestCritters(dt) {
    var i, c, dest, list;
    if (currentScene === "forest") list = forestCritters;
    else if (currentScene === "ocean") list = oceanCritters;
    else return;
    for (i = 0; i < list.length; i++) {
      c = list[i];
      if (c.react > 0) c.react -= dt;
      c.anim += dt;
      if (c.anim > 240) {
        c.anim = 0;
        c.frame = c.frame ? 0 : 1;
      }
      dest = c.path && c.path.length ? c.path[0] : null;
      if (dest && playerOccupies(dest.tx, dest.ty)) {
        c.path = [];
        c.queuedWalk = null;
        c.stepFrom = null;
        c.stepT = 0;
        c.x = tileCenterX(c.tx);
        c.y = tileFootY(c.ty);
        if (!critterYield(c, true)) c.idle = 400;
        continue;
      }
      if (dest) {
        advanceWalk(c, dt);
        continue;
      }
      if (playerOccupies(c.tx, c.ty)) {
        if (!critterYield(c, true)) c.idle = 200;
        continue;
      }
      c.idle -= dt;
      if (c.idle > 0) continue;
      c.idle = 800 + Math.random() * 2000;
      critterYield(c);
    }
  }

    hp += VEGGIE_HEAL;

  function pickBerryBush(prop) {
    var i;
    if (!prop || prop.kind !== "berryBush" || prop.picked) return false;
    i = PROPS.indexOf(prop);
    if (i >= 0) PROPS.splice(i, 1);
    buildSolid();
    spawnGroundLoot("berry", prop.tx, prop.ty, 1);
    rememberHarvest(prop, "berryBush", "gone");
    persistSave();
    return true;
  }

  function goPickBerry(prop) {
    if (!prop) return;
    highlight = { tx: prop.tx, ty: prop.ty };
    if (isNear(player.tx, player.ty, prop.tx, prop.ty) || (player.tx === prop.tx && player.ty === prop.ty)) {
      pending = null;
      startWalk(player, [], 3.5);
      pickBerryBush(prop);
      return;
    }
    var dest = nearestAdjacent(prop.tx, prop.ty);
    if (!dest) return;
    var path = findPath(player.tx, player.ty, dest.tx, dest.ty);
    if (!path.length) return;
    pending = { type: "pickBerry", prop: prop };
    startWalk(player, path, 3.5);
  }

  function drawDigMoundSpot(g, s, dug) {
    var dx, dy, ox, oy, j, h, leaf, fr, a;
    dx = s.tx * TILE;
    dy = s.ty * TILE;
    ox = ((hash(s.tx, s.ty, 3) * 3) | 0) - 1;
    oy = ((hash(s.tx, s.ty, 7) * 3) | 0) - 1;
    if (dug) {
      if (Assets.spr["dirt"]) Assets.draw(g, "dirt", dx, dy);
      else fill(g, dx, dy, 16, 16, C.dirtMid);
      fillDisk(g, dx + 8, dy + 9, 5, C.tillOut);
      fillDisk(g, dx + 8, dy + 9, 3, "#241408");
    } else {
      if (Assets.spr["dirt"]) Assets.draw(g, "dirt", dx + ox, dy + oy);
      else fill(g, dx + ox, dy + oy, 16, 16, C.dirtMid);
      fill(g, dx + ox + 3, dy + oy + 2, 10, 3, C.dirtHi);
      fill(g, dx + ox + 2, dy + oy + 12, 12, 3, C.dirtSh);
      for (j = 0; j < 6; j++) {
        h = hash(s.tx, s.ty, j + 11);
        leaf = h < 0.45 ? "#3E8A28" : (h < 0.75 ? "#8FD44A" : "#C47A38");
        px(g, dx + ox + 2 + ((h * 12) | 0), dy + oy + 3 + ((hash(s.ty, j, 5) * 10) | 0), leaf);
      }
      /* 20260905cq: twinkle so kids spot dig mounds */
      a = 0.32 + 0.48 * Math.abs(Math.sin(tick / 260 + s.tx * 1.7 + s.ty));
      fr = ((tick / 150 + s.tx + s.ty * 3) | 0) % 3;
      g.save();
      g.globalAlpha = a;
      if (Assets.spr.sparkle) Assets.draw(g, "sparkle", dx + ox + 4, dy + oy - 8, fr);
      else {
        px(g, dx + ox + 8, dy + oy - 2, "#FFF8E0");
        px(g, dx + ox + 10, dy + oy, "#FFE9A0");
        px(g, dx + ox + 6, dy + oy - 1, "#FFFDF4");
      }
      g.restore();
    }
  }

  function drawBarkWall(g, tx, ty, dx, dy) {
    var i, h, gx, edge;
    /* Inner bark of a hollow trunk — vertical fibers, not cave stone. */
    fill(g, dx, dy, 16, 16, "#8B4A22");
    fill(g, dx, dy, 16, 2, "#C47A38");
    fill(g, dx, dy + 14, 16, 2, "#4A2410");

      h = hash(tx, ty, i + 7);
      gx = 1 + ((h * 13) | 0);
      fill(g, dx + gx, dy + 2, 1, 12, h < 0.4 ? "#6D3A18" : (h < 0.7 ? "#A85A28" : "#7A3E18"));
    }
    edge = (tx <= 0) || (tx >= TREE_COLS - 1) || (ty <= 0) || (ty >= TREE_ROWS - 1);
    if (tx <= 0) fill(g, dx, dy, 3, 16, "#3D1A0C");
    if (tx >= TREE_COLS - 1) fill(g, dx + 13, dy, 3, 16, "#3D1A0C");
    if (ty <= 0) fill(g, dx, dy, 16, 3, "#3D1A0C");
    if (ty >= TREE_ROWS - 1) fill(g, dx, dy + 13, 16, 3, "#3D1A0C");
    if (!edge) {
      h = hash(tx, ty, 21);
      fill(g, dx + 2 + ((h * 8) | 0), dy + 5, 3, 2, "#5A2E10");
    }

  function drawHollowFloor(g, tx, ty, dx, dy) {
    var i, h, gx, gy, edge, shaft;
    /* Hollow-trunk cavity: dark wood-chip / dirt floor. Not growth rings. */
    edge = (tx <= 1) || (tx >= TREE_COLS - 2) || (ty <= 1) || (ty >= TREE_ROWS - 2);
    shaft = (ty <= 3) && (tx >= 3) && (tx <= TREE_COLS - 4);
    fill(g, dx, dy, 16, 16, edge ? "#32200E" : "#3A2210");
    /* Dim light from the canopy above — a warmer strip at the top, never rings. */
    if (shaft) fill(g, dx, dy, 16, 4, "#4E3018");
    else fill(g, dx, dy, 16, 2, "#4A2C16");
    fill(g, dx, dy + 13, 16, 3, edge ? "#241408" : "#2A1608");
    for (i = 0; i < 8; i++) {
      h = hash(tx, ty, i + 13);
      gx = 1 + ((h * 13) | 0);
      gy = 3 + ((hash(ty, tx, i + 19) * 10) | 0);
      if (h < 0.28) fill(g, dx + gx, dy + gy, 2, 1, "#2A1608");
      else if (h < 0.48) px(g, dx + gx, dy + gy, "#5A2E10");
      else if (h < 0.62) fill(g, dx + gx, dy + gy, 2, 1, "#3D1A0C");
      else if (h < 0.74) px(g, dx + gx, dy + gy, "#6D4427");
      else px(g, dx + gx, dy + gy, "#241408");
    }
  }

  function drawSkyTile(g, tx, ty, dx, dy) {
    var i, h, img, n, e, s, w, plat, leaf;
    /* TREETOP keeps its own canopy sky painting. */
    if (currentScene === "treetop" && Assets.canopySky) {
      g.drawImage(Assets.canopySky, dx, dy, 16, 16);
      return;
    }
    /* TREE 1–4: clear/cloud fill; leaf corners only where sky meets wood/leaf platform. */
    if (currentScene === "tree") {
      n = (cell(tx, ty - 1) === "f" || cell(tx, ty - 1) === "l");
      e = (cell(tx + 1, ty) === "f" || cell(tx + 1, ty) === "l");
      s = (cell(tx, ty + 1) === "f" || cell(tx, ty + 1) === "l");
      w = (cell(tx - 1, ty) === "f" || cell(tx - 1, ty) === "l");
      plat = n || e || s || w;
      leaf = null;
      if (plat) {
        if (n && w) leaf = Assets.treetopSkyLeafTL;
        else if (n && e) leaf = Assets.treetopSkyLeafTR;
        else if (s && w) leaf = Assets.treetopSkyLeafBL;
        else if (s && e) leaf = Assets.treetopSkyLeafBR;
        else if (n) leaf = Assets.treetopSkyLeafTL;
        else if (s) leaf = Assets.treetopSkyLeafBL;
        else if (w) leaf = Assets.treetopSkyLeafTL;
        else if (e) leaf = Assets.treetopSkyLeafTR;
      }
      if (leaf) {
        g.drawImage(leaf, dx, dy, 16, 16);
        return;
      }
      /* Quiet mottled fill only — no hashed cloud stamps (they tiled into a grid). */
      if (Assets.treetopSky) {
        g.drawImage(Assets.treetopSky, dx, dy, 16, 16);
        return;
      }
    }
    /* Peak (and any other sky scene): same clear fill when available. */
    img = Assets.treetopSky;
    if (img) {
      g.drawImage(img, dx, dy, 16, 16);
      return;
    }
    fill(g, dx, dy, 16, 16, C.sky || "#8EC8E8");
    if (((tx + ty * 3) & 7) === 0) {
      fill(g, dx + 3, dy + 5, 8, 3, "#B8DCF0");
      fill(g, dx + 5, dy + 4, 5, 2, "#D0E8F6");
    }
    for (i = 0; i < 2; i++) {
      h = hash(tx, ty, i + 11);
      if (h > 0.82) px(g, dx + ((h * 12) | 0) + 2, dy + 2 + ((hash(ty, i, 4) * 10) | 0), "#F8FCFF");
    }
  }

    if (id === "berryReady") { paintBerryReady(g, x, y); return; }
    if (id === "berryYoung") { paintBerryYoung(g, x, y); return; }
    if (Assets.spr[id]) Assets.draw(g, id, x, y);
    else paintSprout(g, x, y);
  }

  /* UI icon blit: always 16×16 logical dest. Larger atlas frames (future 32×32)
     NN-scale into that rect; under BUFFER=2 that is 32×32 device pixels. */
  function drawUiIcon(g, id, x, y) {
    var s = Assets.spr[id];
    var fw, fh, prev;
    if (!s || !Assets.img) return false;
    fw = s.fw || s.w;
    fh = s.h;
    prev = g.imageSmoothingEnabled;
    g.imageSmoothingEnabled = false;
    g.drawImage(
      Assets.img,
      s.x, s.y, fw, fh,
      Math.round(x), Math.round(y),
      16, 16
    );
    g.imageSmoothingEnabled = prev;
    return true;
  }

  function drawItemIcon(g, id, x, y) {
    if (id === "silver") { if (drawUiIcon(g, "silver", x, y)) return; paintSilver(g, x, y); return; }
    if (id === "goldore") { if (drawUiIcon(g, "goldore", x, y)) return; paintGoldore(g, x, y); return; }
    if (id === "potato") { if (drawUiIcon(g, "potato", x, y)) return; paintPotato(g, x, y); return; }
    if (id === "berry") { if (drawUiIcon(g, "berry", x, y)) return; paintBerry(g, x, y); return; }
    if (id === "acorn") { if (drawUiIcon(g, "acorn", x, y)) return; paintAcorn(g, x, y); return; }
    if (id === "pinecone") { if (drawUiIcon(g, "pinecone", x, y)) return; paintPinecone(g, x, y); return; }
    if (id === "apple") { if (drawUiIcon(g, "apple", x, y)) return; paintApple(g, x, y); return; }
    if (id === "bread") { if (drawUiIcon(g, "bread", x, y)) return; paintBread(g, x, y); return; }
    if (id === "pie") { if (drawUiIcon(g, "pie", x, y)) return; paintPie(g, x, y); return; }
    if (id === "copperBar") { if (drawUiIcon(g, "copperBar", x, y)) return; paintCopperBar(g, x, y); return; }
    if (id === "silverBar") { if (drawUiIcon(g, "silverBar", x, y)) return; paintSilverBar(g, x, y); return; }
    if (id === "goldBar") { if (drawUiIcon(g, "goldBar", x, y)) return; paintGoldBar(g, x, y); return; }
    if (id === "fishingPole") {
      if (drawUiIcon(g, "fishingPole", x, y)) return;
      paintFishingPole(g, x, y); return;
    }
    if (fishKindById(id) || cookedFishKindById(id)) { paintFishIcon(g, x, y, id); return; }
    drawUiIcon(g, id, x, y);
  }

  function fishKindById(id) {
    var i;
    for (i = 0; i < FISH_KINDS.length; i++) {
      if (FISH_KINDS[i].id === id) return FISH_KINDS[i];
    }
    return null;
  }

  function fishKindBySlot(slot) {
    var i;
    for (i = 0; i < FISH_KINDS.length; i++) {
      if (FISH_KINDS[i].slot === slot) return FISH_KINDS[i];
    }
    return null;
  }

  function cookedFishKindById(id) {
    var i, fk;
    if (!id || id.indexOf("cooked") !== 0) return null;
    for (i = 0; i < FISH_KINDS.length; i++) {
      fk = FISH_KINDS[i];
      if (fk.cookedId === id) return fk;
    }
    return null;
  }

  function cookedFishName(fk) {
    if (!fk) return "COOKED FISH";
    return "COOKED " + fk.name;
  }

  function anyFishKindById(id) {
    return fishKindById(id) || cookedFishKindById(id);
  }

  function paintFishingPole(g, x, y) {
    fill(g, x + 3, y + 12, 4, 2, "#6D4427");
    fill(g, x + 4, y + 11, 3, 2, "#C47A38");
    fill(g, x + 6, y + 4, 2, 9, "#E8B060");
    fill(g, x + 7, y + 2, 2, 4, "#C47A38");
    px(g, x + 8, y + 1, "#3D1A0C");
    fill(g, x + 8, y + 8, 3, 3, "#8B5A28");
    px(g, x + 9, y + 9, "#F3D2A3");
    px(g, x + 11, y + 6, "#A8D4E8");
    px(g, x + 12, y + 5, "#A8D4E8");
    px(g, x + 13, y + 7, "#C45A38");
  }

  function paintFishIcon(g, x, y, id) {
    if (drawUiIcon(g, id, x, y)) return;
    var body, belly, fin, eye, cooked, rawId, ck;
    cooked = false;
    rawId = id;
    ck = cookedFishKindById(id);
    if (ck) {
      cooked = true;
      rawId = ck.id;
      if (drawUiIcon(g, "cookedFish", x, y)) return;
    }
    body = "#8A8A7A";
    belly = "#D8D0C0";
    fin = "#5A5A4E";
    eye = "#3A2210";
    if (rawId === "minnow") { body = "#C8C8D4"; belly = "#F0F0F8"; fin = "#8A8A7A"; }
    else if (rawId === "bluegill") { body = "#3A7AB0"; belly = "#A8D4E8"; fin = "#2E6A96"; }
    else if (rawId === "perch") { body = "#C4A060"; belly = "#E8D090"; fin = "#6D4427"; }
    else if (rawId === "catfish") { body = "#6D4427"; belly = "#C4A060"; fin = "#3D1A0C"; }
    else if (rawId === "trout") { body = "#C45A38"; belly = "#F0B428"; fin = "#8B2E1C"; }
    else if (rawId === "bass") { body = "#2F7A14"; belly = "#8FD42A"; fin = "#1E5A12"; }
    else if (rawId === "goldenCarp") { body = "#E8B028"; belly = "#F8E070"; fin = "#C47A38"; }
    else if (rawId === "moonfish") { body = "#A8D4E8"; belly = "#F0F0F8"; fin = "#4A96C8"; }
    else if (rawId === "starfin") { body = "#E8C888"; belly = "#F8E070"; fin = "#8B1A1A"; }
    else if (rawId === "goldenSwordfish") { body = "#E8B028"; belly = "#FFF0A8"; fin = "#C47A10"; }
    if (cooked) {
      /* plate + warmer cooked fish (reuse hue, browner edges) */
      fill(g, x + 2, y + 10, 12, 4, "#D8D0C0");
      fill(g, x + 3, y + 9, 10, 5, "#F0E8D8");
      fill(g, x + 4, y + 11, 8, 2, "#C8B8A0");
      body = body;
      fill(g, x + 4, y + 6, 8, 4, body);
      fill(g, x + 5, y + 5, 6, 2, belly);
      fill(g, x + 10, y + 6, 2, 4, fin);
      px(g, x + 5, y + 7, eye);
      px(g, x + 6, y + 7, "#F8FCFF");
      px(g, x + 7, y + 4, "#E8A060");
      px(g, x + 9, y + 4, "#E8A060");
      return;
    }
    fill(g, x + 3, y + 7, 9, 4, body);
    fill(g, x + 4, y + 6, 7, 2, belly);
    fill(g, x + 5, y + 10, 5, 1, belly);
    fill(g, x + 11, y + 6, 3, 5, fin);
    px(g, x + 12, y + 5, fin);
    px(g, x + 12, y + 11, fin);
    px(g, x + 4, y + 8, eye);
    px(g, x + 5, y + 8, "#F8FCFF");
    if (rawId === "catfish") {
      px(g, x + 2, y + 8, "#3D1A0C");
      px(g, x + 2, y + 10, "#3D1A0C");
    }
    if (rawId === "starfin") {
      px(g, x + 7, y + 5, "#F8E070");
      px(g, x + 6, y + 4, "#F8E070");
      px(g, x + 8, y + 4, "#F8E070");
    }
    if (rawId === "goldenSwordfish") {
      fill(g, x + 0, y + 7, 3, 2, "#F8E070");
      px(g, x + 0, y + 8, "#E8B028");
      px(g, x + 7, y + 5, "#FFF8C8");
      px(g, x + 9, y + 7, "#FFF8C8");
    }
    if (rawId === "moonfish") px(g, x + 8, y + 7, "#F8FCFF");
    if (rawId === "perch") {
      px(g, x + 7, y + 7, "#6D4427");
      px(g, x + 9, y + 8, "#6D4427");
    }
  }

  function paintBar(g, x, y, dark, mid, lite) {
    fill(g, x + 2, y + 7, 12, 5, dark);

    fill(g, x + 4, y + 5, 8, 8, "#C4A060");
    fill(g, x + 5, y + 6, 6, 3, "#E0C888");

  function paintBerry(g, x, y) {

  function paintAcorn(g, x, y) {

    fill(g, x + 7, y + 9, 2, 2, "#E0A060");

  function paintPinecone(g, x, y) {

    fill(g, x + 5, y + 11, 6, 3, "#8B5A28");
    px(g, x + 7, y + 4, "#C47A38");
    px(g, x + 6, y + 6, "#C47A38");
    px(g, x + 9, y + 7, "#5A3A1A");
    px(g, x + 6, y + 9, "#C47A38");

  function paintApple(g, x, y) {

    fill(g, x + 5, y + 5, 6, 9, "#E84A4A");
    fill(g, x + 6, y + 6, 3, 3, "#FF8080");
    px(g, x + 7, y + 4, "#3A7A14");
    px(g, x + 8, y + 3, "#3A7A14");
    fill(g, x + 9, y + 4, 3, 2, "#5FBF22");

  function paintBread(g, x, y) {
    fill(g, x + 2, y + 7, 12, 6, "#8B5A28");
    fill(g, x + 3, y + 6, 10, 6, "#C4A060");
    fill(g, x + 4, y + 5, 8, 3, "#E0C888");
    px(g, x + 6, y + 7, "#8B5A28");

  function paintPie(g, x, y) {
    fill(g, x + 3, y + 8, 10, 5, "#8B5A28");
    fill(g, x + 4, y + 7, 8, 5, "#C47A38");
    fill(g, x + 5, y + 5, 6, 4, "#C83080");
    fill(g, x + 6, y + 4, 4, 3, "#E84A7A");
    px(g, x + 7, y + 6, "#8B1A4A");

  function paintSilver(g, x, y) {
    fill(g, x + 4, y + 6, 8, 6, "#6A6A72");
    fill(g, x + 5, y + 5, 6, 7, "#C8C8D4");
    fill(g, x + 6, y + 6, 3, 3, "#F0F0F8");
    px(g, x + 10, y + 9, "#4A4A52");
  }

  function paintGoldore(g, x, y) {
    fill(g, x + 4, y + 6, 8, 6, "#A86C14");
    fill(g, x + 5, y + 5, 6, 7, "#E8B028");
    fill(g, x + 6, y + 6, 3, 3, "#F8E070");
    px(g, x + 10, y + 9, "#8B5A00");
  }

  function paintPotatoYoung(g, x, y) {
    fill(g, x + 7, y + 8, 2, 6, "#3A7A14");
    fill(g, x + 4, y + 6, 4, 3, "#5FBF22");
    fill(g, x + 8, y + 5, 4, 3, "#5FBF22");
  }

  function paintPotatoReady(g, x, y) {
    fill(g, x + 7, y + 6, 2, 8, "#2F7A14");
    fill(g, x + 3, y + 4, 5, 4, "#4A9A28");
    fill(g, x + 8, y + 3, 5, 4, "#4A9A28");
    fill(g, x + 4, y + 10, 8, 5, "#C4A060");
    fill(g, x + 5, y + 11, 6, 3, "#E0C888");
  }

  function paintBerryYoung(g, x, y) {
    fill(g, x + 7, y + 8, 2, 6, "#3A7A14");
    fill(g, x + 5, y + 5, 6, 5, "#4A9A28");
  }

  function paintBerryReady(g, x, y) {
    fill(g, x + 7, y + 8, 2, 7, "#2F7A14");
    fill(g, x + 4, y + 4, 8, 7, "#4A9A28");
    fill(g, x + 5, y + 6, 2, 2, "#E84A4A");
    fill(g, x + 8, y + 5, 2, 2, "#C83030");
    fill(g, x + 7, y + 8, 2, 2, "#E84A4A");
  }

  function drawForestProp(g, p, x, y) {
    var bob;
    if (p.kind === "pine") drawPine(g, x, y, nodeHurtStage(p), p);
    else if (p.kind === "oak") drawOak(g, x, y, nodeHurtStage(p), p);
    else if (p.kind === "birch") drawBirch(g, x, y, nodeHurtStage(p), p);
    else if (p.kind === "palm") drawPalm(g, x, y, nodeHurtStage(p), p);
    else if (p.kind === "log") drawLog(g, x, y);
    else if (p.kind === "fern") drawFern(g, x, y);
    else if (p.kind === "wildflower") drawWildflower(g, x, y);
    else if (p.kind === "toadstool") drawToadstool(g, x, y);
    else if (p.kind === "berryBush") drawBerryBush(g, x, y, !!p.picked);
    else if (p.kind === "woodsSign") drawWoodsSign(g, x, y, p.label);
    else if (p.kind === "oceanSign") drawWoodsSign(g, x, y, p.label || "OCEAN");
    else if (p.kind === "giantTree") drawGiantTree(g, x, y);
    else if (p.kind === "woodsDown") drawWoodsDown(g, x, y);
    else if (p.kind === "nest") drawNest(g, x, y, p);
    else if (p.kind === "bird") drawBird(g, x, y);
    else if (p.kind === "giantBird") drawGiantBird(g, x, y);
    else if (p.kind === "canopyBough") drawCanopyBough(g, x, y);
    else if (p.kind === "canopySpan") drawCanopyDecal(g, Assets.canopySpan, x, y);
    else if (p.kind === "canopyClump") drawCanopyDecal(g, Assets.canopyClump, x, y);
    else if (p.kind === "canopyHang") drawCanopyDecal(g, Assets.canopyHang, x, y);
    else if (p.kind === "silver" || p.kind === "goldore") {
      var oa, ofr;
      bob = Math.round(Math.sin(tick / 280) * 1);
      if (p.kind === "silver") paintSilver(g, x, y + bob);
      else paintGoldore(g, x, y + bob);
      /* 20260905cy: woods ore nodes twinkle when ready */
      oa = 0.34 + 0.46 * Math.abs(Math.sin(tick / 240 + p.tx * 1.3 + p.ty));
      ofr = ((tick / 140 + p.tx * 2 + p.ty * 5) | 0) % 3;
      g.save();
      g.globalAlpha = oa;
      if (Assets.spr.sparkle) Assets.draw(g, "sparkle", x + 4, y + bob - 10, ofr);
      else {
        px(g, x + 8, y + bob - 4, "#FFF8E0");
        px(g, x + 11, y + bob - 2, "#FFE9A0");
        px(g, x + 5, y + bob - 1, "#FFFDF4");
      }
      g.restore();
    }
  }

  function woodsTreeImg(kind, p, x, y) {
    var alt, a, b;
    alt = p ? ((p.tx + p.ty) & 1) : (((x / TILE + y / TILE) | 0) & 1);
    a = Assets[kind];
    b = Assets[kind + "2"];
    return alt ? (b || a) : (a || b);
  }

  function drawWoodsTreeImg(g, img, x, y, hurt, ox, oy, dw, dh) {
    var prev = g.globalAlpha;
    var smooth = g.imageSmoothingEnabled;
    if (hurt >= 2) g.globalAlpha = prev * 0.52;
    else if (hurt) g.globalAlpha = prev * 0.74;
    /* 20260905ab: props are 2× source (e.g. birch 80×128 into 40×64 logical);
       with BUFFER=2 that maps 1:1 on device — keep NN so density stays sharp */
    g.imageSmoothingEnabled = false;
    g.drawImage(img, x + ox, y + oy, dw, dh);
    g.imageSmoothingEnabled = smooth;
    g.globalAlpha = prev;
  }

  function drawPine(g, x, y, hurt, p) {
    var img = woodsTreeImg("pine", p, x, y);
    var leaf, leafHi;
    if (img) {
      drawWoodsTreeImg(g, img, x, y, hurt, -12, -56, 40, 72);
      return;
    }
    leaf = hurt >= 2 ? "#3A5A20" : (hurt === 1 ? "#3E7A28" : "#2A6A22");
    leafHi = hurt ? "#5A8A38" : "#3E8A2C";
    fill(g, x + 6, y + 2, 4, 14, "#5A3A18");
    fill(g, x + 7, y + 2, 1, 14, "#8B5A28");
    fill(g, x + 2, y - 8, 12, 10, leaf);
    fill(g, x + 3, y - 16, 10, 10, leaf);
    fill(g, x + 4, y - 24, 8, 10, leaf);
    fill(g, x + 5, y - 32, 6, 10, leaf);
    fill(g, x + 6, y - 40, 4, 9, leaf);
    fill(g, x + 7, y - 48, 2, 8, leaf);
    fill(g, x + 3, y - 10, 4, 2, leafHi);
    fill(g, x + 5, y - 20, 3, 2, leafHi);
    fill(g, x + 6, y - 30, 2, 2, leafHi);
  }

  function drawOak(g, x, y, hurt, p) {
    var img = woodsTreeImg("oak", p, x, y);
    var leaf, leafHi;
    if (img) {
      drawWoodsTreeImg(g, img, x, y, hurt, -20, -48, 56, 64);
      return;
    }
    leaf = hurt >= 2 ? "#4A6A20" : (hurt === 1 ? "#4A8A28" : "#3A8A24");
    leafHi = hurt ? "#6A9A38" : "#5FBF22";
    fill(g, x + 5, y + 2, 6, 14, "#6D4427");
    fill(g, x + 6, y + 2, 2, 14, "#C47A38");
    fill(g, x - 16, y - 18, 48, 22, leaf);
    fill(g, x - 12, y - 28, 40, 14, leaf);
    fill(g, x - 6, y - 36, 28, 10, leaf);
    fill(g, x - 10, y - 20, 10, 4, leafHi);
    fill(g, x + 8, y - 26, 8, 3, leafHi);
  }

  function drawBirch(g, x, y, hurt, p) {
    var img = woodsTreeImg("birch", p, x, y);
    var leaf;
    if (img) {
      drawWoodsTreeImg(g, img, x, y, hurt, -12, -48, 40, 64);
      return;
    }
    leaf = hurt >= 2 ? "#6A8A40" : (hurt === 1 ? "#7AAA50" : "#8FBF5A");
    fill(g, x + 6, y + 2, 4, 14, "#E8E0D0");
    fill(g, x + 7, y + 2, 1, 14, "#F8F4E8");
    px(g, x + 6, y + 5, "#3A2210");
    px(g, x + 8, y + 8, "#3A2210");
    px(g, x + 6, y + 12, "#3A2210");
    fill(g, x - 2, y - 20, 20, 16, leaf);
    fill(g, x + 0, y - 30, 16, 12, leaf);
    fill(g, x + 2, y - 38, 12, 10, leaf);
    fill(g, x + 2, y - 22, 5, 3, "#C8E080");
  }

  function drawPalm(g, x, y, hurt, p) {
    var img = Assets.palm;
    if (img) {
      /* 80×128 → 40×64 logical (2× density) */
      drawWoodsTreeImg(g, img, x, y, hurt, -12, -48, 40, 64);
      return;
    }
    fill(g, x + 7, y - 4, 3, 18, "#8B5A28");
    fill(g, x + 2, y - 20, 14, 4, "#2F8A24");
    fill(g, x + 0, y - 16, 8, 3, "#3E9A2C");
    fill(g, x + 10, y - 16, 8, 3, "#3E9A2C");
  }


  function drawLog(g, x, y) {
    if (Assets.log) {
      var smooth = g.imageSmoothingEnabled;
      g.imageSmoothingEnabled = false;
      /* 20260905al: 64×32 source into 32×16 logical (2× density) */
      g.drawImage(Assets.log, x, y, 32, 16);
      g.imageSmoothingEnabled = smooth;
      return;
    }
    fill(g, x + 1, y + 8, 30, 6, "#5A3A18");
    fill(g, x + 2, y + 7, 28, 5, "#8B5A28");

  function drawForestCritter(g, c) {

  function px(g, x, y, color) {
    g.fillStyle = color;
    g.fillRect(x, y, 1, 1);
  }

  function fill(g, x, y, w, h, color) {
    g.fillStyle = color;
    g.fillRect(x, y, w, h);
  }

  function strokeLine(g, x0, y0, x1, y1, color, thick) {
    var dx, dy, sx, sy, err, e2, t;
    x0 = Math.round(x0);
    y0 = Math.round(y0);
    x1 = Math.round(x1);
    y1 = Math.round(y1);
    dx = Math.abs(x1 - x0);
    dy = Math.abs(y1 - y0);
    sx = x0 < x1 ? 1 : -1;
    sy = y0 < y1 ? 1 : -1;
    err = dx - dy;
    t = thick || 1;
    g.fillStyle = color;
    while (true) {
      g.fillRect(x0, y0, t, t);
      if (x0 === x1 && y0 === y1) break;
      e2 = 2 * err;
      if (e2 > -dy) {
        err -= dy;
        x0 += sx;
      }
      if (e2 < dx) {
        err += dx;
        y0 += sy;
      }
    }
  }

  function cell(tx, ty) {
    if (ty < 0 || ty >= ROWS || tx < 0 || tx >= COLS) return "g";
    return GROUND[ty][tx];
  }

  function setCell(tx, ty, ch) {
    if (ty >= 0 && ty < ROWS && tx >= 0 && tx < COLS) GROUND[ty][tx] = ch;
  }

  function isSoft(ch) {
    return ch === "g" || ch === "h" || ch === "m";
  }

  function buildSolid() {
    var y, x, i, p;
    solid = [];
    for (y = 0; y < ROWS; y++) {
      solid[y] = [];
      for (x = 0; x < COLS; x++) {
        solid[y][x] = cell(x, y) === "#" || cell(x, y) === "w" ||
          (cell(x, y) === "y" && !(onBoat && currentScene === "ocean"));
      }
    }
    function block(tx, ty) {
      if (tx >= 0 && ty >= 0 && tx < COLS && ty < ROWS) solid[ty][tx] = true;
    }
    for (i = 0; i < PROPS.length; i++) {
      p = PROPS[i];
      if (p.kind === "house") {
        for (y = 0; y < 4; y++) {
          for (x = 0; x < 5; x++) {
            if (p.tx + x === houseIn.tx && p.ty + y === houseIn.ty) continue;
            block(p.tx + x, p.ty + y);
          }
        }
      } else if (p.kind === "shopHouse") {
        for (y = 0; y < 4; y++) {
          for (x = 0; x < 6; x++) block(p.tx + x, p.ty + y);
        }
      } else if (p.kind === "townHouseA" || p.kind === "townHouseC") {
        for (y = 0; y < 5; y++) {
          for (x = 0; x < 4; x++) block(p.tx + x, p.ty + y);
        }
      } else if (p.kind === "townHouseB" || p.kind === "townHouseD") {
        for (y = 0; y < 4; y++) {
          for (x = 0; x < 5; x++) block(p.tx + x, p.ty + y);
        }
      } else if (p.kind === "fountain") {
        block(p.tx, p.ty); block(p.tx + 1, p.ty);
        block(p.tx, p.ty + 1); block(p.tx + 1, p.ty + 1);
      } else if (p.kind === "log") {
        block(p.tx, p.ty); block(p.tx + 1, p.ty);
      } else if (p.kind === "statue") {
        block(p.tx, p.ty);
      } else if (p.kind === "counter") {
        block(p.tx, p.ty); block(p.tx + 1, p.ty); block(p.tx + 2, p.ty);
      } else if (p.kind === "bed") {
        block(p.tx, p.ty); block(p.tx + 1, p.ty);
        block(p.tx, p.ty + 1); block(p.tx + 1, p.ty + 1);
      } else if (p.kind === "table" || p.kind === "workbench") {
        block(p.tx, p.ty); block(p.tx + 1, p.ty);
      } else if (p.kind === "desk") {
        block(p.tx, p.ty); block(p.tx + 1, p.ty); block(p.tx + 2, p.ty);
      } else if (p.kind === "fireplace") {
        block(p.tx, p.ty); block(p.tx + 1, p.ty);
        block(p.tx, p.ty + 1); block(p.tx + 1, p.ty + 1);
      } else if (p.kind === "stove") {
        block(p.tx, p.ty);
      } else if (p.kind === "chair" || p.kind === "housePlant" || p.kind === "flowerbox" || p.kind === "houseChest") {
        block(p.tx, p.ty);
      } else if (p.kind === "pond") {
        block(p.tx, p.ty); block(p.tx + 1, p.ty);
        block(p.tx, p.ty + 1); block(p.tx + 1, p.ty + 1);
      } else if (p.kind === "giantTree") {
        block(p.tx - 2, p.ty - 1);
        block(p.tx - 1, p.ty - 1);
        block(p.tx, p.ty - 1);
        block(p.tx + 1, p.ty - 1);
        block(p.tx - 2, p.ty);
        block(p.tx - 1, p.ty);
        block(p.tx + 1, p.ty);
      } else if (
        p.kind === "tree" || p.kind === "pine" || p.kind === "oak" || p.kind === "birch" || p.kind === "palm" ||
        p.kind === "stump" || p.kind === "berryBush" || p.kind === "well" || p.kind === "rock" ||
        (p.kind === "lantern" && !p.walk) || p.kind === "crate" || p.kind === "fenceH" || p.kind === "fenceL" ||
        p.kind === "fenceR" || p.kind === "swordPedestal" || p.kind === "moonAltar" ||
        p.kind === "oceanSign"
      ) {
        block(p.tx, p.ty);
      } else if (p.kind === "rowboat") {
        if (p.hidden || p.aboard) continue;
        for (y = 0; y < 2; y++) {
          for (x = 0; x < 3; x++) block(p.tx + x, p.ty + y);
        }
      } else if (p.kind === "brokenBridge") {
        for (y = 0; y < 3; y++) {
          for (x = 0; x < 5; x++) block(p.tx + x, p.ty + y);
        }
      } else if (p.kind === "fixedBridge") {
        for (x = 0; x < 5; x++) block(p.tx + x, p.ty);
      }
    }
    /* 20260905cf: Junie is a soft blocker (path around / scoot) — not a hard wall. */
    if (currentScene === "overworld" && hasOverRim()) {
      for (x = 0; x < COLS; x++) {
        block(x, 0);
        if (!(isOceanDoorCol(x))) block(x, ROWS - 1);
      }
      for (y = 0; y < ROWS; y++) {
        block(0, y);
        block(COLS - 1, y);
      }
    }
  }

  function inBounds(tx, ty) {
    return tx >= 0 && ty >= 0 && tx < COLS && ty < ROWS;
  }

  function carSpanDelta(face) {
    if (face === "left") return { dx: -1, dy: 0 };
    if (face === "up") return { dx: 0, dy: -1 };
    if (face === "down") return { dx: 0, dy: 1 };
    return { dx: 1, dy: 0 };

  function carOccupies(tx, ty) {
    var d, ex, ey;
    if (currentScene !== "overworld" || !car) return false;
    if (tx === car.tx && ty === car.ty) return true;
    if (car.path && car.path.length && car.path[0].tx === tx && car.path[0].ty === ty) return true;
    d = carSpanDelta(car.face || "right");
    ex = car.tx + d.dx;
    ey = car.ty + d.dy;
    if (tx === ex && ty === ey) return true;
    return false;
  }

  function folkOccupies(tx, ty) {
    var i, f;
    if (currentScene !== "overworld" && currentScene !== "forest") return false;
    var list = liveFolk();
    for (i = 0; i < list.length; i++) {

    var worldW = COLS * TILE;

    var maxY = worldH - VIEW_H + CAM_PAD_BOTTOM;
    var minY = -topInset;
    var minX = 0;
    if (maxX < 0) maxX = 0;
    if (maxY < minY) maxY = minY;

      maxX = Math.max(0, worldW - VIEW_W);

      maxX = Math.max(0, worldW - VIEW_W);

        maxY = Math.max(0, worldH - VIEW_H);

        minX = maxX = (worldW - VIEW_W) >> 1;
      } else {
        minX = 0;
        maxX = worldW - VIEW_W;
      }
      minY = -CAM_PAD_TOP;
      maxY = Math.max(minY, worldH - VIEW_H + CAM_PAD_BOTTOM);

        minX = maxX = (worldW - VIEW_W) >> 1;
      } else {

        maxX = Math.max(0, worldW - VIEW_W);

    camY = Math.round(Math.max(minY, Math.min(maxY, targetY)));

      if (player.y - camY < topInset) {

      d = Math.abs(nx - player.tx) + Math.abs(ny - player.ty);
      if (d < bestD) {
        bestD = d;
        best = { tx: nx, ty: ny };
      }
    }
    return best;
  }

  function worldTime() {
    return (dayNumber - 1) * DAY_MS + dayMs;
  }

  function cropStage(c) {
    if (!c) return "";
    if (typeof c === "string") return c;
    return c.stage || "sprout";
  }

  function cropIsReady(c) {
    return cropStage(c) === "ready";
  }

  function cropKindOf(c) {
    if (c && c.crop === "potato") return "potato";
    if (c && c.crop === "berry") return "berry";
    return "carrot";
  }

  function selectedCropKind() {
    if (selectedIs("potatoSeed")) return "potato";
    if (selectedIs("berrySeed")) return "berry";
    return "carrot";
  }

  function cropSprite(c) {
    var st = cropStage(c);
    var kind = cropKindOf(c);
    if (kind === "potato") {
      if (st === "ready") return "potatoReady";
      if (st === "young") return "potatoYoung";
      return "sprout";
    }
    if (kind === "berry") {
      if (st === "ready") return "berryReady";
      if (st === "young") return "berryYoung";
      return "sprout";
    }
    if (st === "ready") return "cropReady";
    if (st === "young") return "cropYoung";
    return "sprout";
  }

  function updateCrops() {
    var t = worldTime();
    var k, c, age, next, changed;
    changed = false;
    for (k in crops) {
      if (!Object.prototype.hasOwnProperty.call(crops, k)) continue;
      c = crops[k];
      if (!c) continue;
      if (typeof c === "string") {
        crops[k] = { stage: c, plantTime: t };
        c = crops[k];
        changed = true;
      }
      age = t - (c.plantTime || 0);
      if (age < 0) age = 0;
      next = "sprout";
      if (age >= CROP_READY_MS) next = "ready";
      else if (age >= CROP_YOUNG_MS) next = "young";
      if (c.stage !== next) {
        c.stage = next;
        changed = true;
      }
    }
    if (changed) persistSave();
  }

  function plantAt(tx, ty) {
    var k = tx + "," + ty;
    if (cell(tx, ty) !== "p") return;
    if (crops[k]) return;
    crops[k] = { stage: "sprout", plantTime: worldTime(), crop: selectedCropKind() };
    persistSave();
  }

  function harvestCropAt(tx, ty) {
    var k = tx + "," + ty;
    var cx, cy;
    if (!cropIsReady(crops[k])) return;
    var kind = cropKindOf(crops[k]);
    delete crops[k];
    /* 20260905ct: harvest pop juice — sparks + soft chip spray */
    cx = tx * TILE + 8;
    cy = ty * TILE + 4;
    spawnSparks(cx, cy);
    spawnHitSparks(cx, cy - 2, false);
    if (kind === "potato") spawnGroundLoot("potato", tx, ty, 1);
    else if (kind === "berry") spawnGroundLoot("berry", tx, ty, 1);
    else spawnGroundLoot("veggie", tx, ty, 1);
    persistSave();
  }

  function isFenceKind(kind) {
    return kind === "fenceH" || kind === "fenceL" || kind === "fenceR";
  }

  function isWoodChop(p) {
    /* 20260905bk: fences are pick-up builds, not multi-hit wood chops. */
    return p && (p.kind === "tree" || p.kind === "pine" || p.kind === "oak" || p.kind === "birch" || p.kind === "palm" || p.kind === "stump" || p.kind === "log");
  }

  function isHarvestable(p) {
    return p && (isWoodChop(p) || p.kind === "rock" || p.kind === "peakRocks");
  }

  function isSoftStrike(p) {
    return p && (p.kind === "tallGrass" || p.kind === "weed" || ((p.kind === "townFlower" || p.kind === "wildflower") && !p.holiday) || p.kind === "crop");
  }

  function isSliceable(p) {
    return p && (p.kind === "tallGrass" || p.kind === "weed");
  }

  function isPickablePlant(p) {
    return p && (p.kind === "townFlower" || p.kind === "wildflower") && !p.holiday;
  }

  function propOccupies(p, tx, ty) {
    if (!p || p.hidden) return false;
    if (p.kind === "house") return tx >= p.tx && tx < p.tx + 5 && ty >= p.ty && ty < p.ty + 4;
    if (p.kind === "shopHouse") return tx >= p.tx && tx < p.tx + 6 && ty >= p.ty && ty < p.ty + 4;
    if (p.kind === "townHouseA" || p.kind === "townHouseC") return tx >= p.tx && tx < p.tx + 4 && ty >= p.ty && ty < p.ty + 5;
    if (p.kind === "townHouseB" || p.kind === "townHouseD") return tx >= p.tx && tx < p.tx + 5 && ty >= p.ty && ty < p.ty + 4;
    if (p.kind === "fountain") return tx >= p.tx && tx < p.tx + 2 && ty >= p.ty && ty < p.ty + 2;
    if (p.kind === "counter") return tx >= p.tx && tx < p.tx + 3 && ty === p.ty;
    if (p.kind === "bed") return tx >= p.tx && tx < p.tx + 2 && ty >= p.ty && ty < p.ty + 2;
    if (p.kind === "table" || p.kind === "workbench") return tx >= p.tx && tx < p.tx + 2 && ty === p.ty;
    if (p.kind === "desk") return tx >= p.tx && tx < p.tx + 3 && ty === p.ty;
    if (p.kind === "fireplace") return tx >= p.tx && tx < p.tx + 2 && ty >= p.ty && ty < p.ty + 2;
    if (p.kind === "rug") return tx >= p.tx && tx < p.tx + 3 && ty >= p.ty && ty < p.ty + 2;
    if (p.kind === "pond") return tx >= p.tx && tx < p.tx + 2 && ty >= p.ty && ty < p.ty + 2;
    if (p.kind === "brokenBridge" || p.kind === "fixedBridge") return tx >= p.tx && tx < p.tx + 5 && ty >= p.ty && ty < p.ty + 3;
    if (p.kind === "rowboat") return ty >= p.ty && ty < p.ty + 2 && tx >= p.tx && tx < p.tx + 3;
    if (p.kind === "log") return ty === p.ty && tx >= p.tx && tx < p.tx + 2;
    if (p.kind === "cave") return tx === p.tx && ty === p.ty;
    if (p.kind === "giantTree") return tx >= p.tx - 2 && tx <= p.tx + 1 && ty >= p.ty - 1 && ty <= p.ty;
    return p.tx === tx && p.ty === ty;
  }

  function propAt(tx, ty) {
    var i, p;
    for (i = 0; i < PROPS.length; i++) {
      p = PROPS[i];
      if (propOccupies(p, tx, ty)) return p;
    }
    return null;
  }

  function harvestableAtTile(tx, ty) {
    var i, p;
    for (i = 0; i < PROPS.length; i++) {
      p = PROPS[i];
      if (isHarvestable(p) && propOccupies(p, tx, ty)) return p;
    }
    return null;
  }

  function hasFence(tx, ty) {
    return !!fenceAt(tx, ty);
  }

  function fenceAt(tx, ty) {
    var i, p;
    for (i = 0; i < PROPS.length; i++) {
      p = PROPS[i];
      if (isFenceKind(p.kind) && p.tx === tx && p.ty === ty) return p;
    }
    return null;
  }

  function forgetFenceBuild(tx, ty) {
    var j, removed;
    removed = false;
    for (j = builds.length - 1; j >= 0; j--) {
      if (!builds[j]) continue;
      if (isFenceKind(builds[j].kind) && builds[j].tx === tx && builds[j].ty === ty) {
        builds.splice(j, 1);
        removed = true;
      }
    }
    return removed;
  }

  function rememberGoneFence(tx, ty) {
    var j;
    if (forgetFenceBuild(tx, ty)) return;
    for (j = 0; j < builds.length; j++) {
      if (builds[j] && builds[j].kind === "goneFence" && builds[j].tx === tx && builds[j].ty === ty) return;
    }
    builds.push({ kind: "goneFence", tx: tx, ty: ty });
  }

  function clearGoneFence(tx, ty) {
    var j;
    for (j = builds.length - 1; j >= 0; j--) {
      if (builds[j] && builds[j].kind === "goneFence" && builds[j].tx === tx && builds[j].ty === ty) {
        builds.splice(j, 1);
      }
    }
  }

  function canPickupFence() {
    /* Axe, shovel, or empty hand — never while BUILD place mode is on. */
    if (fenceBuildOn) return false;
    if (toolEquipped("axe") || toolEquipped("shovel")) return true;
    return !selectedKey();
  }

  function breakFence(prop) {
    var fi;
    if (!prop || !isFenceKind(prop.kind)) return false;
    if (!canPickupFence()) return false;
    if (bagRoom("wood") < 1) {
      showLineNote("BAG FULL. USE THE CHEST.");
      return false;
    }
    fi = PROPS.indexOf(prop);
    if (fi >= 0) PROPS.splice(fi, 1);
    rememberGoneFence(prop.tx, prop.ty);
    buildSolid();
    addToBag("wood", 1);
    delete harvestNodes[nodeKey(liveHarvestScene(), prop.tx, prop.ty)];
    showLineNote("FENCE PICKED UP");
    playSfx("pickup");
    persistSave();
    return true;
  }

  function tryBreakFenceAt(tx, ty) {
    var prop = fenceAt(tx, ty);
    if (!prop || !canPickupFence()) return false;
    return breakFence(prop);
  }

  function tryBreakFenceFacing() {
    var spots, i, prop;
    if (uiPaused() || faintFx) return false;
    if (player.swing > 0) return false;
    if (!canPickupFence()) return false;
    spots = [
      facingTile(),
      { tx: player.tx - 1, ty: player.ty },
      { tx: player.tx + 1, ty: player.ty },
      { tx: player.tx, ty: player.ty - 1 },
      { tx: player.tx, ty: player.ty + 1 }
    ];
    for (i = 0; i < spots.length; i++) {
      prop = fenceAt(spots[i].tx, spots[i].ty);
      if (prop) {
        breakFence(prop);
        return true;
      }
    }
    return false;
  }

  function goBreakFence(prop) {
    var dest, path;
    if (!prop || !isFenceKind(prop.kind) || !canPickupFence()) return;
    highlight = { tx: prop.tx, ty: prop.ty };
    if (isNear(player.tx, player.ty, prop.tx, prop.ty)) {
      pending = null;
      startWalk(player, [], 3.5);
      breakFence(prop);
      return;
    }
    dest = nearestAdjacent(prop.tx, prop.ty);
    if (!dest) return;
    path = findPath(player.tx, player.ty, dest.tx, dest.ty);
    if (!path.length) return;
    pending = { type: "breakFence", prop: prop };
    startWalk(player, path, 3.5);
  }

  function fenceKindFor(tx, ty) {
    var v = hasFence(tx, ty - 1) || hasFence(tx, ty + 1);
    var h = hasFence(tx - 1, ty) || hasFence(tx + 1, ty);
    if (v && !h) return "fenceL";
    return "fenceH";
  }

  function isSoftBuildProp(p) {
    return !!(p && (p.kind === "tallGrass" || p.kind === "weed" || p.kind === "wildflower"));
  }

  function clearSoftBuildProp(tx, ty) {
    var i, p;
    for (i = PROPS.length - 1; i >= 0; i--) {
      p = PROPS[i];
      if (!isSoftBuildProp(p) || !propOccupies(p, tx, ty)) continue;
      PROPS.splice(i, 1);
    }
  }

  function canBuildOn(tx, ty) {
    var ch, p;
    if (currentScene !== "overworld") return false;
    if (!inBounds(tx, ty)) return false;
    ch = cell(tx, ty);
    if (ch !== "g" && ch !== "d" && ch !== "h" && ch !== "m" && ch !== "k") return false;
    if (!walkable(tx, ty)) return false;
    p = propAt(tx, ty);
    if (p && !isSoftBuildProp(p)) return false;
    if (tx === npc.tx && ty === npc.ty) return false;
    if (tx === chicken.tx && ty === chicken.ty) return false;
    if (carOccupies(tx, ty)) return false;
    if (isEntrance(tx, ty)) return false;
    return true;
  }

  function woodsDigAt(tx, ty) {
    var i, s;
    if (currentScene !== "forest") return null;
    for (i = 0; i < WOODS_DIG_SPOTS.length; i++) {
      s = WOODS_DIG_SPOTS[i];
      if (s.tx === tx && s.ty === ty) return s;
    }
    return null;
  }

  function woodsDugAt(tx, ty) {
    var i, b;
    for (i = 0; i < builds.length; i++) {
      b = builds[i];
      if (b && b.kind === "woodsHole" && b.tx === tx && b.ty === ty) return true;
    }
    return false;
  }

  function farmDigAt(tx, ty) {
    var i, s;
    if (currentScene !== "overworld") return null;
    for (i = 0; i < FARM_DIG_SPOTS.length; i++) {
      s = FARM_DIG_SPOTS[i];
      if (s.tx === tx && s.ty === ty) return s;
    }
    return null;
  }

    var i, b;
    for (i = 0; i < builds.length; i++) {
      b = builds[i];
      if (b && (b.kind === "farmHole" || b.kind === "hole") && b.tx === tx && b.ty === ty) return true;
    }
    return false;
  }

  function digLootName(kind) {
    if (kind === "copper") return "COPPER";
    if (kind === "mushroom") return "A MUSHROOM";
    if (kind === "potato") return "A POTATO";
    if (kind === "flower") return "A FLOWER";
    if (kind === "pebble") return "A PEBBLE";
    if (kind === "veggie") return "A CARROT";
    if (kind === "iron") return "IRON";
    if (kind === "gold") return "A COIN";
    if (kind === "goldPile") return "GOLD";
    if (kind === "gem") return "A GEM";
    if (kind === "sapphire") return "A SAPPHIRE";
    if (kind === "stone") return "A STONE";
    if (kind === "silver") return "SILVER";
    if (kind === "goldore") return "GOLD ORE";
    return "A STONE";
  }

  /* 20260905ci: kid toast when a foe drops loot */
  function lootDropNote(kind, amount) {
    var name = digLootName(kind);
    amount = amount | 0;
    if (kind === "gold" || kind === "sapphire" || kind === "gem") {
      if (amount > 1) return "GOT " + name + " +" + amount + "!";
      return "GOT " + name + "!";
    }
    if (amount > 1) return "GOT " + name + " x" + amount + "!";
    return "GOT " + name + "!";
  }

  function woodsLootName(kind) {
    return digLootName(kind);
  }

  function canDigOn(tx, ty) {
    var spot;
    if (!inBounds(tx, ty)) return false;
    if (!walkable(tx, ty)) return false;
    if (propAt(tx, ty)) return false;
    if (folkOccupies(tx, ty)) return false;
    if (isEntrance(tx, ty)) return false;
    if (currentScene === "forest") {
      spot = woodsDigAt(tx, ty);
      if (!spot || woodsDugAt(tx, ty)) return false;
      return true;
    }
    /* 20260905ax: farm dig only on marked mounds (31a) — not every grass tile */
    if (currentScene !== "overworld") return false;
    spot = farmDigAt(tx, ty);
    if (!spot || farmDugAt(tx, ty)) return false;
    if (cell(tx, ty) !== "g") return false;
    if (tx === npc.tx && ty === npc.ty) return false;
    if (tx === chicken.tx && ty === chicken.ty) return false;
    if (carOccupies(tx, ty)) return false;
    return true;
  }

  function tryDig(tx, ty) {
    var spot;
    if (!shovelOwned) return false;
    if (!canDigOn(tx, ty)) return false;
    if (energy <= 0) {
      spendEnergy(ENERGY_HIT);
      return true;
    }
    if (currentScene === "forest") {
      spot = woodsDigAt(tx, ty);
      builds.push({ kind: "woodsHole", tx: tx, ty: ty });
      if (spot && spot.loot) {
        spawnGroundLoot(spot.loot, tx, ty, 1);
        showLineNote("YOU FOUND " + digLootName(spot.loot) + "!");
      }
    } else if (currentScene === "overworld") {
      spot = farmDigAt(tx, ty);
      builds.push({ kind: "farmHole", tx: tx, ty: ty });
      if (spot && spot.loot) {
        spawnGroundLoot(spot.loot, tx, ty, 1);
        showLineNote("YOU FOUND " + digLootName(spot.loot) + "!");
      }
    } else {
      return false;
    }
    spendEnergy(ENERGY_HIT);
    player.workTool = "shovel";
    player.swing = 220;
    spawnSparks(tx * TILE + 8, ty * TILE + 10);
    playSfx("dig");
    persistSave();
    return true;

  function lootKindOk(kind) {
    return kind === "wood" || kind === "stone" || kind === "pebble" || kind === "veggie" ||
      kind === "flower" || kind === "gold" || kind === "goldPile" || kind === "iron" ||
      kind === "copper" || kind === "mushroom" || kind === "sapphire" || kind === "gem" ||
      kind === "mooncrystal" || kind === "silver" || kind === "goldore" ||
      kind === "potato" || kind === "berry" || kind === "acorn" || kind === "pinecone" ||
      kind === "apple" || kind === "bread" || kind === "pie" ? kind : "";
  }

  function lootIsCash(kind) {
    return kind === "gold" || kind === "sapphire" || kind === "gem" ||
      kind === "mooncrystal" || kind === "goldPile";
  }

  function pickupSprite(kind) {
    if (kind === "wood") return "wood";
    if (kind === "stone") return "stoneItem";
    if (kind === "gold") return "goldCoin";
    if (kind === "goldPile") return "goldPile";
    if (kind === "flower") return "townFlower";
    if (kind === "goldore") return "goldore";
    return kind;
  }

  function lootScene() {
    return liveHarvestScene();
  }

  function lootAtTile(tx, ty, scene) {
    var i, list = [];
    scene = scene || lootScene();
    for (i = 0; i < groundLoot.length; i++) {
      if (groundLoot[i].scene === scene && groundLoot[i].tx === tx && groundLoot[i].ty === ty) {
        list.push(groundLoot[i]);
      }
    }
    return list;
  }

  function findLootPile(kind, tx, ty, scene) {
    var i;
    scene = scene || lootScene();
    for (i = 0; i < groundLoot.length; i++) {
      if (groundLoot[i].scene === scene && groundLoot[i].kind === kind &&
          groundLoot[i].tx === tx && groundLoot[i].ty === ty) {
        return groundLoot[i];
      }
    }
    return null;
  }

  function spawnGroundLoot(kind, fromTx, fromTy, amount, opt) {
    var pile, sx, sy;
    amount = amount | 0;
    if (!lootKindOk(kind) || amount <= 0) return;
    pile = findLootPile(kind, fromTx, fromTy);
    if (pile) {
      pile.amount += amount;
      if (opt && opt.fromKill) {
        pile.popAge = 0;
        pile.flash = 480;
        pile.popTall = true;
        if (opt.sx != null) { pile.sx = opt.sx; pile.x = opt.sx; }
        if (opt.sy != null) { pile.sy = opt.sy; pile.y = opt.sy; }
      }
      persistSave();
      return;
    }
    sx = fromTx * TILE + 8;
    sy = fromTy * TILE + 4;
    if (opt && opt.sx != null) sx = opt.sx;
    if (opt && opt.sy != null) sy = opt.sy;
    groundLoot.push({
      id: lootSeq++,
      scene: lootScene(),
      kind: kind,
      amount: amount,
      tx: fromTx,
      ty: fromTy,
      x: sx,
      y: sy,
      sx: sx,
      sy: sy,
      popAge: 0,
      popTall: !!(opt && opt.fromKill),
      flash: (opt && opt.fromKill) ? 480 : 0
    });
    persistSave();
  }

  function spawnKillLoot(kind, mon, amount) {
    if (!mon || !lootKindOk(kind) || !(amount | 0)) return;
    spawnGroundLoot(kind, mon.tx, mon.ty, amount, {
      fromKill: true,
      sx: mon.x,
      sy: mon.y - 10
    });
    showLineNote(lootDropNote(kind, amount));
  }

  function lootTakeRoom(kind) {
    var key;
    if (lootIsCash(kind)) return 999;
    key = stackKey(kind);
    if (!key) return 0;
    return bagRoom(key);
  }

  function collectLootPile(pile) {
    var take, room, i;
    if (!pile || pile.amount <= 0) return 0;
    room = lootTakeRoom(pile.kind);
    take = pile.amount < room ? pile.amount : room;
    if (take <= 0) return 0;
    pile.amount -= take;
    if (pile.amount <= 0) {
      i = groundLoot.indexOf(pile);
      if (i >= 0) groundLoot.splice(i, 1);
    }
    persistSave();
    spawnPickup(pile.kind, pile.tx, pile.ty, take);
    /* 20260905da: gold coins get warm sparkle; other loot keeps soft sparks */
    /* 20260905dc: metal / bar piles get metal sparkle */
    if (pile.kind === "gold" || pile.kind === "goldPile") {
      spawnCoinSparks(pile.tx * TILE + 8, pile.ty * TILE + 6);
    } else if (isMetalLoot(pile.kind)) {
      spawnMetalSparks(pile.tx * TILE + 8, pile.ty * TILE + 6, pile.kind);
    } else {
      spawnSparks(pile.tx * TILE + 8, pile.ty * TILE + 6);
    }
    return take;
  }

  function collectLootAt(tx, ty) {
    var piles, i, took, any;
    piles = lootAtTile(tx, ty).slice();
    if (!piles.length) return false;
    any = false;
    for (i = 0; i < piles.length; i++) {
      took = collectLootPile(piles[i]);
      if (took > 0) any = true;
    }
    if (!any) showLineNote("BAG FULL. USE THE CHEST.");
    return any;
  }

  function goCollectLootAt(tx, ty) {
    var path, dest;
    if (!lootAtTile(tx, ty).length) return;
    highlight = { tx: tx, ty: ty };
    if (player.tx === tx && player.ty === ty) {
      pending = null;
      collectLootAt(tx, ty);
      return;
    }
    if (walkable(tx, ty)) {
      path = findPath(player.tx, player.ty, tx, ty);
      if (!path.length) return;
      pending = { type: "loot", tx: tx, ty: ty };
      startWalk(player, path, 3.5);
      return;
    }
    if (isNear(player.tx, player.ty, tx, ty)) {
      pending = null;
      collectLootAt(tx, ty);
      return;
    }
    dest = nearestAdjacent(tx, ty);
    if (!dest) return;

  function applyBuildsTo(ground, props) {
    var i, b, j, exists;
    if (!builds || !builds.length || !ground || !props) return;
    for (i = 0; i < builds.length; i++) {
      b = builds[i];
      if (!b || b.kind !== "goneFence") continue;
      if (b.ty < 0 || b.ty >= ground.length || !ground[b.ty]) continue;
      if (b.tx < 0 || b.tx >= ground[b.ty].length) continue;
      for (j = props.length - 1; j >= 0; j--) {
        if (props[j].tx === b.tx && props[j].ty === b.ty && isFenceKind(props[j].kind)) {
          props.splice(j, 1);
        }
      }
    }
    for (i = 0; i < builds.length; i++) {
      b = builds[i];
      if (!b || b.kind === "goneFence") continue;
      if (b.ty < 0 || b.ty >= ground.length || !ground[b.ty]) continue;
      if (b.tx < 0 || b.tx >= ground[b.ty].length) continue;
      if (b.kind === "path") {
        if (ground[b.ty][b.tx] === "g" || ground[b.ty][b.tx] === "d" || ground[b.ty][b.tx] === "h" || ground[b.ty][b.tx] === "k" || ground[b.ty][b.tx] === "m" || ground[b.ty][b.tx] === "c") {
          ground[b.ty][b.tx] = "c";
        }
      } else if (b.kind === "hole") {
        if (ground[b.ty][b.tx] === "g") ground[b.ty][b.tx] = "p";
      } else if (b.kind === "townFlower") {
        exists = false;
        for (j = 0; j < props.length; j++) {
          if (props[j].tx === b.tx && props[j].ty === b.ty && props[j].kind === "townFlower") {
            exists = true;
            break;
          }
        }
        if (!exists) props.push({ kind: "townFlower", tx: b.tx, ty: b.ty });
      } else if (b.kind === "fenceH" || b.kind === "fenceL" || b.kind === "fenceR") {
        exists = false;
        for (j = 0; j < props.length; j++) {
          if (props[j].tx === b.tx && props[j].ty === b.ty && isFenceKind(props[j].kind)) {
            exists = true;
            break;
          }
        }
        if (!exists) props.push({ kind: b.kind, tx: b.tx, ty: b.ty });
      } else if (b.kind === "lampPost" || b.kind === "crate") {
        exists = false;

  function applyRestore() {
    var scene, tx, ty, face, spot;

    tx = pendingRestore.tx;

      if (ty >= OVER_ROWS - 1) ty = OVER_ROWS - 2;

      if (scene === "house") { tx = 10; ty = 9; face = "up"; }

      }

        else { tx = 16; ty = 19; face = "up"; }
      }
      else {
        spot = nearestWalkable(tx, ty);
        tx = spot.tx;
        ty = spot.ty;
      }
    }
    placePlayer(tx, ty, face);
    pendingRestore = null;
    unstickPlayer();
    unstickBall();
    unstickPlayBalls();

    maybeMineOutTip();

    fire = findFireplace();
    highlight = fire ? { tx: fire.tx, ty: fire.ty } : null;
    if (!fire || nearFireplace()) {
      pending = null;
      doSmeltNow();
      return;

    best = null;
    d = 999;
    for (y = 0; y < 2; y++) {
      for (x = 0; x < 2; x++) {
        cand = nearestAdjacent(fire.tx + x, fire.ty + y);
        if (!cand) continue;
        if (Math.abs(cand.tx - player.tx) + Math.abs(cand.ty - player.ty) < d) {
          d = Math.abs(cand.tx - player.tx) + Math.abs(cand.ty - player.ty);
          best = cand;
        }
      }
    }
    dest = best;
    if (!dest) {
      doSmeltNow();
      return;
    }
    path = findPath(player.tx, player.ty, dest.tx, dest.ty);
    if (!path.length) {
      doSmeltNow();
      return;

    pending = { type: "smelt" };
    startWalk(player, path, 3.5);

  function trimPocketOver(arr, len) {
    var i, c, extra, room, move, cap;
    for (i = 0; i < len; i++) {
      c = arr[i];
      if (!c) continue;
      cap = stackCap(c.key);
      extra = (c.count | 0) - cap;
      if (extra <= 0) continue;
      c.count = cap;
      room = chestRoom(c.key);
      move = extra < room ? extra : room;
      if (move > 0) chest[c.key] = chestCount(c.key) + move;
    }
  }

  function serializePocket(arr, len, skipTrayAlias) {
    var out = [], i, c;
    for (i = 0; i < len; i++) {
      c = arr[i];
      if (skipTrayAlias && trayHoldsRec(c)) {
        out.push(null);
        continue;
      }
      if (c && c.key && (c.count | 0) > 0) out.push({ key: c.key, count: c.count | 0 });
      else out.push(null);
    }
    return out;
  }

  function readPocketArr(src, len) {
    var out = [], i, rec, key, cnt;
    for (i = 0; i < len; i++) {
      rec = src && src[i];
      out.push(null);
      if (!rec || typeof rec !== "object") continue;
      key = rec.key || rec.k || "";
      cnt = clampCount(rec.count != null ? rec.count : rec.n);
      if (!key || cnt < 1) continue;
      if (!isToolKey(key) && !stackKey(key)) continue;
      out[i] = { key: key, count: isToolKey(key) ? 1 : cnt };
    }
    return out;
  }

  function pocketArrOk(arr, len) {
    return !!(arr && typeof arr.length === "number" && arr.length === len);
  }

  function pourIntoBagOnly(key, n) {
    var left, cap, take, idx;
    left = n | 0;
    if (!key || left <= 0) return;
    cap = stackCap(key);
    left = fillStacksIn(bagCells, BAG_CELLS, key, left, cap);
    while (left > 0) {
      idx = firstEmptyBag();
      if (idx < 0) break;
      take = left < cap ? left : cap;
      bagCells[idx] = { key: key, count: take };
      left -= take;
    }
  }

  function placeToolInTrayFirst(key) {
    var idx, i, c, bagIdx, swapIdx, empty;
    function done() {
      if (isWeaponKey(key)) enforceOneWeaponInTray(key);
    }
    if (!key) return;
    for (i = 0; i < TRAY_CELLS; i++) {
      if (trayCells[i] && trayCells[i].key === key) { done(); return; }
    }
    bagIdx = -1;
    for (i = 0; i < BAG_CELLS; i++) {
      c = bagCells[i];
      if (c && c.key === key) { bagIdx = i; break; }
    }
    if (bagIdx >= 0) {
      c = bagCells[bagIdx];
      idx = firstEmptyTray();
      if (idx >= 0) {
        trayCells[idx] = { key: c.key, count: c.count | 0 };
        bagCells[bagIdx] = null;
        done(); return;
      }
      /* Tray full: swap a non-tool stack out (prefer end of tray). */
      swapIdx = -1;
      for (i = TRAY_CELLS - 1; i >= 0; i--) {
        if (trayCells[i] && !isToolKey(trayCells[i].key)) { swapIdx = i; break; }
      }
      if (swapIdx < 0) return; /* every tray slot is already a tool */
      empty = firstEmptyBag();
      if (empty >= 0) {
        bagCells[empty] = { key: trayCells[swapIdx].key, count: trayCells[swapIdx].count | 0 };
        trayCells[swapIdx] = { key: c.key, count: c.count | 0 };
        bagCells[bagIdx] = null;
      } else {
        bagCells[bagIdx] = { key: trayCells[swapIdx].key, count: trayCells[swapIdx].count | 0 };
        trayCells[swapIdx] = { key: c.key, count: c.count | 0 };
      }
      done(); return;
    }
    idx = firstEmptyTray();
    if (idx >= 0) {
      trayCells[idx] = { key: key, count: 1 };
      done(); return;
    }
    /* Not in bag/tray: create in tray via non-tool swap if possible. */
    swapIdx = -1;
    for (i = TRAY_CELLS - 1; i >= 0; i--) {
      if (trayCells[i] && !isToolKey(trayCells[i].key)) { swapIdx = i; break; }
    }
    if (swapIdx >= 0) {
      empty = firstEmptyBag();
      if (empty >= 0) {
        bagCells[empty] = { key: trayCells[swapIdx].key, count: trayCells[swapIdx].count | 0 };
        trayCells[swapIdx] = { key: key, count: 1 };
        done(); return;
      }
      /* Bag full too: merge displaced stack into an existing bag pile, else swap with a bag cell. */
      c = trayCells[swapIdx];
      for (i = 0; i < BAG_CELLS; i++) {
        if (bagCells[i] && bagCells[i].key === c.key && !isToolKey(c.key)) {
          bagCells[i].count = (bagCells[i].count | 0) + (c.count | 0);
          trayCells[swapIdx] = { key: key, count: 1 };
          done(); return;
        }
      }
      for (i = BAG_CELLS - 1; i >= 0; i--) {
        if (bagCells[i] && !isToolKey(bagCells[i].key)) {
          bagCells[i] = { key: c.key, count: c.count | 0 };
          trayCells[swapIdx] = { key: key, count: 1 };
          done(); return;
        }
      }
    }
    idx = firstEmptyBag();
    if (idx >= 0) bagCells[idx] = { key: key, count: 1 };
  }

  function migrateOldInventoryToPockets() {
    var i, key, n;
    emptyTray();
    emptyBag();
    placeToolInTrayFirst("seed");
    if (hatOwned) placeToolInTrayFirst("hat");
    if (swordOwned) placeToolInTrayFirst("sword");
    if (shovelOwned) placeToolInTrayFirst("shovel");
    if (axeOwned) placeToolInTrayFirst("axe");
    if (pickaxeOwned) placeToolInTrayFirst("pick");

  function clearKeyFromPockets(key) {
    var i;

      if (trayCells[i] && trayCells[i].key === key) trayCells[i] = null;

    for (i = 0; i < BAG_CELLS; i++) if (bagCells[i] === rec) bagCells[i] = null;

      key === "hat" || key === "leash" || key === "lampKit" || key === "crateKit";
  }

  function forceSwordIntoTray() {
    var i, empty, c, displaced, soft;
    /* Recover ownership if a pocket still holds a sword ghost. */
    if (!swordOwned) {
      for (i = 0; i < TRAY_CELLS; i++) {
        if (trayCells[i] && trayCells[i].key === "sword") { swordOwned = true; break; }
      }
    }
    if (!swordOwned) {
      for (i = 0; i < BAG_CELLS; i++) {
        if (bagCells[i] && bagCells[i].key === "sword") { swordOwned = true; break; }
      }

    if (!swordOwned) return;
    clearKeyFromPockets("sword");
    /* Hard-pin hotbar slot 0; relocate whatever was there. */
    c = trayCells[0];
    if (c && c.key && c.key !== "sword") {
      displaced = { key: c.key, count: c.count | 0 };
      empty = firstEmptyTray();
      if (empty >= 0) trayCells[empty] = displaced;
      else {
        /* Prefer parking soft tools/kits/stacks into the bag. */
        soft = softTrayBumpKey(displaced.key) || !isToolKey(displaced.key);
        empty = firstEmptyBag();
        if (empty >= 0) bagCells[empty] = displaced;
        else {
          for (i = BAG_CELLS - 1; i >= 0; i--) {
            if (bagCells[i] && !isToolKey(bagCells[i].key)) {
              bagCells[i] = displaced;
              break;
            }
          }
        }
        if (soft) { /* kept for readability; displacement already done */ }
      }
    }
    trayCells[0] = { key: "sword", count: 1 };
    /* Cave sword hard-pin wins: bow (or any other weapon) leaves the tray. */
    enforceOneWeaponInTray("sword");
    selectedSlot = 0;

  /* 20260905bg — forever only 1 fishing pole across tray/bag/chest/held.
     Pip buy stays OWNED; tools never stack count>1. */
  function ensureOnePole() {
    var i, c, saw;
    saw = false;
    for (i = 0; i < TRAY_CELLS; i++) {
      c = trayCells[i];
      if (c && c.key === "pole") { saw = true; break; }
    }
    if (!saw) {
      for (i = 0; i < BAG_CELLS; i++) {
        c = bagCells[i];
        if (c && c.key === "pole") { saw = true; break; }
      }
    }
    if (!saw && bagHeld && bagHeld.key === "pole") saw = true;
    if (!saw && ((chest.pole | 0) > 0)) saw = true;
    if (saw) poleOwned = true;
    /* Tools are not chest rows — wipe any legacy chest.pole extras. */
    if ((chest.pole | 0) > 0) chest.pole = 0;
    if (!poleOwned) return;
    clearKeyFromPockets("pole");
    if (bagHeld && bagHeld.key === "pole") {
      bagHeld = null;
      bagHeldFrom = null;
    }
    placeToolInTrayFirst("pole");
    /* Hard-cap: never leave count>1 or a second copy. */
    saw = false;
    for (i = 0; i < TRAY_CELLS; i++) {
      c = trayCells[i];
      if (!c || c.key !== "pole") continue;
      if (!saw) { c.count = 1; saw = true; }
      else trayCells[i] = null;
    }
    for (i = 0; i < BAG_CELLS; i++) {
      c = bagCells[i];
      if (!c || c.key !== "pole") continue;
      if (!saw) { c.count = 1; saw = true; }
      else bagCells[i] = null;
    }
    if (!saw) {
      i = firstEmptyBag();
      if (i >= 0) bagCells[i] = { key: "pole", count: 1 };
      else {
        for (i = BAG_CELLS - 1; i >= 0; i--) {
          if (!bagCells[i] || !isToolKey(bagCells[i].key)) {
            bagCells[i] = { key: "pole", count: 1 };
            break;
          }
        }
      }
    }
    syncBagCounts();
  }

  function ensureCaveSword(silent) {

  function findHouseChest() {
    var i, p;
    for (i = 0; i < PROPS.length; i++) {
      p = PROPS[i];
      if (p.kind === "houseChest") return p;
    }
    return null;
  }

  function nearHouseChest() {
    var box = findHouseChest();
    if (!box) return false;
    if (isNear(player.tx, player.ty, box.tx, box.ty)) return true;
    if (player.tx === box.tx && player.ty === box.ty) return true;
    /* Forest chest art hangs into the south tile; standing one more step
       south still counts as adjacent so Space/E open the UI. */
    if (currentScene === "forest" && player.tx === box.tx && player.ty === box.ty + 2) return true;
    return false;
  }

  function standingOnHouseChest() {
    var box = findHouseChest();
    if (!box) return false;
    return player.tx === box.tx && player.ty === box.ty;
  }

  function tryBumpChest(tx, ty) {
    if (currentScene !== "house" && currentScene !== "forest" && currentScene !== "tree") return false;
    if (!houseChestHit(tx, ty, null)) return false;
    pending = null;
    openChest();
    return true;
  }

  function houseChestHit(tx, ty, world) {
    var box, b;
    if (currentScene !== "house" && currentScene !== "forest" && currentScene !== "tree") return false;
    box = findHouseChest();
    if (!box) return false;
    if (propOccupies(box, tx, ty)) return true;
    if (!world) return false;
    b = propBounds(box);
    return world.x >= b.x && world.x < b.x + b.w && world.y >= b.y && world.y < b.y + b.h;
  }
