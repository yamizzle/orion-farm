<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#2A1A10">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="format-detection" content="telephone=no">
  <title>Moondrop Mountain</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html {
      --sat: env(safe-area-inset-top, 0px);
      --sar: env(safe-area-inset-right, 0px);
      --sab: env(safe-area-inset-bottom, 0px);
      --sal: env(safe-area-inset-left, 0px);
    }
    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      overscroll-behavior: none;
      -webkit-text-size-adjust: 100%;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none;
      user-select: none;
      background: #2A1A10;
    }
    body {
      position: fixed;
      inset: 0;
    }
    #frame {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #2A1A10;
    }
    #game {
      display: block;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      -ms-interpolation-mode: nearest-neighbor;
      background: #5FBF22;
    }
    #frame:fullscreen,
    #frame:-webkit-full-screen {
      width: 100%;
      height: 100%;
      background: #2A1A10;
    }
    #fsBtn {
      position: absolute;
      top: max(8px, var(--sat));
      right: max(8px, var(--sar));
      z-index: 5;
      min-width: 44px;
      min-height: 44px;
      padding: 6px 8px;
      border: 0;
      background: transparent;
      cursor: pointer;
      -webkit-appearance: none;
      appearance: none;
      touch-action: manipulation;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #fsFace {
      display: block;
      width: 96px;
      height: 39px;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      pointer-events: none;
    }
    #fsBtn:active #fsFace { filter: brightness(0.9); }
  </style>
</head>
<body>
  <div id="frame">
    <canvas id="game" width="320" height="192" role="application" aria-label="Moondrop Mountain"></canvas>
    <button type="button" id="fsBtn" aria-label="Full Screen">
      <canvas id="fsFace" width="32" height="13"></canvas>
    </button>
  </div>
  <script>
(function () {
  "use strict";

  var VIEW_W = 320;
  var VIEW_H = 192;
  var TILE = 16;
  var COLS = 20;
  var ROWS = 12;

  var C = {
    sky: "#8EC8E8",
    grassHi: "#8FD42A",
    grassMid: "#5FBF22",
    grassSh: "#2F7A14",
    grassDp: "#1E5A12",
    dirtHi: "#F0B428",
    dirtMid: "#D49420",
    dirtSh: "#A86C14",
    till: "#B56F29",
    tillSh: "#6D4427",
    tillOut: "#3E2410",
    water: "#4A96C8",
    waterDp: "#2E6A96",
    waterFm: "#A8D4E8",
    stone: "#8A8A7A",
    stoneHi: "#B0B0A0",
    stoneSh: "#5A5A4E",
    woodHi: "#E8B060",
    woodMid: "#C47A38",
    woodSh: "#7A3E18",
    woodOut: "#3D1A0C",
    roof: "#C45A38",
    roofHi: "#E07850",
    roofSh: "#8B2E1C",
    parch: "#F3D2A3",
    uiText: "#3A2210",
    gold: "#8B1A1A",
    energy: "#6BCB3C",
    energyEmpty: "#3A4A20",
    slot: "#8B5A28",
    bevelDk: "#5B2B2A",
    leaf: "#4A9A28",
    flower: "#E8C84A",
    blossom: "#E8A0A8",
    door: "#5A3A22",
    glass: "#7AB8C8",
    letterbox: "#2A1A10",
    skin: "#F0C090"
  };

  /* 5x7 bitmasks, bit4 = left */
  var FONT = {
    " ": [0,0,0,0,0,0,0],
    "A": [0x0E,0x11,0x11,0x1F,0x11,0x11,0x11],
    "B": [0x1E,0x11,0x11,0x1E,0x11,0x11,0x1E],
    "C": [0x0E,0x11,0x10,0x10,0x10,0x11,0x0E],
    "D": [0x1E,0x11,0x11,0x11,0x11,0x11,0x1E],
    "E": [0x1F,0x10,0x10,0x1E,0x10,0x10,0x1F],
    "F": [0x1F,0x10,0x10,0x1E,0x10,0x10,0x10],
    "G": [0x0E,0x11,0x10,0x17,0x11,0x11,0x0E],
    "H": [0x11,0x11,0x11,0x1F,0x11,0x11,0x11],
    "I": [0x1F,0x04,0x04,0x04,0x04,0x04,0x1F],
    "J": [0x01,0x01,0x01,0x01,0x11,0x11,0x0E],
    "K": [0x11,0x12,0x14,0x18,0x14,0x12,0x11],
    "L": [0x10,0x10,0x10,0x10,0x10,0x10,0x1F],
    "M": [0x11,0x1B,0x15,0x15,0x11,0x11,0x11],
    "N": [0x11,0x19,0x15,0x13,0x11,0x11,0x11],
    "O": [0x0E,0x11,0x11,0x11,0x11,0x11,0x0E],
    "P": [0x1E,0x11,0x11,0x1E,0x10,0x10,0x10],
    "Q": [0x0E,0x11,0x11,0x11,0x15,0x12,0x0D],
    "R": [0x1E,0x11,0x11,0x1E,0x14,0x12,0x11],
    "S": [0x0F,0x10,0x10,0x0E,0x01,0x01,0x1E],
    "T": [0x1F,0x04,0x04,0x04,0x04,0x04,0x04],
    "U": [0x11,0x11,0x11,0x11,0x11,0x11,0x0E],
    "V": [0x11,0x11,0x11,0x11,0x11,0x0A,0x04],
    "W": [0x11,0x11,0x11,0x15,0x15,0x1B,0x11],
    "X": [0x11,0x11,0x0A,0x04,0x0A,0x11,0x11],
    "Y": [0x11,0x11,0x0A,0x04,0x04,0x04,0x04],
    "Z": [0x1F,0x01,0x02,0x04,0x08,0x10,0x1F],
    "1": [0x04,0x0C,0x04,0x04,0x04,0x04,0x0E],
    "'": [0x04,0x04,0x08,0x00,0x00,0x00,0x00],
    "·": [0x00,0x00,0x00,0x04,0x00,0x00,0x00],
    ".": [0x00,0x00,0x00,0x00,0x00,0x04,0x04],
    "!": [0x04,0x04,0x04,0x04,0x04,0x00,0x04]
  };

  var canvas = document.getElementById("game");
  var ctx = canvas.getContext("2d");
  var frame = document.getElementById("frame");
  var fsBtn = document.getElementById("fsBtn");
  var fsFace = document.getElementById("fsFace");
  var scale = 3;
  var fillMode = false;
  var swipeStartY = null;
  var assets = {};

  function loadImage(src) {
    return new Promise(function (resolve, reject) {
      var img = new Image();
      img.onload = function () { resolve(img); };
      img.onerror = function () { reject(new Error("image " + src)); };
      img.src = src;
    });
  }

  var Assets = {
    img: null,
    spr: {},
    ready: false,
    load: function () {
      return fetch("assets/manifest.json").then(function (r) {
        if (!r.ok) throw new Error("manifest " + r.status);
        return r.json();
      }).then(function (meta) {
        var map = {};
        var i, s, k;
        for (i = 0; i < meta.sprites.length; i++) {
          s = meta.sprites[i];
          map[s.id] = s;
        }
        Assets.spr = map;
        if (meta.palette) {
          for (k in meta.palette) {
            if (Object.prototype.hasOwnProperty.call(meta.palette, k)) C[k] = meta.palette[k];
          }
        }
        return loadImage("assets/" + (meta.atlas || "atlas.png"));
      }).then(function (img) {
        Assets.img = img;
        Assets.ready = true;
      });
    },
    draw: function (ctx, id, x, y, frame) {
      var s = Assets.spr[id];
      if (!s || !Assets.img) return;
      var fr = frame || 0;
      var fw = s.fw || s.w;
      var ox = s.ox || 0;
      var oy = s.oy || 0;
      var ax = (s.anchor && s.anchor[0]) || 0;
      var ay = (s.anchor && s.anchor[1]) || 0;
      ctx.drawImage(
        Assets.img,
        s.x + fr * fw, s.y, fw, s.h,
        Math.round(x + ox - ax), Math.round(y + oy - ay),
        fw, s.h
      );
    }
  };

  var highlight = null;
  var ripples = [];
  var selectedSlot = 0;
  var tick = 0;
  var lastTs = 0;
  var dialogue = false;
  var crops = {};
  var pending = null;
  var solid = null;
  var player = {
    tx: 14, ty: 6,
    x: 14 * 16 + 8,
    y: 6 * 16 + 14,
    face: "down",
    frame: 0,
    moving: false,
    path: [],
    stepFrom: null,
    stepT: 0,
    anim: 0
  };
  var chicken = {
    tx: 8, ty: 8,
    x: 8 * 16 + 8,
    y: 8 * 16 + 14,
    face: "right",
    frame: 0,
    path: [],
    stepFrom: null,
    stepT: 0,
    idle: 400,
    anim: 0,
    react: 0
  };
  var npc = {
    tx: 10, ty: 5,
    x: 10 * 16 + 8,
    y: 5 * 16 + 14,
    face: "right",
    frame: 0
  };

  /* Ground: g grass, d dirt path, p tilled, w water */
  var GROUND = [
    "gggggggggggggggggggg",
    "gggggggggggggggggggg",
    "gggggggggggggggggggg",
    "gggggggggggggggggggg",
    "gggggggggggggggggggg",
    "ggggggggggggddddgggg",
    "gggggppgggggddddgggg",
    "gggggppgggggdddggggg",
    "gggggppggggdddgggggg",
    "ggggggggggdddggggggg",
    "gggggggggdddgggggggg",
    "ggggggggddgggggggggg"
  ];

  var PROPS = [
    { kind: "tree", tx: 2, ty: 3 },
    { kind: "house", tx: 13, ty: 1 },
    { kind: "well", tx: 18, ty: 4 },
    { kind: "mailbox", tx: 16, ty: 5 },
    { kind: "crate", tx: 12, ty: 4 },
    { kind: "pond", tx: 1, ty: 9 },
    { kind: "rock", tx: 8, ty: 3 },
    { kind: "rock", tx: 18, ty: 10 },
    { kind: "rock", tx: 11, ty: 11 },
    { kind: "weed", tx: 4, ty: 4 },
    { kind: "weed", tx: 10, ty: 2 },
    { kind: "weed", tx: 12, ty: 5 },
    { kind: "weed", tx: 19, ty: 7 },
    { kind: "weed", tx: 9, ty: 6 },
    { kind: "fenceH", tx: 4, ty: 5 },
    { kind: "fenceH", tx: 5, ty: 5 },
    { kind: "fenceH", tx: 6, ty: 5 },
    { kind: "fenceL", tx: 4, ty: 6 },
    { kind: "fenceL", tx: 4, ty: 7 },
    { kind: "fenceL", tx: 4, ty: 8 },
    { kind: "fenceR", tx: 7, ty: 5 },
    { kind: "fenceR", tx: 7, ty: 6 },
    { kind: "fenceR", tx: 7, ty: 7 },
    { kind: "fenceR", tx: 7, ty: 8 }
  ];

  function px(g, x, y, color) {
    g.fillStyle = color;
    g.fillRect(x, y, 1, 1);
  }

  function fill(g, x, y, w, h, color) {
    g.fillStyle = color;
    g.fillRect(x, y, w, h);
  }

  function hash(x, y, s) {
    var n = (x * 374761393 + y * 668265263 + s * 1274126177) | 0;
    n = (n ^ (n >>> 13)) * 1274126177;
    return ((n >>> 0) % 1000) / 1000;
  }

  function cell(tx, ty) {
    if (ty < 0 || ty >= ROWS || tx < 0 || tx >= COLS) return "g";
    return GROUND[ty].charAt(tx);
  }

  function buildSolid() {
    var y, x, i;
    solid = [];
    for (y = 0; y < ROWS; y++) {
      solid[y] = [];
      for (x = 0; x < COLS; x++) solid[y][x] = false;
    }
    function block(tx, ty) {
      if (tx >= 0 && ty >= 0 && tx < COLS && ty < ROWS) solid[ty][tx] = true;
    }
    for (y = 1; y <= 4; y++) {
      for (x = 13; x <= 17; x++) block(x, y);
    }
    block(2, 3);
    block(1, 9); block(2, 9); block(1, 10); block(2, 10);
    block(18, 4);
    block(8, 3); block(18, 10); block(11, 11);
    var fences = [[4, 5], [5, 5], [6, 5], [4, 6], [4, 7], [4, 8], [7, 5], [7, 6], [7, 7], [7, 8]];
    for (i = 0; i < fences.length; i++) block(fences[i][0], fences[i][1]);
    block(npc.tx, npc.ty);
  }

  function inBounds(tx, ty) {
    return tx >= 0 && ty >= 0 && tx < COLS && ty < ROWS;
  }

  function walkable(tx, ty) {
    return inBounds(tx, ty) && !solid[ty][tx];
  }

  function chickenOk(tx, ty) {
    if (!walkable(tx, ty)) return false;
    var ch = cell(tx, ty);
    return ch === "g" || ch === "d";
  }

  function tileCenterX(tx) { return tx * TILE + 8; }
  function tileFootY(ty) { return ty * TILE + 14; }

  function findPath(sx, sy, ex, ey) {
    if (!walkable(ex, ey)) return [];
    if (sx === ex && sy === ey) return [];
    var q = [[sx, sy]];
    var came = {};
    function key(x, y) { return x + "," + y; }
    came[key(sx, sy)] = null;
    var dirs = [[0, -1], [0, 1], [-1, 0], [1, 0]];
    var head = 0;
    var i, cur, nx, ny, nk, path, node, k;
    while (head < q.length) {
      cur = q[head++];
      if (cur[0] === ex && cur[1] === ey) {
        path = [];
        k = key(ex, ey);
        while (came[k]) {
          node = came[k];
          path.push({ tx: node[2], ty: node[3] });
          k = node[0] + "," + node[1];
        }
        path.reverse();
        return path;
      }
      for (i = 0; i < 4; i++) {
        nx = cur[0] + dirs[i][0];
        ny = cur[1] + dirs[i][1];
        nk = key(nx, ny);
        if (came[nk] !== undefined) continue;
        if (!walkable(nx, ny)) continue;
        came[nk] = [cur[0], cur[1], nx, ny];
        q.push([nx, ny]);
      }
    }
    return [];
  }

  function faceToward(who, tx, ty) {
    var dx = tx - who.tx;
    var dy = ty - who.ty;
    if (Math.abs(dx) > Math.abs(dy)) who.face = dx > 0 ? "right" : "left";
    else if (dy !== 0) who.face = dy > 0 ? "down" : "up";
  }

  function startWalk(who, path, speed) {
    who.x = tileCenterX(who.tx);
    who.y = tileFootY(who.ty);
    who.path = path || [];
    who.speed = speed;
    who.stepT = 0;
    who.anim = 0;
    if (who.path.length) {
      who.stepFrom = { tx: who.tx, ty: who.ty };
      who.moving = true;
      faceToward(who, who.path[0].tx, who.path[0].ty);
    } else {
      who.moving = false;
      who.frame = 0;
    }
  }

  function advanceWalk(who, dt) {
    if (!who.path || !who.path.length) {
      who.moving = false;
      who.frame = 0;
      return false;
    }
    var dest = who.path[0];
    var speed = who.speed || 3.5;
    who.stepT += (dt / 1000) * speed;
    if (who.stepT >= 1) {
      who.tx = dest.tx;
      who.ty = dest.ty;
      who.x = tileCenterX(who.tx);
      who.y = tileFootY(who.ty);
      who.path.shift();
      who.stepT = 0;
      if (who.path.length) {
        who.stepFrom = { tx: who.tx, ty: who.ty };
        faceToward(who, who.path[0].tx, who.path[0].ty);
      } else {
        who.moving = false;
        who.frame = 0;
        return true;
      }
    } else {
      var fx = tileCenterX(who.stepFrom.tx);
      var fy = tileFootY(who.stepFrom.ty);
      who.x = fx + (tileCenterX(dest.tx) - fx) * who.stepT;
      who.y = fy + (tileFootY(dest.ty) - fy) * who.stepT;
      who.moving = true;
    }
    who.anim += dt;
    if (who.anim > 180) {
      who.anim = 0;
      who.frame = who.frame ? 0 : 1;
    }
    return false;
  }

  function isNear(ax, ay, bx, by) {
    return Math.abs(ax - bx) + Math.abs(ay - by) <= 1;
  }

  function nearestAdjacent(tx, ty) {
    var dirs = [[0, 1], [0, -1], [-1, 0], [1, 0]];
    var best = null, bestD = 999, i, nx, ny, d;
    for (i = 0; i < 4; i++) {
      nx = tx + dirs[i][0];
      ny = ty + dirs[i][1];
      if (!walkable(nx, ny)) continue;
      d = Math.abs(nx - player.tx) + Math.abs(ny - player.ty);
      if (d < bestD) {
        bestD = d;
        best = { tx: nx, ty: ny };
      }
    }
    return best;
  }

  function plantAt(tx, ty) {
    var k = tx + "," + ty;
    if (cell(tx, ty) !== "p") return;
    if (crops[k]) return;
    crops[k] = "sprout";
  }

  function arrive() {
    if (!pending) return;
    var act = pending;
    pending = null;
    if (act.type === "plant") {
      if (isNear(player.tx, player.ty, act.tx, act.ty)) {
        plantAt(act.tx, act.ty);
        faceToward(player, act.tx, act.ty);
      }
    } else if (act.type === "talk") {
      if (isNear(player.tx, player.ty, npc.tx, npc.ty)) {
        faceToward(player, npc.tx, npc.ty);
        faceToward(npc, player.tx, player.ty);
        dialogue = true;
      }
    }
  }

  function goTalk() {
    highlight = { tx: npc.tx, ty: npc.ty };
    if (isNear(player.tx, player.ty, npc.tx, npc.ty)) {
      pending = null;
      startWalk(player, [], 3.5);
      faceToward(player, npc.tx, npc.ty);
      faceToward(npc, player.tx, player.ty);
      dialogue = true;
      return;
    }
    var dest = nearestAdjacent(npc.tx, npc.ty);
    if (!dest) return;
    pending = { type: "talk" };
    startWalk(player, findPath(player.tx, player.ty, dest.tx, dest.ty), 3.5);
  }

  function goPlant(tx, ty) {
    if (isNear(player.tx, player.ty, tx, ty)) {
      pending = null;
      plantAt(tx, ty);
      faceToward(player, tx, ty);
      return;
    }
    var dest = walkable(tx, ty) ? { tx: tx, ty: ty } : nearestAdjacent(tx, ty);
    if (!dest) return;
    var path = findPath(player.tx, player.ty, dest.tx, dest.ty);
    if (!path.length) return;
    pending = { type: "plant", tx: tx, ty: ty };
    startWalk(player, path, 3.5);
  }

  function goWalk(tx, ty) {
    pending = null;
    if (!walkable(tx, ty)) return;
    startWalk(player, findPath(player.tx, player.ty, tx, ty), 3.5);
  }

  function updateChicken(dt) {
    if (chicken.react > 0) chicken.react -= dt;
    chicken.anim += dt;
    if (chicken.anim > 280) {
      chicken.anim = 0;
      chicken.frame = chicken.frame ? 0 : 1;
    }
    if (chicken.path && chicken.path.length) {
      advanceWalk(chicken, dt);
      return;
    }
    chicken.idle -= dt;
    if (chicken.idle > 0) return;
    chicken.idle = 900 + Math.random() * 2200;
    var dirs = [[0, -1], [0, 1], [-1, 0], [1, 0]];
    var tries, d, nx, ny;
    for (tries = 0; tries < 8; tries++) {
      d = dirs[(Math.random() * 4) | 0];
      nx = chicken.tx + d[0];
      ny = chicken.ty + d[1];
      if (chickenOk(nx, ny)) {
        startWalk(chicken, [{ tx: nx, ty: ny }], 1.3);
        return;
      }
    }
  }

  function drawShadow(g, x, y, hw) {
    var ix = Math.round(x);
    var iy = Math.round(y);
    fill(g, ix - hw, iy - 2, hw * 2, 3, "rgba(30,90,18,0.40)");
    fill(g, ix - hw + 2, iy - 3, hw * 2 - 4, 1, "rgba(30,90,18,0.22)");
  }

  function drawPlayer(g) {
    var bob = (player.moving && player.frame) ? -1 : 0;
    drawShadow(g, player.x, player.y, 5);
    Assets.draw(g, "player-" + player.face, player.x, player.y + bob, player.frame);
  }

  function drawNpc(g) {
    var face = npc.face || "down";
    if (!Assets.spr["npc-" + face]) face = "down";
    drawShadow(g, npc.x, npc.y, 5);
    Assets.draw(g, "npc-" + face, npc.x, npc.y, 0);
  }

  function drawChickenSpr(g) {
    var bob = chicken.frame ? -1 : 0;
    var hop = chicken.react > 0 ? -3 : 0;
    var face = chicken.face === "left" ? "left" : "right";
    drawShadow(g, chicken.x, chicken.y, 4);
    Assets.draw(g, "chicken-" + face, chicken.x, chicken.y + bob + hop, chicken.frame);
  }

  function drawActors(g) {
    var list = [];
    var i;
    for (i = 0; i < PROPS.length; i++) {
      list.push({ foot: propFoot(PROPS[i]), kind: "prop", p: PROPS[i] });
    }
    list.push({ foot: player.y, kind: "player" });
    list.push({ foot: chicken.y, kind: "chicken" });
    list.push({ foot: npc.y, kind: "npc" });
    list.sort(function (a, b) { return a.foot - b.foot; });
    for (i = 0; i < list.length; i++) {
      if (list[i].kind === "prop") drawProp(g, list[i].p);
      else if (list[i].kind === "player") drawPlayer(g);
      else if (list[i].kind === "chicken") drawChickenSpr(g);
      else drawNpc(g);
    }
  }

  function drawDialogue(g) {
    if (!dialogue) return;
    var x = 16, y = 116, w = 288, h = 50;
    woodPanel(g, x, y, w, h);
    fill(g, x + 4, y + 4, w - 8, h - 8, C.parch);
    woodPanel(g, x + 8, y - 6, 62, 11);
    drawText(g, "NEIGHBOR", x + 12, y - 3, C.parch);
    drawText(g, "HI! WELCOME TO", x + 10, y + 12, C.uiText);
    drawText(g, "MOONDROP MOUNTAIN.", x + 10, y + 22, C.uiText);
  }

  function hitSprite(p, x, y, w, h, ox, oy) {
    var left = x - ox;
    var top = y - oy;
    return p.x >= left && p.x < left + w && p.y >= top && p.y < top + h;
  }


  function drawText(g, str, x, y, color) {
    g.fillStyle = color;
    var i, r, c, bits, ch;
    for (i = 0; i < str.length; i++) {
      ch = str.charAt(i);
      bits = FONT[ch] || FONT[" "];
      for (r = 0; r < 7; r++) {
        for (c = 0; c < 5; c++) {
          if (bits[r] & (0x10 >> c)) {
            g.fillRect(x + i * 6 + c, y + r, 1, 1);
          }
        }
      }
    }
  }

  function textWidth(str) {
    return str.length * 6 - 1;
  }

  function woodPanel(g, x, y, w, h) {
    fill(g, x, y, w, h, C.woodMid);
    fill(g, x, y, w, 1, C.woodHi);
    fill(g, x, y, 1, h, C.woodHi);
    fill(g, x, y + h - 1, w, 1, C.bevelDk);
    fill(g, x + w - 1, y, 1, h, C.bevelDk);
    fill(g, x + 1, y + 1, w - 2, 1, C.woodHi);
    fill(g, x + 1, y + h - 2, w - 2, 1, C.woodSh);
  }

  function grassIndex(tx, ty) {
    return ((tx * 3 + ty * 7) >>> 0) % 4;
  }

  function drawDirtTile(g, tx, ty, dx, dy) {
    Assets.draw(g, "dirt", dx, dy);
    /* jagged grass bites on edges */
    var n = cell(tx, ty - 1) === "g";
    var s = cell(tx, ty + 1) === "g";
    var e = cell(tx + 1, ty) === "g";
    var w = cell(tx - 1, ty) === "g";
    var i, ox, col;
    if (n) {
      for (i = 0; i < 16; i++) {
        ox = (hash(tx, ty, i + 40) < 0.45) ? 2 : 1;
        col = hash(tx, i, 2) < 0.5 ? C.grassMid : C.grassHi;
        fill(g, dx + i, dy, 1, ox, col);
        if (hash(tx, ty, i) < 0.25) px(g, dx + i, dy + ox, C.grassSh);
      }
    }
    if (s) {
      for (i = 0; i < 16; i++) {
        ox = (hash(tx, ty, i + 80) < 0.4) ? 2 : 1;
        col = hash(tx, i, 5) < 0.5 ? C.grassMid : C.grassSh;
        fill(g, dx + i, dy + 16 - ox, 1, ox, col);
      }
    }
    if (w) {
      for (i = 0; i < 16; i++) {
        ox = (hash(tx, ty, i + 120) < 0.4) ? 2 : 1;
        col = hash(ty, i, 3) < 0.5 ? C.grassMid : C.grassHi;
        fill(g, dx, dy + i, ox, 1, col);
      }
    }
    if (e) {
      for (i = 0; i < 16; i++) {
        ox = (hash(tx, ty, i + 160) < 0.4) ? 2 : 1;
        col = hash(ty, i, 8) < 0.5 ? C.grassMid : C.grassSh;
        fill(g, dx + 16 - ox, dy + i, ox, 1, col);
      }
    }
  }


  function propFoot(p) {
    if (p.kind === "house") return p.ty * TILE + 64;
    if (p.kind === "tree") return p.ty * TILE + 24;
    if (p.kind === "well") return p.ty * TILE + 28;
    if (p.kind === "mailbox") return p.ty * TILE + 20;
    if (p.kind === "pond") return p.ty * TILE + 20;
    if (p.kind === "crate") return p.ty * TILE + 14;
    return p.ty * TILE + TILE;
  }

  function drawProp(g, p) {
    var x = p.tx * TILE;
    var y = p.ty * TILE;
    if (p.kind === "house") {
      Assets.draw(g, "house", x, y);
    } else if (p.kind === "tree") {
      Assets.draw(g, "tree", x, y);
    } else if (p.kind === "well") {
      Assets.draw(g, "well", x, y);
    } else if (p.kind === "mailbox") {
      Assets.draw(g, "mailbox", x, y);
    } else if (p.kind === "crate") {
      Assets.draw(g, "crate", x, y);
    } else if (p.kind === "pond") {
      Assets.draw(g, "pond", x, y);
      if (((tick / 700) | 0) % 2) {
        px(g, x + 18, y + 11, C.waterFm);
        px(g, x + 10, y + 19, C.waterFm);
      }
    } else if (p.kind === "rock") {
      Assets.draw(g, "rock" + ((p.tx + p.ty) & 1), x, y);
    } else if (p.kind === "weed") {
      Assets.draw(g, "weed" + ((p.tx + p.ty) & 1), x, y);
    } else if (p.kind === "fenceH") {
      Assets.draw(g, "fenceH", x, y);
    } else if (p.kind === "fenceL") {
      Assets.draw(g, "fenceL", x, y);
    } else if (p.kind === "fenceR") {
      Assets.draw(g, "fenceR", x, y);
    }
  }

  function strokeCircle(g, cx, cy, r, color) {
    g.fillStyle = color;
    var a, x, y;
    for (a = 0; a < 360; a += 10) {
      x = Math.round(cx + Math.cos(a * Math.PI / 180) * r);
      y = Math.round(cy + Math.sin(a * Math.PI / 180) * r);
      g.fillRect(x, y, 1, 1);
    }
  }

  function drawHUD(g) {
    /* title plaque — widened for MOONDROP MOUNTAIN */
    woodPanel(g, 4, 4, 114, 13);
    drawText(g, "MOONDROP MOUNTAIN", 8, 7, C.parch);

    /* day plaque */
    woodPanel(g, 206, 4, 110, 21);
    fill(g, 210, 8, 7, 7, C.flower);
    fill(g, 212, 10, 3, 3, C.parch);
    px(g, 209, 11, C.flower);
    px(g, 217, 11, C.flower);
    px(g, 213, 7, C.flower);
    drawText(g, "DAY 1", 220, 8, C.uiText);
    drawText(g, "SPRING · MORNING", 210, 16, C.parch);

    /* hotbar */
    var slots = 10;
    var slot = 18;
    var gap = 1;
    var barW = slots * slot + (slots - 1) * gap;
    var bx = ((VIEW_W - barW) / 2) | 0;
    var by = VIEW_H - 22;
    woodPanel(g, bx - 3, by - 3, barW + 6, 24);
    var i, sx, sy, sel;
    for (i = 0; i < slots; i++) {
      sx = bx + i * (slot + gap);
      sy = by;
      sel = i === selectedSlot;
      fill(g, sx, sy, slot, slot, sel ? C.woodHi : C.woodSh);
      fill(g, sx + 1, sy + 1, slot - 2, slot - 2, C.slot);
      fill(g, sx + 2, sy + 2, slot - 4, slot - 4, sel ? "#6A4420" : "#5A3818");
      if (sel) {
        fill(g, sx, sy, slot, 1, C.parch);
        fill(g, sx, sy, 1, slot, C.parch);
      }
      if (i === 0) {
        Assets.draw(g, "seed", sx + 1, sy + 1);
      }
    }

    /* energy */
    var ex = VIEW_W - 16;
    var ey = VIEW_H - 70;
    woodPanel(g, ex - 2, ey - 10, 14, 56);
    drawText(g, "E", ex + 2, ey - 8, C.parch);
    fill(g, ex + 1, ey + 2, 8, 40, C.energyEmpty);
    fill(g, ex + 1, ey + 2, 8, 40, C.energy);
    fill(g, ex + 1, ey + 2, 8, 1, C.grassHi);
    fill(g, ex + 1, ey + 2, 1, 40, C.grassHi);
  }

  function drawWorld(g, dt) {
    var tx, ty, ch, dx, dy;

    for (ty = 0; ty < ROWS; ty++) {
      for (tx = 0; tx < COLS; tx++) {
        ch = cell(tx, ty);
        dx = tx * TILE;
        dy = ty * TILE;
        if (ch === "d") drawDirtTile(g, tx, ty, dx, dy);
        else if (ch === "p") {
          Assets.draw(g, "till", dx, dy);
          if (crops[tx + "," + ty]) Assets.draw(g, "sprout", dx, dy);
        }
        else Assets.draw(g, "grass" + grassIndex(tx, ty), dx, dy);
      }
    }

    if (highlight) {
      g.fillStyle = "rgba(243,210,163,0.32)";
      g.fillRect(highlight.tx * TILE, highlight.ty * TILE, TILE, TILE);
      g.fillStyle = "rgba(243,210,163,0.7)";
      g.fillRect(highlight.tx * TILE, highlight.ty * TILE, TILE, 1);
      g.fillRect(highlight.tx * TILE, highlight.ty * TILE, 1, TILE);
      g.fillRect(highlight.tx * TILE, highlight.ty * TILE + 15, TILE, 1);
      g.fillRect(highlight.tx * TILE + 15, highlight.ty * TILE, 1, TILE);
    }

    var i, rp, life, r, alpha;
    for (i = ripples.length - 1; i >= 0; i--) {
      rp = ripples[i];
      rp.age += dt;
      life = rp.age / 520;
      if (life >= 1) {
        ripples.splice(i, 1);
        continue;
      }
      r = 2 + life * 16;
      alpha = 1 - life;
      strokeCircle(g, rp.x, rp.y, r, "rgba(243,210,163," + (alpha * 0.85).toFixed(2) + ")");
      if (r > 5) {
        strokeCircle(g, rp.x, rp.y, r - 3, "rgba(232,176,96," + (alpha * 0.45).toFixed(2) + ")");
      }
    }

    drawActors(g);
    drawHUD(g);
    drawDialogue(g);
  }

  function readInset(name) {
    var v = getComputedStyle(document.documentElement).getPropertyValue(name);
    return parseFloat(v) || 0;
  }

  function viewSize() {
    var vv = window.visualViewport;
    var w = (vv && vv.width) ? vv.width : window.innerWidth;
    var h = (vv && vv.height) ? vv.height : window.innerHeight;
    if (!fillMode) return { w: w, h: h };
    var sat = readInset("--sat");
    var sab = readInset("--sab");
    var sal = readInset("--sal");
    var sar = readInset("--sar");
    var top = vv ? vv.offsetTop : 0;
    var left = vv ? vv.offsetLeft : 0;
    var cutT = Math.max(0, sat - top);
    var cutL = Math.max(0, sal - left);
    var cutB = Math.max(0, (top + h) - (window.innerHeight - sab));
    var cutR = Math.max(0, (left + w) - (window.innerWidth - sar));
    return { w: Math.max(1, w - cutL - cutR), h: Math.max(1, h - cutT - cutB) };
  }

  function isStandalone() {
    if (window.navigator.standalone === true) return true;
    try {
      if (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) return true;
      if (window.matchMedia && window.matchMedia("(display-mode: fullscreen)").matches) return true;
    } catch (err) {}
    return false;
  }

  function fsEnabled() {
    return !!(document.fullscreenEnabled || document.webkitFullscreenEnabled);
  }

  function fsElement() {
    return document.fullscreenElement || document.webkitFullscreenElement || null;
  }

  function requestFs() {
    var els = [frame, document.documentElement];
    function tryAt(i) {
      if (i >= els.length) return;
      var el = els[i];
      if (!el) { tryAt(i + 1); return; }
      var fn = el.requestFullscreen || el.webkitRequestFullscreen || el.webkitRequestFullScreen;
      if (!fn) { tryAt(i + 1); return; }
      try {
        var p = fn.call(el);
        if (p && typeof p.catch === "function") p.catch(function () { tryAt(i + 1); });
      } catch (err) {
        tryAt(i + 1);
      }
    }
    tryAt(0);
  }

  function exitNativeFs() {
    if (!fsElement()) return;
    var fn = document.exitFullscreen || document.webkitExitFullscreen || document.webkitCancelFullScreen;
    if (!fn) return;
    try {
      var p = fn.call(document);
      if (p && typeof p.catch === "function") p.catch(function () {});
    } catch (err) {}
  }

  function paintFsFace() {
    if (!fsFace) return;
    var g = fsFace.getContext("2d");
    var label = fillMode ? "EXIT" : "FULL";
    fsFace.width = 32;
    fsFace.height = 13;
    g.imageSmoothingEnabled = false;
    woodPanel(g, 0, 0, 32, 13);
    drawText(g, label, 5, 3, C.parch);
    if (fsBtn) fsBtn.setAttribute("aria-label", fillMode ? "Exit Full Screen" : "Full Screen");
  }

  function hideSafariChrome() {
    try {
      document.documentElement.style.minHeight = "calc(100% + 2px)";
      window.scrollTo(0, 0);
      setTimeout(function () {
        window.scrollTo(0, 1);
        resize();
      }, 50);
      setTimeout(function () {
        window.scrollTo(0, 0);
        resize();
      }, 280);
    } catch (err) {}
  }

  function enterFill() {
    fillMode = true;
    document.documentElement.classList.add("fill-on");
    document.body.classList.add("fill-on");
    paintFsFace();
    resize();
  }

  function leaveFill() {
    fillMode = false;
    document.documentElement.classList.remove("fill-on");
    document.body.classList.remove("fill-on");
    document.documentElement.style.minHeight = "";
    paintFsFace();
    resize();
    exitNativeFs();
  }

  function enterFull() {
    if (fsEnabled()) requestFs();
    enterFill();
    hideSafariChrome();
  }

  function onFsChange() {
    if (fsElement()) {
      if (!fillMode) enterFill();
      else resize();
    } else if (fillMode) {
      leaveFill();
    }
  }

  function pinFrame() {
    if (!frame) return;
    var vv = window.visualViewport;
    if (fillMode && vv && !fsElement()) {
      frame.style.top = vv.offsetTop + "px";
      frame.style.left = vv.offsetLeft + "px";
      frame.style.width = vv.width + "px";
      frame.style.height = vv.height + "px";
      frame.style.right = "auto";
      frame.style.bottom = "auto";
    } else {
      frame.style.top = "";
      frame.style.left = "";
      frame.style.width = "";
      frame.style.height = "";
      frame.style.right = "";
      frame.style.bottom = "";
    }
  }

  function resize() {
    pinFrame();
    var vs = viewSize();
    var w = vs.w;
    var h = vs.h;
    if (fillMode) {
      scale = Math.min(w / VIEW_W, h / VIEW_H);
      if (scale < 0.5) scale = 0.5;
    } else {
      scale = Math.floor(Math.min(w / VIEW_W, h / VIEW_H));
      if (scale < 1) scale = 1;
      if (scale > 6) scale = 6;
    }
    canvas.style.width = (VIEW_W * scale) + "px";
    canvas.style.height = (VIEW_H * scale) + "px";
    ctx.imageSmoothingEnabled = false;
  }

  function pointFromEvent(e) {
    var src = e;
    if (e.changedTouches && e.changedTouches[0]) src = e.changedTouches[0];
    else if (e.touches && e.touches[0]) src = e.touches[0];
    var rect = canvas.getBoundingClientRect();
    return {
      x: (src.clientX - rect.left) / rect.width * VIEW_W,
      y: (src.clientY - rect.top) / rect.height * VIEW_H
    };
  }

  function tap(e) {
    var p = pointFromEvent(e);
    if (p.x < 0 || p.y < 0 || p.x >= VIEW_W || p.y >= VIEW_H) return;

    if (dialogue) {
      dialogue = false;
      return;
    }

    var slots = 10;
    var slot = 18;
    var gap = 1;
    var barW = slots * slot + (slots - 1) * gap;
    var bx = ((VIEW_W - barW) / 2) | 0;
    var by = VIEW_H - 22;
    if (p.y >= by - 3 && p.y <= by + 18 && p.x >= bx && p.x <= bx + barW) {
      var idx = ((p.x - bx) / (slot + gap)) | 0;
      if (idx >= 0 && idx < slots) selectedSlot = idx;
      return;
    }

    if (hitSprite(p, npc.x, npc.y, 16, 32, 8, 28)) {
      goTalk();
      return;
    }
    if (hitSprite(p, chicken.x, chicken.y, 16, 16, 8, 14)) {
      chicken.react = 420;
      chicken.idle = 500;
      return;
    }

    var tx = Math.floor(p.x / TILE);
    var ty = Math.floor(p.y / TILE);
    if (tx < 0 || ty < 0 || tx >= COLS || ty >= ROWS) return;
    highlight = { tx: tx, ty: ty };
    ripples.push({
      x: tx * TILE + 8,
      y: ty * TILE + 8,
      age: 0
    });
    if (tx === npc.tx && ty === npc.ty) {
      goTalk();
      return;
    }
    if (tx === chicken.tx && ty === chicken.ty) {
      chicken.react = 420;
      chicken.idle = 500;
      return;
    }
    if (selectedSlot === 0 && cell(tx, ty) === "p" && !crops[tx + "," + ty]) {
      goPlant(tx, ty);
      return;
    }
    goWalk(tx, ty);
  }

  function loop(ts) {
    if (!lastTs) lastTs = ts;
    var dt = ts - lastTs;
    if (dt > 64) dt = 64;
    lastTs = ts;
    ctx.imageSmoothingEnabled = false;
    if (!dialogue) {
      if (player.moving || (player.path && player.path.length)) {
        if (advanceWalk(player, dt)) arrive();
      }
      updateChicken(dt);
      tick += dt;
    }
    drawWorld(ctx, dt);
    requestAnimationFrame(loop);
  }

  function paintLoading() {
    ctx.imageSmoothingEnabled = false;
    ctx.fillStyle = C.grassMid;
    ctx.fillRect(0, 0, VIEW_W, VIEW_H);
    woodPanel(ctx, 86, 86, 148, 20);
    drawText(ctx, "LOADING FARM", 96, 92, C.parch);
  }

  function paintMissing() {
    ctx.imageSmoothingEnabled = false;
    ctx.fillStyle = C.letterbox;
    ctx.fillRect(0, 0, VIEW_W, VIEW_H);
    drawText(ctx, "ART MISSING", 8, 8, C.parch);
  }

  paintLoading();
  buildSolid();
  paintFsFace();
  if (isStandalone()) enterFill();
  else resize();
  window.addEventListener("resize", resize);
  if (window.visualViewport) {
    window.visualViewport.addEventListener("resize", resize);
    window.visualViewport.addEventListener("scroll", resize);
  }
  document.addEventListener("fullscreenchange", onFsChange);
  document.addEventListener("webkitfullscreenchange", onFsChange);
  if (fsBtn) {
    fsBtn.addEventListener("pointerdown", function (e) {
      e.preventDefault();
      e.stopPropagation();
      if (fillMode) leaveFill();
      else enterFull();
    });
    fsBtn.addEventListener("click", function (e) {
      e.preventDefault();
      e.stopPropagation();
    });
  }
  document.addEventListener("keydown", function (e) {
    if ((e.key === "Escape" || e.key === "Esc") && fillMode) {
      e.preventDefault();
      leaveFill();
    }
  });
  document.addEventListener("touchstart", function (e) {
    if (!fillMode || !e.touches || !e.touches[0]) return;
    swipeStartY = e.touches[0].clientY < 56 ? e.touches[0].clientY : null;
  }, { passive: true });
  document.addEventListener("touchend", function (e) {
    if (swipeStartY == null || !e.changedTouches || !e.changedTouches[0]) return;
    var dy = e.changedTouches[0].clientY - swipeStartY;
    swipeStartY = null;
    if (dy > 70) leaveFill();
  }, { passive: true });
  canvas.addEventListener("pointerdown", tap, { passive: true });
  document.addEventListener("touchmove", function (e) {
    e.preventDefault();
  }, { passive: false });
  document.addEventListener("gesturestart", function (e) {
    e.preventDefault();
  });
  document.addEventListener("dblclick", function (e) {
    e.preventDefault();
  });
  Assets.load().then(function () {
    requestAnimationFrame(loop);
  }).catch(function () {
    paintMissing();
  });
})();
  </script>
</body>
</html>
