  function closeChest() {
    chestOpen = false;
    chestMsg = "";
    chestScroll = 0;
    chestDrag = null;
  }

  function chestLayout() {
    var w = 280, h = 180;
    var x = ((VIEW_W - w) / 2) | 0;
    var y = 10;
    var listX = x + 8;
    var listY = y + 20;
    var listW = w - 20;
    var btnH = 14;
    var btnW = 78;
    var allY = y + h - 18;
    var listH = allY - listY - 6;
    var rowH = 11;
    var contentH = CHEST_ROWS.length * rowH;
    var maxScroll = contentH - listH;
    if (maxScroll < 0) maxScroll = 0;
    return {
      x: x, y: y, w: w, h: h,
      headY: y + 6,
      listX: listX, listY: listY, listW: listW, listH: listH,
      rowH: rowH, contentH: contentH, maxScroll: maxScroll,
      backX: x + w - 46,
      backY: y - 8,
      backW: 36, backH: 12,
      putX: x + 8, takeX: x + w - 8 - btnW,
      allY: allY,
      btnW: btnW, btnH: btnH,
      bagX: x + 112,
      chestX: x + w - 16
    };
  }

  function clampChestScroll() {
    var L = chestLayout();
    if (chestScroll < 0) chestScroll = 0;
    if (chestScroll > L.maxScroll) chestScroll = L.maxScroll;
  }

  function putInChest(key, amount) {
    var n, have, room, move;
    /* 20260905bg: fishing pole is never a chest stack — keep one forever in tray/bag. */
    if (key === "pole") {
      ensureOnePole();
      return 0;
    }
    n = amount | 0;
    if (n < 0) n = bagCount(key);
    have = bagCount(key);
    room = chestRoom(key);
    move = n;
    if (move > have) move = have;
    if (move > room) move = room;
    if (move <= 0) return 0;
    takeFromBag(key, move);
    chest[key] = chestCount(key) + move;
    persistSave();
    return move;
  }

  function takeFromChest(key, amount) {
    var n, have, room, move;
    n = amount | 0;
    if (n < 0) n = chestCount(key);
    have = chestCount(key);
    room = bagRoom(key);
    move = n;
    if (move > have) move = have;
    if (move > room) move = room;
    if (move <= 0) return 0;
    chest[key] = have - move;
    addToBag(key, move);
    persistSave();
    return move;
  }

  function chestPut(all) {
    var rec, n, i;
    if (all) {
      n = 0;
      for (i = 0; i < CHEST_ROWS.length; i++) n += putInChest(CHEST_ROWS[i].key, -1);
      if (n <= 0) {
        chestMsg = "NOTHING TO PUT.";
        for (i = 0; i < CHEST_ROWS.length; i++) {
          if (bagCount(CHEST_ROWS[i].key) > 0) { chestMsg = "CHEST IS FULL."; break; }
        }
        chestMsgT = 1200;
        return;
      }
      playSfx("ui");
      chestMsg = "PUT AWAY.";
      chestMsgT = 900;
      return;
    }
    rec = CHEST_ROWS[chestSel];
    if (!rec) return;
    n = putInChest(rec.key, 1);
    if (n <= 0) {
      if (bagCount(rec.key) < 1) chestMsg = "NOTHING TO PUT.";
      else chestMsg = "CHEST IS FULL.";
      chestMsgT = 1200;
      return;
    }
    playSfx("ui");
    chestMsg = "";
    chestMsgT = 0;
  }

  function chestTake(all) {
    var rec, n, i;
    if (all) {
      n = 0;
      for (i = 0; i < CHEST_ROWS.length; i++) n += takeFromChest(CHEST_ROWS[i].key, -1);
      if (n <= 0) {
        chestMsg = "CHEST IS EMPTY.";
        for (i = 0; i < CHEST_ROWS.length; i++) {
          if (chestCount(CHEST_ROWS[i].key) > 0) { chestMsg = "BAG FULL."; break; }
        }
        chestMsgT = 1200;
        return;
      }
      playSfx("ui");
      chestMsg = "TOOK IT OUT.";
      chestMsgT = 900;
      return;
    }
    rec = CHEST_ROWS[chestSel];
    if (!rec) return;
    n = takeFromChest(rec.key, 1);
    if (n <= 0) {
      if (chestCount(rec.key) < 1) chestMsg = "CHEST IS EMPTY.";
      else chestMsg = "BAG FULL.";
      chestMsgT = 1200;
      return;
    }
    playSfx("ui");
    chestMsg = "";
    chestMsgT = 0;
  }

  function chestRowAt(p) {
    var L = chestLayout();
    var i;
    if (p.x < L.listX || p.x >= L.x + L.w - 4) return -1;
    if (p.y < L.listY || p.y >= L.listY + L.listH) return -1;
    i = ((p.y - L.listY + chestScroll) / L.rowH) | 0;
    if (i < 0 || i >= CHEST_ROWS.length) return -1;
    return i;
  }

  function tapChestRow(p) {
    var L = chestLayout();
    var i = chestRowAt(p);
    var mid;
    if (i < 0) return false;
    chestSel = i;
    mid = L.x + (L.w / 2) | 0;
    if (p.x < mid) chestPut(false);
    else chestTake(false);
    return true;
  }

  function tapChest(p, e) {
    var L = chestLayout();
    if (hitPad(p.x, p.y, L.backX, L.backY, L.backW, L.backH, 6)) {
      closeChest();
      return true;
    }
    /* Footer: PUT ALL is the left wood; everything else on this strip is TAKE ALL
       (covers the old clustered TAKE ALL at x+88 and the new right-aligned wood).
       2pm live missed the 70x12 because it sat under the list's PUT half. */
    if (p.x >= L.x && p.x <= L.x + L.w && p.y >= L.allY - 6 && p.y < L.allY + L.btnH + 8) {
      if (p.x < L.putX + L.btnW + 4) chestPut(true);
      else chestTake(true);
      return true;
    }
    if (p.x >= L.listX && p.x < L.x + L.w - 4 && p.y >= L.listY && p.y < L.listY + L.listH) {
      chestDrag = { y: p.y, x: p.x, scroll: chestScroll, id: e ? e.pointerId : 0, moved: false };
      if (e && canvas.setPointerCapture) {
        try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
      }
      return true;
    }
    if (p.x >= L.x && p.x <= L.x + L.w && p.y >= L.y && p.y <= L.y + L.h) return true;
    closeChest();
    return true;
  }

  function finishChestDrag(e) {
    var p, dy, dx;
    if (!chestDrag) return;
    if (e) {
      p = pointFromEvent(e);
      dy = chestDrag.y - p.y;
      dx = chestDrag.x - p.x;
      if (!chestDrag.moved && Math.abs(dy) < 4 && Math.abs(dx) < 6) tapChestRow(p);
    }
    chestDrag = null;
  }

  function drawChest(g) {
    var L, i, rec, rowY, bagN, boxN, col, name, barH, barY, barX;
    if (!chestOpen) return;
    g.fillStyle = "rgba(20,12,8,0.40)";
    g.fillRect(0, 0, VIEW_W, VIEW_H);
    L = chestLayout();
    clampChestScroll();
    woodPanel(g, L.x, L.y, L.w, L.h);
    fill(g, L.x + 4, L.y + 4, L.w - 8, L.h - 8, C.parch);
    woodPanel(g, L.x + 8, L.y - 8, 72, 11);
    drawText(g, "CHEST", L.x + 16, L.y - 5, C.parch);
    woodPanel(g, L.backX, L.backY, L.backW, L.backH);
    drawText(g, "BACK", L.backX + ((L.backW - textWidth("BACK")) / 2) | 0, L.backY + 2, C.parch);
    drawText(g, "BAG", L.bagX, L.headY, C.woodSh);
    drawText(g, "BOX", L.chestX - textWidth("BOX"), L.headY, C.woodSh);
    g.save();
    g.beginPath();
    g.rect(L.listX, L.listY, L.listW, L.listH);
    g.clip();
    for (i = 0; i < CHEST_ROWS.length; i++) {
      rec = CHEST_ROWS[i];
      rowY = L.listY + i * L.rowH - chestScroll;
      if (rowY + L.rowH < L.listY || rowY > L.listY + L.listH) continue;
      if (i === chestSel) fill(g, L.x + 8, rowY, L.w - 16, L.rowH - 1, "#E8C888");
      drawItemIcon(g, rec.icon, L.x + 10, rowY - 1);
      col = C.uiText;
      name = rec.name;
      if (textWidth(name) > 78) name = name.slice(0, 10);
      drawText(g, name, L.x + 28, rowY + 3, col);
      bagN = String(bagCount(rec.key));
      boxN = String(chestCount(rec.key));
      drawText(g, bagN, L.bagX, rowY + 3, col);
      drawText(g, ">", L.bagX + 28, rowY + 3, C.woodSh);
      drawText(g, "<", L.bagX + 40, rowY + 3, C.woodSh);
      drawText(g, boxN, L.chestX - textWidth(boxN), rowY + 3, col);
    }
    g.restore();
    if (L.maxScroll > 0) {
      barX = L.x + L.w - 10;
      barH = (L.listH * L.listH / L.contentH) | 0;
      if (barH < 12) barH = 12;
      barY = L.listY + ((L.listH - barH) * chestScroll / L.maxScroll) | 0;
      fill(g, barX, L.listY, 3, L.listH, C.woodSh);
      fill(g, barX, barY, 3, barH, C.woodMid);
    }
    woodPanel(g, L.putX, L.allY, L.btnW, L.btnH);
    drawText(g, "PUT ALL", L.putX + ((L.btnW - textWidth("PUT ALL")) / 2) | 0, L.allY + 2, C.parch);
    woodPanel(g, L.takeX, L.allY, L.btnW, L.btnH);
    drawText(g, "TAKE ALL", L.takeX + ((L.btnW - textWidth("TAKE ALL")) / 2) | 0, L.allY + 2, C.parch);
    if (chestMsg && chestMsgT > 0) {
      drawText(g, chestMsg, L.putX + L.btnW + 6, L.allY + 4, C.gold);
    }
  }

  function goChest() {
    var box, dest, path;
    if (currentScene !== "house" && currentScene !== "forest" && currentScene !== "tree") return;
    box = findHouseChest();
    highlight = box ? { tx: box.tx, ty: box.ty } : null;
    if (!box || nearHouseChest()) {
      pending = null;
      openChest();
      return;
    }
    dest = nearestAdjacent(box.tx, box.ty);
    if (!dest) {
      openChest();
      return;
    }
    path = findPath(player.tx, player.ty, dest.tx, dest.ty);
    if (!path.length) {
      openChest();
      return;
    }
    pending = { type: "chest" };
    startWalk(player, path, 3.5);
  }

  function talkHomeLight() {

  function goHomeLight() {
    var table, dest, path, x, best, d, cand;
    if (currentScene !== "house" || !homeLightOn()) return;
    table = findTable();
    highlight = table ? { tx: table.tx, ty: table.ty } : null;
    if (!table || nearTable()) {

      if (Math.abs(cand.tx - player.tx) + Math.abs(cand.ty - player.ty) < d) {

        best = cand;
      }

    if (!dest) {
      talkHomeLight();
      return;

      return;

  function sleepWakeSpot() {
    var bed = findBed();
    var spots, i, s;
    if (!bed) return { tx: 4, ty: 3 };
    spots = [
      { tx: bed.tx, ty: bed.ty + 2 },
      { tx: bed.tx + 1, ty: bed.ty + 2 },
      { tx: bed.tx + 2, ty: bed.ty + 1 },
      { tx: bed.tx + 2, ty: bed.ty },
      { tx: bed.tx - 1, ty: bed.ty + 1 },
      { tx: bed.tx - 1, ty: bed.ty }
    ];
    for (i = 0; i < spots.length; i++) {
      s = spots[i];
      if (inBounds(s.tx, s.ty) && walkable(s.tx, s.ty)) return s;
    }
    return nearestAdjacent(bed.tx, bed.ty + 1) || { tx: 4, ty: 3 };
  }

  function finishSleepAdvance() {
    var spot;
    dayNumber += 1;
    dayMs = 0;
    refillVitals();
    monsterCache[1] = null;
    monsterCache[2] = null;
    monsterCache[3] = null;
    monsterCache[4] = null;
    monsterCache[5] = null;
    monsterCache[6] = null;
    outdoorMonsterCache.overworld = null;
    outdoorMonsterCache.forest = null;
    if (currentScene === "mine") spawnMineMonsters();
    else if (currentScene === "overworld" || currentScene === "forest") spawnOutdoorSlugs(currentScene);
    else monsters = [];
    spot = sleepWakeSpot();

  function beginSleep() {
    var i;
    if (sleepFx || currentScene !== "house") return;
    dialogue = null;
    pending = null;
    highlight = null;
    cancelHit();
    player.path = [];
    player.queuedWalk = null;

    sleepFx = { age: 0, stage: "out", zs: [], woke: false };
    for (i = 0; i < 3; i++) {
      sleepFx.zs.push({
        x: (VIEW_W / 2 | 0) - 10 + i * 12,

      });

  }


  function maybeBedSleepTip() {
    /* 20260905cl: once-per-save toast so kids know the bed is the sleep button */
    if (unlocked.bedSleepTip) return;
    if (currentScene !== "house") return;

  function goSleep() {
    var bed, dest, path, x, y, best, d, cand;
    if (currentScene !== "house" || sleepFx) return;
    bed = findBed();
    highlight = bed ? { tx: bed.tx, ty: bed.ty } : null;
    if (!bed || nearBed()) {
      pending = null;
      beginSleep();
      return;
    }
    best = null;
    d = 999;
    for (y = 0; y < 2; y++) {
      for (x = 0; x < 2; x++) {
        cand = nearestAdjacent(bed.tx + x, bed.ty + y);
        if (!cand) continue;
        if (Math.abs(cand.tx - player.tx) + Math.abs(cand.ty - player.ty) < d) {
          d = Math.abs(cand.tx - player.tx) + Math.abs(cand.ty - player.ty);
          best = cand;
        }
      }
    }
    dest = best;
    if (!dest) {
      beginSleep();
      return;
    }
    path = findPath(player.tx, player.ty, dest.tx, dest.ty);
    if (!path.length) {
      beginSleep();
      return;
    }
    pending = { type: "sleep" };
    startWalk(player, path, 3.5);
  }

  function updateSleep(dt) {
    var i, z;
    if (!sleepFx) return;
    sleepFx.age += dt;
    /* 20260905cx: keep bed Z's drifting while fading out / holding */
    if (sleepFx.zs) {
      for (i = sleepFx.zs.length - 1; i >= 0; i--) {
        z = sleepFx.zs[i];
        z.age += dt;
        z.y -= dt * 0.018;
        z.x += Math.sin((z.age + z.wob) * 0.008) * 0.02 * dt;
        if (z.age >= z.life && sleepFx.stage === "out") {
          z.age = 0;
          z.y = 70 - (i % 3) * 5;
          z.x = (VIEW_W / 2 | 0) - 10 + i * 12;
        }
      }
    }
    if (sleepFx.stage === "out") {
      if (sleepFx.age >= 420) {
        sleepFx.stage = "hold";
        sleepFx.age = 0;
        finishSleepAdvance();
      }
    } else if (sleepFx.stage === "hold") {
      if (sleepFx.age >= 700) {
        sleepFx.stage = "in";
        sleepFx.age = 0;
        /* 20260905cx: morning wake spark at the bedside */
        if (!sleepFx.woke) {
          sleepFx.woke = true;
          sleepFx.zs = [];
          if (player) {
            spawnSparks(player.x, player.y - 10);
            /* 20260905dj: full energy after sleep — soft green refill juice */
            spawnEnergyRefillSparks(player.x, player.y - 14);
            /* 20260905dk: full hearts after sleep — pink heal juice */
            spawnEatHearts(player.x, player.y - 12);
          }
        }
      }
    } else if (sleepFx.age >= 480) {
      sleepFx = null;
    }
  }

  function drawSleep(g) {
    var a, msg, tw, x, fade, i, z, za, warm;
    if (!sleepFx) return;
    if (sleepFx.stage === "out") a = sleepFx.age / 420;
    else if (sleepFx.stage === "hold") a = 1;
    else a = 1 - sleepFx.age / 480;
    if (a < 0) a = 0;
    if (a > 1) a = 1;
    /* 20260905cx: warm morning wash on wake (not pure black) */
    if (sleepFx.stage === "in") {
      warm = 1 - a;
      g.fillStyle = "rgba(42,28,16," + a.toFixed(3) + ")";
      g.fillRect(0, 0, VIEW_W, VIEW_H);
      g.fillStyle = "rgba(255,220,140," + (0.18 * warm).toFixed(3) + ")";
      g.fillRect(0, 0, VIEW_W, VIEW_H);
    } else {
      g.fillStyle = "rgba(18,10,8," + a.toFixed(3) + ")";
      g.fillRect(0, 0, VIEW_W, VIEW_H);
    }
    /* floating Z's while falling asleep */
    if (sleepFx.zs && sleepFx.stage !== "in") {
      for (i = 0; i < sleepFx.zs.length; i++) {
        z = sleepFx.zs[i];
        za = 1 - z.age / z.life;
        if (za <= 0) continue;
        g.save();
        g.globalAlpha = Math.min(1, za + 0.15) * Math.min(1, a + 0.35);
        drawTiredZGlyph(g, Math.round(z.x), Math.round(z.y), z.sc, "#F3D2A3", "#3D1A0C");
        g.restore();
      }
    }
    if (a > 0.45 || sleepFx.stage === "in") {
      fade = sleepFx.stage === "hold" ? 1 : (sleepFx.stage === "out" ? (a - 0.45) / 0.55 : Math.min(1, a * 1.4));
      if (fade < 0) fade = 0;
      if (fade > 1) fade = 1;
      msg = sleepFx.stage === "in" ? ("GOOD MORNING! DAY " + dayNumber) : "YOU SLEEP...";
      tw = textWidth(msg);
      x = ((VIEW_W - tw - 24) / 2) | 0;
      g.save();
      g.globalAlpha = fade;

  /* 20260905bq: advance the day from a dedicated mark (not shared gameplay dt).
     Caps each step, ignores pause/resume gaps, and refuses multi-day spirals so
     one laggy frame or tab wake cannot skip Evening or jump Day N→N+3. DAY_MS frozen. */
  function updateClock() {
    var now, dt, before, beforeDay, rolled;
    if (timePaused()) {
      resetClockMark();
      return;
    }
    now = (typeof performance !== "undefined" && performance.now) ? performance.now() : Date.now();
    if (!clockMark) {
      clockMark = now;
      return;
    }
    dt = now - clockMark;
    clockMark = now;
    if (!(dt > 0)) return;
    if (dt > 50) dt = 50;
    before = clockPhase();
    beforeDay = dayNumber;
    dayMs += dt;
    rolled = 0;
    while (dayMs >= DAY_MS && rolled < 1) {
      dayMs -= DAY_MS;
      dayNumber += 1;
      rolled += 1;
    }
    if (dayMs >= DAY_MS) dayMs = dayMs % DAY_MS;
    if (clockPhase() !== before || dayNumber !== beforeDay) {
      if (currentScene === "overworld") {
        holidaySyncKey = "";
        syncHolidayProps();
      }
      /* 20260905br: evening/night can top-up shy daytime farm slugs once per phase flip. */
      if (outdoorSlugScene()) ensureOutdoorSlugs(currentScene);
      /* 20260905cb: three lights + night → Moondrop Night toast */
      maybeMoondropNight();
      /* Defer save so a sync localStorage hitch cannot nest inside the tick. */
      setTimeout(function () { persistSave(); }, 0);
    }
    updateCrops();
    updateHarvestNodes();
  }

  function sampleKeys(keys, t) {
    var i, lo, hi, u, k, out;
    if (t <= keys[0].at) return keys[0];
    for (i = 1; i < keys.length; i++) {
      if (t <= keys[i].at) {
        lo = keys[i - 1];
        hi = keys[i];
        u = (t - lo.at) / (hi.at - lo.at);
        out = { at: t };
        for (k in lo) {
          if (Object.prototype.hasOwnProperty.call(lo, k) && k !== "at") {
            out[k] = lo[k] + (hi[k] - lo[k]) * u;
          }
        }
        return out;
      }
    }
    return keys[keys.length - 1];
  }

  /* 20260905bb: one outdoor time/grade sample per frame. Farm + forest share
     the same night lift (was forest-only); GRADE_KEYS evening values untouched.
     forestNightFlora stays forest-only for moss/rim extras. */
  var frameDayT = null;
  var frameGradeRaw = null;
  var frameOutdoorGrade = null;

  function usesOutdoorGrade() {
    return !(isCozyInterior() || currentScene === "mine" || currentScene === "caveclimb" || currentScene === "islandCave");
  }

  function liftOutdoorNightGrade(gr, t) {
    var out, k;
    if (t < 0.74) return gr;
    out = {};
    for (k in gr) {
      if (Object.prototype.hasOwnProperty.call(gr, k)) out[k] = gr[k];
    }
    out.hueA = gr.hueA * 0.10;
    out.colorA = gr.colorA * 0.22;
    out.ovA = gr.ovA * 0.35;
    out.mulA = gr.mulA * 0.38;
    if (out.mulA > 0.26) out.mulA = 0.26;
    out.mulR = gr.mulR + (92 - gr.mulR) * 0.65;
    out.mulG = gr.mulG + (124 - gr.mulG) * 0.70;
    out.mulB = gr.mulB + (88 - gr.mulB) * 0.55;
    return out;
  }

  function beginFrameGrade() {
    frameDayT = dayMs / DAY_MS;
    frameGradeRaw = sampleKeys(GRADE_KEYS, frameDayT);
    frameOutdoorGrade = liftOutdoorNightGrade(frameGradeRaw, frameDayT);
  }

  function currentGrade() {
    if (frameDayT === null) beginFrameGrade();
    if (usesOutdoorGrade()) return frameOutdoorGrade;
    return frameGradeRaw;
  }

    if (isCozyInterior()) {
      if (t >= 0.72) return { r: 255, g: cozy ? 184 : 200, b: cozy ? 104 : 130, a: cozy ? 0.38 : 0.24 };
      if (t >= 0.56) return { r: 255, g: cozy ? 178 : 196, b: cozy ? 112 : 140, a: cozy ? 0.26 : 0.16 };
      return { r: 255, g: cozy ? 220 : 236, b: cozy ? 176 : 210, a: cozy ? 0.12 : 0.04 };
    }
    if (currentScene === "caveclimb") {

      return { r: 150, g: 140, b: 128, a: 0.18 };

      return { r: 168, g: 152, b: 138, a: 0.22 };

    return null;
  }

  function lanternGlowAmt() {
    var t;
    if (currentScene === "mine" || currentScene === "caveclimb" || currentScene === "islandCave") return 0.55;
    if (currentScene !== "overworld" && currentScene !== "forest" && currentScene !== "treetop" && currentScene !== "ocean") return 0;
    if (frameDayT === null) beginFrameGrade();
    t = frameDayT;
    if (t < 0.75) return 0;
    if (t < 0.768) return 0.22 + 0.78 * (t - 0.75) / 0.018;
    if (t < 0.97) return 1;
    return Math.max(0, (1 - t) / 0.03);

      fn(46 * TILE + 16, 30 * TILE + 4, 0.98, 301);
      fn(48 * TILE + 8, 31 * TILE + 2, 0.72, 302);
      fn(53 * TILE + 8, 31 * TILE + 2, 0.72, 303);
    }
    if (currentScene === "overworld" && townHoliday() === "lantern" && !festivalOn) {
      fn(46 * TILE + 16, 30 * TILE + 4, 0.70, 310);
      fn(45 * TILE + 8, 28 * TILE + 2, 0.48, 311);
      fn(48 * TILE + 8, 31 * TILE + 2, 0.48, 312);
    }
  }

  function paintLightDisks(g, amt, mode, radMul, stops) {
    var sx, sy, flicker, rad, grd, i, s;
    g.save();
    g.globalCompositeOperation = mode;
    forEachNightLight(function (wx, wy, scale, i) {
      sx = wx - camX;
      sy = wy - camY;
      if (sx < -80 || sy < -80 || sx > VIEW_W + 80 || sy > VIEW_H + 80) return;
      flicker = 0.88 + Math.sin(tick / 140 + i * 1.7) * 0.12;
      rad = radMul * amt * flicker * scale;
      grd = g.createRadialGradient(sx, sy, 1.5, sx, sy, rad);
      var si;
      for (si = 0; si < stops.length; si++) {
        s = stops[si];
        grd.addColorStop(s[0], "rgba(" + s[1] + "," + s[2] + "," + s[3] + "," + (s[4] * amt * flicker).toFixed(3) + ")");
      }
      g.fillStyle = grd;
      g.beginPath();
      g.arc(sx, sy, rad, 0, Math.PI * 2);
      g.fill();
    });
    g.restore();
  }

  function drawLanternWells(g, amt) {
    if ((currentScene !== "overworld" && currentScene !== "forest" && currentScene !== "treetop") || amt < 0.02) return;
    paintLightDisks(g, amt, "color", 56, [
      [0, 240, 168, 56, 0.84],
      [0.42, 236, 148, 52, 0.46],
      [1, 200, 110, 48, 0]
    ]);
    paintLightDisks(g, amt, "soft-light", 52, [
      [0, 255, 210, 122, 0.66],
      [0.48, 240, 150, 60, 0.32],
      [1, 80, 40, 24, 0]
    ]);
    paintLightDisks(g, amt, "screen", 50, [
      [0, 140, 80, 36, 0.60],
      [0.42, 90, 50, 28, 0.28],
      [1, 28, 16, 24, 0]
    ]);
  }

  function drawLanternLights(g) {
    var amt, sx, sy, flicker, rad, grd;
    if (currentScene !== "overworld" && currentScene !== "forest" && currentScene !== "treetop") return;
    amt = lanternGlowAmt();
    if (amt < 0.02) return;
    g.save();
    g.globalCompositeOperation = "lighter";
    forEachNightLight(function (wx, wy, scale, i) {
      sx = wx - camX;
      sy = wy - camY;
      if (sx < -64 || sy < -64 || sx > VIEW_W + 64 || sy > VIEW_H + 64) return;
      flicker = 0.88 + Math.sin(tick / 140 + i * 1.7) * 0.12;
      rad = 46 * amt * flicker * scale;
      grd = g.createRadialGradient(sx, sy, 1.5, sx, sy, rad);
      grd.addColorStop(0, "rgba(255,220,128," + (0.48 * amt * flicker).toFixed(3) + ")");
      grd.addColorStop(0.30, "rgba(255,168,68," + (0.22 * amt * flicker).toFixed(3) + ")");
      grd.addColorStop(0.64, "rgba(210,100,40," + (0.08 * amt * flicker).toFixed(3) + ")");
      grd.addColorStop(1, "rgba(80,40,20,0)");
      g.fillStyle = grd;
      g.beginPath();
      g.arc(sx, sy, rad, 0, Math.PI * 2);
      g.fill();
    });
    g.restore();
  }

  function fillBlend(g, mode, alpha, r, gv, b, w, h) {
    if (alpha < 0.01) return;
    g.save();
    g.globalCompositeOperation = mode;
    g.globalAlpha = alpha;
    g.fillStyle = "rgb(" + (r | 0) + "," + (gv | 0) + "," + (b | 0) + ")";
    g.fillRect(0, 0, w || VIEW_W, h || VIEW_H);
    g.restore();
  }

  function applyOutdoorGrade(g, w, h) {
    var gr = currentGrade();
    w = w || VIEW_W;
    h = h || VIEW_H;
    fillBlend(g, "saturation", gr.sat, 128, 128, 128, w, h);
    fillBlend(g, "hue", gr.hueA, gr.hueR, gr.hueG, gr.hueB, w, h);
    fillBlend(g, "color", gr.colorA, gr.colorR, gr.colorG, gr.colorB, w, h);
    fillBlend(g, "overlay", gr.ovA, gr.ovR, gr.ovG, gr.ovB, w, h);
    fillBlend(g, "multiply", gr.mulA, gr.mulR, gr.mulG, gr.mulB, w, h);
  }

  function outdoorGradeActive() {
    var gr = currentGrade();
    return gr.sat >= 0.01 || gr.hueA >= 0.01 || gr.colorA >= 0.01 || gr.ovA >= 0.01 || gr.mulA >= 0.01;
  }

  function drawOutdoorGrade(g) {
    applyOutdoorGrade(g, VIEW_W, VIEW_H);
  }

  function drawHouseHomeGlow(g) {
    var table = findTable();
    var spots = [];
    var i, s, sx, sy, flicker, rad, grd;
    if (table) spots.push({ x: table.tx * TILE + 16, y: table.ty * TILE + 2, scale: 0.85 });
    for (i = 0; i < PROPS.length; i++) {
      if (PROPS[i].kind === "lantern") {
        spots.push({ x: PROPS[i].tx * TILE + 8, y: PROPS[i].ty * TILE + 2, scale: 0.7 });
      } else if (PROPS[i].kind === "fireplace") {
        spots.push({ x: PROPS[i].tx * TILE + 24, y: PROPS[i].ty * TILE + 22, scale: 1.05 });
      }
    }
    g.save();
    g.globalCompositeOperation = "screen";
    for (i = 0; i < spots.length; i++) {
      s = spots[i];
      sx = s.x - camX;
      sy = s.y - camY;
      flicker = 0.88 + Math.sin(tick / 160 + i * 1.4) * 0.12;
      rad = 36 * flicker * s.scale;
      grd = g.createRadialGradient(sx, sy, 2, sx, sy, rad);
      grd.addColorStop(0, "rgba(255,210,130," + (0.28 * flicker).toFixed(3) + ")");
      grd.addColorStop(0.45, "rgba(255,176,88," + (0.14 * flicker).toFixed(3) + ")");
      grd.addColorStop(1, "rgba(255,150,60,0)");
      g.fillStyle = grd;
      g.beginPath();
      g.arc(sx, sy, rad, 0, Math.PI * 2);
      g.fill();
    }
    g.restore();
  }

  /* 20260905cd: mine/stairs/cave — soft vignette + warm torch/lamp pools (kid-readable). */
  function isCaveLitScene() {
    return currentScene === "mine" || currentScene === "caveclimb" || currentScene === "islandCave";
  }

  function forEachCaveTorch(fn) {
    var i, p;
    for (i = 0; i < PROPS.length; i++) {
      p = PROPS[i];
      if (p.kind === "lantern" || p.kind === "lampPost") {
        fn(p.tx * TILE + 8, p.ty * TILE + 2, 1, i);
      } else if (p.kind === "moonAltar") {
        fn(p.tx * TILE + 8, p.ty * TILE + 4, 1.18, 40 + i);
      }
    }
  }

  function drawCaveTorchFalloff(g) {
    var cx, cy, rad, grd, sx, sy, flicker, r;
    if (!isCaveLitScene()) return;
    cx = VIEW_W * 0.5;
    cy = VIEW_H * 0.48;
    rad = Math.max(VIEW_W, VIEW_H) * 0.86;
    /* Soft vignette: dim corners only — never pitch black. */
    g.save();
    grd = g.createRadialGradient(cx, cy, rad * 0.22, cx, cy, rad);
    grd.addColorStop(0, "rgba(16,10,18,0)");
    grd.addColorStop(0.48, "rgba(16,10,18,0.06)");
    grd.addColorStop(0.78, "rgba(12,8,16,0.22)");
    grd.addColorStop(1, "rgba(8,6,12,0.36)");
    g.fillStyle = grd;
    g.fillRect(0, 0, VIEW_W, VIEW_H);
    g.restore();
    /* Warm pools near lanterns / peak altar. */
    g.save();
    g.globalCompositeOperation = "screen";
    forEachCaveTorch(function (wx, wy, scale, idx) {
      sx = wx - camX;
      sy = wy - camY;
      if (sx < -96 || sy < -96 || sx > VIEW_W + 96 || sy > VIEW_H + 96) return;
      flicker = 0.90 + Math.sin(tick / 150 + idx * 1.55) * 0.10;
      r = 62 * flicker * scale;
      grd = g.createRadialGradient(sx, sy, 2, sx, sy, r);
      grd.addColorStop(0, "rgba(255,214,128," + (0.46 * flicker).toFixed(3) + ")");
      grd.addColorStop(0.32, "rgba(255,176,88," + (0.26 * flicker).toFixed(3) + ")");
      grd.addColorStop(0.68, "rgba(190,110,48," + (0.10 * flicker).toFixed(3) + ")");
      grd.addColorStop(1, "rgba(70,36,18,0)");
      g.fillStyle = grd;
      g.beginPath();
      g.arc(sx, sy, r, 0, Math.PI * 2);
      g.fill();
    });
    g.restore();
    g.save();
    g.globalCompositeOperation = "soft-light";
    forEachCaveTorch(function (wx, wy, scale, idx) {
      sx = wx - camX;
      sy = wy - camY;
      if (sx < -80 || sy < -80 || sx > VIEW_W + 80 || sy > VIEW_H + 80) return;
      flicker = 0.90 + Math.sin(tick / 150 + idx * 1.55) * 0.10;
      r = 54 * flicker * scale;
      grd = g.createRadialGradient(sx, sy, 1.5, sx, sy, r);
      grd.addColorStop(0, "rgba(255,220,150," + (0.38 * flicker).toFixed(3) + ")");
      grd.addColorStop(0.5, "rgba(240,150,70," + (0.16 * flicker).toFixed(3) + ")");
      grd.addColorStop(1, "rgba(80,40,20,0)");
      g.fillStyle = grd;
      g.beginPath();
      g.arc(sx, sy, r, 0, Math.PI * 2);
      g.fill();
    });
    g.restore();
  }

  function drawDayTint(g) {
    var tint, amt;
    if (isCozyInterior() || isCaveLitScene()) {
      tint = currentTint();
      if (tint && tint.a >= 0.01) {
        fillBlend(g, "multiply", tint.a, tint.r, tint.g, tint.b);
      }
      if (currentScene === "house" && homeLightOn()) drawHouseHomeGlow(g);
      if (isCaveLitScene()) drawCaveTorchFalloff(g);
      return;
    }
    drawOutdoorGrade(g);
    amt = lanternGlowAmt();
    if (amt < 0.02 && currentScene === "overworld" && townHoliday() === "lantern") amt = 0.22;
    if (amt > 0.02) {
      drawLanternWells(g, amt);
      drawLanternLights(g);
    }
  }

  function openDialogue(title, lines, choices) {
    dialogue = { title: title, lines: lines, choices: choices || null };
    playSfx("talk");
  }

  function mineMailReady() {
    return introSeen || found.moonshard;
  }

  function fishMailReady() {
    /* After welcome — nudge kids toward Pip's fishing pole */
    return !!mailRead.welcome;
  }

  function bridgeMailReady() {
    return !!found.bridgeFixed;
  }

  function moondropMailReady() {
    return !!festivalOn;
  }

  function hasUnreadMail() {
    if (!mailRead.welcome) return true;
    /* fish tip early — right after welcome, before mine/thanks */
    if (fishMailReady() && !mailRead.fish) return true;
    if (mineMailReady() && !mailRead.mine) return true;
    if (quest.errandDone && !mailRead.thanks) return true;
    if (bridgeMailReady() && !mailRead.bridge) return true;
    if (moondropMailReady() && !mailRead.moondrop) return true;
    return false;
  }

  function letterToShow() {
    if (!mailRead.welcome) return LETTERS.welcome;
    if (fishMailReady() && !mailRead.fish) return LETTERS.fish;
    if (mineMailReady() && !mailRead.mine) return LETTERS.mine;
    if (quest.errandDone && !mailRead.thanks) return LETTERS.thanks;
    if (bridgeMailReady() && !mailRead.bridge) return LETTERS.bridge;
    if (moondropMailReady() && !mailRead.moondrop) return LETTERS.moondrop;
    if (quest.errandDone) return LETTERS.thanks;
    if (mineMailReady()) return LETTERS.mine;
    return LETTERS.welcome;
  }

  function findMailbox() {
    var i, p;
    for (i = 0; i < PROPS.length; i++) {
      p = PROPS[i];
      if (p.kind === "mailbox") return p;
    }
    return null;
  }

  function mailboxHit(tx, ty, world) {
    var box, b;
    if (currentScene !== "overworld") return false;
    box = findMailbox();
    if (!box) return false;
    if (tx === box.tx && ty === box.ty) return true;
    if (!world) return false;
    b = propBounds(box);
    if (hasUnreadMail()) {
      b = { x: b.x, y: b.y - 16, w: b.w, h: b.h + 16 };
    }
    return world.x >= b.x && world.x < b.x + b.w && world.y >= b.y && world.y < b.y + b.h;
  }

  function openMail() {
    var letter = letterToShow();
    var box;
    /* 20260905cz: soft sparkle when opening the mailbox */
    box = findMailbox();
    if (box) spawnMailSparks(box.tx * TILE + 8, box.ty * TILE);
    else if (player) spawnMailSparks(player.x, player.y - 10);
    mailRead[letter.id] = true;
    persistSave();
    openDialogue(letter.title, letter.lines);
  }

  function goMail() {
    var box, dest, path;
    if (currentScene !== "overworld") return;
    box = findMailbox();
    highlight = box ? { tx: box.tx, ty: box.ty } : null;
    if (!box || isNear(player.tx, player.ty, box.tx, box.ty) || (player.tx === box.tx && player.ty === box.ty)) {
      pending = null;
      openMail();
      return;
    }
    dest = nearestAdjacent(box.tx, box.ty);
    if (!dest) {
      openMail();
      return;
    }
    path = findPath(player.tx, player.ty, dest.tx, dest.ty);
    if (!path.length) {
      openMail();
      return;
    }
    pending = { type: "mail" };
    startWalk(player, path, 3.5);
  }

  function allFound() {
    return found.copper && found.mushroom && found.moonshard;
  }

  function noteLines() {
    /* 20260905cb: Nim notes nudge Home / Town / Peak after the house glows */
    if (homeLightOn() && threeLightsOn() && !festivalOn) {
      return ["THREE LIGHTS GLOW.", "FIND ME AT NIGHT", "BY THE STATUE."];
    }
    if (homeLightOn() && (pipDone || unlocked.shopGlow) && !(found.peakLight || unlocked.peakGlow)) {
      return ["TWO LIGHTS GLOW.", "THE PEAK ALTAR", "WAITS UP HIGH."];
    }
    if (homeLightOn() && !(pipDone || unlocked.shopGlow)) {
      return ["HOME IS LIT.", "PIP'S TOWN LAMP", "NEEDS COPPER."];
    }
    if (quest.errandDone && allFound()) {
      return ["YOU FOUND THEM ALL.", "THANKS FOR THE WOOD.", "THE MOUNTAIN HUMS."];
    }
    if (quest.errandDone) {
      return ["THANKS FOR THE WOOD.", "MOON SHARDS ARE STILL", "IN THESE CAVES."];
    }
    return allFound() ? NOTE_CLOSE : NOTE_OPEN;
  }

  function questHint() {
    /* 20260905bx: while underground, Jobs points kids to UP → OUT ladders */
    if (currentScene === "mine") return "FOLLOW UP SIGNS TO OUT";
    /* 20260905cl: bed clarity — sleep heals + new morning */
    if (currentScene === "house" && (hp < MAX_HP || clockPhaseName() === "EVENING" || clockPhaseName() === "NIGHT")) {
      return "SLEEP IN YOUR BED.";
    }
    /* 20260905ck: ocean fishing without a pole — send kids to Pip */
    if (currentScene === "ocean" && !poleOwned) return "BUY A FISHING POLE AT PIP'S.";
    /* 20260905cm: peak rocks need the diamond pick — Jobs says so when you own it */
    if (diamondPickOwned && !found.peakRocksCleared) {
      if (currentScene === "peak") return "SMASH THE PEAK ROCKS.";
      return "SMASH PEAK ROCKS WITH THE DIAMOND PICK.";
    }
    /* 20260905cm: evening/night outdoor slugs drop loot — kid tip until first kill */
    if (!found.outdoorSlug && outdoorSlugScene() && (clockPhaseName() === "EVENING" || clockPhaseName() === "NIGHT")) {
      return "SWORD THE NIGHT SLUGS.";
    }
    /* 20260905ck: bridge ready to fix once you have the wood */
    if (!found.bridgeFixed && bagCount("wood") >= 8) return "FIX THE BRIDGE WITH 8 WOOD.";
    if (hasAnyRawFish()) return "COOK FISH ON THE STOVE";
    if (hasAnySmeltOre()) return "SMELT ORE AT THE FIREPLACE";
    if (!quest.flowerAsked) return "SAY HI TO JUNIE";
    if (!found.kickedBall) return "KICK THE CART IN TOWN.";
    if (!found.kickedPlayBall) return "KICK THE BALL ON THE FARM.";
    /* 20260905cn: town soccer after farm ball tip */
    if (!found.kickedTownPlayBall) return "KICK THE BALL IN TOWN.";
    /* 20260905cl: fish letter early after welcome; bridge/Moondrop later */
    if (fishMailReady() && !mailRead.fish) return "READ THE NEW LETTER";
    if (!quest.flowerDone) return "BRING A MUSHROOM TO JUNIE";
    if (mineMailReady() && !mailRead.mine) return "READ THE NEW LETTER";
    if (!quest.errandDone && mailRead.mine) return "LEAVE WOOD AT NIM'S NOTE";
    if (quest.errandDone && !mailRead.thanks) return "READ THE NEW LETTER";
    if (bridgeMailReady() && !mailRead.bridge) return "READ THE NEW LETTER";
    if (moondropMailReady() && !mailRead.moondrop) return "READ THE NEW LETTER";
    /* 20260905cb: three-lights story spine — Home / Town / Peak then night */
    if (!homeLightOn()) {
      if (found.moonshard) return "LIGHT THE HOME LAMP.";
      return "FIND A MOON SHARD";
    }
    if (!(pipDone || unlocked.shopGlow)) return "LIGHT THE TOWN LAMP.";
    if (!(found.peakLight || unlocked.peakGlow)) return "LIGHT THE PEAK LAMP.";
    if (!festivalOn && threeLightsOn()) return "A SHY GLOW WAITS AT NIGHT.";
    if (festivalOn) return "MOONDROP NIGHT SHINES.";
    if (!lilaDone) return "PLANT FLOWERS WITH LILA";
    if (!reedDone) return "HELP REED'S CAR";
    /* 20260905cn: holding seeds + empty garden → plant tip (toast covers first select) */
    if ((selectedIs("seed") || selectedIs("potatoSeed") || selectedIs("berrySeed")) && !hasAnyCrop()) {
      return "PLANT SEEDS ON THE GARDEN DIRT.";
    }
    /* 20260905bv/05cn: nest bird cozy loop — clearer when wood is ready */
    if (found.birdArrived && !found.birdNestFixed && bagCount("wood") >= 10) {
      return "GIVE 10 WOOD TO THE NEST BIRD";
    }
    if (found.birdArrived && !found.birdNestFixed) return "BRING 10 WOOD TO THE NEST BIRD";
    if (found.birdNestFixed && !unlocked.birdRideTip) return "ASK THE BIRD FOR A RIDE";
    if ((houseTier | 0) < 2) return "PIP SELLS A HOUSE KIT.";
    return "THE PEAK GLOWS.";
  }

  function homeLightOn() {
    return !!(homeLight || quest.homeDone || unlocked.homeGlow);
  }

  function jobOpen() {
    return questHint() !== "ALL JOBS DONE";
  }

  function hasMushroomToGive() {
    return !quest.flowerDone && (bagCount("mushroom") > 0 || found.mushroom);
  }

  function giveMushroom() {
    if (bagCount("mushroom") > 0) takeFromBag("mushroom", 1);
    quest.flowerAsked = true;
    quest.flowerDone = true;
    persistSave();
    unlockAch("kindHeart");
    ensureSelectedSlot();
  }

  function hasVeggieToSell() {
    return bagCount("veggie") > 0;
  }

  function sellVeggie() {
    if (!hasVeggieToSell()) return false;
    takeFromBag("veggie", 1);
    gold += CROP_PRICE;
    persistSave();
    return true;
  }

  function sellVeggieLines() {
    sellVeggie();
    return ["YUM! HERE IS " + CROP_PRICE + "G.", "THANK YOU!"];
  }

  function neighborLines() {
    if (!quest.flowerAsked) {
      if (hasMushroomToGive()) {
        giveMushroom();
        return ["OH! YOU FOUND A", "CAVE MUSHROOM.", "THANK YOU!"];
      }
      if (hasVeggieToSell()) return sellVeggieLines();
      quest.flowerAsked = true;
      persistSave();
      return ["I'M JUNIE. CAN YOU", "FIND A CAVE MUSHROOM", "FOR MY GARDEN?"];
    }
    if (!quest.flowerDone) {
      if (hasMushroomToGive()) {
        giveMushroom();
        return ["OH! A CAVE FLOWER.", "THANK YOU, ORION!"];
      }
      if (hasVeggieToSell()) return sellVeggieLines();
      return ["A CAVE MUSHROOM", "GROWS IN THE MINE.", "BRING ME ONE?"];
    }
    if (hasVeggieToSell()) return sellVeggieLines();
    if (mineMailReady() && !mailRead.mine) {
      return ["THANKS AGAIN!", "CHECK YOUR MAIL."];
    }
    if (fishMailReady() && !mailRead.fish) {
      return ["CHECK YOUR MAIL!", "PIP SELLS A POLE."];
    }
    if (moondropMailReady() && !mailRead.moondrop) {
      return ["MOONDROP NIGHT!", "CHECK YOUR MAIL."];
    }
    if (bridgeMailReady() && !mailRead.bridge) {
      return ["THE BRIDGE IS FIXED!", "CHECK YOUR MAIL."];
    }
    if (!quest.errandDone) {
      return ["NIM WANTS WOOD.", "LEAVE SOME AT", "THE MINE NOTE."];
    }
    /* 20260905cb: Junie tips Home / Town / Peak night-lights */
    if (!homeLightOn()) {
      if (found.moonshard) {
        return ["TAKE THE SHARD", "INSIDE YOUR HOUSE.", "HOME LIGHT!"];
      }
      return ["NIM LEFT A SHARD", "IN THE CAVE.", "BRING IT HOME."];
    }
    if (!(pipDone || unlocked.shopGlow)) {
      return ["HOME GLOWS!", "BRING COPPER TO PIP", "FOR THE TOWN LAMP."];
    }
    if (!(found.peakLight || unlocked.peakGlow)) {
      return ["TOWN GLOWS TOO!", "CLIMB THE PEAK.", "LIGHT THE ALTAR."];
    }
    if (!festivalOn) {
      return ["THREE LIGHTS!", "WAIT FOR NIGHT.", "SAY HI TO NIM."];
    }
    return ["MOONDROP NIGHT!", "THE MOUNTAIN", "SHINES FOR US."];
  }

  function talkNeighbor() {
    faceToward(player, npc.tx, npc.ty);
    faceToward(npc, player.tx, player.ty);
    openDialogue("JUNIE", withHolidayLines("junie", neighborLines()));
  }

  function liveFolk() {
    if (currentScene === "forest") return forestFolk;
    if (currentScene === "overworld") return townFolk;
    return [];
  }

  function folkAt(tx, ty) {
    var i, f, list;
    list = liveFolk();
    for (i = 0; i < list.length; i++) {
      f = list[i];
      if (f.tx === tx && f.ty === ty) return f;
    }
    return null;
  }

  function folkOk(f, tx, ty) {
    var p;
    if (currentScene !== "overworld" && currentScene !== "forest") return false;
    if (!walkable(tx, ty) && !(tx === f.tx && ty === f.ty)) return false;
    if (tx < f.patio.x0 || tx > f.patio.x1 || ty < f.patio.y0 || ty > f.patio.y1) return false;
    if (playerOccupies(tx, ty)) return false;
    if (carOccupies(tx, ty)) return false;
    var list = liveFolk();
    for (p = 0; p < list.length; p++) {
      if (list[p] !== f && list[p].tx === tx && list[p].ty === ty) return false;
    }
    return true;
  }

  function folkYield(f) {
    var dirs = [[0, -1], [0, 1], [-1, 0], [1, 0]];
    var i, j, tmp, d, nx, ny;
    for (i = 3; i > 0; i--) {
      j = (Math.random() * (i + 1)) | 0;
      tmp = dirs[i]; dirs[i] = dirs[j]; dirs[j] = tmp;
    }
    for (i = 0; i < 4; i++) {
      d = dirs[i];
      nx = f.tx + d[0];
      ny = f.ty + d[1];
      if (folkOk(f, nx, ny)) {
        startWalk(f, [{ tx: nx, ty: ny }], 1.4);
        return true;
      }
    }
    return false;
  }

  function folkStop(f) {
    f.path = [];
    f.queuedWalk = null;
    f.stepFrom = null;
    f.stepT = 0;
    f.frame = 0;
    f.x = tileCenterX(f.tx);
    f.y = tileFootY(f.ty);
  }

  function actorTiles(who) {
    var tiles = [], seen = {};
    function add(tx, ty) {
      var key;
      if (tx == null || ty == null) return;
      key = tx + "," + ty;
      if (seen[key]) return;
      seen[key] = true;
      tiles.push({ tx: tx, ty: ty });
    }
    if (!who) return tiles;
    add(who.tx, who.ty);
    if (who.path && who.path.length) add(who.path[0].tx, who.path[0].ty);
    if (who.stepFrom) add(who.stepFrom.tx, who.stepFrom.ty);
    return tiles;
  }

  function tilesTouch(a, b) {
    var i, j, dx, dy;
    if (!a || !b) return false;
    for (i = 0; i < a.length; i++) {
      for (j = 0; j < b.length; j++) {
        dx = Math.abs(a[i].tx - b[j].tx);
        dy = Math.abs(a[i].ty - b[j].ty);
        if (dx + dy <= 1) return true;
      }
    }
    return false;
  }

  function playerNearFolk(f) {
    return !!(f && tilesTouch(actorTiles(player), actorTiles(f)));
  }

  function playerFacingFolk(f) {
    var tile;
    if (!f) return false;
    if (Math.abs(player.tx - f.tx) + Math.abs(player.ty - f.ty) !== 1) return false;
    tile = facingTile();
    return tile.tx === f.tx && tile.ty === f.ty;
  }

  function npcYield() {
    var dirs = [[0, -1], [0, 1], [-1, 0], [1, 0]];
    var i, d, nx, ny, away, scored, dx, dy;
    if (currentScene !== "overworld" || !npc) return false;
    scored = [];
    for (i = 0; i < 4; i++) {
      d = dirs[i];
      nx = npc.tx + d[0];
      ny = npc.ty + d[1];
      if (!walkable(nx, ny)) continue;
      if (playerOccupies(nx, ny)) continue;
      if (chicken && chicken.tx === nx && chicken.ty === ny) continue;
      if (carOccupies(nx, ny)) continue;
      if (folkOccupies(nx, ny)) continue;
      away = Math.abs(nx - player.tx) + Math.abs(ny - player.ty);
      scored.push({ nx: nx, ny: ny, away: away, rnd: Math.random() });
    }
    scored.sort(function (a, b) {
      if (b.away !== a.away) return b.away - a.away;
      return a.rnd - b.rnd;
    });
    if (scored.length) {
      npc.tx = scored[0].nx;
      npc.ty = scored[0].ny;
      npc.x = tileCenterX(npc.tx);
      npc.y = tileFootY(npc.ty);
      return true;
    }
    /* Penned / crowded: hop up to 2 tiles like chicken 05bu. */
    scored = [];
    for (dy = -2; dy <= 2; dy++) {
      for (dx = -2; dx <= 2; dx++) {
        if (!dx && !dy) continue;
        if (Math.abs(dx) + Math.abs(dy) > 2) continue;
        nx = npc.tx + dx;
        ny = npc.ty + dy;
        if (!walkable(nx, ny)) continue;
        if (playerOccupies(nx, ny)) continue;
        if (chicken && chicken.tx === nx && chicken.ty === ny) continue;
        if (carOccupies(nx, ny)) continue;
        if (folkOccupies(nx, ny)) continue;
        away = Math.abs(nx - player.tx) + Math.abs(ny - player.ty);
        scored.push({ nx: nx, ny: ny, away: away, rnd: Math.random() });
      }
    }
    scored.sort(function (a, b) {
      if (b.away !== a.away) return b.away - a.away;
      return a.rnd - b.rnd;
    });
    if (scored.length) {
      npc.tx = scored[0].nx;
      npc.ty = scored[0].ny;
      npc.x = tileCenterX(npc.tx);
      npc.y = tileFootY(npc.ty);
      return true;
    }
    return false;
  }

  function updateTownFolk(dt) {
    var i, f, dest;
    var list;
    if (currentScene !== "overworld" && currentScene !== "forest") return;
    /* 20260905cf: Junie scoots when Orion walks into / toward her tile. */
    if (currentScene === "overworld" && npc) {
      if (playerOccupies(npc.tx, npc.ty) ||
          (player.path && player.path.length && player.path[0].tx === npc.tx && player.path[0].ty === npc.ty)) {
        npcYield();
      }
      /* 20260905co: soft idle sway when nobody is chatting her up */
      if (playerNearFolk(npc)) {
        npc.frame = 0;
        npc.anim = 0;
      } else {
        npc.anim = (npc.anim || 0) + dt;
        if (npc.anim > 340) {
          npc.anim = 0;
          npc.frame = npc.frame ? 0 : 1;
        }
      }
    }
    list = liveFolk();
    for (i = 0; i < list.length; i++) {
      f = list[i];
      if (playerNearFolk(f)) {
        folkStop(f);
        f.idle = 1800;
        continue;
      }
      f.anim += dt;
      if (f.anim > 220) {
        f.anim = 0;
        f.frame = f.frame ? 0 : 1;
      }
      dest = f.path && f.path.length ? f.path[0] : null;
      if (dest && playerOccupies(dest.tx, dest.ty)) {
        folkStop(f);
        if (!folkYield(f)) f.idle = 400;
        continue;
      }
      if (dest) {
        advanceWalk(f, dt);
        continue;
      }
      if (playerOccupies(f.tx, f.ty)) {
        if (!folkYield(f)) f.idle = 200;
        continue;
      }
      f.idle -= dt;
      if (f.idle > 0) continue;
      f.idle = 900 + Math.random() * 2200;
      folkYield(f);
    }
  }

  function carLampSpots() {

    if (!img) return;
    u = birdFly.age / birdFly.life;
    if (u > 1) u = 1;
    u = 1 - (1 - u) * (1 - u);
    x = birdFly.x0 + (birdFly.x1 - birdFly.x0) * u;
    y = birdFly.y0 + (birdFly.y1 - birdFly.y0) * u + Math.sin(birdFly.age / 90) * 3;
    g.imageSmoothingEnabled = false;
    g.drawImage(img, Math.round(x), Math.round(y), birdFly.w, birdFly.h);
  }

  function drawBirdRideOverlay(g) {
    var img, w, h, x, y, bob, u, fade;
    if (!birdRideFx) return;
    img = Assets.birdRide;
    if (!img) return;
    w = img.naturalWidth || img.width;
    h = img.naturalHeight || img.height;
    bob = Math.round(Math.sin(birdRideFx.age / 80) * 2);
    x = ((VIEW_W - w) / 2) | 0;
    y = 36 + bob;
    /* 20260905cr: soft flight fade in/out */
    u = birdRideFx.age / birdRideFx.life;
    if (u < 0) u = 0;
    if (u > 1) u = 1;
    fade = 1;
    if (u < 0.18) fade = u / 0.18;
    else if (u > 0.72) fade = (1 - u) / 0.28;
    if (fade < 0) fade = 0;
    g.save();
    g.globalAlpha = fade;
    g.imageSmoothingEnabled = false;
    g.drawImage(img, x, y, w, h);
    g.restore();
  }

        try { doorFade.pending(); } catch (err) {}

  function updateDogPetFx(dt) {
    var i, sp;
    if (dog.react > 0) {
      dog.react -= dt;
      if (dog.react < 0) dog.react = 0;
    }
    for (i = sparks.length - 1; i >= 0; i--) {
      sp = sparks[i];
      if (!sp.heart) continue;
      sp.age += dt;
      sp.x += sp.vx * dt;
      sp.y += sp.vy * dt;
      if (sp.age >= sp.life) sparks.splice(i, 1);
    }
  }

  function updateDoorFade(dt) {
    var half;
    if (!doorFade) return;
    doorFade.age += dt;
    half = doorFade.life * 0.42;
    if (!doorFade.did && doorFade.age >= half) {
      doorFade.did = true;
      if (doorFade.pending) {
        try { doorFade.pending(); } catch (err) {}
        doorFade.pending = null;
      }
      /* 20260905cv: tiny warm spark at Orion's feet on the new side of the door */
      if (player) spawnSparks(player.x, player.y - 6);
    }
    if (doorFade.age >= doorFade.life) doorFade = null;
  }

  function drawDoorFade(g) {
    var u, a;
    if (!doorFade) return;
    u = doorFade.age / doorFade.life;
    if (u < 0) u = 0;
    if (u > 1) u = 1;
    /* triangle peak near mid — never hold a solid black screen */
    if (u < 0.42) a = u / 0.42;
    else if (u > 0.58) a = (1 - u) / 0.42;
    else a = 1;
    if (a < 0) a = 0;
    if (a > 1) a = 1;
    g.fillStyle = "rgba(32, 20, 14," + (a * 0.7).toFixed(3) + ")";
    g.fillRect(0, 0, VIEW_W, VIEW_H);
    /* soft warm rim so it reads cozy, not a hard cut */
    if (a > 0.35) {
      g.fillStyle = "rgba(120, 72, 40," + (a * 0.18).toFixed(3) + ")";
      g.fillRect(0, 0, VIEW_W, 10);
      g.fillRect(0, VIEW_H - 10, VIEW_W, 10);
    }
  }

    var f;
    if (currentScene === "overworld") {
      if (isCottageEntrance(player.tx, player.ty) || cottageDoorHit(player.tx, player.ty, null)) {
        enterCottage();
        return true;
      }
      if (isCottage2Entrance(player.tx, player.ty) || cottage2DoorHit(player.tx, player.ty, null)) {
        enterCottage2();
        return true;
      }
      f = facingTile();
      if (cottageDoorHit(f.tx, f.ty, null) || isCottageEntrance(f.tx, f.ty)) {
        goEnterCottage();
        return true;
      }
      if (cottage2DoorHit(f.tx, f.ty, null) || isCottage2Entrance(f.tx, f.ty)) {
        goEnterCottage2();
        return true;
      }
      if (isTallCottageEntrance(player.tx, player.ty) || tallCottageDoorHit(player.tx, player.ty, null)) {
        enterTallCottage();
        return true;
      }
      if (isLHouseEntrance(player.tx, player.ty) || lHouseDoorHit(player.tx, player.ty, null)) {
        enterLHouse();
        return true;
      }
      f = facingTile();
      if (tallCottageDoorHit(f.tx, f.ty, null) || isTallCottageEntrance(f.tx, f.ty)) {
        goEnterTallCottage();
        return true;
      }
      if (lHouseDoorHit(f.tx, f.ty, null) || isLHouseEntrance(f.tx, f.ty)) {
        goEnterLHouse();
        return true;
      }
      return false;
    }
    if (currentScene === "cottage") {
      if (isCottageExit(player.tx, player.ty)) {
        exitCottage();
        return true;
      }
      f = facingTile();
      if (isCottageExit(f.tx, f.ty)) {
        goExitCottage();
        return true;
      }
      if ((player.tx === 4 && player.ty === 4) || (f.tx === 4 && f.ty === 4)) {
        talkLuna();
        return true;
      }
      return false;
    }
    if (currentScene === "cottage2") {
      if (isCottage2Exit(player.tx, player.ty)) {
        exitCottage2();
        return true;
      }
      f = facingTile();
      if (isCottage2Exit(f.tx, f.ty)) {
        goExitCottage2();
        return true;

        return true;

        return true;

  function shopDoorHit(tx, ty, world) {
    var hx, hy, stoopY, onStoop;
    if (currentScene !== "overworld") return false;
    /* Door is the painted opening (shopIn.ty - 1), not the stoop square below.
       Stoop (shopIn) is walk-only — arrive() still enters when Orion steps on it.
       Same idea as houseDoorHit. Skip (42,26) car; skip (43,27) exit landing. */
    if (tx === shopIn.tx && ty === shopIn.ty) return false;
    if (tx === shopIn.tx + 1 && ty === shopIn.ty) return false;
    onStoop = player.tx === shopIn.tx && player.ty === shopIn.ty;
    if (onStoop) {
      if (tx === shopIn.tx && ty === shopIn.ty - 1) return true;
      if (tx === shopIn.tx + 1 && ty === shopIn.ty - 1) return true;
      if (tx === shopIn.tx - 1 && ty === shopIn.ty - 1) return true;
      if (!world) return false;
      hx = 42 * TILE;
      hy = 22 * TILE - 16;
      stoopY = shopIn.ty * TILE;
      return world.x >= hx + 12 && world.x < hx + 40 && world.y >= hy + 40 && world.y < stoopY;
    }
    if (tx === shopIn.tx && ty === shopIn.ty - 1) return true;
    if (tx === shopIn.tx + 1 && ty === shopIn.ty - 1) return true;
    if (tx === shopIn.tx - 1 && ty === shopIn.ty - 1) return true;
    if (!world) return false;
    hx = 42 * TILE;
    hy = 22 * TILE - 16;
    stoopY = shopIn.ty * TILE;
    /* Pixel rect stops above the stoop row so the square below the door is not a warp. */
    return world.x >= hx + 12 && world.x < hx + 40 && world.y >= hy + 40 && world.y < stoopY;
  }

  function tapShop(p) {
    var L = shopLayout();
    var i, rowY;
    if (hitPad(p.x, p.y, L.byeX, L.buyY, L.byeW, L.btnH, 6)) {
      closeShop();
      return true;
    }
    if (hitPad(p.x, p.y, L.buyX, L.buyY, L.buyW, L.btnH, 6)) {
      buyShopItem(SHOP_ITEMS[shopSel]);
      return true;
    }
    var start = shopListStart();
    var vis = shopVisCount();
    for (i = 0; i < vis; i++) {
      rowY = L.listY + i * L.rowH;
      if (p.x >= L.x + 8 && p.x <= L.x + L.w - 8 && p.y >= rowY && p.y < rowY + L.rowH) {
        if (start + i < SHOP_ITEMS.length) {
          /* Bottom row + more below → scroll down (touch had no way to reach leash). */
          if (i === vis - 1 && start + vis < SHOP_ITEMS.length && shopSel === start + i) {
            shopSel = Math.min(SHOP_ITEMS.length - 1, shopSel + 1);
          } else if (i === 0 && start > 0 && shopSel === start) {
            shopSel = Math.max(0, shopSel - 1);
          } else {
            shopSel = start + i;
          }
        }
        return true;
      }
    }
    if (p.x >= L.x && p.x <= L.x + L.w && p.y >= L.y && p.y <= L.y + L.h) return true;
    closeShop();
    return true;
  }

  function shopVisCount() {
    var L = shopLayout();
    return Math.max(1, ((L.buyY - 4 - L.listY) / L.rowH) | 0);
  }

  function shopListStart() {
    var vis = shopVisCount();
    var start = (shopSel | 0) - vis + 1;
    if (start < 0) start = 0;
    if (start > SHOP_ITEMS.length - vis) start = Math.max(0, SHOP_ITEMS.length - vis);
    return start;
  }

  function drawScreenSparks(g) {
    var i, sp, life;
    for (i = 0; i < sparks.length; i++) {
      sp = sparks[i];
      if (!sp.screen) continue;
      life = 1 - sp.age / sp.life;
      if (life <= 0) continue;
      g.fillStyle = sp.col;
      g.fillRect(Math.round(sp.x), Math.round(sp.y), 1, 1);
      if (life > 0.45) g.fillRect(Math.round(sp.x) + 1, Math.round(sp.y) - 1, 1, 1);
    }
  }

  function farmPondAt(tx, ty) {

    if (currentScene !== "overworld") return null;

  /* Ocean water is walk cell "y". Beach sand + pier dock are "f". */
  function isOceanWater(tx, ty) {
    return currentScene === "ocean" && inBounds(tx, ty) && cell(tx, ty) === "y";
  }

  function oceanFishSpotAt(tx, ty) {
    if (!isOceanWater(tx, ty)) return null;
    return { kind: "ocean", tx: tx, ty: ty };
  }

  function standingByOceanWater(tx, ty) {
    return !!(isOceanWater(tx, ty) && orthoNearTile(player.tx, player.ty, tx, ty) && cell(player.tx, player.ty) === "f");
  }

  function nearestOceanBank(tx, ty) {
    var dirs, i, nx, ny, best = null, bestD = 999, d;
    if (!isOceanWater(tx, ty)) return null;
    dirs = [[0, -1], [0, 1], [-1, 0], [1, 0]];
    for (i = 0; i < dirs.length; i++) {
      nx = tx + dirs[i][0];
      ny = ty + dirs[i][1];
      if (!inBounds(nx, ny) || cell(nx, ny) !== "f") continue;
      d = Math.abs(nx - player.tx) + Math.abs(ny - player.ty);
      if (d < bestD) {
        bestD = d;
        best = { tx: nx, ty: ny };
      }
    }
    return best;
  }

  function orthoNearTile(ax, ay, bx, by) {
    return (ax === bx && Math.abs(ay - by) === 1) || (ay === by && Math.abs(ax - bx) === 1);
  }

  function standingByPond(pond) {
    var x, y;
    if (!pond) return false;
    for (y = pond.ty; y < pond.ty + 2; y++) {
      for (x = pond.tx; x < pond.tx + 2; x++) {
        if (orthoNearTile(player.tx, player.ty, x, y)) return true;
      }
    }
    return false;
  }

  function nearestPondTile(pond) {
    var x, y, best = null, bestD = 999, d;
    if (!pond) return null;
    for (y = pond.ty; y < pond.ty + 2; y++) {
      for (x = pond.tx; x < pond.tx + 2; x++) {
        d = Math.abs(x - player.tx) + Math.abs(y - player.ty);
        if (d < bestD) {
          bestD = d;
          best = { tx: x, ty: y };
        }
      }
    }
    return best;
  }

  function nearestPondBank(pond) {
    var x, y, dest, d, best = null, bestD = 999;
    if (!pond) return null;
    for (y = pond.ty; y < pond.ty + 2; y++) {
      for (x = pond.tx; x < pond.tx + 2; x++) {
        dest = nearestAdjacent(x, y);
        if (!dest) continue;
        d = Math.abs(dest.tx - player.tx) + Math.abs(dest.ty - player.ty);
        if (d < bestD) {
          bestD = d;
          best = dest;
        }
      }
    }
    return best;
  }

  function pondBobberSpot(pond, tile) {
    var t = tile || nearestPondTile(pond);
    if (!t) return { x: pond.tx * TILE + 16, y: pond.ty * TILE + 16 };
    return { x: t.tx * TILE + 8, y: t.ty * TILE + 10 };
  }

  function pickCatchFish() {
    var i, total = 0, roll, acc = 0, ocean;
    ocean = !!(fishing && fishing.waterKind === "ocean");
    if (ocean && Math.random() < 1 / 50) return fishKindById("goldenSwordfish");
    for (i = 0; i < FISH_KINDS.length; i++) {
      if (FISH_KINDS[i].oceanOnly) continue;
      total += FISH_KINDS[i].weight;
    }
    roll = Math.random() * total;
    for (i = 0; i < FISH_KINDS.length; i++) {
      if (FISH_KINDS[i].oceanOnly) continue;
      acc += FISH_KINDS[i].weight;
      if (roll < acc) return FISH_KINDS[i];
    }
    return FISH_KINDS[0];
  }

  function spendCastEnergy() {
    if (energy <= 1) return;
    energy -= ENERGY_CAST;
    if (energy < 1) energy = 1;
    persistSave();
  }

  function cancelFishing() {
    if (!fishing) return;
    fishing = null;
    player.workTool = "";
    player.swing = 0;
  }

  function beginFishing(pond, tx, ty) {
    var spot, wait;
    if (!pond || fishing) return false;
    if (uiPaused() || faintFx) return false;
    player.path = [];
    player.queuedWalk = null;
    player.moving = false;
    player.stepT = 0;
    player.frame = 0;
    pending = null;
    faceToward(player, tx, ty);
    player.workTool = "pole";
    player.swing = 220;
    spendCastEnergy();
    spot = pondBobberSpot(pond, { tx: tx, ty: ty });
    wait = 1500 + Math.random() * 2500;
    fishing = {
      pondTx: pond.tx,
      pondTy: pond.ty,
      tileTx: tx,
      tileTy: ty,
      waterKind: pond.kind || "pond",
      phase: "cast",
      age: 0,
      castMs: 420,
      waitMs: wait,
      reelMs: 720,
      bite: false,
      fish: null,
      bobX: spot.x,
      bobY: spot.y,
      splash: 0
    };
    playSfx("cast");
    return true;
  }

  function finishFishingReel() {
    var fish;
    if (!fishing) return;
    fish = fishing.fish;
    fishing = null;
    player.workTool = "";
    player.swing = 0;
    if (fish) {
      addItem(fish.id, 1);
      if (fish.id === "goldenSwordfish") {
        showLineNote("WOW! A GOLDEN SWORDFISH!");
        /* 20260905dn: special gold sparkle for the rare ocean catch */
        if (player) spawnGoldenSwordfishSparks(player.x, player.y - 8);
      } else showLineNote("YUM! A " + fish.name + ".");
      playSfx("pickup");
    } else {
      showLineNote("NOTHING THIS TIME.");
    }
  }

  function updateFishing(dt) {
    if (!fishing) return;
    fishing.age += dt;
    if (fishing.phase === "cast") {
      if (player.swing > 0) player.swing -= dt;
      if (fishing.age >= fishing.castMs) {
        fishing.phase = "wait";
        fishing.age = 0;
      }
      return;
    }
    if (fishing.phase === "wait") {
      if (fishing.age >= fishing.waitMs) {
        fishing.bite = Math.random() >= FISH_MISS;
        fishing.fish = fishing.bite ? pickCatchFish() : null;
        fishing.phase = "reel";
        fishing.age = 0;
        fishing.splash = 1;
        playSfx(fishing.bite ? "nibble" : "splash");
        if (fishing.bite) playSfx("splash");
      }
      return;
    }
    if (fishing.phase === "reel") {
      if (fishing.splash) fishing.splash += dt;
      if (fishing.age >= fishing.reelMs) finishFishingReel();
    }
  }

  function fishingHand() {
    /* Waist/hands — swordHand sits near the face and made the line look like a tongue. */
    var hx = player.x;
    var hy = player.y - 7;
    if (player.face === "left") { hx -= 5; hy -= 1; }
    else if (player.face === "right") { hx += 5; hy -= 1; }
    else if (player.face === "up") { hx -= 1; hy -= 5; }
    else { hx += 5; hy -= 2; } /* down: hold to the side so the pole clears the face */
    return { x: hx, y: hy };
  }

  function drawFishing(g) {
    var hand, tip, bx, by, bob, t, i, ang, px0, py0, dx, dy, len, ux, uy, poleLen, hx, hy, tx, ty;
    if (!fishing) return;
    hand = fishingHand();
    bob = 0;
    if (fishing.phase === "wait") bob = Math.round(Math.sin(tick / 180) * 1);
    if (fishing.phase === "reel" && fishing.bite) bob = 2 + Math.round(Math.sin(tick / 70) * 1);
    bx = fishing.bobX;
    by = fishing.bobY + bob;
    if (fishing.phase === "cast") {
      t = fishing.age / fishing.castMs;
      if (t > 1) t = 1;
      bx = hand.x + (fishing.bobX - hand.x) * t;
      by = hand.y + (fishing.bobY - hand.y) * t;
    }
    dx = bx - hand.x;
    dy = by - hand.y;
    len = Math.sqrt(dx * dx + dy * dy) || 1;
    ux = dx / len;
    uy = dy / len;
    poleLen = Math.min(16, Math.max(10, len * 0.38));
    tip = { x: hand.x + ux * poleLen, y: hand.y + uy * poleLen };
    hx = Math.round(hand.x);
    hy = Math.round(hand.y);
    tx = Math.round(tip.x);
    ty = Math.round(tip.y);
    /* Short wooden pole from the hands toward the water. */
    strokeLine(g, hx, hy, tx, ty, "#3D1A0C", 3);
    strokeLine(g, hx, hy, tx, ty, "#C47A38", 2);
    strokeLine(g, hx, hy, tx, ty, "#E8B060", 1);
    fill(g, hx - 1, hy - 1, 3, 3, "#6D4427");
    px(g, hx, hy, "#E8B060");
    /* Thin light fishing line tip → bobber (not a brown tongue). */
    strokeLine(g, tip.x, tip.y, bx, by, "#D8EEF8", 1);
    strokeLine(g, tip.x, tip.y + 1, bx, by + 1, "#A8D4E8", 1);
    if (fishing.phase !== "cast" || fishing.age > 80) {
      fill(g, Math.round(bx) - 1, Math.round(by) - 1, 3, 3, "#C45A38");
      px(g, Math.round(bx), Math.round(by) - 1, "#F3D2A3");
      px(g, Math.round(bx), Math.round(by) + 1, "#8B2E1C");
    }
    if (fishing.phase === "reel" && fishing.splash) {
      /* 20260905cr: bigger bobber bite splash ring */
      for (i = 0; i < 12; i++) {
        ang = (i / 12) * Math.PI * 2 + fishing.age * 0.012;
        px0 = Math.round(fishing.bobX + Math.cos(ang) * (3 + fishing.age * 0.028));
        py0 = Math.round(fishing.bobY + Math.sin(ang) * (1.5 + fishing.age * 0.016) - fishing.age * 0.014);
        if (i % 3 === 0) fill(g, px0, py0, 2, 2, i % 2 ? "#E8F6FF" : C.waterFm);
        else px(g, px0, py0, i % 2 ? C.waterFm : C.water);
      }
      if (fishing.bite && fishing.age < 220) {
        g.save();
        g.globalAlpha = Math.min(0.7, 0.55 * (1 - fishing.age / 220));
        g.fillStyle = "#FFFDF8";
        g.fillRect(Math.round(fishing.bobX) - 3, Math.round(fishing.bobY) - 4, 6, 6);
        g.restore();
      }
    }
  }

  function tryFishFacing() {
    var t, pond, spot;
    if (uiPaused() || faintFx) return false;
    if (onBoat) return false;
    if (fishing) return true;
    t = facingTile();
    pond = farmPondAt(t.tx, t.ty);
    spot = oceanFishSpotAt(t.tx, t.ty);
    if (!pond && !spot) return false;
    if (!poleOwned) {
      showLineNote("BUY A FISHING POLE AT PIP'S.");
      return true;
    }
    if (!toolEquipped("pole")) {
      showLineNote("SELECT THE FISHING POLE.");
      return true;
    }
    if (pond) {
      if (!standingByPond(pond)) return false;
      return beginFishing(pond, t.tx, t.ty);
    }
    if (!standingByOceanWater(t.tx, t.ty)) return false;
    return beginFishing(spot, t.tx, t.ty);
  }

  function tryFishTap(pond, tx, ty) {
    var dest, path;
    if (!pond) return false;
    if (pond.kind !== "pond" && pond.kind !== "ocean") return false;
    if (pond.kind === "pond" && currentScene !== "overworld") return false;
    if (pond.kind === "ocean" && currentScene !== "ocean") return false;
    if (onBoat) return false;
    if (fishing) return true;
    if (!poleOwned) {
      showLineNote("BUY A FISHING POLE AT PIP'S.");
      return true;
    }
    if (!toolEquipped("pole")) {
      dest = pond.kind === "ocean" ? nearestOceanBank(tx, ty) : nearestPondBank(pond);
      if (dest && (dest.tx !== player.tx || dest.ty !== player.ty)) {
        highlight = { tx: dest.tx, ty: dest.ty };
        goWalk(dest.tx, dest.ty);
      } else {
        showLineNote("SELECT THE FISHING POLE.");
      }
      return true;
    }
    if (pond.kind === "ocean") {
      if (!standingByOceanWater(tx, ty)) {
        dest = nearestOceanBank(tx, ty);
        if (!dest) return true;
        highlight = { tx: dest.tx, ty: dest.ty };
        path = findPath(player.tx, player.ty, dest.tx, dest.ty);
        if (path.length) startWalk(player, path, 3.5);
        return true;
      }
      return beginFishing(pond, tx, ty);
    }
    if (!standingByPond(pond)) {
      dest = nearestPondBank(pond);
      if (!dest) return true;
      highlight = { tx: dest.tx, ty: dest.ty };
      path = findPath(player.tx, player.ty, dest.tx, dest.ty);
      if (path.length) startWalk(player, path, 3.5);
      return true;
    }
    return beginFishing(pond, tx, ty);
  }

  function playerPathAt(tx, ty) {
    var i, b;
    for (i = 0; i < builds.length; i++) {
      b = builds[i];
      if (b && b.kind === "path" && b.tx === tx && b.ty === ty) return b;
    }
    return null;
  }

  function breakPlayerPathAt(tx, ty) {
    /* 20260905bj: placed dirt paths stay — pickaxe/axe never lift them (rocks still smash). */
    return false;
  }

  function goBreakPath(tx, ty) {
    var dest, path;
    if (!playerPathAt(tx, ty)) return;
    highlight = { tx: tx, ty: ty };
    if ((player.tx === tx && player.ty === ty) || isNear(player.tx, player.ty, tx, ty)) {
      pending = null;
      startWalk(player, [], 3.5);
      breakPlayerPathAt(tx, ty);
      return;
    }
    dest = walkable(tx, ty) ? { tx: tx, ty: ty } : nearestAdjacent(tx, ty);
    if (!dest) return;
    path = findPath(player.tx, player.ty, dest.tx, dest.ty);
    if (!path.length) return;
    pending = { type: "breakPath", tx: tx, ty: ty };
    startWalk(player, path, 3.5);
  }

  function facingTile() {
    var dx = 0, dy = 0;
    if (player.face === "left") dx = -1;
    else if (player.face === "right") dx = 1;
    else if (player.face === "up") dy = -1;
    else dy = 1;
    return { tx: player.tx + dx, ty: player.ty + dy };

  function swordBtnRect() {
    /* Bottom-left above the hotbar; keep clear of DAY panel and mine OUT.
       20260905cg: keep fat-finger size — camera pad clears world under tray, not a tinier pad. */
    return { x: 6, y: VIEW_H - 72, s: 58 };

  function hasActionTool() {
    return !!(swordOwned || bowOwned);
  }

  function adjacentFoe() {
    var i, j, m, dx, dy;
    /* 20260905bz: true 8-neighbor (diagonals too) — facing must not gate pad kill */
    for (i = 0; i < monsters.length; i++) {
      m = monsters[i];
      if (!m || m.hp <= 0) continue;
      for (dy = -1; dy <= 1; dy++) {
        for (dx = -1; dx <= 1; dx++) {
          if (monsterOccupies(m, player.tx + dx, player.ty + dy)) return m;
        }
      }
    }
    return null;
  }

  function actionIcon() {
    if (toolEquipped("bow")) return "bow";
    if (ironSwordOwned) return "ironSword";
    return "sword";

  function arrowBusy() {

  }

  function shootArrow() {
    var dx = 0, dy = 0;
    if (!bowOwned || uiPaused() || faintFx) return false;
    if (player.face === "left") dx = -1;
    else if (player.face === "right") dx = 1;
    else if (player.face === "up") dy = -1;
    else dy = 1;
    arrows.push({
      tx: player.tx,
      ty: player.ty,
      dx: dx,
      dy: dy,
      left: 3,
      wait: 0,
      face: player.face,
      x: player.x,
      y: player.y - 10
    });
    return true;
  }

  function updateArrows(dt) {
    var i, a, nx, ny, m;
    for (i = arrows.length - 1; i >= 0; i--) {
      a = arrows[i];
      a.wait += dt;
      a.x = tileCenterX(a.tx) + a.dx * (a.wait / 80) * TILE;
      a.y = (tileFootY(a.ty) - 10) + a.dy * (a.wait / 80) * TILE;
      if (a.wait < 80) continue;
      a.wait = 0;
      nx = a.tx + a.dx;
      ny = a.ty + a.dy;
      a.left -= 1;
      if (!inBounds(nx, ny) || (solid && solid[ny] && solid[ny][nx]) || a.left < 0) {
        arrows.splice(i, 1);
        continue;
      }
      a.tx = nx;
      a.ty = ny;
      a.x = tileCenterX(nx);
      a.y = tileFootY(ny) - 10;
      m = monsterAt(nx, ny);
      if (m && m.hp > 0) {
        hitMonsterOnce(m, "bow");
        spendEnergy(ENERGY_SWING);
        arrows.splice(i, 1);
        continue;
      }
      if (a.left <= 0) arrows.splice(i, 1);
    }
  }

  function drawArrows(g) {
    var i, a, ang;
    for (i = 0; i < arrows.length; i++) {
      a = arrows[i];
      ang = 0;
      if (a.face === "left") ang = Math.PI;
      else if (a.face === "up") ang = -Math.PI * 0.5;
      else if (a.face === "down") ang = Math.PI * 0.5;
      g.save();
      g.imageSmoothingEnabled = false;
      g.translate(Math.round(a.x), Math.round(a.y));
      g.rotate(ang);
      Assets.draw(g, "arrow", -8, -8);
      g.restore();
    }
  }

  function showStrikeBtn() {
    if (isCozyInterior()) return false;
    if (swordEquipped()) return true;
    return currentScene === "mine";
  }

  function hitSwordBtn(p) {
    var b, pad, cx, cy, dx, dy, r;
    if (!showStrikeBtn()) return false;
    b = swordBtnRect();
    pad = 8;
    cx = b.x + b.s * 0.5;
    cy = b.y + b.s * 0.5;
    dx = p.x - cx;
    dy = p.y - cy;
    r = b.s * 0.5 + pad;
    if (dx * dx + dy * dy <= r * r) return true;
    /* Also accept the square bounds — fat finger near the rim. */
    return p.x >= b.x - 2 && p.x < b.x + b.s + 2 && p.y >= b.y - 2 && p.y < b.y + b.s + 2;
  }

  function swingBusy() {
    return player.arc > 0;
  }

  function swingHitTiles() {
    var tiles = [];
    var seen = {};
    function add(tx, ty) {
      var k = tx + "," + ty;
      if (seen[k]) return;
      seen[k] = true;
      tiles.push({ tx: tx, ty: ty });
    }
    var ox = player.tx;
    var oy = player.ty;
    var pix = entityTile(player);
    var face = facingTile();
    var dx, dy;
    /* Omnidirectional fat-finger pad: every neighbor around Orion, not a facing cone. */
    add(ox, oy);
    for (dy = -1; dy <= 1; dy++) {
      for (dx = -1; dx <= 1; dx++) {
        if (dx || dy) add(ox + dx, oy + dy);
      }
    }
    add(face.tx, face.ty);
    if (pix.tx !== ox || pix.ty !== oy) add(pix.tx, pix.ty);
    if (player.swingDest) add(player.swingDest.tx, player.swingDest.ty);
    return tiles;
  }

  function swingArcTiles() {
    return swingHitTiles();
  }

  function strikeDamage(m, via) {
    if (via === "bow") {
      if (m && (m.kind === "bat" || m.kind === "crystalbat")) return 3;
      return 1;
    }
    /* 20260903a: pad/mine swings always deal 4 — never gate on arc timer (lag/edge could zero arc mid-hit). */
    if (via === "swing" || via === "pad" || currentScene === "mine") return 4;
    if (toolEquipped("pick") && m && (m.kind === "grub" || m.kind === "toughgrub")) return 3;
    if (swordEquipped()) return ironSwordOwned ? 4 : 2;
    return 1;
  }

  function hitMonsterOnce(m, via) {
    if (!m || m.hp <= 0) return;
    if (!via) via = "swing";
    m.hp -= strikeDamage(m, via);
    m.flash = 340; /* 20260905ci: longer white hit flash */
    stunMonster(m);
    m.shake = Math.max(m.shake || 0, 320);
    spawnHitSparks(m.x, m.y - 4, false);
    playSfx("hit");
    if (m.hp <= 0) defeatMonster(m);
  }

  function entityTile(who) {
    return {
      tx: Math.round((who.x - 8) / TILE),
      ty: Math.round((who.y - 14) / TILE)
    };
  }

  function monsterOccupies(m, tx, ty) {
    var pt, dest;
    if (!m) return false;
    if (m.tx === tx && m.ty === ty) return true;
    pt = entityTile(m);
    if (pt.tx === tx && pt.ty === ty) return true;
    dest = m.path && m.path.length ? m.path[0] : null;
    if (dest && dest.tx === tx && dest.ty === ty) return true;
    return false;
  }

  function swingReachHits(m) {
    var dx, dy, reach, pt, dtx, dty, tileR, flying;
    if (!m) return false;
    /* 20260905bz: omni adjacent (8-neighbor). Ground stays Chebyshev≤1 (05af no-snipe).
       Bats hop on hit — Chebyshev≤2 + wider pixel reach so the 2nd pad tap still kills. */
    flying = m.kind === "bat" || m.kind === "crystalbat";
    tileR = flying ? 2 : 1;
    dx = m.x - player.x;
    dy = m.y - player.y;
    reach = (flying ? 56 : 40) + (m.scale > 1.2 ? 6 : 0);
    if ((dx * dx + dy * dy) <= reach * reach) return true;
    dtx = Math.abs(m.tx - player.tx);
    dty = Math.abs(m.ty - player.ty);
    if (dtx <= tileR && dty <= tileR) return true;
    pt = entityTile(m);
    dtx = Math.abs(pt.tx - player.tx);
    dty = Math.abs(pt.ty - player.ty);
    if (dtx <= tileR && dty <= tileR) return true;
    return false;
  }

  function stunMonster(m) {
    var dx, dy, nx, ny, occ;
    if (!m) return;
    m.path = [];
    m.queuedWalk = null;
    m.moving = false;
    m.stepFrom = null;
    m.stepT = 0;
    m.stun = 560;
    m.idle = 900;
    m.shake = 280;
    dx = 0;
    dy = 0;
    if (m.tx < player.tx) dx = -1;
    else if (m.tx > player.tx) dx = 1;
    else if (m.ty < player.ty) dy = -1;
    else if (m.ty > player.ty) dy = 1;
    else if (player.face === "left") dx = -1;
    else if (player.face === "right") dx = 1;
    else if (player.face === "up") dy = -1;
    else dy = 1;
    /* 20260903b: only flying foes hop a tile on hit — slimes stay put so pad taps finish the kill. */
    if (m.kind === "bat" || m.kind === "crystalbat") {
      nx = m.tx + dx;
      ny = m.ty + dy;
      occ = monsterAt(nx, ny);
      if ((!occ || occ === m) && monsterOk(m, nx, ny) && !playerOccupies(nx, ny)) {
        m.tx = nx;
        m.ty = ny;
      }
    }
    m.x = tileCenterX(m.tx);
    m.y = tileFootY(m.ty);
  }

  function applySwingHits() {
    var tiles = swingHitTiles();
    var i, j, m, t, hit, targets = [];
    for (i = 0; i < monsters.length; i++) {
      m = monsters[i];
      if (!m || m.hp <= 0) continue;
      hit = false;
      for (j = 0; j < tiles.length; j++) {
        t = tiles[j];
        if (monsterOccupies(m, t.tx, t.ty)) { hit = true; break; }
      }
      if (hit || swingReachHits(m)) targets.push(m);
    }
    for (i = 0; i < targets.length; i++) hitMonsterOnce(targets[i]);
    var cut = 0, p, seen = {};
    var key;
    for (j = 0; j < tiles.length; j++) {
      t = tiles[j];
      p = propAt(t.tx, t.ty);
      if (!isSliceable(p)) continue;
      key = p.tx + "," + p.ty;
      if (seen[key]) continue;
      seen[key] = true;
      if (sliceGrass(p)) cut += 1;
    }
    if (targets.length || cut) spendEnergy(ENERGY_SWING);
    else {
      t = facingTile();
      spawnSparks(t.tx * TILE + 8, t.ty * TILE + 6);
    }
  }

  function updateSwordArc(dt) {
    if (player.arc <= 0) return;
    player.arc -= dt;
    if (!player.arcHit && player.arc <= SWING_MS * (1 - SWING_HIT_AT)) {
      player.arcHit = true;
      applySwingHits();
    }
    if (player.arc < 0) player.arc = 0;
  }

  function canSwordSwing() {
    if (uiPaused() || faintFx || fishing) return false;
    if (isCozyInterior()) return false;
    if (swordEquipped()) return true;
    return currentScene === "mine";
  }

  function startSwordSwing() {
    var dest, foe, i, m, best, bestD, dx, dy, d;
    if (!canSwordSwing()) return false;
    if (currentScene === "mine") ensureCaveSword(true);
    /* 20260905bz: fat-finger remash — allow a new press ~90ms after the last swing start
       (arc timer alone is too sticky when SWING_MS is long / frames lag). */
    var now = (typeof performance !== "undefined" && performance.now) ? performance.now() : Date.now();
    if (player.arc > 0 && (now - lastSwingAt) < 90) return false;
    dest = player.path && player.path.length ? player.path[0] : player.queuedWalk;
    player.swingDest = dest ? { tx: dest.tx, ty: dest.ty } : null;
    player.path = [];
    player.queuedWalk = null;
    player.moving = false;
    player.stepT = 0;
    player.frame = 0;
    player.x = tileCenterX(player.tx);
    player.y = tileFootY(player.ty);
    highlight = null;
    foe = adjacentFoe();
    if (!foe) {
      best = null;
      bestD = 1e9;
      for (i = 0; i < monsters.length; i++) {
        m = monsters[i];
        if (!m || m.hp <= 0) continue;
        if (!swingReachHits(m)) continue;
        dx = m.x - player.x;
        dy = m.y - player.y;
        d = dx * dx + dy * dy;
        if (d < bestD) {
          bestD = d;
          best = m;
        }
      }
      foe = best;
    }
    if (foe) faceToward(player, foe.tx, foe.ty);
    cancelHit();
    player.arc = SWING_MS;
    lastSwingAt = now;
    /* 20260903a / 05bz: land damage on press (not mid-arc) so pad kills can't miss while bat flees. */
    player.arcHit = true;
    applySwingHits();
    playSfx("swing");
    return true;
  }

  function makeMon(kind, tx, ty) {
    var spec = {
      /* 20260905br: outdoor slug — softer than mine slime (2hp / half-heart bump). */
      /* 20260905cp: outdoor slugs a touch larger so dusk wash does not hide them */
      slug: { sprite: "slime", maxHp: 2, dmg: BUMP_DMG, gold: 1, scale: 1.05 },
      slime: { sprite: "slime", maxHp: 4, dmg: BUMP_DMG, gold: 1, scale: 1 },
      bat: { sprite: "bat", maxHp: 6, dmg: BUMP_DMG, gold: 2, scale: 1 },
      grub: { sprite: "rockgrub", maxHp: 6, dmg: BUMP_DMG, gold: 1, scale: 1 },
      toughgrub: { sprite: "rockgrub", maxHp: 8, dmg: BUMP_DMG, gold: 2, scale: 1.25 },
      crystalbat: { sprite: "crystalbat", maxHp: 6, dmg: BUMP_DMG, gold: 3, scale: 1 },
      toughslime: { sprite: "slime", maxHp: 4, dmg: BUMP_DMG, gold: 3, scale: 1.2 },
      bigslime: { sprite: "slime", maxHp: 6, dmg: BUMP_DMG, gold: 5, scale: 1.5 }
    }[kind] || { sprite: "slime", maxHp: 2, dmg: BUMP_DMG, gold: 1, scale: 1 };
    return {
      kind: kind,
      sprite: spec.sprite,
      tx: tx, ty: ty,
      homeTx: tx, homeTy: ty,
      x: tileCenterX(tx),
      y: tileFootY(ty),
      face: "down",
      frame: 0,
      path: [],
      stepFrom: null,
      stepT: 0,
      queuedWalk: null,
      idle: 400 + Math.random() * 900,
      anim: 0,
      hp: spec.maxHp,
      maxHp: spec.maxHp,
      dmg: spec.dmg,
      gold: spec.gold,
      scale: spec.scale || 1,
      shake: 0,
      stun: 0
    };
  }

  function syncMineMonsterCombat() {
    var i, m, fresh, specHp;
    /* 20260903b: cached foes keep old HP/dmg — resync to current makeMon specs. */
    for (i = 0; i < monsters.length; i++) {
      m = monsters[i];
      if (!m || m.hp <= 0) continue;
      fresh = makeMon(m.kind, m.tx, m.ty);
      specHp = fresh.maxHp;
      if ((m.maxHp | 0) !== specHp) {
        m.maxHp = specHp;
        if (m.hp > specHp) m.hp = specHp;
      }
      m.dmg = fresh.dmg;
      m.scale = fresh.scale;
      m.gold = fresh.gold;
    }
  }

  function outdoorSlugScene() {
    return currentScene === "overworld" || currentScene === "forest";
  }

  function outdoorSlugTarget(scene) {
    var ph;
    scene = scene || currentScene;
    if (scene === "forest") return 2;
    if (scene !== "overworld") return 0;
    /* Night-friendly: evenings/nights get a few rim lurkers; day keeps one shy edge slug. */
    ph = clockPhaseName();
    if (ph === "EVENING" || ph === "NIGHT") return 3;
    return 1;
  }

  function outdoorKeepClear(tx, ty) {
    if (currentScene === "overworld") {
      if (Math.abs(tx - houseIn.tx) + Math.abs(ty - houseIn.ty) <= 3) return true;
      if (Math.abs(tx - forestIn.tx) + Math.abs(ty - forestIn.ty) <= 2) return true;
      if (Math.abs(tx - 36) + Math.abs(ty - 6) <= 2) return true; /* NE mine */
      if (tx >= 40) return true; /* town / river */
      if (tx >= FARM.x0 && tx <= FARM.x1 && ty >= FARM.y0 && ty <= FARM.y1) {
        /* Keep crop/yard soft — slugs stay on the rim, not the chicken yard center. */
        if (tx >= FARM.x0 + 2 && tx <= FARM.x1 - 2 && ty >= FARM.y0 + 2 && ty <= FARM.y1 - 2) return true;
      }
      return false;
    }
    if (currentScene === "forest") {
      if (ty >= FOREST_ROWS - 3) return true; /* FARM exit */
      if (tx === treetopDoor.tx && ty === treetopDoor.ty) return true;
      return false;
    }
    return false;
  }

  function outdoorMonCellOk(tx, ty) {
    var ch;
    if (!inBounds(tx, ty) || solid[ty][tx]) return false;
    if (!walkable(tx, ty)) return false;
    ch = cell(tx, ty);
    return ch === "g" || ch === "d" || ch === "p" || ch === "h";
  }

  function outdoorSlugCandidates(scene) {
    if (scene === "forest") {
      return [
        { tx: 6, ty: 28 }, { tx: 20, ty: 22 }, { tx: 8, ty: 48 },
        { tx: 18, ty: 40 }, { tx: 12, ty: 18 }, { tx: 22, ty: 52 }
      ];
    }
    /* Farm edges + woods-path spur (away from house / town / mine pad). */
