<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#2A1A10">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="format-detection" content="telephone=no">
  <title>Moondrop Mountain</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html {
      --sat: env(safe-area-inset-top, 0px);
      --sar: env(safe-area-inset-right, 0px);
      --sab: env(safe-area-inset-bottom, 0px);
      --sal: env(safe-area-inset-left, 0px);
    }
    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      overscroll-behavior: none;
      -webkit-text-size-adjust: 100%;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none;
      user-select: none;
      background: #2A1A10;
    }
    body {
      position: fixed;
      inset: 0;
    }
    #frame {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #2A1A10;
    }
    #game {
      display: block;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      -ms-interpolation-mode: nearest-neighbor;
      background: #5FBF22;
    }
    #frame:fullscreen,
    #frame:-webkit-full-screen {
      width: 100%;
      height: 100%;
      background: #2A1A10;
    }
    #fsBtn {
      position: absolute;
      top: max(8px, var(--sat));
      right: max(8px, var(--sar));
      z-index: 5;
      min-width: 44px;
      min-height: 44px;
      padding: 6px 8px;
      border: 0;
      background: transparent;
      cursor: pointer;
      -webkit-appearance: none;
      appearance: none;
      touch-action: manipulation;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #fsFace {
      display: block;
      width: 96px;
      height: 39px;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      pointer-events: none;
    }
    #fsBtn:active #fsFace { filter: brightness(0.9); }
  </style>
</head>
<body>
  <div id="frame">
    <canvas id="game" width="320" height="192" role="application" aria-label="Moondrop Mountain"></canvas>
    <button type="button" id="fsBtn" aria-label="Full Screen">
      <canvas id="fsFace" width="32" height="13"></canvas>
    </button>
  </div>

  function loadImage(src) {
    return new Promise(function (resolve, reject) {
      var img = new Image();
      img.onload = function () { resolve(img); };
      img.onerror = function () { reject(new Error("image " + src)); };
      img.src = src;
    });
  }

  var Assets = {
    img: null,
    spr: {},
    ready: false,
    load: function () {
      return fetch("assets/manifest.json").then(function (r) {
        if (!r.ok) throw new Error("manifest " + r.status);
        return r.json();
      }).then(function (meta) {
        var map = {};
        var i, s, k;
        for (i = 0; i < meta.sprites.length; i++) {
          s = meta.sprites[i];
          map[s.id] = s;
        }
        Assets.spr = map;
        if (meta.palette) {
          for (k in meta.palette) {
            if (Object.prototype.hasOwnProperty.call(meta.palette, k)) C[k] = meta.palette[k];
          }
        }
        return loadImage("assets/" + (meta.atlas || "atlas.png"));
      }).then(function (img) {
        Assets.img = img;
        Assets.ready = true;
      });
    },
    draw: function (ctx, id, x, y, frame) {
      var s = Assets.spr[id];
      if (!s || !Assets.img) return;
      var fr = frame || 0;
      var fw = s.fw || s.w;
      var ox = s.ox || 0;
      var oy = s.oy || 0;
      var ax = (s.anchor && s.anchor[0]) || 0;
      var ay = (s.anchor && s.anchor[1]) || 0;
      ctx.drawImage(
        Assets.img,
        s.x + fr * fw, s.y, fw, s.h,
        Math.round(x + ox - ax), Math.round(y + oy - ay),
        fw, s.h
      );
    }
  };

  function hash(x, y, s) {
    var n = (x * 374761393 + y * 668265263 + s * 1274126177) | 0;
    n = (n ^ (n >>> 13)) * 1274126177;
    return ((n >>> 0) % 1000) / 1000;
  }

  function buildOverworldGround() {
    var cols = OVER_COLS, rows = OVER_ROWS;
    var g = [];
    var y, x, row;
    for (y = 0; y < rows; y++) {
      row = [];
      for (x = 0; x < cols; x++) row[x] = "g";
      g[y] = row;
    }
    function set(tx, ty, ch) {
      if (tx >= 0 && ty >= 0 && tx < cols && ty < rows) g[ty][tx] = ch;
    }
    function rect(x0, y0, x1, y1, ch) {
      var xx, yy;
      for (yy = y0; yy <= y1; yy++) {
        for (xx = x0; xx <= x1; xx++) set(xx, yy, ch);
      }
    }
    /* farm till (original 5-6,6-8 + offset 2,24) */
    rect(7, 30, 8, 32, "p");
    /* farm dirt south of the house */
    rect(14, 29, 17, 30, "d");
    rect(14, 31, 16, 31, "d");
    rect(13, 32, 15, 32, "d");
    rect(12, 33, 14, 33, "d");
    rect(11, 34, 13, 34, "d");
    rect(10, 35, 11, 35, "d");
    /* path north, west of the house, then east to the mine */
    for (y = 10; y <= 29; y++) {
      set(13, y, "d");
      set(14, y, "d");
    }
    for (x = 13; x <= 37; x++) {
      set(x, 9, "d");
      set(x, 10, "d");
    }
    for (y = 6; y <= 9; y++) set(37, y, "d");
    /* spur to the second pond */
    for (x = 15; x <= 25; x++) set(x, 16, "d");
    /* rocky hill around the mine */
    for (y = 2; y <= 8; y++) {
      for (x = 32; x <= 43; x++) {
        if (g[y][x] === "g" && hash(x, y, 3) < 0.62) set(x, y, "h");
      }
    }
    return g;
  }

  function buildMineGround() {
    var cols = 24, rows = 16;
    var g = [];
    var y, x, row;
    for (y = 0; y < rows; y++) {
      row = [];
      for (x = 0; x < cols; x++) {
        row[x] = (x === 0 || y === 0 || x === cols - 1 || y === rows - 1) ? "#" : "s";
      }
      g[y] = row;
    }
    function wall(tx, ty) {
      if (tx > 0 && ty > 0 && tx < cols - 1 && ty < rows - 1) g[ty][tx] = "#";
    }
    wall(9, 4); wall(10, 4); wall(9, 5); wall(10, 5);
    wall(16, 8); wall(17, 8);
    wall(5, 10); wall(6, 10);
    return g;
  }

    return [

  }

  function saveScene() {
    if (!GROUND || !GROUND.length) return;
    sceneCache[currentScene] = { cols: COLS, rows: ROWS, ground: GROUND, props: PROPS };
  }

  function applyScene(name) {
    saveScene();
    currentScene = name;
    var cached = sceneCache[name];
    if (cached) {
      COLS = cached.cols;
      ROWS = cached.rows;
      GROUND = cached.ground;
      PROPS = cached.props;
    } else if (name === "mine") {
      COLS = 24;
      ROWS = 16;
      GROUND = buildMineGround();
      PROPS = buildMineProps();
    } else {
      COLS = OVER_COLS;
      ROWS = OVER_ROWS;
      GROUND = buildOverworldGround();
      PROPS = buildOverworldProps();
    }
    buildSolid();
  }

  function px(g, x, y, color) {
    g.fillStyle = color;
    g.fillRect(x, y, 1, 1);
  }

  function fill(g, x, y, w, h, color) {
    g.fillStyle = color;
    g.fillRect(x, y, w, h);
  }

  function cell(tx, ty) {
    if (ty < 0 || ty >= ROWS || tx < 0 || tx >= COLS) return "g";
    return GROUND[ty][tx];
  }

  function setCell(tx, ty, ch) {
    if (ty >= 0 && ty < ROWS && tx >= 0 && tx < COLS) GROUND[ty][tx] = ch;
  }

  function isSoft(ch) {
    return ch === "g" || ch === "h";
  }

  function buildSolid() {
    var y, x, i, p;
    solid = [];
    for (y = 0; y < ROWS; y++) {
      solid[y] = [];
      for (x = 0; x < COLS; x++) {
        solid[y][x] = cell(x, y) === "#";
      }
    }
    function block(tx, ty) {
      if (tx >= 0 && ty >= 0 && tx < COLS && ty < ROWS) solid[ty][tx] = true;
    }
    for (i = 0; i < PROPS.length; i++) {
      p = PROPS[i];
      if (p.kind === "house") {
        for (y = 0; y < 4; y++) {
          for (x = 0; x < 5; x++) block(p.tx + x, p.ty + y);
        }
      } else if (p.kind === "pond") {
        block(p.tx, p.ty); block(p.tx + 1, p.ty);
        block(p.tx, p.ty + 1); block(p.tx + 1, p.ty + 1);
      } else if (p.kind === "cave") {
        for (x = 0; x < 4; x++) block(p.tx + x, p.ty);
        block(p.tx, p.ty + 1);
        block(p.tx + 2, p.ty + 1);
        block(p.tx + 3, p.ty + 1);
      } else if (
        p.kind === "tree" || p.kind === "well" || p.kind === "rock" ||
        p.kind === "lantern" || p.kind === "fenceH" || p.kind === "fenceL" ||
        p.kind === "fenceR"
      ) {
        block(p.tx, p.ty);
      }
    }
    if (currentScene === "overworld") block(npc.tx, npc.ty);
  }

  function inBounds(tx, ty) {
    return tx >= 0 && ty >= 0 && tx < COLS && ty < ROWS;
  }

  function walkable(tx, ty) {
    return inBounds(tx, ty) && !solid[ty][tx];
  }

  function chickenOk(tx, ty) {
    if (currentScene !== "overworld") return false;
    if (!walkable(tx, ty)) return false;
    if (tx < FARM.x0 || tx > FARM.x1 || ty < FARM.y0 || ty > FARM.y1) return false;
    var ch = cell(tx, ty);
    return ch === "g" || ch === "d";
  }

  function tileCenterX(tx) { return tx * TILE + 8; }
  function tileFootY(ty) { return ty * TILE + 14; }

  function updateCamera() {
    var worldW = COLS * TILE;
    var worldH = ROWS * TILE;
    var targetX = player.x - (VIEW_W >> 1);
    var targetY = player.y - (VIEW_H >> 1);
    var maxX = worldW - VIEW_W;
    var maxY = worldH - VIEW_H;
    if (maxX < 0) maxX = 0;
    if (maxY < 0) maxY = 0;
    camX = Math.round(Math.max(0, Math.min(maxX, targetX)));
    camY = Math.round(Math.max(0, Math.min(maxY, targetY)));
    camera.x = camX;
    camera.y = camY;
  }

  function findPath(sx, sy, ex, ey) {
    if (!walkable(ex, ey)) return [];
    if (sx === ex && sy === ey) return [];
    var q = [[sx, sy]];
    var came = {};
    function key(x, y) { return x + "," + y; }
    came[key(sx, sy)] = null;
    var dirs = [[0, -1], [0, 1], [-1, 0], [1, 0]];
    var head = 0;
    var i, cur, nx, ny, nk, path, node, k;
    while (head < q.length) {
      cur = q[head++];
      if (cur[0] === ex && cur[1] === ey) {
        path = [];
        k = key(ex, ey);
        while (came[k]) {
          node = came[k];
          path.push({ tx: node[2], ty: node[3] });
          k = node[0] + "," + node[1];
        }
        path.reverse();
        return path;
      }
      for (i = 0; i < 4; i++) {
        nx = cur[0] + dirs[i][0];
        ny = cur[1] + dirs[i][1];
        nk = key(nx, ny);
        if (came[nk] !== undefined) continue;
        if (!walkable(nx, ny)) continue;
        came[nk] = [cur[0], cur[1], nx, ny];
        q.push([nx, ny]);
      }
    }
    return [];
  }

  function faceToward(who, tx, ty) {
    var dx = tx - who.tx;
    var dy = ty - who.ty;
    if (Math.abs(dx) > Math.abs(dy)) who.face = dx > 0 ? "right" : "left";
    else if (dy !== 0) who.face = dy > 0 ? "down" : "up";
  }

  function startWalk(who, path, speed) {
    who.x = tileCenterX(who.tx);
    who.y = tileFootY(who.ty);
    who.path = path || [];
    who.speed = speed;
    who.stepT = 0;
    who.anim = 0;
    if (who.path.length) {
      who.stepFrom = { tx: who.tx, ty: who.ty };
      who.moving = true;
      faceToward(who, who.path[0].tx, who.path[0].ty);
    } else {
      who.moving = false;
      who.frame = 0;
    }
  }

  function advanceWalk(who, dt) {
    if (!who.path || !who.path.length) {
      who.moving = false;
      who.frame = 0;
      return false;
    }
    var dest = who.path[0];
    var speed = who.speed || 3.5;
    who.stepT += (dt / 1000) * speed;
    if (who.stepT >= 1) {
      who.tx = dest.tx;
      who.ty = dest.ty;
      who.x = tileCenterX(who.tx);
      who.y = tileFootY(who.ty);
      who.path.shift();
      who.stepT = 0;
      if (who.path.length) {
        who.stepFrom = { tx: who.tx, ty: who.ty };
        faceToward(who, who.path[0].tx, who.path[0].ty);
      } else {
        who.moving = false;
        who.frame = 0;
        return true;
      }
    } else {
      var fx = tileCenterX(who.stepFrom.tx);
      var fy = tileFootY(who.stepFrom.ty);
      who.x = fx + (tileCenterX(dest.tx) - fx) * who.stepT;
      who.y = fy + (tileFootY(dest.ty) - fy) * who.stepT;
      who.moving = true;
    }
    who.anim += dt;
    if (who.anim > 180) {
      who.anim = 0;
      who.frame = who.frame ? 0 : 1;
    }
    return false;
  }

  function isNear(ax, ay, bx, by) {
    return Math.abs(ax - bx) + Math.abs(ay - by) <= 1;
  }

  function nearestAdjacent(tx, ty) {
    var dirs = [[0, 1], [0, -1], [-1, 0], [1, 0]];
    var best = null, bestD = 999, i, nx, ny, d;
    for (i = 0; i < 4; i++) {
      nx = tx + dirs[i][0];
      ny = ty + dirs[i][1];
      if (!walkable(nx, ny)) continue;
      d = Math.abs(nx - player.tx) + Math.abs(ny - player.ty);
      if (d < bestD) {
        bestD = d;
        best = { tx: nx, ty: ny };
      }
    }
    return best;
  }

  function plantAt(tx, ty) {
    var k = tx + "," + ty;
    if (cell(tx, ty) !== "p") return;
    if (crops[k]) return;
    crops[k] = "sprout";
  }

  function isFenceKind(kind) {
    return kind === "fenceH" || kind === "fenceL" || kind === "fenceR";
  }

  function isHarvestable(p) {
    return p && (p.kind === "tree" || p.kind === "rock");
  }

  function propOccupies(p, tx, ty) {
    if (!p) return false;
    if (p.kind === "house") return tx >= p.tx && tx < p.tx + 5 && ty >= p.ty && ty < p.ty + 4;
    if (p.kind === "pond") return tx >= p.tx && tx < p.tx + 2 && ty >= p.ty && ty < p.ty + 2;
    if (p.kind === "cave") return tx >= p.tx && tx < p.tx + 4 && ty >= p.ty && ty < p.ty + 2;
    return p.tx === tx && p.ty === ty;
  }

  function propAt(tx, ty) {
    var i, p;
    for (i = 0; i < PROPS.length; i++) {
      p = PROPS[i];
      if (propOccupies(p, tx, ty)) return p;
    }
    return null;
  }

  function harvestableAtTile(tx, ty) {
    var i, p;
    for (i = 0; i < PROPS.length; i++) {
      p = PROPS[i];
      if (isHarvestable(p) && p.tx === tx && p.ty === ty) return p;
    }
    return null;
  }

  function harvestableAtPoint(wx, wy) {
    var i, p, b, rock = null, tree = null;
    for (i = 0; i < PROPS.length; i++) {
      p = PROPS[i];
      if (!isHarvestable(p)) continue;
      b = propBounds(p);
      if (wx >= b.x && wx < b.x + b.w && wy >= b.y && wy < b.y + b.h) {
        if (p.kind === "rock") rock = p;
        else tree = p;
      }
    }
    return rock || tree;
  }

  function hasFence(tx, ty) {
    var i, p;
    for (i = 0; i < PROPS.length; i++) {
      p = PROPS[i];
      if (isFenceKind(p.kind) && p.tx === tx && p.ty === ty) return true;
    }
    return false;
  }

  function fenceKindFor(tx, ty) {
    var v = hasFence(tx, ty - 1) || hasFence(tx, ty + 1);
    var h = hasFence(tx - 1, ty) || hasFence(tx + 1, ty);
    if (v && !h) return "fenceL";
    return "fenceH";
  }

  function canBuildOn(tx, ty) {
    var ch;
    if (currentScene !== "overworld") return false;
    if (!inBounds(tx, ty)) return false;
    ch = cell(tx, ty);
    if (ch !== "g" && ch !== "d" && ch !== "h") return false;
    if (!walkable(tx, ty)) return false;
    if (propAt(tx, ty)) return false;
    if (tx === npc.tx && ty === npc.ty) return false;
    if (tx === chicken.tx && ty === chicken.ty) return false;
    if (isEntrance(tx, ty)) return false;
    return true;
  }

  function spawnSparks(x, y) {
    var i, ang;
    for (i = 0; i < 5; i++) {
      ang = (i / 5) * Math.PI * 2 + Math.random() * 0.4;
      sparks.push({
        x: x,
        y: y,
        vx: Math.cos(ang) * 0.035,
        vy: Math.sin(ang) * 0.028 - 0.02,
        age: 0,
        life: 260 + Math.random() * 140,
        col: i % 2 ? C.parch : C.flower
      });
    }
  }

  function spawnPickup(kind, tx, ty, amount) {
    pickups.push({
      kind: kind,
      amount: amount,
      x: tx * TILE + 8,
      y: ty * TILE + 4,
      sx: tx * TILE + 8,
      sy: ty * TILE + 4,
      age: 0,
      life: 420
    });
  }

  function addItem(kind, amount) {
    if (kind === "wood") inventory.wood += amount;
    else if (kind === "stone") inventory.stone += amount;
  }

  function flushPickups() {
    var i, pk;
    for (i = 0; i < pickups.length; i++) {
      pk = pickups[i];
      addItem(pk.kind, pk.amount);
    }
    pickups = [];
  }

  function cancelHit() {
    player.hitting = null;
  }

  function doHit() {
    var h = player.hitting;
    var prop, cx, cy;
    if (!h || !isHarvestable(h.prop)) {
      cancelHit();
      return;
    }
    prop = h.prop;
    faceToward(player, prop.tx, prop.ty);
    player.swing = 220;
    prop.shake = 200;
    cx = prop.tx * TILE + 8;
    cy = prop.ty * TILE + (prop.kind === "tree" ? 2 : 6);
    spawnSparks(cx, cy);
    h.left -= 1;
    if (h.left <= 0) {
      finishHarvest(prop);
      cancelHit();
    } else {
      h.wait = HIT_GAP;
    }
  }

  function beginHit(prop) {
    if (!isHarvestable(prop)) return;
    player.path = [];
    player.moving = false;
    player.stepT = 0;
    player.frame = 0;
    faceToward(player, prop.tx, prop.ty);
    player.hitting = { prop: prop, left: HIT_COUNT, wait: 0 };
    doHit();
  }

  function finishHarvest(prop) {
    if (prop.kind === "tree") {
      prop.kind = "stump";
      prop.shake = 0;
      buildSolid();
      spawnPickup("wood", prop.tx, prop.ty, WOOD_PER_TREE);
    } else if (prop.kind === "rock") {
      var i = PROPS.indexOf(prop);
      if (i >= 0) PROPS.splice(i, 1);
      buildSolid();
      spawnPickup("stone", prop.tx, prop.ty, STONE_PER_ROCK);
    }
  }

  function updateHit(dt) {
    if (player.swing > 0) player.swing -= dt;
    if (!player.hitting) return;
    if (!isHarvestable(player.hitting.prop)) {
      cancelHit();
      return;
    }
    player.hitting.wait -= dt;
    if (player.hitting.wait <= 0) doHit();
  }

  function updatePickups(dt) {
    var i, pk, t, destX, destY;
    for (i = pickups.length - 1; i >= 0; i--) {
      pk = pickups[i];
      pk.age += dt;
      t = pk.age / pk.life;
      if (t >= 1) {
        addItem(pk.kind, pk.amount);
        pickups.splice(i, 1);
        continue;
      }
      destX = player.x;
      destY = player.y - 10;
      pk.x = pk.sx + (destX - pk.sx) * t;
      pk.y = pk.sy + (destY - pk.sy) * t - Math.sin(t * Math.PI) * 12;
    }
  }

  function updateFx(dt) {
    var i, p, sp;
    if (slotShake > 0) slotShake -= dt;
    for (i = 0; i < PROPS.length; i++) {
      p = PROPS[i];
      if (p.shake > 0) p.shake -= dt;
    }
    for (i = sparks.length - 1; i >= 0; i--) {
      sp = sparks[i];
      sp.age += dt;
      if (sp.age >= sp.life) {
        sparks.splice(i, 1);
        continue;
      }
      sp.x += sp.vx * dt;
      sp.y += sp.vy * dt;
      sp.vy += 0.00018 * dt;
    }
  }

  function tryBuild(tx, ty) {
    var placingFence = selectedSlot === SLOT_WOOD;
    var placingPath = selectedSlot === SLOT_STONE;
    if (!placingFence && !placingPath) return false;
    if (!canBuildOn(tx, ty)) return false;
    if (placingFence && player.tx === tx && player.ty === ty) return false;
    if (placingFence && inventory.wood < FENCE_COST) {
      slotShake = 220;
      return true;
    }
    if (placingPath && inventory.stone < PATH_COST) {
      slotShake = 220;
      return true;
    }
    if (placingFence) {
      inventory.wood -= FENCE_COST;
      PROPS.push({ kind: fenceKindFor(tx, ty), tx: tx, ty: ty });
      buildSolid();
    } else {
      inventory.stone -= PATH_COST;
      setCell(tx, ty, "k");
    }
    return true;
  }

  function caveAt(tx, ty) {
    var i, p;
    for (i = 0; i < PROPS.length; i++) {
      p = PROPS[i];
      if (p.kind === "cave" && tx >= p.tx && tx < p.tx + 4 && ty >= p.ty && ty < p.ty + 2) return p;
    }
    return null;
  }

  function isEntrance(tx, ty) {
    return currentScene === "overworld" && tx === portalIn.tx && ty === portalIn.ty;
  }

  function isExit(tx, ty) {
    return currentScene === "mine" && tx === portalOut.tx && ty === portalOut.ty;
  }

  function placePlayer(tx, ty, face) {
    player.tx = tx;
    player.ty = ty;
    player.x = tileCenterX(tx);
    player.y = tileFootY(ty);
    player.path = [];
    player.moving = false;
    player.stepT = 0;
    player.frame = 0;
    if (face) player.face = face;
    pending = null;
    highlight = null;
    ripples = [];
    sparks = [];
    flushPickups();
    cancelHit();
    updateCamera();
  }

  function enterMine() {
    applyScene("mine");
    placePlayer(12, 12, "up");
  }

  function exitMine() {
    applyScene("overworld");
    placePlayer(37, 7, "down");
  }

  function arrive() {
    if (isEntrance(player.tx, player.ty)) {
      pending = null;
      enterMine();
      return;
    }
    if (isExit(player.tx, player.ty)) {
      pending = null;
      exitMine();
      return;
    }
    if (!pending) return;
    var act = pending;
    pending = null;
    if (act.type === "plant") {
      if (isNear(player.tx, player.ty, act.tx, act.ty)) {
        plantAt(act.tx, act.ty);
        faceToward(player, act.tx, act.ty);
      }
    } else if (act.type === "talk") {
      if (isNear(player.tx, player.ty, npc.tx, npc.ty)) {
        faceToward(player, npc.tx, npc.ty);
        faceToward(npc, player.tx, player.ty);
        dialogue = true;
      }
    } else if (act.type === "enter") {
      enterMine();
    } else if (act.type === "exit") {
      exitMine();
    } else if (act.type === "harvest") {
      if (isHarvestable(act.prop) && isNear(player.tx, player.ty, act.prop.tx, act.prop.ty)) {
        beginHit(act.prop);
      }
    } else if (act.type === "build") {
      if (isNear(player.tx, player.ty, act.tx, act.ty) || (player.tx === act.tx && player.ty === act.ty)) {
        faceToward(player, act.tx, act.ty);
        tryBuild(act.tx, act.ty);
      }
    }
  }

  function goTalk() {
    if (currentScene !== "overworld") return;
    highlight = { tx: npc.tx, ty: npc.ty };
    if (isNear(player.tx, player.ty, npc.tx, npc.ty)) {
      pending = null;
      startWalk(player, [], 3.5);
      faceToward(player, npc.tx, npc.ty);
      faceToward(npc, player.tx, player.ty);
      dialogue = true;
      return;
    }
    var dest = nearestAdjacent(npc.tx, npc.ty);
    if (!dest) return;
    pending = { type: "talk" };
    startWalk(player, findPath(player.tx, player.ty, dest.tx, dest.ty), 3.5);
  }

  function goPlant(tx, ty) {
    if (isNear(player.tx, player.ty, tx, ty)) {
      pending = null;
      plantAt(tx, ty);
      faceToward(player, tx, ty);
      return;
    }
    var dest = walkable(tx, ty) ? { tx: tx, ty: ty } : nearestAdjacent(tx, ty);
    if (!dest) return;
    var path = findPath(player.tx, player.ty, dest.tx, dest.ty);
    if (!path.length) return;
    pending = { type: "plant", tx: tx, ty: ty };
    startWalk(player, path, 3.5);
  }

  function goWalk(tx, ty) {
    pending = null;
    if (!walkable(tx, ty)) return;
    startWalk(player, findPath(player.tx, player.ty, tx, ty), 3.5);
  }

  function goEnter() {
    highlight = { tx: portalIn.tx, ty: portalIn.ty };
    if (player.tx === portalIn.tx && player.ty === portalIn.ty) {
      enterMine();
      return;
    }
    var path = findPath(player.tx, player.ty, portalIn.tx, portalIn.ty);
    if (!path.length) return;
    pending = { type: "enter" };
    startWalk(player, path, 3.5);
  }

  function goExit() {
    highlight = { tx: portalOut.tx, ty: portalOut.ty };
    if (player.tx === portalOut.tx && player.ty === portalOut.ty) {
      exitMine();
      return;
    }
    var path = findPath(player.tx, player.ty, portalOut.tx, portalOut.ty);
    if (!path.length) return;
    pending = { type: "exit" };
    startWalk(player, path, 3.5);
  }

  function goHarvest(prop) {
    if (!isHarvestable(prop)) return;
    highlight = { tx: prop.tx, ty: prop.ty };
    if (isNear(player.tx, player.ty, prop.tx, prop.ty)) {
      pending = null;
      startWalk(player, [], 3.5);
      beginHit(prop);
      return;
    }
    var dest = nearestAdjacent(prop.tx, prop.ty);
    if (!dest) return;
    var path = findPath(player.tx, player.ty, dest.tx, dest.ty);
    if (!path.length) return;
    pending = { type: "harvest", prop: prop };
    startWalk(player, path, 3.5);
  }

  function goBuild(tx, ty) {
    var placingFence = selectedSlot === SLOT_WOOD;
    var ghost = placingFence ? fenceKindFor(tx, ty) : "path";
    highlight = { tx: tx, ty: ty, ghost: ghost };
    if (!canBuildOn(tx, ty)) return;
    if (placingFence && player.tx === tx && player.ty === ty) return;
    if (placingFence && inventory.wood < FENCE_COST) {
      slotShake = 220;
      return;
    }
    if (!placingFence && inventory.stone < PATH_COST) {
      slotShake = 220;
      return;
    }
    if (placingFence) {
      if (isNear(player.tx, player.ty, tx, ty)) {
        pending = null;
        faceToward(player, tx, ty);
        tryBuild(tx, ty);
        return;
      }
      var dest = nearestAdjacent(tx, ty);
      if (!dest) return;
      var path = findPath(player.tx, player.ty, dest.tx, dest.ty);
      if (!path.length) return;
      pending = { type: "build", tx: tx, ty: ty };
      startWalk(player, path, 3.5);
      return;
    }
    if (player.tx === tx && player.ty === ty) {
      pending = null;
      tryBuild(tx, ty);
      return;
    }
    var pathOn = findPath(player.tx, player.ty, tx, ty);
    if (!pathOn.length) return;
    pending = { type: "build", tx: tx, ty: ty };
    startWalk(player, pathOn, 3.5);
  }

  function updateChicken(dt) {
    if (currentScene !== "overworld") return;
    if (chicken.react > 0) chicken.react -= dt;
    chicken.anim += dt;
    if (chicken.anim > 280) {
      chicken.anim = 0;
      chicken.frame = chicken.frame ? 0 : 1;
    }
    if (chicken.path && chicken.path.length) {
      advanceWalk(chicken, dt);
      return;
    }
    chicken.idle -= dt;
    if (chicken.idle > 0) return;
    chicken.idle = 900 + Math.random() * 2200;
    var dirs = [[0, -1], [0, 1], [-1, 0], [1, 0]];
    var tries, d, nx, ny;
    for (tries = 0; tries < 8; tries++) {
      d = dirs[(Math.random() * 4) | 0];
      nx = chicken.tx + d[0];
      ny = chicken.ty + d[1];
      if (chickenOk(nx, ny)) {
        startWalk(chicken, [{ tx: nx, ty: ny }], 1.3);
        return;
      }
    }
  }

  function drawShadow(g, x, y, hw) {
    var ix = Math.round(x);
    var iy = Math.round(y);
    fill(g, ix - hw, iy - 2, hw * 2, 3, "rgba(30,90,18,0.40)");
    fill(g, ix - hw + 2, iy - 3, hw * 2 - 4, 1, "rgba(30,90,18,0.22)");
  }

  function drawPlayer(g) {
    var bob = (player.moving && player.frame) ? -1 : 0;
    var sx = 0, sy = 0, amp;
    if (player.swing > 0) {
      amp = Math.round(Math.sin((1 - player.swing / 220) * Math.PI) * 3);
      if (player.face === "left") sx = -amp;
      else if (player.face === "right") sx = amp;
      else if (player.face === "up") sy = -amp;
      else sy = amp;
      bob -= 1;
    }
    drawShadow(g, player.x, player.y, 5);
    Assets.draw(g, "player-" + player.face, player.x + sx, player.y + bob + sy, player.frame);
  }

  function drawNpc(g) {
    var face = npc.face || "down";
    if (!Assets.spr["npc-" + face]) face = "down";
    drawShadow(g, npc.x, npc.y, 5);
    Assets.draw(g, "npc-" + face, npc.x, npc.y, 0);
  }

  function drawChickenSpr(g) {
    var bob = chicken.frame ? -1 : 0;
    var hop = chicken.react > 0 ? -3 : 0;
    var face = chicken.face === "left" ? "left" : "right";
    drawShadow(g, chicken.x, chicken.y, 4);
    Assets.draw(g, "chicken-" + face, chicken.x, chicken.y + bob + hop, chicken.frame);
  }

  function propFoot(p) {
    if (p.kind === "house") return p.ty * TILE + 64;
    if (p.kind === "tree") return p.ty * TILE + 24;
    if (p.kind === "well") return p.ty * TILE + 28;
    if (p.kind === "mailbox") return p.ty * TILE + 20;
    if (p.kind === "pond") return p.ty * TILE + 20;
    if (p.kind === "crate" || p.kind === "stump") return p.ty * TILE + 14;
    if (p.kind === "cave") return p.ty * TILE + 32;
    if (p.kind === "lantern") return p.ty * TILE + 20;
    if (p.kind === "ladder") return p.ty * TILE + 20;
    return p.ty * TILE + TILE;
  }

  function propBounds(p) {
    if (p.kind === "house") return { x: p.tx * TILE, y: p.ty * TILE - 16, w: 80, h: 80 };
    if (p.kind === "tree") return { x: p.tx * TILE - 16, y: p.ty * TILE - 48, w: 48, h: 64 };
    if (p.kind === "cave") return { x: p.tx * TILE, y: p.ty * TILE - 16, w: 64, h: 48 };
    if (p.kind === "pond") return { x: p.tx * TILE - 2, y: p.ty * TILE, w: 36, h: 32 };
    if (p.kind === "well") return { x: p.tx * TILE, y: p.ty * TILE - 16, w: 16, h: 32 };
    if (p.kind === "mailbox" || p.kind === "lantern" || p.kind === "ladder") {
      return { x: p.tx * TILE, y: p.ty * TILE - 8, w: 16, h: 24 };
    }
    return { x: p.tx * TILE, y: p.ty * TILE, w: 16, h: 16 };
  }

  function onScreen(b) {
    return b.x + b.w > camX - 8 && b.x < camX + VIEW_W + 8 &&
      b.y + b.h > camY - 8 && b.y < camY + VIEW_H + 8;
  }

  function drawProp(g, p) {
    var x = p.tx * TILE;
    var y = p.ty * TILE;
    if (p.shake > 0) {
      x += ((tick / 40) | 0) % 2 ? 1 : -1;
    }
    if (p.kind === "house") {
      Assets.draw(g, "house", x, y);
    } else if (p.kind === "tree") {
      Assets.draw(g, "tree", x, y);
    } else if (p.kind === "stump") {
      Assets.draw(g, "stump", x, y);
    } else if (p.kind === "well") {
      Assets.draw(g, "well", x, y);
    } else if (p.kind === "mailbox") {
      Assets.draw(g, "mailbox", x, y);
    } else if (p.kind === "crate") {
      Assets.draw(g, "crate", x, y);
    } else if (p.kind === "pond") {
      Assets.draw(g, "pond", x, y);
      if (((tick / 700) | 0) % 2) {
        px(g, x + 18, y + 11, C.waterFm);
        px(g, x + 10, y + 19, C.waterFm);
      }
    } else if (p.kind === "rock") {
      Assets.draw(g, "rock" + ((p.tx + p.ty) & 1), x, y);
    } else if (p.kind === "weed") {
      Assets.draw(g, "weed" + ((p.tx + p.ty) & 1), x, y);
    } else if (p.kind === "fenceH") {
      Assets.draw(g, "fenceH", x, y);
    } else if (p.kind === "fenceL") {
      Assets.draw(g, "fenceL", x, y);
    } else if (p.kind === "fenceR") {
      Assets.draw(g, "fenceR", x, y);
    } else if (p.kind === "cave") {
      Assets.draw(g, "cave", x, y);
    } else if (p.kind === "lantern") {
      var flicker = ((tick / 200) | 0) % 2;
      g.fillStyle = flicker ? "rgba(240,192,96,0.18)" : "rgba(240,192,96,0.10)";
      g.fillRect(x - 12, y - 16, 40, 40);
      Assets.draw(g, "lantern", x, y);
    } else if (p.kind === "ladder") {
      Assets.draw(g, "ladder", x, y);
    }
  }

  function drawActors(g) {
    var list = [];
    var i, p, b;
    for (i = 0; i < PROPS.length; i++) {
      p = PROPS[i];
      b = propBounds(p);
      if (onScreen(b)) list.push({ foot: propFoot(p), kind: "prop", p: p });
    }
    list.push({ foot: player.y, kind: "player" });
    if (currentScene === "overworld") {
      list.push({ foot: chicken.y, kind: "chicken" });
      list.push({ foot: npc.y, kind: "npc" });
    }
    list.sort(function (a, b) { return a.foot - b.foot; });
    for (i = 0; i < list.length; i++) {
      if (list[i].kind === "prop") drawProp(g, list[i].p);
      else if (list[i].kind === "player") drawPlayer(g);
      else if (list[i].kind === "chicken") drawChickenSpr(g);
      else drawNpc(g);
    }
  }

  function drawPickups(g) {
    var i, pk, id;
    for (i = 0; i < pickups.length; i++) {
      pk = pickups[i];
      id = pk.kind === "wood" ? "wood" : "stoneItem";
      Assets.draw(g, id, Math.round(pk.x - 8), Math.round(pk.y - 8));
    }
  }

  function drawSparks(g) {
    var i, sp, life;
    for (i = 0; i < sparks.length; i++) {
      sp = sparks[i];
      life = 1 - sp.age / sp.life;
      if (life <= 0) continue;
      g.fillStyle = sp.col;
      g.fillRect(Math.round(sp.x), Math.round(sp.y), 1, 1);
      if (life > 0.45) g.fillRect(Math.round(sp.x) + 1, Math.round(sp.y) - 1, 1, 1);
    }
  }

  function drawDialogue(g) {
    if (!dialogue) return;
    var x = 16, y = 116, w = 288, h = 50;
    woodPanel(g, x, y, w, h);
    fill(g, x + 4, y + 4, w - 8, h - 8, C.parch);
    woodPanel(g, x + 8, y - 6, 62, 11);
    drawText(g, "NEIGHBOR", x + 12, y - 3, C.parch);
    drawText(g, "HI! WELCOME TO", x + 10, y + 12, C.uiText);
    drawText(g, "MOONDROP MOUNTAIN.", x + 10, y + 22, C.uiText);
  }

  function hitSprite(p, x, y, w, h, ox, oy) {
    var left = x - ox;
    var top = y - oy;
    return p.x >= left && p.x < left + w && p.y >= top && p.y < top + h;
  }

  function drawText(g, str, x, y, color) {
    g.fillStyle = color;
    var i, r, c, bits, ch;
    for (i = 0; i < str.length; i++) {
      ch = str.charAt(i);
      bits = FONT[ch] || FONT[" "];
      for (r = 0; r < 7; r++) {
        for (c = 0; c < 5; c++) {
          if (bits[r] & (0x10 >> c)) {
            g.fillRect(x + i * 6 + c, y + r, 1, 1);
          }
        }
      }
    }
  }

  function textWidth(str) {
    return str.length * 6 - 1;
  }

  function woodPanel(g, x, y, w, h) {
    fill(g, x, y, w, h, C.woodMid);
    fill(g, x, y, w, 1, C.woodHi);
    fill(g, x, y, 1, h, C.woodHi);
    fill(g, x, y + h - 1, w, 1, C.bevelDk);
    fill(g, x + w - 1, y, 1, h, C.bevelDk);
    fill(g, x + 1, y + 1, w - 2, 1, C.woodHi);
    fill(g, x + 1, y + h - 2, w - 2, 1, C.woodSh);
  }

  function grassIndex(tx, ty) {
    return ((tx * 3 + ty * 7) >>> 0) % 4;
  }

  function drawDirtTile(g, tx, ty, dx, dy) {
    Assets.draw(g, "dirt", dx, dy);
    var n = isSoft(cell(tx, ty - 1));
    var s = isSoft(cell(tx, ty + 1));
    var e = isSoft(cell(tx + 1, ty));
    var w = isSoft(cell(tx - 1, ty));
    var i, ox, col;
    if (n) {
      for (i = 0; i < 16; i++) {
        ox = (hash(tx, ty, i + 40) < 0.45) ? 2 : 1;
        col = hash(tx, i, 2) < 0.5 ? C.grassMid : C.grassHi;
        fill(g, dx + i, dy, 1, ox, col);
        if (hash(tx, ty, i) < 0.25) px(g, dx + i, dy + ox, C.grassSh);
      }
    }
    if (s) {
      for (i = 0; i < 16; i++) {
        ox = (hash(tx, ty, i + 80) < 0.4) ? 2 : 1;
        col = hash(tx, i, 5) < 0.5 ? C.grassMid : C.grassSh;
        fill(g, dx + i, dy + 16 - ox, 1, ox, col);
      }
    }
    if (w) {
      for (i = 0; i < 16; i++) {
        ox = (hash(tx, ty, i + 120) < 0.4) ? 2 : 1;
        col = hash(ty, i, 3) < 0.5 ? C.grassMid : C.grassHi;
        fill(g, dx, dy + i, ox, 1, col);
      }
    }
    if (e) {
      for (i = 0; i < 16; i++) {
        ox = (hash(tx, ty, i + 160) < 0.4) ? 2 : 1;
        col = hash(ty, i, 8) < 0.5 ? C.grassMid : C.grassSh;
        fill(g, dx + 16 - ox, dy + i, ox, 1, col);
      }
    }
  }

  function strokeCircle(g, cx, cy, r, color) {
    g.fillStyle = color;
    var a, x, y;
    for (a = 0; a < 360; a += 10) {
      x = Math.round(cx + Math.cos(a * Math.PI / 180) * r);
      y = Math.round(cy + Math.sin(a * Math.PI / 180) * r);
      g.fillRect(x, y, 1, 1);
    }
  }

  function drawHUD(g) {
    woodPanel(g, 4, 4, 114, 13);
    drawText(g, "MOONDROP MOUNTAIN", 8, 7, C.parch);

    woodPanel(g, 206, 4, 110, 21);
    fill(g, 210, 8, 7, 7, C.flower);
    fill(g, 212, 10, 3, 3, C.parch);
    px(g, 209, 11, C.flower);
    px(g, 217, 11, C.flower);
    px(g, 213, 7, C.flower);
    drawText(g, "DAY 1", 220, 8, C.uiText);
    drawText(g, currentScene === "mine" ? "SPRING · MINE" : "SPRING · MORNING", 210, 16, C.parch);

    var slots = 10;
    var slot = 18;
    var gap = 1;
    var barW = slots * slot + (slots - 1) * gap;
    var bx = ((VIEW_W - barW) / 2) | 0;
    var by = VIEW_H - 22;
    woodPanel(g, bx - 3, by - 3, barW + 6, 24);
    var i, sx, sy, sel, count, label, shakeX;
    for (i = 0; i < slots; i++) {
      sx = bx + i * (slot + gap);
      sy = by;
      shakeX = 0;
      if (slotShake > 0 && (i === SLOT_WOOD || i === SLOT_STONE) && i === selectedSlot) {
        shakeX = ((tick / 40) | 0) % 2 ? 1 : -1;
      }
      sx += shakeX;
      sel = i === selectedSlot;
      fill(g, sx, sy, slot, slot, sel ? C.woodHi : C.woodSh);
      fill(g, sx + 1, sy + 1, slot - 2, slot - 2, C.slot);
      fill(g, sx + 2, sy + 2, slot - 4, slot - 4, sel ? "#6A4420" : "#5A3818");
      if (sel) {
        fill(g, sx, sy, slot, 1, C.parch);
        fill(g, sx, sy, 1, slot, C.parch);
      }
      if (i === SLOT_SEED) {
        Assets.draw(g, "seed", sx + 1, sy + 1);
      } else if (i === SLOT_WOOD) {
        Assets.draw(g, "wood", sx + 1, sy + 1);
        count = inventory.wood;
      } else if (i === SLOT_STONE) {
        Assets.draw(g, "stoneItem", sx + 1, sy + 1);
        count = inventory.stone;
      } else {
        count = -1;
      }
      if (count >= 0) {
        if (count > 99) count = 99;
        label = String(count);
        drawText(g, label, sx + slot - textWidth(label) - 2, sy + slot - 9, C.woodOut);
        drawText(g, label, sx + slot - textWidth(label) - 3, sy + slot - 10, C.parch);
      }
    }

    var ex = VIEW_W - 16;
    var ey = VIEW_H - 70;
    woodPanel(g, ex - 2, ey - 10, 14, 56);
    drawText(g, "E", ex + 2, ey - 8, C.parch);
    fill(g, ex + 1, ey + 2, 8, 40, C.energyEmpty);
    fill(g, ex + 1, ey + 2, 8, 40, C.energy);
    fill(g, ex + 1, ey + 2, 8, 1, C.grassHi);
    fill(g, ex + 1, ey + 2, 1, 40, C.grassHi);
  }

  function drawWorld(g, dt) {
    updateCamera();
    g.fillStyle = currentScene === "mine" ? (C.caveDark || "#14110E") : C.grassMid;
    g.fillRect(0, 0, VIEW_W, VIEW_H);
    g.save();
    g.translate(-camX, -camY);

    var x0 = Math.max(0, (camX / TILE) | 0);
    var y0 = Math.max(0, (camY / TILE) | 0);
    var x1 = Math.min(COLS, ((camX + VIEW_W) / TILE | 0) + 2);
    var y1 = Math.min(ROWS, ((camY + VIEW_H) / TILE | 0) + 2);
    var tx, ty, ch, dx, dy;

    for (ty = y0; ty < y1; ty++) {
      for (tx = x0; tx < x1; tx++) {
        ch = cell(tx, ty);
        dx = tx * TILE;
        dy = ty * TILE;
        if (ch === "d") drawDirtTile(g, tx, ty, dx, dy);
        else if (ch === "p") {
          Assets.draw(g, "till", dx, dy);
          if (crops[tx + "," + ty]) Assets.draw(g, "sprout", dx, dy);
        } else if (ch === "s") {
          Assets.draw(g, "stone" + ((tx + ty) & 1), dx, dy);
        } else if (ch === "h") {
          Assets.draw(g, "hill", dx, dy);
        } else if (ch === "k") {
          Assets.draw(g, "path", dx, dy);
        } else if (ch === "#") {
          Assets.draw(g, "wall", dx, dy);
        } else {
          Assets.draw(g, "grass" + grassIndex(tx, ty), dx, dy);
        }
      }
    }

    if (highlight) {
      if (highlight.ghost && Assets.spr[highlight.ghost]) {
        g.globalAlpha = 0.4;
        Assets.draw(g, highlight.ghost, highlight.tx * TILE, highlight.ty * TILE);
        g.globalAlpha = 1;
      }
      g.fillStyle = highlight.ghost ? "rgba(107,203,60,0.28)" : "rgba(243,210,163,0.32)";
      g.fillRect(highlight.tx * TILE, highlight.ty * TILE, TILE, TILE);
      g.fillStyle = highlight.ghost ? "rgba(107,203,60,0.75)" : "rgba(243,210,163,0.7)";
      g.fillRect(highlight.tx * TILE, highlight.ty * TILE, TILE, 1);
      g.fillRect(highlight.tx * TILE, highlight.ty * TILE, 1, TILE);
      g.fillRect(highlight.tx * TILE, highlight.ty * TILE + 15, TILE, 1);
      g.fillRect(highlight.tx * TILE + 15, highlight.ty * TILE, 1, TILE);
    }

    var i, rp, life, r, alpha;
    for (i = ripples.length - 1; i >= 0; i--) {
      rp = ripples[i];
      rp.age += dt;
      life = rp.age / 520;
      if (life >= 1) {
        ripples.splice(i, 1);
        continue;
      }
      r = 2 + life * 16;
      alpha = 1 - life;
      strokeCircle(g, rp.x, rp.y, r, "rgba(243,210,163," + (alpha * 0.85).toFixed(2) + ")");
      if (r > 5) {
        strokeCircle(g, rp.x, rp.y, r - 3, "rgba(232,176,96," + (alpha * 0.45).toFixed(2) + ")");
      }
    }

    drawActors(g);
    drawPickups(g);
    drawSparks(g);
    g.restore();
    drawHUD(g);
    drawDialogue(g);
  }

  function readInset(name) {
    var v = getComputedStyle(document.documentElement).getPropertyValue(name);
    return parseFloat(v) || 0;
  }

  function viewSize() {
    var vv = window.visualViewport;
    var w = (vv && vv.width) ? vv.width : window.innerWidth;
    var h = (vv && vv.height) ? vv.height : window.innerHeight;
    if (!fillMode) return { w: w, h: h };
    var sat = readInset("--sat");
    var sab = readInset("--sab");
    var sal = readInset("--sal");
    var sar = readInset("--sar");
    var top = vv ? vv.offsetTop : 0;
    var left = vv ? vv.offsetLeft : 0;
    var cutT = Math.max(0, sat - top);
    var cutL = Math.max(0, sal - left);
    var cutB = Math.max(0, (top + h) - (window.innerHeight - sab));
    var cutR = Math.max(0, (left + w) - (window.innerWidth - sar));
    return { w: Math.max(1, w - cutL - cutR), h: Math.max(1, h - cutT - cutB) };
  }

  function isStandalone() {
    if (window.navigator.standalone === true) return true;
    try {
      if (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) return true;
      if (window.matchMedia && window.matchMedia("(display-mode: fullscreen)").matches) return true;
    } catch (err) {}
    return false;
  }

  function fsEnabled() {
    return !!(document.fullscreenEnabled || document.webkitFullscreenEnabled);
  }

  function fsElement() {
    return document.fullscreenElement || document.webkitFullscreenElement || null;
  }

  function requestFs() {
    var els = [frame, document.documentElement];
    function tryAt(i) {
      if (i >= els.length) return;
      var el = els[i];
      if (!el) { tryAt(i + 1); return; }
      var fn = el.requestFullscreen || el.webkitRequestFullscreen || el.webkitRequestFullScreen;
      if (!fn) { tryAt(i + 1); return; }
      try {
        var p = fn.call(el);
        if (p && typeof p.catch === "function") p.catch(function () { tryAt(i + 1); });
      } catch (err) {
        tryAt(i + 1);
      }
    }
    tryAt(0);
  }

  function exitNativeFs() {
    if (!fsElement()) return;
    var fn = document.exitFullscreen || document.webkitExitFullscreen || document.webkitCancelFullScreen;
    if (!fn) return;
    try {
      var p = fn.call(document);
      if (p && typeof p.catch === "function") p.catch(function () {});
    } catch (err) {}
  }

  function paintFsFace() {
    if (!fsFace) return;
    var g = fsFace.getContext("2d");
    var label = fillMode ? "EXIT" : "FULL";
    fsFace.width = 32;
    fsFace.height = 13;
    g.imageSmoothingEnabled = false;
    woodPanel(g, 0, 0, 32, 13);
    drawText(g, label, 5, 3, C.parch);
    if (fsBtn) fsBtn.setAttribute("aria-label", fillMode ? "Exit Full Screen" : "Full Screen");
  }

  function hideSafariChrome() {
    try {
      document.documentElement.style.minHeight = "calc(100% + 2px)";
      window.scrollTo(0, 0);
      setTimeout(function () {
        window.scrollTo(0, 1);
        resize();
      }, 50);
      setTimeout(function () {
        window.scrollTo(0, 0);
        resize();
      }, 280);
    } catch (err) {}
  }

  function enterFill() {
    fillMode = true;
    document.documentElement.classList.add("fill-on");
    document.body.classList.add("fill-on");
    paintFsFace();
    resize();
  }

  function leaveFill() {
    fillMode = false;
    document.documentElement.classList.remove("fill-on");
    document.body.classList.remove("fill-on");
    document.documentElement.style.minHeight = "";
    paintFsFace();
    resize();
    exitNativeFs();
  }

  function enterFull() {
    if (fsEnabled()) requestFs();
    enterFill();
    hideSafariChrome();
  }

  function onFsChange() {
    if (fsElement()) {
      if (!fillMode) enterFill();
      else resize();
    } else if (fillMode) {
      leaveFill();
    }
  }

  function pinFrame() {
    if (!frame) return;
    var vv = window.visualViewport;
    if (fillMode && vv && !fsElement()) {
      frame.style.top = vv.offsetTop + "px";
      frame.style.left = vv.offsetLeft + "px";
      frame.style.width = vv.width + "px";
      frame.style.height = vv.height + "px";
      frame.style.right = "auto";
      frame.style.bottom = "auto";
    } else {
      frame.style.top = "";
      frame.style.left = "";
      frame.style.width = "";
      frame.style.height = "";
      frame.style.right = "";
      frame.style.bottom = "";
    }
  }

  function resize() {
    pinFrame();
    var vs = viewSize();
    var w = vs.w;
    var h = vs.h;
    if (fillMode) {
      scale = Math.min(w / VIEW_W, h / VIEW_H);
      if (scale < 0.5) scale = 0.5;
    } else {
      scale = Math.floor(Math.min(w / VIEW_W, h / VIEW_H));
      if (scale < 1) scale = 1;
      if (scale > 6) scale = 6;
    }
    canvas.style.width = (VIEW_W * scale) + "px";
    canvas.style.height = (VIEW_H * scale) + "px";
    ctx.imageSmoothingEnabled = false;
  }

  function pointFromEvent(e) {
    var src = e;
    if (e.changedTouches && e.changedTouches[0]) src = e.changedTouches[0];
    else if (e.touches && e.touches[0]) src = e.touches[0];
    var rect = canvas.getBoundingClientRect();
    return {
      x: (src.clientX - rect.left) / rect.width * VIEW_W,
      y: (src.clientY - rect.top) / rect.height * VIEW_H
    };
  }

  function tapHud(p) {
    var slots = 10;
    var slot = 18;
    var gap = 1;
    var barW = slots * slot + (slots - 1) * gap;
    var bx = ((VIEW_W - barW) / 2) | 0;
    var by = VIEW_H - 22;
    if (p.y >= by - 3 && p.y <= by + 18 && p.x >= bx && p.x <= bx + barW) {
      var idx = ((p.x - bx) / (slot + gap)) | 0;
      if (idx >= 0 && idx < slots) selectedSlot = idx;
      return true;
    }
    if (p.x >= 4 && p.x <= 118 && p.y >= 4 && p.y <= 17) return true;
    if (p.x >= 206 && p.x <= 316 && p.y >= 4 && p.y <= 25) return true;
    if (p.x >= VIEW_W - 18 && p.x <= VIEW_W - 2 && p.y >= VIEW_H - 80 && p.y <= VIEW_H - 14) return true;
    return false;
  }

  function tap(e) {
    var p = pointFromEvent(e);
    if (p.x < 0 || p.y < 0 || p.x >= VIEW_W || p.y >= VIEW_H) return;

    if (dialogue) {
      dialogue = false;
      return;
    }

    if (tapHud(p)) return;

    var world = { x: p.x + camX, y: p.y + camY };
    var tx = Math.floor(world.x / TILE);
    var ty = Math.floor(world.y / TILE);
    var harvest = harvestableAtPoint(world.x, world.y);
    if (!harvest && inBounds(tx, ty)) harvest = harvestableAtTile(tx, ty);
    if (player.hitting && harvest && player.hitting.prop === harvest) return;
    cancelHit();

    if (currentScene === "overworld") {
      if (hitSprite(world, npc.x, npc.y, 16, 32, 8, 28)) {
        goTalk();
        return;
      }
      if (hitSprite(world, chicken.x, chicken.y, 16, 16, 8, 14)) {
        chicken.react = 420;
        chicken.idle = 500;
        return;
      }
    }

    if (tx < 0 || ty < 0 || tx >= COLS || ty >= ROWS) return;
    highlight = { tx: tx, ty: ty };
    ripples.push({
      x: tx * TILE + 8,
      y: ty * TILE + 8,
      age: 0
    });
    if (currentScene === "overworld" && tx === npc.tx && ty === npc.ty) {
      goTalk();
      return;
    }
    if (currentScene === "overworld" && tx === chicken.tx && ty === chicken.ty) {
      chicken.react = 420;
      chicken.idle = 500;
      return;
    }
    if (isEntrance(tx, ty) || caveAt(tx, ty)) {
      goEnter();
      return;
    }
    if (isExit(tx, ty)) {
      goExit();
      return;
    }
    if (harvest) {
      goHarvest(harvest);
      return;
    }
    if (selectedSlot === SLOT_SEED && cell(tx, ty) === "p" && !crops[tx + "," + ty]) {
      goPlant(tx, ty);
      return;
    }
    if ((selectedSlot === SLOT_WOOD || selectedSlot === SLOT_STONE) && canBuildOn(tx, ty)) {
      goBuild(tx, ty);
      return;
    }
    if ((selectedSlot === SLOT_WOOD || selectedSlot === SLOT_STONE) && currentScene === "overworld") {
      highlight = { tx: tx, ty: ty };
      slotShake = 180;
      return;
    }
    goWalk(tx, ty);
  }

  function loop(ts) {
    if (!lastTs) lastTs = ts;
    var dt = ts - lastTs;
    if (dt > 64) dt = 64;
    lastTs = ts;
    ctx.imageSmoothingEnabled = false;
    if (!dialogue) {
      if (player.hitting) {
        updateHit(dt);
      } else if (player.moving || (player.path && player.path.length)) {
        if (advanceWalk(player, dt)) arrive();
      } else if (player.swing > 0) {
        player.swing -= dt;
      }
      updateChicken(dt);
      updatePickups(dt);
      updateFx(dt);
      tick += dt;
    }
    drawWorld(ctx, dt);
    requestAnimationFrame(loop);
  }

  function paintLoading() {
    ctx.imageSmoothingEnabled = false;
    ctx.fillStyle = C.grassMid;
    ctx.fillRect(0, 0, VIEW_W, VIEW_H);
    woodPanel(ctx, 86, 86, 148, 20);
    drawText(ctx, "LOADING FARM", 96, 92, C.parch);
  }

  function paintMissing() {
    ctx.imageSmoothingEnabled = false;
    ctx.fillStyle = C.letterbox;
    ctx.fillRect(0, 0, VIEW_W, VIEW_H);
    drawText(ctx, "ART MISSING", 8, 8, C.parch);
  }

  paintLoading();
  applyScene("overworld");
  updateCamera();
  paintFsFace();
  if (isStandalone()) enterFill();
  else resize();
  window.addEventListener("resize", resize);
  if (window.visualViewport) {
    window.visualViewport.addEventListener("resize", resize);
    window.visualViewport.addEventListener("scroll", resize);
  }
  document.addEventListener("fullscreenchange", onFsChange);
  document.addEventListener("webkitfullscreenchange", onFsChange);
  if (fsBtn) {
    fsBtn.addEventListener("pointerdown", function (e) {
      e.preventDefault();
      e.stopPropagation();
      if (fillMode) leaveFill();
      else enterFull();
    });
    fsBtn.addEventListener("click", function (e) {
      e.preventDefault();
      e.stopPropagation();
    });
  }
  document.addEventListener("keydown", function (e) {
    if ((e.key === "Escape" || e.key === "Esc") && fillMode) {
      e.preventDefault();
      leaveFill();
    }
  });
  document.addEventListener("touchstart", function (e) {
    if (!fillMode || !e.touches || !e.touches[0]) return;
    swipeStartY = e.touches[0].clientY < 56 ? e.touches[0].clientY : null;
  }, { passive: true });
  document.addEventListener("touchend", function (e) {
    if (swipeStartY == null || !e.changedTouches || !e.changedTouches[0]) return;
    var dy = e.changedTouches[0].clientY - swipeStartY;
    swipeStartY = null;
    if (dy > 70) leaveFill();
  }, { passive: true });
  canvas.addEventListener("pointerdown", tap, { passive: true });
  document.addEventListener("touchmove", function (e) {
    e.preventDefault();
  }, { passive: false });
  document.addEventListener("gesturestart", function (e) {
    e.preventDefault();
  });
  document.addEventListener("dblclick", function (e) {
    e.preventDefault();
  });
  Assets.load().then(function () {
    requestAnimationFrame(loop);
  }).catch(function () {
    paintMissing();
  });
})();
  </script>
</body>
</html>
