  function readInset(name) {
    var v = getComputedStyle(document.documentElement).getPropertyValue(name);
    return parseFloat(v) || 0;
  }

  function viewSize() {
    var vv = window.visualViewport;
    var w = (vv && vv.width) ? vv.width : window.innerWidth;
    var h = (vv && vv.height) ? vv.height : window.innerHeight;
    if (!fillMode) return { w: w, h: h };
    var sat = readInset("--sat");
    var sab = readInset("--sab");
    var sal = readInset("--sal");
    var sar = readInset("--sar");
    var top = vv ? vv.offsetTop : 0;
    var left = vv ? vv.offsetLeft : 0;
    var cutT = Math.max(0, sat - top);
    var cutL = Math.max(0, sal - left);
    var cutB = Math.max(0, (top + h) - (window.innerHeight - sab));
    var cutR = Math.max(0, (left + w) - (window.innerWidth - sar));
    return { w: Math.max(1, w - cutL - cutR), h: Math.max(1, h - cutT - cutB) };
  }

  function isStandalone() {
    if (window.navigator.standalone === true) return true;
    try {
      if (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) return true;
      if (window.matchMedia && window.matchMedia("(display-mode: fullscreen)").matches) return true;
    } catch (err) {}
    return false;
  }

  function fsEnabled() {
    return !!(document.fullscreenEnabled || document.webkitFullscreenEnabled);
  }

  function fsElement() {
    return document.fullscreenElement || document.webkitFullscreenElement || null;
  }

  function requestFs() {
    var els = [frame, document.documentElement];
    function tryAt(i) {
      if (i >= els.length) return;
      var el = els[i];
      if (!el) { tryAt(i + 1); return; }
      var fn = el.requestFullscreen || el.webkitRequestFullscreen || el.webkitRequestFullScreen;
      if (!fn) { tryAt(i + 1); return; }
      try {
        var p = fn.call(el);
        if (p && typeof p.catch === "function") p.catch(function () { tryAt(i + 1); });
      } catch (err) {
        tryAt(i + 1);
      }
    }
    tryAt(0);
  }

    if (!fsElement()) return;
    var fn = document.exitFullscreen || document.webkitExitFullscreen || document.webkitCancelFullScreen;

      if (p && typeof p.catch === "function") p.catch(function () {});

  }

  function paintWoodHud(face, btn, label, off, ariaOn, ariaOff) {
    var g, fw, fh;
    if (!face) return;
    g = face.getContext("2d");
    fw = 18;
    fh = 11;
    face.width = fw;
    face.height = fh;
    g.imageSmoothingEnabled = false;
    woodPanel(g, 0, 0, fw, fh);
    drawText(g, label, ((fw - textWidth(label)) / 2) | 0, 2, off ? C.woodSh : C.parch);
    if (btn) {
      btn.setAttribute("aria-label", off ? ariaOff : ariaOn);
      if (off) btn.classList.add("is-off");
      else btn.classList.remove("is-off");

    paintWoodHud(musFace, musBtn, "MU", musicMuted, "Music on", "Music off");
    paintFsFace();

  function hideSafariChrome() {
    try {
      document.documentElement.style.minHeight = "calc(100% + 2px)";
      window.scrollTo(0, 0);
      setTimeout(function () {
        window.scrollTo(0, 1);
        resize();
      }, 50);
      setTimeout(function () {
        window.scrollTo(0, 0);
        resize();
      }, 280);
    } catch (err) {}
  }

  function enterFill() {
    fillMode = true;
    document.documentElement.classList.add("fill-on");
    document.body.classList.add("fill-on");
    paintFsFace();
    resize();
  }

  function leaveFill() {
    fillMode = false;
    document.documentElement.classList.remove("fill-on");
    document.body.classList.remove("fill-on");

    resize();
    exitNativeFs();
  }

  function enterFull() {
    if (fsEnabled()) requestFs();

    hideSafariChrome();

  function onFsChange() {

  function pinFrame() {
    if (!frame) return;
    var vv = window.visualViewport;
    if (fillMode && vv && !fsElement()) {
      frame.style.top = vv.offsetTop + "px";
      frame.style.left = vv.offsetLeft + "px";
      frame.style.width = vv.width + "px";
      frame.style.height = vv.height + "px";
      frame.style.right = "auto";
      frame.style.bottom = "auto";
    } else {
      frame.style.top = "";
      frame.style.left = "";
      frame.style.width = "";
      frame.style.height = "";
      frame.style.right = "";
      frame.style.bottom = "";
    }
  }

  function resize() {
    pinFrame();
    var vs = viewSize();
    var w = vs.w;
    var h = vs.h;
    var bw = VIEW_W * BUFFER;
    var bh = VIEW_H * BUFFER;
    if (fillMode) {
      scale = Math.min(w / VIEW_W, h / VIEW_H);
      if (scale < 0.5) scale = 0.5;
    } else {
      scale = Math.floor(Math.min(w / VIEW_W, h / VIEW_H));
      if (scale < 1) scale = 1;
      if (scale > 6) scale = 6;
    }
    if (canvas.width !== bw || canvas.height !== bh) {
      canvas.width = bw;
      canvas.height = bh;
    }
    /* CSS footprint stays logical VIEW_* — not buffer pixels. */
    canvas.style.width = (VIEW_W * scale) + "px";
    canvas.style.height = (VIEW_H * scale) + "px";
    applyDrawBuffer(ctx);

  function pointFromEvent(e) {
    var src = e;
    if (e.changedTouches && e.changedTouches[0]) src = e.changedTouches[0];
    else if (e.touches && e.touches[0]) src = e.touches[0];
    var rect = canvas.getBoundingClientRect();
    return {
      x: (src.clientX - rect.left) / rect.width * VIEW_W,
      y: (src.clientY - rect.top) / rect.height * VIEW_H
    };
  }

  function inHud(p, x, y, w, h, inset) {
    var pad = inset || 0;

  }

  function tapHud(p) {
    var T = trayLayout();
    var idx, key;
    var worldHud = { x: p.x + camX, y: p.y + camY };
    var hudTx = Math.floor(worldHud.x / TILE);
    var hudTy = Math.floor(worldHud.y / TILE);
    /* Sword pad MUST win over OUT / stairs / holes under the button (31t: pad-over-OUT; 31r: MINE 6 UP/PEAK). */
    if (hitSwordBtn(p)) {
      startSwordSwing();
      return true;
    }
    /* Prefer MINE 1 OUT over hotbar when the finger is on the ladder/OUT label (not on round sword pad). */
    if (currentScene === "mine" && mineFloor === 1 && (isMineExit(hudTx, hudTy) || mineExitHit(hudTx, hudTy, worldHud))) {
      return false;
    }
    if (hudWorldDoor(hudTx, hudTy, worldHud)) return false;
    if (hitPad(p.x, p.y, T.bagX, T.bagY, T.bagW, T.bagH, 4)) {
      toggleBag();
      return true;
    }
    if (showFenceBuildBtn()) {
      var br = fenceBuildBtnRect();
      if (inHud(p, br.x, br.y, br.w, br.h, 0)) {
        toggleFenceBuild();
        playSfx("ui");
        return true;
      }
    }
    if (p.y >= T.by && p.y <= T.by + T.slot && p.x >= T.bx && p.x <= T.bx + T.barW) {
      idx = ((p.x - T.bx) / (T.slot + T.gap)) | 0;
      if (idx >= 0 && idx < TRAY_CELLS) {
        if (bagOpen) {
          tapPocket("tray", idx);
          return true;
        }
        pickHotbarSlot(idx);
        playSfx("ui");
        key = selectedKey();
        if (key === "snack") eatSnack();
        if (key === "apple") eatApple();
        if (key === "bread") eatBread();
        if (key === "pie") eatPie();
        if (key === "veggie") eatCarrot();
        if (key === "potato") eatPotato();
        if (key === "berry") eatBerry();
        if (key === "mushroom") eatMushroom();
        if (fishKindById(key)) eatRawFish();
        if (cookedFishKindById(key)) eatCookedFish();
        if (key === "hat" && hatOwned) {
          hatOn = !hatOn;
          persistSave();
        }
      }
      return true;
    }
    /* 20260905cg: hearts/energy + DAY panels are display-only — do not swallow world taps. */
    if (inHud(p, 4, 3, 18, 18, 3)) {
      playSfx("ui");
      if (bagOpen) closeBag();
      achieveOpen = !achieveOpen;
      questOpen = false;
      achieveScroll = 0;
      achieveDrag = null;
      return true;

    if (inHud(p, 24, 3, 18, 18, 3)) {
      playSfx("ui");
      if (bagOpen) closeBag();
      questOpen = !questOpen;
      achieveOpen = false;
      return true;
    }
    return false;
  }

  function tap(e) {

    if (toast) {
      if (toast.ready) {
        dismissUnlock();
        swallowDismissTap();
      }
      return;
    }
    if (dialogue) {
      wasOpen = !!dialogue;
      tapDialogue(p);
      if (wasOpen && !dialogue) swallowDismissTap();
      return;
    }
    if (birdFly || birdRideFx) return;
    if (wipeAsk) {
      wasOpen = true;
      tapWipeAsk(p);
      if (wasOpen && !wipeAsk) swallowDismissTap();
      return;
    }
    if (sleepFx || faintFx) return;
    if (achieveOpen) {
      wasOpen = true;
      L = achieveLayout();
      tapAchieve(p, e);

      ok("mirrorDropRestoresTray", !!(trayCells[2] && trayCells[2].key === "wood" && (trayCells[2].count | 0) === 4), trayCells[2] && trayCells[2].count);
      ok("bagCountAfterRestore", bagCount("wood") === 4, "bagCount=" + bagCount("wood"));
      /* 05x/05be swap: bag silverBar ↔ tray wood — neither vanishes. */
      emptyBag();
      emptyTray();
      trayCells[0] = { key: "wood", count: 2 };
      bagCells[0] = { key: "silverBar", count: 1 };
      bagOpen = true;
      tapPocket("bag", 0);
      tapPocket("tray", 0);
      ok("swapTrayGetsSilver", !!(trayCells[0] && trayCells[0].key === "silverBar" && (trayCells[0].count | 0) === 1), trayCells[0] && trayCells[0].key);
      ok("swapBagGetsWood", !!(bagCells[0] && bagCells[0].key === "wood" && (bagCells[0].count | 0) === 2), bagCells[0] && bagCells[0].key);
      ok("swapNoHeldLeft", !bagHeld, bagHeld && bagHeld.key);
      if (bagOpen) closeBag();
      /* 20260905ca: farm/town kickballs bounce off solids */
      applyScene("overworld");
      buildSolid();
      var farmB = playBallById("farm");
      var townB = playBallById("town");
      ok("playBallFarmHome", !!(farmB && farmB.homeTx === 12 && farmB.homeTy === 32), farmB && (farmB.tx + "," + farmB.ty));
      ok("playBallTownHome", !!(townB && townB.homeTx === 44 && townB.homeTy === 31), townB && (townB.tx + "," + townB.ty));
      if (farmB) {
        parkPlayBall(farmB, 12, 32);
        placePlayer(12, 31, "down");
        kickPlayBall(farmB);
        var kickEnd = farmB.path.length ? farmB.path[farmB.path.length - 1] : { tx: farmB.tx, ty: farmB.ty };
        ok("playBallKickSlides", farmB.path.length > 0 && kickEnd.ty > 32, "n=" + farmB.path.length + " end=" + kickEnd.tx + "," + kickEnd.ty);
        farmB.path = [];
        farmB.moving = false;
        var bx, by, bounceTried = false, lastBounce;
        for (by = 24; by <= 36 && !bounceTried; by++) {
          for (bx = 2; bx <= 22 && !bounceTried; bx++) {
            if (!walkable(bx, by) || walkable(bx, by - 1)) continue;
            parkPlayBall(farmB, bx, by);
            placePlayer(bx, by + 1, "up");
            kickPlayBall(farmB);
            lastBounce = farmB.path.length ? farmB.path[farmB.path.length - 1] : { tx: bx, ty: by };
            ok("playBallBounceWalkable", walkable(lastBounce.tx, lastBounce.ty), lastBounce.tx + "," + lastBounce.ty);
            ok("playBallBounceNotIntoSolid", lastBounce.ty !== by - 1, "end=" + lastBounce.tx + "," + lastBounce.ty);
            bounceTried = true;
          }
        }
        ok("playBallBounceTried", bounceTried);
        parkPlayBall(farmB, 12, 32);
      }
      /* 20260905cf: soft blockers never permanently dead-end far taps. */
      applyScene("overworld");
      buildSolid();
      var junieTx = npc.tx, junieTy = npc.ty;
      /* Use clear farm-yard grass (away from houseIn 17,28 footprint). */
      placePlayer(6, 30, "right");
      npc.tx = 8; npc.ty = 30;
      npc.x = tileCenterX(npc.tx); npc.y = tileFootY(npc.ty);
      buildSolid();
      ok("npcNotHardSolid", walkable(npc.tx, npc.ty), "junie@" + npc.tx + "," + npc.ty);
      ok("softBlockDetectsNpc", softBlockAt(npc.tx, npc.ty), "");
      var pathAround = findPath(player.tx, player.ty, 12, 30);
      ok("pathPastNpc", pathAround.length > 0, "n=" + pathAround.length);
      var endNpc = pathAround.length ? pathAround[pathAround.length - 1] : null;
      ok("pathPastNpcReaches", !!(endNpc && endNpc.tx === 12 && endNpc.ty === 30), endNpc && (endNpc.tx + "," + endNpc.ty));
      /* Soft on the line: still finds a route (around or through+scoot). */
      placePlayer(6, 31, "right");
      npc.tx = 8; npc.ty = 31;
      npc.x = tileCenterX(npc.tx); npc.y = tileFootY(npc.ty);
      var pathThru = findPath(6, 31, 12, 31);
      ok("pathThroughNpc", pathThru.length > 0, "n=" + pathThru.length);
      /* Chicken scoot target still pathable. */
      chicken.tx = 10; chicken.ty = 33;
      chicken.x = tileCenterX(chicken.tx); chicken.y = tileFootY(chicken.ty);
      placePlayer(10, 35, "up");
      var pathChick = findPath(player.tx, player.ty, chicken.tx, chicken.ty);
      ok("pathOntoChicken", pathChick.length > 0, "n=" + pathChick.length);
      var endC = pathChick[pathChick.length - 1];
      ok("pathOntoChickenEnds", !!(endC && endC.tx === chicken.tx && endC.ty === chicken.ty), endC && (endC.tx + "," + endC.ty));
      /* Far open ground: always some progress (partway harden). */
      placePlayer(6, 30, "down");
      var far = findPath(6, 30, 6, 35);
      ok("farOpenPath", far.length > 0, "n=" + far.length);
      /* House door path still works with soft Junie on the stoop below. */
      npc.tx = houseIn.tx; npc.ty = houseIn.ty + 1;
      npc.x = tileCenterX(npc.tx); npc.y = tileFootY(npc.ty);
      placePlayer(houseIn.tx, houseIn.ty + 4, "up");
      var pathDoor = findPath(player.tx, player.ty, houseIn.tx, houseIn.ty);
      ok("doorPathWithSoftNpc", pathDoor.length > 0, "n=" + pathDoor.length);
      npc.tx = junieTx; npc.ty = junieTy;
      npc.x = tileCenterX(npc.tx); npc.y = tileFootY(npc.ty);
      buildSolid();
    } catch (e) {
      fail++;
      log.push("FAIL exception — " + (e && e.message ? e.message : e));
    }
    var pre = document.getElementById("autotest");
    if (!pre) {
      pre = document.createElement("pre");
      pre.id = "autotest";
      pre.style.cssText = "position:fixed;left:8px;top:8px;z-index:99999;background:#111;color:#9f9;padding:8px;font:12px monospace;max-width:90%;white-space:pre-wrap;";
      document.body.appendChild(pre);
    }
    pre.textContent = (fail ? "COMBAT AUTOTEST FAIL" : "COMBAT AUTOTEST PASS") + " (" + pass + " pass / " + fail + " fail)\n" + log.join("\n");
    document.title = fail ? "AUTOTEST FAIL" : "AUTOTEST PASS";
    return fail === 0;
  }
  if (/[?&]autotest=combat\b/.test(location.search || "")) {
    window.__runCombatAutotest = runCombatAutotest;
  }
  checkFreshBuild();
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState !== "visible") return;
    checkFreshBuild();
    if (Assets.ready && !artDensityOk()) reloadForArt();
  });
  Assets.load().then(function () {
    if (!artDensityOk()) {
      reloadForArt();
      return;
    }
    try { sessionStorage.removeItem("moondrop-art-reload"); } catch (err) {}
    if (currentScene === "overworld") buildSolid();
    unstickPlayer();
    scheduleLoop();
    if (window.__runCombatAutotest) {
      setTimeout(function () { window.__runCombatAutotest(); }, 200);
    }
  }).catch(function () {
    paintMissing();
  });
})();
  </script>
</body>
