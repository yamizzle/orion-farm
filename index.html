  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#2A1A10">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="format-detection" content="telephone=no">
  <title>Moondrop Mountain</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html {
      --sat: env(safe-area-inset-top, 0px);
      --sar: env(safe-area-inset-right, 0px);
      --sab: env(safe-area-inset-bottom, 0px);
      --sal: env(safe-area-inset-left, 0px);
    }
    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      overscroll-behavior: none;
      -webkit-text-size-adjust: 100%;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none;
      user-select: none;
      background: #2A1A10;
    }
    body {
      position: fixed;
      inset: 0;
    }
    #frame {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #2A1A10;
    }
    #game {
      display: block;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      -ms-interpolation-mode: nearest-neighbor;
      background: #5FBF22;
    }
    #frame:fullscreen,
    #frame:-webkit-full-screen {
      width: 100%;
      height: 100%;
      background: #2A1A10;
    }
    #hudBtns {
      position: absolute;
      top: max(6px, var(--sat));
      right: max(6px, var(--sar));
      z-index: 5;
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 2px;
    }
    #hudBtns button {
      width: 36px;
      height: 36px;
      padding: 0;
      border: 0;
      background: transparent;
      cursor: pointer;
      -webkit-appearance: none;
      appearance: none;
      touch-action: manipulation;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #hudBtns canvas {
      display: block;
      width: 36px;
      height: 22px;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      pointer-events: none;
    }
    #hudBtns button:active canvas { filter: brightness(0.9); }
    #hudBtns button.is-off canvas { opacity: 0.55; }
  </style>
</head>

    var m = /(?:\?|&)v=([^&]*)/.exec(location.search || "");

  }

  function bustUrl(url) {
    return url + (url.indexOf("?") >= 0 ? "&" : "?") + "v=" + encodeURIComponent(pageVer());
  }

  function reloadFarm() {
    persistSave();

  }

  function checkFreshBuild() {
    fetch("assets/version.json?t=" + Date.now(), { cache: "no-store" }).then(function (r) {
      if (!r.ok) return null;
      return r.json();
    }).then(function (ver) {
      var remote, already;
      if (!ver || !ver.v || ver.v === BUILD) return;
      remote = String(ver.v);
      already = pageVer();
      if (already === remote) return;
      try {
        if (sessionStorage.getItem("moondrop-build") === remote) return;
        sessionStorage.setItem("moondrop-build", remote);
      } catch (err) {}
      persistSave();
      location.replace((location.pathname || "/") + "?v=" + encodeURIComponent(remote));
    }).catch(function () {});
  }

  function loadImage(src) {
    return new Promise(function (resolve, reject) {

      img.onload = function () { resolve(img); };
      img.onerror = function () { reject(new Error("image " + src)); };
      img.src = bustUrl(src);

    }
    function rect(x0, y0, x1, y1, ch) {
      var xx, yy;
      for (yy = y0; yy <= y1; yy++) {
        for (xx = x0; xx <= x1; xx++) set(xx, yy, ch);
      }
    }
    /* farm till (original 5-6,6-8 + offset 2,24) */

    rect(12, 33, 14, 33, "d");

    }
    /* dirt path east from the farm to town */
    for (x = 16; x <= 39; x++) {
      set(x, 32, "d");
      set(x, 33, "d");
    }
    /* cobble loop around the town green */

    rect(44, 36, 54, 38, "m");
    return g;
  }

    key = stackKey(kind);

  function tryBuild(tx, ty) {

    if (!placingFence && !placingPath) return false;
    if (!canBuildOn(tx, ty)) return false;
    if (placingFence && player.tx === tx && player.ty === ty) return false;
    if (placingFence && inventory.wood < FENCE_COST) {
      slotShake = 220;
      return true;
    }
    if (placingPath && inventory.stone < PATH_COST) {
      slotShake = 220;
      return true;
    }
    if (placingFence) {
      inventory.wood -= FENCE_COST;
      var fk = fenceKindFor(tx, ty);
      PROPS.push({ kind: fk, tx: tx, ty: ty });
      builds.push({ kind: fk, tx: tx, ty: ty });
      buildSolid();
    } else {
      inventory.stone -= PATH_COST;
      setCell(tx, ty, "c");

  function holeHit(tx, ty, world) {
    var i, p, b;

    for (i = 0; i < PROPS.length; i++) {
      p = PROPS[i];
      if (p.kind !== "hole" && !(p.kind === "ladder" && mineFloor > 1)) continue;
      if (tx === p.tx && (ty === p.ty || ty === p.ty - 1)) return p;
      if (!world) continue;
      b = propBounds(p);

    if (!world) return false;

          (data.player && typeof data.player === "object")) {

          tx: data.player && typeof data.player.tx === "number" ? data.player.tx | 0 : -1,

  }

  function serializeNodes() {
    var out = {};
    var key, rec;
    function addLive(scene, props) {
      if (!props) return;
      var i, p, k;
      for (i = 0; i < props.length; i++) {
        p = props[i];
        if (p.kind !== "tree" && p.kind !== "rock" && p.kind !== "stump" && p.kind !== "tallGrass") continue;
        k = nodeKey(scene, p.tx, p.ty);
        rec = harvestNodes[k];
        out[k] = {
          scene: scene,
          kind: p.kind === "stump" ? "tree" : p.kind,
          state: rec && rec.state ? rec.state : p.kind,
          tx: p.tx,
          ty: p.ty,
          hp: rec && typeof rec.hp === "number" ? rec.hp : 0,
          maxHp: rec && typeof rec.maxHp === "number" ? rec.maxHp : 0,
          harvestedAt: rec && typeof rec.harvestedAt === "number" ? rec.harvestedAt : 0
        };
      }
    }
    addLive(liveHarvestScene(), PROPS);
    if (sceneCache.overworld && liveHarvestScene() !== "overworld") addLive("overworld", sceneCache.overworld.props);
    if (sceneCache.mine && liveHarvestScene() !== "mine") addLive("mine", sceneCache.mine.props);
    if (sceneCache.mine2 && liveHarvestScene() !== "mine2") addLive("mine2", sceneCache.mine2.props);
    if (sceneCache.mine3 && liveHarvestScene() !== "mine3") addLive("mine3", sceneCache.mine3.props);
    for (key in harvestNodes) {
      if (!Object.prototype.hasOwnProperty.call(harvestNodes, key)) continue;
      rec = harvestNodes[key];
      if (!rec || out[key]) continue;
      out[key] = {
        scene: rec.scene,
        kind: rec.kind,
        state: rec.state || (rec.kind === "rock" ? "gone" : "stump"),
        tx: rec.tx,
        ty: rec.ty,
        hp: rec.hp || 0,
        maxHp: rec.maxHp || 0,
        harvestedAt: rec.harvestedAt
      };
    }
    return out;
  }

  function serializeLoot() {
    var out = [];
    var i, L;
    for (i = 0; i < groundLoot.length; i++) {
      L = groundLoot[i];
      if (!L || !lootKindOk(L.kind) || !L.amount) continue;
      out.push({
        scene: L.scene,
        kind: L.kind,
        amount: L.amount | 0,
        tx: L.tx | 0,
        ty: L.ty | 0
      });
    }
    return out;
  }

  function loadLoot(list) {
    var i, L, kind, scene, tx, ty;
    groundLoot = [];
    if (!list || !list.length) return;
    for (i = 0; i < list.length; i++) {
      L = list[i];
      if (!L || typeof L !== "object") continue;
      kind = lootKindOk(L.kind);
      if (!kind) continue;
      scene = typeof L.scene === "string" && L.scene ? L.scene : "overworld";
      tx = L.tx | 0;
      ty = L.ty | 0;
      groundLoot.push({
        id: lootSeq++,
        scene: scene,
        kind: kind,
        amount: clampCount(L.amount) || 1,
        tx: tx,
        ty: ty,
        x: tx * TILE + 8,
        y: ty * TILE + 4,
        sx: tx * TILE + 8,
        sy: ty * TILE + 4,
        popAge: LOOT_POP_MS
      });
    }
  }

  function applyBuildsTo(ground, props) {
    var i, b, j, exists;
    if (!builds || !builds.length || !ground || !props) return;
    for (i = 0; i < builds.length; i++) {
      b = builds[i];
      if (!b) continue;
      if (b.ty < 0 || b.ty >= ground.length || !ground[b.ty]) continue;
      if (b.tx < 0 || b.tx >= ground[b.ty].length) continue;
      if (b.kind === "path") {
        if (ground[b.ty][b.tx] === "g" || ground[b.ty][b.tx] === "d" || ground[b.ty][b.tx] === "h" || ground[b.ty][b.tx] === "k" || ground[b.ty][b.tx] === "m" || ground[b.ty][b.tx] === "c") {
          ground[b.ty][b.tx] = "c";
        }
      } else if (b.kind === "hole") {
        if (ground[b.ty][b.tx] === "g") ground[b.ty][b.tx] = "p";
      } else if (b.kind === "townFlower") {
        exists = false;
        for (j = 0; j < props.length; j++) {
          if (props[j].tx === b.tx && props[j].ty === b.ty && props[j].kind === "townFlower") {
            exists = true;
            break;
          }
        }
        if (!exists) props.push({ kind: "townFlower", tx: b.tx, ty: b.ty });
      } else if (b.kind === "fenceH" || b.kind === "fenceL" || b.kind === "fenceR") {
        exists = false;
        for (j = 0; j < props.length; j++) {
          if (props[j].tx === b.tx && props[j].ty === b.ty && isFenceKind(props[j].kind)) {
            exists = true;
            break;
          }
        }
        if (!exists) props.push({ kind: b.kind, tx: b.tx, ty: b.ty });
      }
    }
  }

  function applyPipLantern(props) {
    var i, exists;
    if (!props) return;
    if (!pipLantern && !pipDone) return;
    exists = false;
    for (i = 0; i < props.length; i++) {
      if (props[i].kind === "lantern" && props[i].tx === pipLanternAt.tx && props[i].ty === pipLanternAt.ty) {
        exists = true;
        break;
      }
    }
    if (!exists) props.push({ kind: "lantern", tx: pipLanternAt.tx, ty: pipLanternAt.ty });
  }

  function applyRestore() {
    var scene, tx, ty, face;
    if (!pendingRestore) return;
    scene = pendingRestore.scene || "overworld";
    if (scene !== currentScene) applyScene(scene);
    tx = pendingRestore.tx;
    ty = pendingRestore.ty;
    face = pendingRestore.face || "down";
    if (scene === "overworld") {
      if (tx < 0) tx = 0;
      if (ty < 0) ty = 0;
      if (tx >= OVER_COLS) tx = OVER_COLS - 1;
      if (ty >= OVER_ROWS) ty = OVER_ROWS - 1;
    }
    if (!inBounds(tx, ty) || !walkable(tx, ty)) {
      if (scene === "house") { tx = 10; ty = 9; face = "up"; }
      else if (scene === "shop") { tx = 8; ty = 7; face = "up"; }
      else if (scene === "mine") {
        if (mineFloor === 2) { tx = 5; ty = 10; face = "down"; }
        else if (mineFloor === 3) { tx = 11; ty = 11; face = "up"; }
        else if (mineFloor === 4) { tx = 6; ty = 10; face = "down"; }
        else if (mineFloor === 5) { tx = 24; ty = 14; face = "up"; }
        else if (mineFloor === 6) { tx = 8; ty = 12; face = "down"; }
        else { tx = 16; ty = 19; face = "up"; }
      }
      else { tx = 16; ty = 30; face = "down"; }
    }
    placePlayer(tx, ty, face);
    pendingRestore = null;
    if ((hp <= 0 || energy <= 0) && !faintFx) beginFaint();
  }

  function findBed() {

  function nearBed() {
    var bed = findBed();
    var x, y;
    if (!bed) return false;
    for (y = 0; y < 2; y++) {

    var yesX = x + 28;

  function hitPad(px, py, x, y, w, h, pad) {

  function clockPhase() {
    var i = (dayMs / PHASE_MS) | 0;
    if (i < 0) i = 0;
    if (i >= PHASES.length) i = PHASES.length - 1;
    return i;
  }

  function clockPhaseName() {
    return PHASES[clockPhase()];
  }

  function clockHudLine() {
    var phase = clockPhaseName();
    if (currentScene === "mine") return phase + " · MINE " + clampMineFloor(mineFloor);
    if (currentScene === "house") return phase + " · HOME";
    if (currentScene === "shop") return phase + " · SHOP";
    return "SPRING · " + phase;
  }

  function uiPaused() {
    return !!(dialogue || achieveOpen || questOpen || sleepFx || faintFx || wipeAsk || toast || shopOpen || craftOpen || chestOpen);
  }

  function timePaused() {
    return !!(uiPaused() || document.hidden);
  }

  function updateClock(dt) {
    if (timePaused()) return;
    var before = clockPhase();
    var beforeDay = dayNumber;
    dayMs += dt;
    while (dayMs >= DAY_MS) {
      dayMs -= DAY_MS;
      dayNumber += 1;
    }
    if (clockPhase() !== before || dayNumber !== beforeDay) persistSave();
    updateCrops();
    updateHarvestNodes();
  }

  function sampleKeys(keys, t) {
    var i, lo, hi, u, k, out;
    if (t <= keys[0].at) return keys[0];
    for (i = 1; i < keys.length; i++) {
      if (t <= keys[i].at) {
        lo = keys[i - 1];
        hi = keys[i];
        u = (t - lo.at) / (hi.at - lo.at);
        out = { at: t };
        for (k in lo) {
          if (Object.prototype.hasOwnProperty.call(lo, k) && k !== "at") {
            out[k] = lo[k] + (hi[k] - lo[k]) * u;
          }
        }
        return out;
      }
    }
    return keys[keys.length - 1];
  }

  function currentGrade() {
    return sampleKeys(GRADE_KEYS, dayMs / DAY_MS);
  }

  function currentTint() {
    var t = dayMs / DAY_MS;
    var cozy = currentScene === "house" && homeLightOn();
    if (currentScene === "house" || currentScene === "shop") {
      if (t >= 0.72) return { r: 255, g: cozy ? 184 : 200, b: cozy ? 104 : 130, a: cozy ? 0.38 : 0.24 };
      if (t >= 0.56) return { r: 255, g: cozy ? 178 : 196, b: cozy ? 112 : 140, a: cozy ? 0.26 : 0.16 };
      return { r: 255, g: cozy ? 220 : 236, b: cozy ? 176 : 210, a: cozy ? 0.12 : 0.04 };
    }
    if (currentScene === "mine") {
      if (mineFloor >= 6) return { r: 48, g: 36, b: 72, a: 0.56 };
      if (mineFloor >= 5) return { r: 56, g: 42, b: 80, a: 0.52 };
      if (mineFloor >= 4) return { r: 64, g: 48, b: 84, a: 0.48 };
      if (mineFloor === 3) return { r: 72, g: 62, b: 88, a: 0.44 };
      if (mineFloor === 2) return { r: 118, g: 104, b: 116, a: 0.34 };
      return { r: 168, g: 152, b: 138, a: 0.22 };
    }
    return null;
  }

  function lanternGlowAmt() {
    if (currentScene === "mine") return 0.55;
    if (currentScene !== "overworld") return 0;
    var t = dayMs / DAY_MS;
    if (t < 0.75) return 0;
    if (t < 0.768) return 0.22 + 0.78 * (t - 0.75) / 0.018;
    if (t < 0.97) return 1;
    return Math.max(0, (1 - t) / 0.03);
  }

  function lanternIsLit() {

  function forEachNightLight(fn) {
    var i, p, hx, hy;
    for (i = 0; i < PROPS.length; i++) {
      p = PROPS[i];
      if (p.kind === "lantern") {
        fn(p.tx * TILE + 8, p.ty * TILE + 2, 1, i);
      } else if (p.kind === "house") {
        fn(p.tx * TILE + 40, p.ty * TILE + 68, 0.88, 80 + i);
        fn(p.tx * TILE + 60, p.ty * TILE + 36, 0.55, 90 + i);
        fn(p.tx * TILE + 40, p.ty * TILE + 8, 0.40, 100 + i);
      } else if (p.kind === "shopHouse" || p.kind === "townHouseA" || p.kind === "townHouseB") {
        fn(p.tx * TILE + 32, p.ty * TILE + 52, 0.72, 80 + i);
        fn(p.tx * TILE + 16, p.ty * TILE + 18, 0.48, 90 + i);
        fn(p.tx * TILE + 48, p.ty * TILE + 18, 0.42, 100 + i);
      }
    }
    if (currentScene === "overworld" && car && reedDone && lanternGlowAmt() > 0.02) {
      var lamps = carLampSpots();
      fn(lamps[0].x + 1, lamps[0].y + 1, 0.42, 200);
      fn(lamps[1].x + 1, lamps[1].y + 1, 0.42, 201);
    }
    if (currentScene === "overworld" && festivalOn && lanternGlowAmt() > 0.02) {
      fn(51 * TILE + 8, 29 * TILE + 2, 1.18, 300);
      fn(46 * TILE + 16, 30 * TILE + 4, 0.98, 301);
      fn(48 * TILE + 8, 31 * TILE + 2, 0.72, 302);
      fn(53 * TILE + 8, 31 * TILE + 2, 0.72, 303);
    }
  }

  function paintLightDisks(g, amt, mode, radMul, stops) {
    var sx, sy, flicker, rad, grd, i, s;
    g.save();
    g.globalCompositeOperation = mode;
    forEachNightLight(function (wx, wy, scale, i) {
      sx = wx - camX;
      sy = wy - camY;
      if (sx < -80 || sy < -80 || sx > VIEW_W + 80 || sy > VIEW_H + 80) return;
      flicker = 0.88 + Math.sin(tick / 140 + i * 1.7) * 0.12;
      rad = radMul * amt * flicker * scale;
      grd = g.createRadialGradient(sx, sy, 1.5, sx, sy, rad);
      var si;
      for (si = 0; si < stops.length; si++) {
        s = stops[si];
        grd.addColorStop(s[0], "rgba(" + s[1] + "," + s[2] + "," + s[3] + "," + (s[4] * amt * flicker).toFixed(3) + ")");
      }
      g.fillStyle = grd;
      g.beginPath();
      g.arc(sx, sy, rad, 0, Math.PI * 2);
      g.fill();
    });
    g.restore();
  }

    g.fillStyle = "rgb(" + (r | 0) + "," + (gv | 0) + "," + (b | 0) + ")";

    fillBlend(g, "overlay", gr.ovA, gr.ovR, gr.ovG, gr.ovB, w, h);

      tmp = dirs[i]; dirs[i] = dirs[j]; dirs[j] = tmp;
    }
    for (i = 0; i < 4; i++) {
      d = dirs[i];
      nx = f.tx + d[0];
      ny = f.ty + d[1];

      f.anim += dt;
      if (f.anim > 220) {
        f.anim = 0;
        f.frame = f.frame ? 0 : 1;
      }
      dest = f.path && f.path.length ? f.path[0] : null;
      if (dest && playerOccupies(dest.tx, dest.ty)) {
        folkStop(f);
        if (!folkYield(f)) f.idle = 400;
        continue;
      }
      if (dest) {
        advanceWalk(f, dt);
        continue;
      }
      if (playerOccupies(f.tx, f.ty)) {
        if (!folkYield(f)) f.idle = 200;
        continue;
      }
      f.idle -= dt;
      if (f.idle > 0) continue;
      f.idle = 900 + Math.random() * 2200;
      folkYield(f);

      a.x = tileCenterX(a.tx) + a.dx * (a.wait / 80) * TILE;
      a.y = (tileFootY(a.ty) - 10) + a.dy * (a.wait / 80) * TILE;
      if (a.wait < 80) continue;
      a.wait = 0;
      nx = a.tx + a.dx;
      ny = a.ty + a.dy;
      a.left -= 1;
      if (!inBounds(nx, ny) || (solid && solid[ny] && solid[ny][nx]) || a.left < 0) {

      a.tx = nx;
      a.ty = ny;

      else if (a.face === "down") ang = Math.PI * 0.5;

      tmp = dirs[i];
      dirs[i] = dirs[j];
      dirs[j] = tmp;
    }
    for (i = 0; i < 4; i++) {
      d = dirs[i];
      nx = m.tx + d[0];
      ny = m.ty + d[1];
      if (monsterOk(m, nx, ny) && !playerOccupies(nx, ny)) {

      m.anim += dt;

        m.frame = m.frame ? 0 : 1;

      for (i = 0; i < 8; i++) {

  function spawnMineDrop(mon) {
    var roll = Math.random();
    var deep = mineFloor >= 4;
    var shift = Math.min(0.10, (mineFloor - 1) * 0.018);
    var tNothing = 0.35 - shift;
    var tJunk = tNothing + 0.40;
    var tUseful = tJunk + 0.20;
    var j, u, v, goldAmt;
    if (roll < tNothing) return;
    if (roll < tJunk) {
      j = Math.random();
      if (j < 0.34) spawnGroundLoot("pebble", mon.tx, mon.ty, 1);
      else if (j < 0.67) spawnGroundLoot("stone", mon.tx, mon.ty, 1);
      else spawnGroundLoot("gold", mon.tx, mon.ty, 1);
      return;
    }
    if (roll < tUseful) {
      u = Math.random();
      if (u < (deep ? 0.50 : 0.18)) spawnGroundLoot("iron", mon.tx, mon.ty, 1);
      else if (u < (deep ? 0.80 : 0.62)) spawnGroundLoot("copper", mon.tx, mon.ty, 1);
      else spawnGroundLoot("mushroom", mon.tx, mon.ty, 1);
      return;
    }
    v = Math.random();
    goldAmt = 5 + ((Math.random() * 4) | 0);
    if (deep) {
      if (v < 0.40) spawnGroundLoot("sapphire", mon.tx, mon.ty, 20);
      else spawnGroundLoot("gold", mon.tx, mon.ty, goldAmt);
    } else if (v < 0.35) {
      spawnGroundLoot("gem", mon.tx, mon.ty, 8);
    } else {
      spawnGroundLoot("gold", mon.tx, mon.ty, goldAmt);
    }
  }

  function updateCar(dt) {
    var next, dest, ni;
    if (currentScene !== "overworld") return;
    car.anim += dt;
    if (car.anim > 160) {
      car.anim = 0;
      car.frame = car.frame ? 0 : 1;
    }
    if (car.wait > 0) {
      car.wait -= dt;
      return;
    }
    dest = car.path && car.path.length ? car.path[0] : null;
    if (dest && (playerOccupies(dest.tx, dest.ty) || folkOccupies(dest.tx, dest.ty))) {
      car.path = [];
      car.stepFrom = null;
      car.stepT = 0;
      car.x = tileCenterX(car.tx);
      car.y = tileFootY(car.ty);
      car.wait = 280;
      return;
    }
    if (dest) {
      advanceWalk(car, dt);
      return;
    }
    ni = (car.loopI + 1) % CAR_LOOP.length;
    next = CAR_LOOP[ni];
    if (playerOccupies(next.tx, next.ty) || folkOccupies(next.tx, next.ty)) {

    car.loopI = ni;

  function findAch(id) {
    var i;

  function unlockAch(id) {

  function beginUnlock(def) {
    var i, ang, bits;
    bits = [];
    for (i = 0; i < 16; i++) {
      ang = (i / 16) * Math.PI * 2 + (i % 3) * 0.11;
      bits.push({
        ang: ang,
        dist: 6 + (i % 4),
        spd: 0.05 + (i % 5) * 0.01,
        age: 0,
        life: 640 + (i % 4) * 90,
        frame: i % 3
      });
    }
    toast = {
      name: def.name,
      blurb: def.blurb || "",
      age: 0,
      motion: 2000,
      ready: false,
      bits: bits
    };
    playSfx("toast");
  }

  function dismissUnlock() {
    toast = null;
  }

  function updateToasts(dt) {
    var def, i, b, ang;
    if (!toast && toastQueue.length) {
      def = findAch(toastQueue.shift());
      if (def) beginUnlock(def);
    }
    if (!toast) return;
    toast.age += dt;
    if (!toast.ready && toast.age >= toast.motion) toast.ready = true;
    for (i = toast.bits.length - 1; i >= 0; i--) {
      b = toast.bits[i];
      b.age += dt;
      b.dist += b.spd * dt;
      b.spd *= 0.993;
      if (b.age >= b.life) toast.bits.splice(i, 1);
    }
    if (toast.age > 280 && toast.bits.length < 12) {
      if (((toast.age / 110) | 0) !== (((toast.age - dt) / 110) | 0)) {
        ang = (toast.age * 0.013) % (Math.PI * 2);
        toast.bits.push({
          ang: ang,
          dist: 12 + (toast.age % 9),
          spd: 0.028,
          age: 0,
          life: 540,
          frame: ((toast.age / 80) | 0) % 3
        });
      }
    }
  }

    }
    found.mooncrystal = true;
    for (j = PROPS.length - 1; j >= 0; j--) {
      other = PROPS[j];

    openDialogue("ORION", ["THE MOUNTAIN HEART.", "NIM LEFT THIS GLOW", "FOR ME TO FIND."]);
  }

  function pickupCollectible(prop) {
    var i;
    if (!isCollectible(prop)) return;
    if (prop.kind === "gem" || prop.kind === "chest" || prop.kind === "mooncrystal" ||
        prop.kind === "iron" || prop.kind === "sapphire") {
      if (prop.kind === "gem" && found.gem) return;
      if (prop.kind === "iron" && found.iron) return;
      if (prop.kind === "sapphire" && found.sapphire) return;
      if (prop.kind === "chest" && mineFloor === 6 && found.peakChest) return;
      if ((prop.kind === "chest" || prop.kind === "mooncrystal") && mineFloor !== 6 && found.mooncrystal) return;
      takeDeepFind(prop);
      return;
    }
    if (found[prop.kind]) return;
    i = PROPS.indexOf(prop);
    if (i >= 0) PROPS.splice(i, 1);
    found[prop.kind] = true;
    spawnPickup(prop.kind, prop.tx, prop.ty, 1);
    spawnSparks(prop.tx * TILE + 8, prop.ty * TILE + 6);
    unlockAch(COLLECT_ACH[prop.kind]);
    if (allFound()) {
      unlockAch("moonlightPocket");
      if (!outroSeen) {
        outroSeen = true;
        persistSave();
        openDialogue("NIM'S NOTE", NOTE_CLOSE);

        persistSave();

  function tryPickupHere() {

        pickupCollectible(p);
        break;

    if (lootAtTile(player.tx, player.ty).length) collectLootAt(player.tx, player.ty);

  function goCollect(prop) {
    if (!isCollectible(prop)) return;
    if (prop.kind === "gem" && found.gem) return;
    if (prop.kind === "iron" && found.iron) return;
    if (prop.kind === "sapphire" && found.sapphire) return;
    if (prop.kind === "chest" && mineFloor === 6 && found.peakChest) return;
    if ((prop.kind === "chest" || prop.kind === "mooncrystal") && mineFloor !== 6 && found.mooncrystal) return;
    if (prop.kind !== "gem" && prop.kind !== "chest" && prop.kind !== "mooncrystal" &&
        prop.kind !== "iron" && prop.kind !== "sapphire" && found[prop.kind]) return;
    highlight = { tx: prop.tx, ty: prop.ty };
    if (player.tx === prop.tx && player.ty === prop.ty) {
      pending = null;
      pickupCollectible(prop);
      return;
    }
    if (!walkable(prop.tx, prop.ty)) {
      var side = nearestAdjacent(prop.tx, prop.ty);
      if (!side) return;
      pending = { type: "collect", prop: prop };
      startWalk(player, findPath(player.tx, player.ty, side.tx, side.ty), 3.5);
      return;
    }
    var path = findPath(player.tx, player.ty, prop.tx, prop.ty);
    if (!path.length) return;
    pending = { type: "collect", prop: prop };
    startWalk(player, path, 3.5);
  }

    highlight = note ? { tx: note.tx, ty: note.ty } : null;
    if (!note || isNear(player.tx, player.ty, note.tx, note.ty) || (player.tx === note.tx && player.ty === note.ty)) {
      pending = null;
      readNoteNow();

    var dest = nearestAdjacent(note.tx, note.ty);
    if (!dest) {
      readNoteNow();
      return;
    }
    var path = findPath(player.tx, player.ty, dest.tx, dest.ty);
    if (!path.length) {
      readNoteNow();
      return;

    pending = { type: "note" };
    startWalk(player, path, 3.5);
  }

  function arrive() {
    if (isMineEntrance(player.tx, player.ty)) {
      pending = null;
      enterMine();
      return;
    }
    if (isHouseEntrance(player.tx, player.ty)) {
      pending = null;
      enterHouse();
      return;
    }
    if (isMineDown(player.tx, player.ty)) {
      pending = null;
      enterMineFloor(mineFloor + 1, "down");
      return;
    }
    if (isMineUp(player.tx, player.ty)) {
      pending = null;
      enterMineFloor(mineFloor - 1, "up");
      return;
    }
    if (isMineExit(player.tx, player.ty)) {
      pending = null;
      exitMine();
      return;
    }
    if (isHouseExit(player.tx, player.ty)) {
      pending = null;
      exitHouse();
      return;
    }
    if (isShopEntrance(player.tx, player.ty)) {
      pending = null;
      enterShop();
      return;
    }
    if (isShopExit(player.tx, player.ty)) {
      pending = null;
      exitShop();
      return;
    }
    tryPickupHere();
    if (!pending) return;
    var act = pending;
    pending = null;
    if (act.type === "plant") {
      if (isNear(player.tx, player.ty, act.tx, act.ty)) {
        plantAt(act.tx, act.ty);
        faceToward(player, act.tx, act.ty);
      }
    } else if (act.type === "talk") {
      if (isNear(player.tx, player.ty, npc.tx, npc.ty)) {
        talkNeighbor();
      }
    } else if (act.type === "note") {
      readNoteNow();
    } else if (act.type === "mail") {
      openMail();
    } else if (act.type === "collect") {
      if (isCollectible(act.prop) && (player.tx === act.prop.tx && player.ty === act.prop.ty || isNear(player.tx, player.ty, act.prop.tx, act.prop.ty))) {
        pickupCollectible(act.prop);
      }
    } else if (act.type === "loot") {
      if (player.tx === act.tx && player.ty === act.ty) {
        collectLootAt(act.tx, act.ty);
      }
    } else if (act.type === "enter") {
      enterMine();
    } else if (act.type === "mineDown") {
      enterMineFloor(mineFloor + 1, "down");
    } else if (act.type === "mineUp") {
      enterMineFloor(mineFloor - 1, "up");
    } else if (act.type === "exit") {
      exitMine();
    } else if (act.type === "enterHouse") {
      enterHouse();
    } else if (act.type === "exitHouse") {
      exitHouse();
    } else if (act.type === "harvest") {
      if (isHarvestable(act.prop) && isNear(player.tx, player.ty, act.prop.tx, act.prop.ty)) {
        beginHit(act.prop);
      }
    } else if (act.type === "cutGrass") {
      if (act.prop && isSliceable(act.prop) && (isNear(player.tx, player.ty, act.prop.tx, act.prop.ty) || (player.tx === act.prop.tx && player.ty === act.prop.ty))) {
        startWalk(player, [], 3.5);
        beginHit(act.prop);
      }
    } else if (act.type === "pickPlant") {
      if (act.prop && isPickablePlant(act.prop) && (isNear(player.tx, player.ty, act.prop.tx, act.prop.ty) || (player.tx === act.prop.tx && player.ty === act.prop.ty))) {
        startWalk(player, [], 3.5);
        beginHit(act.prop);
      }
    } else if (act.type === "pickCrop") {
      if (isNear(player.tx, player.ty, act.tx, act.ty) || (player.tx === act.tx && player.ty === act.ty)) {
        startWalk(player, [], 3.5);
        beginHit({ kind: "crop", tx: act.tx, ty: act.ty });
      }
    } else if (act.type === "build") {
      if (isNear(player.tx, player.ty, act.tx, act.ty) || (player.tx === act.tx && player.ty === act.ty)) {
        faceToward(player, act.tx, act.ty);
        tryBuild(act.tx, act.ty);
      }
    } else if (act.type === "dig") {
      if (isNear(player.tx, player.ty, act.tx, act.ty) || (player.tx === act.tx && player.ty === act.ty)) {
        faceToward(player, act.tx, act.ty);
        tryDig(act.tx, act.ty);
      }
    } else if (act.type === "sleep") {
      beginSleep();
    } else if (act.type === "homeLight") {
      talkHomeLight();
    } else if (act.type === "craft") {
      openCraft();
    } else if (act.type === "chest") {
      openChest();
    } else if (act.type === "talkFolk") {
      if (act.folk && isNear(player.tx, player.ty, act.folk.tx, act.folk.ty)) talkFolk(act.folk);
    } else if (act.type === "talkNim") {
      if (nimVisible() && isNear(player.tx, player.ty, nim.tx, nim.ty)) talkNim();
    } else if (act.type === "tapCar") {
      beepCar();
    } else if (act.type === "peakAltar") {
      talkPeakAltar();

  function updateChicken(dt) {
    if (currentScene !== "overworld") return;
    if (chicken.react > 0) chicken.react -= dt;

      chicken.anim = 0;
      chicken.frame = chicken.frame ? 0 : 1;

    var dest = chicken.path && chicken.path.length ? chicken.path[0] : null;
    if (dest && playerOccupies(dest.tx, dest.ty)) {
      chickenStop();
      dest = null;
      if (!chickenYield()) chicken.idle = 400;
      return;
    }
    if (dest) {
      advanceWalk(chicken, dt);
      return;
    }
    if (playerOccupies(chicken.tx, chicken.ty)) {
      if (!chickenYield()) chicken.idle = 200;
      return;
    }
    chicken.idle -= dt;
    if (chicken.idle > 0) return;
    chicken.idle = 900 + Math.random() * 2200;

  function drawShadow(g, x, y, hw) {
    var ix = Math.round(x);
    var iy = Math.round(y);
    fill(g, ix - hw, iy - 2, hw * 2, 3, "rgba(30,90,18,0.40)");
    fill(g, ix - hw + 2, iy - 3, hw * 2 - 4, 1, "rgba(30,90,18,0.22)");

  function drawPlayer(g) {
    var bob, sx, sy, amp;
    if (faintFx && faintFx.stage === "out") {
      drawShadow(g, player.x, player.y, 6);
      if (Assets.spr["player-faint"]) Assets.draw(g, "player-faint", player.x, player.y);
      else Assets.draw(g, "player-" + (player.face || "down"), player.x, player.y, 0);
      return;
    }
    bob = (player.moving && player.frame) ? -1 : 0;
    sx = 0;
    sy = 0;
    if (player.arc > 0 || player.swing > 0) {
      var dur = player.arc > 0 ? SWING_MS : 220;
      var left = player.arc > 0 ? player.arc : player.swing;
      amp = Math.round(Math.sin((1 - left / dur) * Math.PI) * 3);
      if (player.face === "left") sx = -amp;
      else if (player.face === "right") sx = amp;
      else if (player.face === "up") sy = -amp;
      else sy = amp;
      bob -= 1;
    }
    if (player.arc > 0 && swordOwned && player.face === "up") {
      drawSwordArc(g, sx, sy, bob);
    } else if (player.swing > 0 && player.workTool && player.face === "up") {
      drawWorkTool(g, sx, sy, bob);
    }
    drawShadow(g, player.x, player.y, 5);
    if (!(iFrames > 0 && ((tick / 80) | 0) % 2 === 0)) {
      Assets.draw(g, "player-" + player.face, player.x + sx, player.y + bob + sy, player.frame);
      if (hatOn) {
        Assets.draw(g, "strawHat", Math.round(player.x - 8 + sx), Math.round(player.y - 34 + bob + sy));
      }
    }
    if (player.arc > 0 && swordOwned && player.face !== "up") {
      drawSwordArc(g, sx, sy, bob);
    } else if (player.swing > 0 && player.workTool && player.face !== "up") {
      drawWorkTool(g, sx, sy, bob);
    }
  }

  function swordHand(sx, sy, bob) {
    var hx = player.x + sx;
    var hy = player.y + bob + sy - 16;
    if (player.face === "left") hx -= 3;
    else if (player.face === "right") hx += 3;
    else if (player.face === "up") hy -= 2;
    else hy -= 1;
    return { x: hx, y: hy };
  }

  function workChopAngle() {
    var u = 1 - player.swing / 220;
    var span, mid;
    if (u < 0) u = 0;
    if (u > 1) u = 1;
    u = u * u * (3 - 2 * u);
    span = 70 * Math.PI / 180;
    if (player.face === "down") mid = Math.PI * 0.82;
    else if (player.face === "right") mid = Math.PI * 0.32;
    else if (player.face === "up") mid = -0.12;
    else mid = -Math.PI * 0.32;
    return mid - span * 0.4 + span * u;
  }

  function drawWorkTool(g, sx, sy, bob) {
    var hand, ang, id;
    id = player.workTool;
    if (!id || !Assets.spr[id]) return;
    hand = swordHand(sx, sy, bob);
    ang = workChopAngle();
    g.save();
    g.imageSmoothingEnabled = false;
    g.translate(Math.round(hand.x), Math.round(hand.y));
    g.rotate(ang);
    Assets.draw(g, id, -8, -12);
    g.restore();
  }

  function swingAngle() {
    var u = 1 - player.arc / SWING_MS;
    var span, mid, step;
    if (u < 0) u = 0;
    if (u > 1) u = 1;
    u = u * u * (3 - 2 * u);
    step = Math.round(u * 4) / 4;
    span = 110 * Math.PI / 180;
    if (player.face === "down") mid = Math.PI;
    else if (player.face === "right") mid = Math.PI * 0.5;
    else if (player.face === "up") mid = 0;
    else mid = -Math.PI * 0.5;
    return mid - span * 0.5 + span * step;
  }

  function drawSwordArc(g, sx, sy, bob) {
    var hand = swordHand(sx, sy, bob);
    var ang = swingAngle();
    var u = 1 - player.arc / SWING_MS;
    var tipX, tipY, fr;
    g.save();
    g.imageSmoothingEnabled = false;
    g.translate(Math.round(hand.x), Math.round(hand.y));
    g.rotate(ang);
    Assets.draw(g, ironSwordOwned ? "ironSword" : "sword", -8, -13);
    g.restore();
    if (u > 0.22 && u < 0.82 && Assets.spr.slash) {
      tipX = hand.x + Math.sin(ang) * 13;
      tipY = hand.y - Math.cos(ang) * 13;
      fr = u > 0.5 ? 1 : 0;
      g.save();
      g.imageSmoothingEnabled = false;
      g.globalAlpha = u < 0.35 || u > 0.7 ? 0.7 : 1;
      g.translate(Math.round(tipX), Math.round(tipY));
      g.rotate(ang);
      Assets.draw(g, "slash", 0, 0, fr);
      g.restore();
    }
  }

  function harvestSprite(p) {
    var st, n;
    if (!p) return "";
    if (p.kind === "tree") {
      st = nodeHurtStage(p);
      if (st >= 2) return "treeHurt2";
      if (st === 1) return "treeHurt";
      return "tree";
    }
    if (p.kind === "rock") {
      st = nodeHurtStage(p);
      n = (p.tx + p.ty) & 1;
      if (st >= 2) return "rock" + n + "Hurt2";
      if (st === 1) return "rock" + n + "Hurt";
      return "rock" + n;
    }
    return "";

  var washScratch = null;

  function lanternPopAt(wx, wy) {
    var amt = lanternGlowAmt();
    var best = 0;
    if (amt < 0.02) return 0;
    forEachNightLight(function (lx, ly, scale) {
      var rad = 46 * amt * scale;
      var dx, dy, t;
      if (rad < 1) return;
      dx = wx - lx;
      dy = wy - ly;
      t = 1 - Math.sqrt(dx * dx + dy * dy) / rad;
      if (t > best) best = t;
    });
    if (best < 0) best = 0;
    if (best > 1) best = 1;
    return best;
  }

  function creatureNightWash(wx, wy) {
    var t = dayMs / DAY_MS;
    var amt = lanternGlowAmt();
    var gr, pop, a;
    if (currentScene !== "overworld") return null;
    gr = currentGrade();
    if (amt >= 0.02) {
      pop = lanternPopAt(wx, wy);
      a = (0.22 + 0.13 * amt) * (1 - pop);
      if (a < 0.01) return null;
      return { r: gr.mulR, g: gr.mulG, b: gr.mulB, a: a };
    }
    if (t >= 0.50 && t < 0.75) {
      a = gr.mulA * 0.4;
      if (a > 0.10) a = 0.10;
      if (a < 0.01) return null;
      return { r: gr.mulR, g: gr.mulG, b: gr.mulB, a: a };
    }
    return null;
  }

  function actorWorldPos(item) {
    if (item.kind === "player") return { x: player.x, y: player.y };
    if (item.kind === "chicken") return { x: chicken.x, y: chicken.y };
    if (item.kind === "npc") return { x: npc.x, y: npc.y };
    if (item.kind === "car") return { x: car.x, y: car.y };
    if (item.kind === "folk" && item.f) return { x: item.f.x, y: item.f.y };
    if (item.kind === "mon" && item.m) return { x: item.m.x, y: item.m.y };
    return { x: 0, y: 0 };
  }

  function collectPropActors() {
    var list = [];
    var i, p, b;
    for (i = 0; i < PROPS.length; i++) {
      p = PROPS[i];
      b = propBounds(p);
      if (onScreen(b)) list.push({ foot: propFoot(p), kind: "prop", p: p });
    }
    return list;
  }

  function collectCreatureActors() {
    var list = [];
    var i;
    list.push({ foot: player.y, kind: "player" });
    if (currentScene === "mine") {
      for (i = 0; i < monsters.length; i++) {
        if (monsters[i].hp > 0) list.push({ foot: monsters[i].y, kind: "mon", m: monsters[i] });
      }
    }
    if (currentScene === "overworld") {
      list.push({ foot: chicken.y, kind: "chicken" });
      list.push({ foot: npc.y, kind: "npc" });
      list.push({ foot: car.y, kind: "car" });
      for (i = 0; i < townFolk.length; i++) {
        list.push({ foot: townFolk[i].y, kind: "folk", f: townFolk[i] });
      }
      if (nimVisible()) list.push({ foot: nim.y, kind: "nim" });
    }
    if (currentScene === "shop") {
      list.push({ foot: tileFootY(4), kind: "shopPip" });
    }
    return list;
  }

  function paintActor(g, item) {
    if (item.kind === "prop") drawProp(g, item.p);
    else if (item.kind === "player") drawPlayer(g);
    else if (item.kind === "chicken") drawChickenSpr(g);
    else if (item.kind === "car") drawCarSpr(g);
    else if (item.kind === "folk") drawFolk(g, item.f);
    else if (item.kind === "nim") drawNim(g);
    else if (item.kind === "mon") drawMonster(g, item.m);
    else if (item.kind === "shopPip") {
      drawShadow(g, tileCenterX(8), tileFootY(4), 5);
      Assets.draw(g, "pip-down", tileCenterX(8), tileFootY(4), 0);
    } else drawNpc(g);
  }

  function drawWashedActor(g, item) {
    var pos = actorWorldPos(item);
    var wash = creatureNightWash(pos.x, pos.y);
    var sc, sg, ox, oy, ix, iy, img, px, i, inv, mr, mgv, mb;
    if (!wash) {
      paintActor(g, item);
      return;
    }
    if (!washScratch) {
      washScratch = document.createElement("canvas");
      washScratch.width = 96;
      washScratch.height = 96;
    }
    sc = washScratch;
    sg = sc.getContext("2d");
    ox = 48;
    oy = 68;
    ix = Math.round(pos.x);
    iy = Math.round(pos.y);
    sg.globalCompositeOperation = "source-over";
    sg.globalAlpha = 1;
    sg.imageSmoothingEnabled = false;
    sg.clearRect(0, 0, sc.width, sc.height);
    sg.save();
    sg.translate(ox - ix, oy - iy);
    paintActor(sg, item);
    sg.restore();
    img = sg.getImageData(0, 0, sc.width, sc.height);
    px = img.data;
    inv = 1 - wash.a;
    mr = wash.r / 255;
    mgv = wash.g / 255;
    mb = wash.b / 255;
    for (i = 0; i < px.length; i += 4) {
      if (!px[i + 3]) continue;
      px[i] = (px[i] * inv + px[i] * mr * wash.a + 0.5) | 0;
      px[i + 1] = (px[i + 1] * inv + px[i + 1] * mgv * wash.a + 0.5) | 0;
      px[i + 2] = (px[i + 2] * inv + px[i + 2] * mb * wash.a + 0.5) | 0;
    }
    sg.putImageData(img, 0, 0);
    g.drawImage(sc, ix - ox, iy - oy);
  }

  function sortActors(list) {
    list.sort(function (a, b) { return a.foot - b.foot; });
  }

  var propScratch = null;
  var propMask = null;

  function ensurePropScratch(w, h) {
    var size = 160;
    if (w > size) size = w;
    if (h > size) size = h;
    if (!propScratch || propScratch.width < size || propScratch.height < size) {
      propScratch = document.createElement("canvas");
      propScratch.width = size;
      propScratch.height = size;
      propMask = document.createElement("canvas");
      propMask.width = size;
      propMask.height = size;
    }
    return propScratch;
  }

  function drawGradedProp(g, item) {
    var p = item.p;
    var b, pad, bx, by, bw, bh, sc, sg, mk, mg;
    if (!outdoorGradeActive()) {
      paintActor(g, item);
      return;
    }
    b = propBounds(p);
    pad = 24;
    bx = b.x - pad;
    by = b.y - pad;
    bw = b.w + pad * 2;
    bh = b.h + pad * 2;
    sc = ensurePropScratch(bw, bh);
    sg = sc.getContext("2d");
    mk = propMask;
    mg = mk.getContext("2d");
    sg.imageSmoothingEnabled = false;
    mg.imageSmoothingEnabled = false;
    sg.globalCompositeOperation = "source-over";
    sg.globalAlpha = 1;
    sg.clearRect(0, 0, sc.width, sc.height);
    mg.globalCompositeOperation = "source-over";
    mg.globalAlpha = 1;
    mg.clearRect(0, 0, mk.width, mk.height);
    sg.save();
    sg.translate(-bx, -by);
    drawProp(sg, p);
    sg.restore();
    mg.drawImage(sc, 0, 0);
    applyOutdoorGrade(sg, bw, bh);
    sg.globalCompositeOperation = "destination-in";
    sg.drawImage(mk, 0, 0);
    sg.globalCompositeOperation = "source-over";
    g.drawImage(sc, 0, 0, bw, bh, bx, by, bw, bh);
  }

  function drawActors(g) {
    var list = collectPropActors().concat(collectCreatureActors());
    var i, item;
    sortActors(list);
    for (i = 0; i < list.length; i++) {
      item = list[i];
      if (currentScene === "overworld") {
        if (item.kind === "prop") drawGradedProp(g, item);
        else drawWashedActor(g, item);
      } else {
        paintActor(g, item);
      }
    }
  }

  function drawMonster(g, m) {
    var bob, sx, sc;
    if (!m || m.hp <= 0) return;
    bob = m.frame ? -1 : 0;
    sx = 0;
    if (m.shake > 0) sx = ((tick / 40) | 0) % 2 ? 1 : -1;
    sc = m.scale || 1;
    drawShadow(g, m.x + sx, m.y, sc > 1.2 ? 6 : 4);
    if (sc !== 1) {
      g.save();
      g.imageSmoothingEnabled = false;
      g.translate(Math.round(m.x + sx), Math.round(m.y + bob));
      g.scale(sc, sc);
      Assets.draw(g, m.sprite, 0, 0, m.frame);
      g.restore();
    } else {
      Assets.draw(g, m.sprite, m.x + sx, m.y + bob, m.frame);
    }
  }

  function drawPickups(g) {
    var i, pk, L, bob, scene;
    scene = lootScene();
    for (i = 0; i < groundLoot.length; i++) {
      L = groundLoot[i];
      if (L.scene !== scene) continue;
      bob = L.popAge >= LOOT_POP_MS ? Math.round(Math.sin(tick / 280) * 1) : 0;
      Assets.draw(g, pickupSprite(L.kind), Math.round(L.x - 8), Math.round(L.y - 8 + bob));
    }
    for (i = 0; i < pickups.length; i++) {
      pk = pickups[i];
      Assets.draw(g, pickupSprite(pk.kind), Math.round(pk.x - 8), Math.round(pk.y - 8));
    }

  function drawSparks(g) {
    var i, sp, life;
    for (i = 0; i < sparks.length; i++) {
      sp = sparks[i];
      life = 1 - sp.age / sp.life;
      if (life <= 0) continue;
      g.fillStyle = sp.col;
      g.fillRect(Math.round(sp.x), Math.round(sp.y), 1, 1);
      if (life > 0.45) g.fillRect(Math.round(sp.x) + 1, Math.round(sp.y) - 1, 1, 1);

  function drawDialogue(g) {
    if (!dialogue) return;
    var lines = dialogue.lines || [];
    var title = dialogue.title || "";
    var x = 16, w = 288;
    var h = 16 + Math.max(2, lines.length) * 10;

    woodPanel(g, x + 8, y - 6, tw, 11);

    }

  function clamp01(t) {
    if (t <= 0) return 0;
    if (t >= 1) return 1;
    return t;
  }

  function easeOutBack(t) {
    var u;
    if (t <= 0) return 0;
    if (t >= 1) return 1;
    u = t - 1;
    return 1 + 2.70158 * u * u * u + 1.70158 * u * u;
  }

  function drawUnlockBadge(g, cx, cy, scale) {
    var s = Assets.spr.starBadge;
    var fw, fh, dw, dh;
    if (s && Assets.img) {
      fw = s.fw || s.w;
      fh = s.h;
      dw = Math.round(fw * scale);
      dh = Math.round(fh * scale);
      if (dw < 2) dw = 2;
      if (dh < 2) dh = 2;
      g.drawImage(
        Assets.img,
        s.x, s.y, fw, fh,
        Math.round(cx - dw / 2), Math.round(cy - dh / 2),
        dw, dh
      );
      return;
    }
    Assets.draw(g, "trophy", Math.round(cx - 8), Math.round(cy - 8));
  }

  function drawToast(g) {
    if (!toast) return;
    var age = toast.age;
    var dim = clamp01(age / 180) * 0.58;
    var pop = easeOutBack(clamp01(age / 480));
    var badgeScale = 0.22 + 0.78 * pop;
    var cardA = clamp01((age - 380) / 240);
    var cx = (VIEW_W / 2) | 0;
    var cy = 56;
    var i, b, bx, by, fr, ring, rayA, rayL, ra, t, x0, y0, x1, y1, steps;
    var name, blurb, w, x, y, tw, okW, okX, okY;

    if (age > 480) badgeScale = 1 + 0.045 * Math.sin(age / 160);

    g.fillStyle = "rgba(42,26,16," + dim.toFixed(3) + ")";
    g.fillRect(0, 0, VIEW_W, VIEW_H);

    if (age < 900) {
      ring = 10 + clamp01(age / 520) * 44;
      strokeCircle(g, cx, cy, ring, "rgba(232,200,74," + (0.58 * (1 - age / 900)).toFixed(2) + ")");
      if (ring > 10) {
        strokeCircle(g, cx, cy, ring - 7, "rgba(243,210,163," + (0.38 * (1 - age / 900)).toFixed(2) + ")");
      }
    }

    if (age < 820) {
      rayA = 0.6 * (1 - age / 820);
      rayL = 8 + clamp01(age / 380) * 30;
      g.fillStyle = "rgba(240,208,96," + rayA.toFixed(2) + ")";
      for (i = 0; i < 8; i++) {
        ra = (i / 8) * Math.PI * 2 + age * 0.0011;
        x0 = Math.round(cx + Math.cos(ra) * 9);
        y0 = Math.round(cy + Math.sin(ra) * 9);
        x1 = Math.round(cx + Math.cos(ra) * rayL);
        y1 = Math.round(cy + Math.sin(ra) * rayL);
        steps = 7;
        for (t = 0; t <= steps; t++) {
          g.fillRect(
            Math.round(x0 + (x1 - x0) * t / steps),
            Math.round(y0 + (y1 - y0) * t / steps),
            1,
            1
          );
        }
      }
    }

    drawUnlockBadge(g, cx, cy, badgeScale);

    for (i = 0; i < toast.bits.length; i++) {
      b = toast.bits[i];
      bx = Math.round(cx + Math.cos(b.ang) * b.dist);
      by = Math.round(cy + Math.sin(b.ang) * b.dist * 0.78);
      fr = b.age > b.life * 0.55 ? 0 : b.frame;
      g.save();
      g.globalAlpha = clamp01(1 - b.age / b.life);
      Assets.draw(g, "sparkle", bx - 8, by - 8, fr);
      g.restore();
    }

    if (cardA <= 0) return;
    g.save();
    g.globalAlpha = cardA;
    name = toast.name;
    blurb = toast.blurb;
    w = textWidth(name) + 24;
    if (textWidth(blurb) + 24 > w) w = textWidth(blurb) + 24;
    if (w < 168) w = 168;
    if (w > 280) w = 280;
    x = ((VIEW_W - w) / 2) | 0;
    y = 90;
    woodPanel(g, x, y, w, 60);
    fill(g, x + 4, y + 4, w - 8, 52, C.parch);
    woodPanel(g, x + 8, y - 6, 62, 11);
    drawText(g, "A STAR!", x + 12, y - 3, C.parch);
    tw = textWidth(name);
    drawText(g, name, x + ((w - tw) / 2) | 0, y + 14, C.uiText);
    tw = textWidth(blurb);
    drawText(g, blurb, x + ((w - tw) / 2) | 0, y + 26, C.woodSh);
    if (toast.ready) {
      okW = 28;
      okX = x + ((w - okW) / 2) | 0;
      okY = y + 41;
      woodPanel(g, okX, okY, okW, 12);
      drawText(g, "OK", okX + 8, okY + 3, C.parch);
    }
    g.restore();
  }

  function hitSprite(p, x, y, w, h, ox, oy) {

  function drawText(g, str, x, y, color) {
    g.fillStyle = color;
    var i, r, c, bits, ch;
    for (i = 0; i < str.length; i++) {
      ch = str.charAt(i);
      bits = FONT[ch] || FONT[" "];
      for (r = 0; r < 7; r++) {
        for (c = 0; c < 5; c++) {
          if (bits[r] & (0x10 >> c)) {
            g.fillRect(x + i * 6 + c, y + r, 1, 1);

        }

    }
  }

    var i, ox, col;
    if (n) {

      }
    }
    if (w) {
      for (i = 0; i < 16; i++) {

        px(g, dx, dy + i, col);

  function strokeCircle(g, cx, cy, r, color) {
    g.fillStyle = color;
    var a, x, y;
    for (a = 0; a < 360; a += 10) {
      x = Math.round(cx + Math.cos(a * Math.PI / 180) * r);
      y = Math.round(cy + Math.sin(a * Math.PI / 180) * r);
      g.fillRect(x, y, 1, 1);
    }
  }

  function fillDisk(g, cx, cy, r, color) {
    var x, y;
    g.fillStyle = color;
    for (y = -r; y <= r; y++) {
      for (x = -r; x <= r; x++) {
        if (x * x + y * y <= r * r) g.fillRect(cx + x, cy + y, 1, 1);
      }
    }
  }

  function houseShellTile(tx, ty) {
    if (currentScene !== "house") return "wall";
    if ((tx === 0 || tx === COLS - 1) && (ty === 0 || ty === ROWS - 1)) return "housePost";
    if (ty === 0) return "houseWallN";
    if (ty === ROWS - 1) return "houseWallS";
    if (tx === 0) return "houseWallL";
    if (tx === COLS - 1) return "houseWallR";
    return "inwall";
  }


  function drawFestivalSparkles(g) {
    var amt, i, sx, sy, fr, wx, wy;
    if (!festivalOn || currentScene !== "overworld") return;
    amt = lanternGlowAmt();
    if (amt < 0.08) return;
    g.save();
    for (i = 0; i < 8; i++) {
      wx = (46 + (i * 1.6) % 10) * TILE + 4 + ((tick / 90 + i * 11) % 10);
      wy = (28 + (i * 0.8) % 5) * TILE + ((tick / 120 + i * 7) % 9);
      sx = wx;
      sy = wy;
      g.globalAlpha = (0.28 + 0.42 * Math.abs(Math.sin(tick / 220 + i))) * amt;
      fr = ((tick / 150 + i) | 0) % 3;
      if (Assets.spr.sparkle) Assets.draw(g, "sparkle", sx, sy, fr);
    }
    g.restore();
  }

  function drawFestivalStar(g) {
    var amt, cx, cy, a;
    if (!festivalOn || currentScene !== "overworld") return;
    amt = lanternGlowAmt();
    if (amt < 0.08) return;
    cx = VIEW_W - 40;
    cy = 38;
    a = 0.40 + 0.40 * Math.abs(Math.sin(tick / 320));
    g.save();
    g.globalAlpha = a * amt;
    if (Assets.spr.faintStar) Assets.draw(g, "faintStar", cx, cy, ((tick / 200) | 0) % 3);
    else if (Assets.spr.sparkle) Assets.draw(g, "sparkle", cx - 8, cy - 8);
    g.restore();
  }

  function drawWorld(g, dt) {
    updateCamera();
    g.fillStyle = currentScene === "mine" ? (C.caveDark || "#14110E") : (currentScene === "house" || currentScene === "shop") ? (C.woodSh || "#7A3E18") : C.grassMid;
    g.fillRect(0, 0, VIEW_W, VIEW_H);
    g.save();
    g.translate(-camX, -camY);

    var x0 = Math.max(0, (camX / TILE) | 0);
    var y0 = Math.max(0, (camY / TILE) | 0);
    var x1 = Math.min(COLS, ((camX + VIEW_W) / TILE | 0) + 2);
    var y1 = Math.min(ROWS, ((camY + VIEW_H) / TILE | 0) + 2);
    var tx, ty, ch, dx, dy;

    for (ty = y0; ty < y1; ty++) {
      for (tx = x0; tx < x1; tx++) {
        ch = cell(tx, ty);
        dx = tx * TILE;
        dy = ty * TILE;
        if (ch === "d") drawDirtTile(g, tx, ty, dx, dy);
        else if (ch === "p") {
          Assets.draw(g, "till", dx, dy);
          var crop = crops[tx + "," + ty];
          if (crop) {
            var bob = cropIsReady(crop) ? Math.round(Math.sin(tick / 280) * 1) : 0;
            Assets.draw(g, cropSprite(crop), dx, dy + bob);
          }
        } else if (ch === "s") {
          if (currentScene === "mine") {
            if (mineFloor >= 4) Assets.draw(g, "deepFloor", dx, dy);
            else Assets.draw(g, ((tx + ty) & 1) ? "mineFloor1" : "mineFloor", dx, dy);
            if (cell(tx, ty - 1) === "#") fill(g, dx, dy, TILE, 2, "rgba(8,6,10,0.55)");
            if (cell(tx - 1, ty) === "#") fill(g, dx, dy, 1, TILE, "rgba(8,6,10,0.28)");
            if (cell(tx + 1, ty) === "#") fill(g, dx + TILE - 1, dy, 1, TILE, "rgba(8,6,10,0.28)");
          } else {
            Assets.draw(g, "stone" + ((tx + ty) & 1), dx, dy);
          }
        } else if (ch === "h") {
          Assets.draw(g, "hill", dx, dy);
        } else if (ch === "k") {
          Assets.draw(g, "path", dx, dy);
        } else if (ch === "c") {
          Assets.draw(g, "cobble", dx, dy);
        } else if (ch === "m") {
          Assets.draw(g, "meadow", dx, dy);
        } else if (ch === "f") {
          Assets.draw(g, currentScene === "house" ? "houseFloor" : "woodfloor", dx, dy);
        } else if (ch === "#") {
          if (currentScene === "mine") {
            Assets.draw(g, mineFloor >= 4 ? "deepWall" : "mineWall", dx, dy);
          } else {
            Assets.draw(g, houseShellTile(tx, ty), dx, dy);
          }
        } else {
          Assets.draw(g, "grass" + grassIndex(tx, ty), dx, dy);
        }
      }
    }

    if (highlight) {
      if (highlight.ghost && Assets.spr[highlight.ghost]) {
        g.globalAlpha = 0.4;
        Assets.draw(g, highlight.ghost, highlight.tx * TILE, highlight.ty * TILE);
        g.globalAlpha = 1;
      }
      if (highlight.ghost) {
        g.fillStyle = "rgba(107,203,60,0.22)";
        g.fillRect(highlight.tx * TILE, highlight.ty * TILE, TILE, TILE);
        g.fillStyle = "rgba(107,203,60,0.7)";
      } else {
        g.fillStyle = "rgba(243,210,163,0.55)";
      }
      g.fillRect(highlight.tx * TILE, highlight.ty * TILE, TILE, 1);
      g.fillRect(highlight.tx * TILE, highlight.ty * TILE, 1, TILE);
      g.fillRect(highlight.tx * TILE, highlight.ty * TILE + 15, TILE, 1);
      g.fillRect(highlight.tx * TILE + 15, highlight.ty * TILE, 1, TILE);
    }

    var i, rp, life, r, alpha;
    for (i = ripples.length - 1; i >= 0; i--) {
      rp = ripples[i];
      rp.age += dt;
      life = rp.age / 520;
      if (life >= 1) {
        ripples.splice(i, 1);
        continue;
      }
      r = 2 + life * 16;
      alpha = 1 - life;
      strokeCircle(g, rp.x, rp.y, r, "rgba(243,210,163," + (alpha * 0.85).toFixed(2) + ")");
      if (r > 5) {
        strokeCircle(g, rp.x, rp.y, r - 3, "rgba(232,176,96," + (alpha * 0.45).toFixed(2) + ")");
      }
    }

    if (currentScene === "overworld") {
      g.restore();
      drawDayTint(g);
      g.save();
      g.translate(-camX, -camY);
      drawActors(g);
      drawPickups(g);
      drawArrows(g);
      drawSparks(g);
      drawFestivalSparkles(g);
      g.restore();
      drawFestivalStar(g);
    } else {
      drawActors(g);
      drawPickups(g);
      drawArrows(g);
      drawSparks(g);
      g.restore();
      drawDayTint(g);
    }
    drawHUD(g);
    drawDialogue(g);
    drawAchieveList(g);
    drawQuestPlaque(g);
    drawToast(g);
    drawWipeAsk(g);
    drawShop(g);
    drawCraft(g);
    drawChest(g);
    drawSleep(g);
    drawFaint(g);
    drawLineNote(g);
  }

  function readInset(name) {
    var v = getComputedStyle(document.documentElement).getPropertyValue(name);
    return parseFloat(v) || 0;
  }

  function viewSize() {
    var vv = window.visualViewport;
    var w = (vv && vv.width) ? vv.width : window.innerWidth;
    var h = (vv && vv.height) ? vv.height : window.innerHeight;
    if (!fillMode) return { w: w, h: h };
    var sat = readInset("--sat");
    var sab = readInset("--sab");
    var sal = readInset("--sal");
    var sar = readInset("--sar");
    var top = vv ? vv.offsetTop : 0;
    var left = vv ? vv.offsetLeft : 0;
    var cutT = Math.max(0, sat - top);
    var cutL = Math.max(0, sal - left);
    var cutB = Math.max(0, (top + h) - (window.innerHeight - sab));
    var cutR = Math.max(0, (left + w) - (window.innerWidth - sar));
    return { w: Math.max(1, w - cutL - cutR), h: Math.max(1, h - cutT - cutB) };
  }

  function isStandalone() {
    if (window.navigator.standalone === true) return true;
    try {
      if (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) return true;
      if (window.matchMedia && window.matchMedia("(display-mode: fullscreen)").matches) return true;
    } catch (err) {}
    return false;
  }

  function fsEnabled() {
    return !!(document.fullscreenEnabled || document.webkitFullscreenEnabled);
  }

  function fsElement() {
    return document.fullscreenElement || document.webkitFullscreenElement || null;
  }

  function requestFs() {
    var els = [frame, document.documentElement];
    function tryAt(i) {
      if (i >= els.length) return;
      var el = els[i];
      if (!el) { tryAt(i + 1); return; }
      var fn = el.requestFullscreen || el.webkitRequestFullscreen || el.webkitRequestFullScreen;
      if (!fn) { tryAt(i + 1); return; }
      try {
        var p = fn.call(el);
        if (p && typeof p.catch === "function") p.catch(function () { tryAt(i + 1); });
      } catch (err) {
        tryAt(i + 1);
      }
    }
    tryAt(0);
  }

  function exitNativeFs() {
    if (!fsElement()) return;
    var fn = document.exitFullscreen || document.webkitExitFullscreen || document.webkitCancelFullScreen;
    if (!fn) return;
    try {
      var p = fn.call(document);
      if (p && typeof p.catch === "function") p.catch(function () {});
    } catch (err) {}
  }

  function paintWoodHud(face, btn, label, off, ariaOn, ariaOff) {
    var g, fw, fh;
    if (!face) return;
    g = face.getContext("2d");
    fw = 18;
    fh = 11;
    face.width = fw;
    face.height = fh;
    g.imageSmoothingEnabled = false;
    woodPanel(g, 0, 0, fw, fh);
    drawText(g, label, ((fw - textWidth(label)) / 2) | 0, 2, off ? C.woodSh : C.parch);
    if (btn) {
      btn.setAttribute("aria-label", off ? ariaOff : ariaOn);
      if (off) btn.classList.add("is-off");
      else btn.classList.remove("is-off");
    }
  }

  function paintFsFace() {
    paintWoodHud(fsFace, fsBtn, fillMode ? "X" : "FS", false,
      fillMode ? "Exit Full Screen" : "Full Screen",
      fillMode ? "Exit Full Screen" : "Full Screen");

  function paintHudFaces() {
    paintWoodHud(sfxFace, sfxBtn, "FX", sfxMuted, "Sound effects on", "Sound effects off");
    paintWoodHud(musFace, musBtn, "MU", musicMuted, "Music on", "Music off");
    paintFsFace();
    paintWoodHud(rlFace, rlBtn, "RL", false, "Reload farm", "Reload farm");
  }

  function hideSafariChrome() {
    try {
      document.documentElement.style.minHeight = "calc(100% + 2px)";
      window.scrollTo(0, 0);
      setTimeout(function () {
        window.scrollTo(0, 1);
        resize();
      }, 50);
      setTimeout(function () {
        window.scrollTo(0, 0);
        resize();
      }, 280);
    } catch (err) {}
  }

  function enterFill() {
    fillMode = true;
    document.documentElement.classList.add("fill-on");
    document.body.classList.add("fill-on");
    paintFsFace();
    resize();
  }

  function leaveFill() {
    fillMode = false;
    document.documentElement.classList.remove("fill-on");
    document.body.classList.remove("fill-on");
    document.documentElement.style.minHeight = "";
    paintFsFace();
    resize();
    exitNativeFs();
  }

  function enterFull() {
    if (fsEnabled()) requestFs();
    enterFill();
    hideSafariChrome();
  }

  function onFsChange() {
    if (fsElement()) {
      if (!fillMode) enterFill();
      else resize();
    } else if (fillMode) {
      leaveFill();
    }
  }

  function pinFrame() {
    if (!frame) return;
    var vv = window.visualViewport;
    if (fillMode && vv && !fsElement()) {
      frame.style.top = vv.offsetTop + "px";
      frame.style.left = vv.offsetLeft + "px";
      frame.style.width = vv.width + "px";
      frame.style.height = vv.height + "px";
      frame.style.right = "auto";
      frame.style.bottom = "auto";
    } else {
      frame.style.top = "";
      frame.style.left = "";
      frame.style.width = "";
      frame.style.height = "";
      frame.style.right = "";
      frame.style.bottom = "";
    }
  }

  function resize() {
    pinFrame();
    var vs = viewSize();
    var w = vs.w;
    var h = vs.h;
    if (fillMode) {
      scale = Math.min(w / VIEW_W, h / VIEW_H);
      if (scale < 0.5) scale = 0.5;
    } else {
      scale = Math.floor(Math.min(w / VIEW_W, h / VIEW_H));
      if (scale < 1) scale = 1;
      if (scale > 6) scale = 6;
    }
    canvas.style.width = (VIEW_W * scale) + "px";
    canvas.style.height = (VIEW_H * scale) + "px";
    ctx.imageSmoothingEnabled = false;
  }

  function pointFromEvent(e) {
    var src = e;
    if (e.changedTouches && e.changedTouches[0]) src = e.changedTouches[0];
    else if (e.touches && e.touches[0]) src = e.touches[0];
    var rect = canvas.getBoundingClientRect();
    return {
      x: (src.clientX - rect.left) / rect.width * VIEW_W,
      y: (src.clientY - rect.top) / rect.height * VIEW_H
    };
  }

  function tapHud(p) {
    var slots = HUD_SLOTS;
    var slot = 18;
    var gap = 1;
    var barW = slots * slot + (slots - 1) * gap;
    var bx = ((VIEW_W - barW) / 2) | 0;
    var by = VIEW_H - 22;
    if (hitSwordBtn(p)) {
      startSwordSwing();
      return true;
    }
    if (p.y >= by - 3 && p.y <= by + 18 && p.x >= bx && p.x <= bx + barW) {
      var idx = ((p.x - bx) / (slot + gap)) | 0;
      if (idx >= 0 && idx < slots) {
        selectedSlot = idx;
        playSfx("ui");
        if (idx === SLOT_SNACK && (inventory.snack || 0) > 0) eatSnack();
        if (idx === SLOT_VEGGIE && (inventory.veggie || 0) > 0) eatCarrot();
        if (idx === SLOT_HAT && hatOwned) {
          hatOn = !hatOn;
          persistSave();
        }
      }
      return true;
    }
    if (p.x >= 46 && p.x <= 112 && p.y >= 3 && p.y <= 21) return true;
    if (p.x >= 4 && p.x <= 22 && p.y >= 3 && p.y <= 21) {
      playSfx("ui");
      achieveOpen = !achieveOpen;
      questOpen = false;
      return true;
    }
    if (p.x >= 24 && p.x <= 42 && p.y >= 3 && p.y <= 21) {
      playSfx("ui");
      questOpen = !questOpen;
      achieveOpen = false;
      return true;
    }
    if (p.x >= 206 && p.x <= 316 && p.y >= 4 && p.y <= 25) return true;
    if (p.x >= VIEW_W - 18 && p.x <= VIEW_W - 2 && p.y >= VIEW_H - 80 && p.y <= VIEW_H - 14) return true;
    return false;
  }

  function tap(e) {
    var p = pointFromEvent(e);
    if (p.x < 0 || p.y < 0 || p.x >= VIEW_W || p.y >= VIEW_H) return;

    if (toast) {
      if (toast.ready) dismissUnlock();
      return;
    }
    if (dialogue) {
      dialogue = null;
      return;
    }
    if (wipeAsk) {
      tapWipeAsk(p);
      return;
    }
    if (sleepFx || faintFx) return;
    if (achieveOpen) {
      achieveOpen = false;
      return;
    }
    if (questOpen) {
      if (!tapJournal(p)) questOpen = false;
      return;
    }
    if (shopOpen) {
      tapShop(p);
      return;
    }
    if (craftOpen) {
      tapCraft(p);
      return;
    }
    if (chestOpen) {
      tapChest(p);
      return;
    }

    if (tapHud(p)) return;
    if (player.arc > 0) return;

    kbDrive = false;
    var world = { x: p.x + camX, y: p.y + camY };
    var tx = Math.floor(world.x / TILE);
    var ty = Math.floor(world.y / TILE);
    var harvest = harvestableAtTile(tx, ty);
    if (player.hitting && harvest && player.hitting.prop === harvest) return;
    cancelHit();

    if (currentScene === "overworld") {
      if (hitSprite(world, npc.x, npc.y, 16, 32, 8, 28)) {
        goTalk();
        return;
      }
      if (hitSprite(world, chicken.x, chicken.y, 16, 16, 8, 14)) {
        chicken.react = 420;
        chicken.idle = 500;
        return;
      }
      if (nimVisible() && hitSprite(world, nim.x, nim.y, 16, 32, 8, 28)) {
        goTalkNim();
        return;
      }
      var fi, f;
      for (fi = 0; fi < townFolk.length; fi++) {
        f = townFolk[fi];
        if (hitSprite(world, f.x, f.y, 16, 32, 8, 28)) {
          goTalkFolk(f);
          return;
        }
      }
      if (carSpriteHit(world)) {
        goTapCar();
        return;
      }
    }
    if (currentScene === "shop") {
      if (hitSprite(world, tileCenterX(8), tileFootY(4), 16, 32, 8, 28)) {
        talkPip();
        return;
      }
    }
    if (currentScene === "mine") {
      var mi, monHit;
      for (mi = 0; mi < monsters.length; mi++) {
        monHit = monsters[mi];
        if (monHit.hp <= 0) continue;
        if (hitSprite(world, monHit.x, monHit.y, 16, 16, 8, 14)) {
          goFight(monHit);
          return;
        }
      }
    }

    if (tx < 0 || ty < 0 || tx >= COLS || ty >= ROWS) return;
    highlight = { tx: tx, ty: ty };
    ripples.push({
      x: tx * TILE + 8,
      y: ty * TILE + 8,
      age: 0
    });
    if (currentScene === "overworld" && tx === npc.tx && ty === npc.ty) {
      goTalk();
      return;
    }
    if (currentScene === "overworld" && tx === chicken.tx && ty === chicken.ty) {
      chicken.react = 420;
      chicken.idle = 500;
      return;
    }
    if (isMineEntrance(tx, ty) || caveAt(tx, ty)) {
      goEnter();
      return;
    }
    if (mailboxHit(tx, ty, world)) {
      goMail();
      return;
    }
    if (houseDoorHit(tx, ty, world)) {
      goEnterHouse();
      return;
    }
    if (shopDoorHit(tx, ty, world) || isShopEntrance(tx, ty)) {
      goEnterShop();
      return;
    }
    var hitHole = holeHit(tx, ty, world);
    if (isMineDown(tx, ty) || (hitHole && hitHole.kind === "hole")) {
      goMineShaft(true);
      return;
    }
    if (isMineUp(tx, ty) || (hitHole && hitHole.kind === "ladder" && mineFloor > 1)) {
      goMineShaft(false);
      return;
    }
    if (isMineExit(tx, ty)) {
      goExit();
      return;
    }
    if (isHouseExit(tx, ty) || (currentScene === "house" && tx === houseOut.tx && ty === houseOut.ty + 1)) {
      goExitHouse();
      return;
    }
    if (isShopExit(tx, ty) || (currentScene === "shop" && tx === shopOut.tx && ty === shopOut.ty + 1)) {
      goExitShop();
      return;
    }
    var hitProp = propAt(tx, ty);
    if (!hitProp) {
      var hi;
      for (hi = 0; hi < PROPS.length; hi++) {
        if (isCollectible(PROPS[hi]) || PROPS[hi].kind === "note" || PROPS[hi].kind === "mailbox" || PROPS[hi].kind === "swordPedestal" || PROPS[hi].kind === "hole" || PROPS[hi].kind === "ladder" || PROPS[hi].kind === "moonAltar") {
          var bb = propBounds(PROPS[hi]);
          if (world.x >= bb.x && world.x < bb.x + bb.w && world.y >= bb.y && world.y < bb.y + bb.h) {
            hitProp = PROPS[hi];
            break;
          }
        }
      }
    }
    if (currentScene === "house" && (bedHit(tx, ty, world) || (hitProp && hitProp.kind === "bed"))) {
      goSleep();
      return;
    }
    if (currentScene === "house" && (workbenchHit(tx, ty, world) || (hitProp && hitProp.kind === "workbench"))) {
      goCraft();
      return;
    }
    if (currentScene === "house" && (houseChestHit(tx, ty, world) || (hitProp && hitProp.kind === "houseChest"))) {
      goChest();
      return;
    }
    if (currentScene === "house" && homeLightOn() && (tableHit(tx, ty, world) || (hitProp && hitProp.kind === "table"))) {
      goHomeLight();
      return;
    }
    if (hitProp && (hitProp.kind === "doormat" || hitProp.kind === "inndoor")) {
      if (currentScene === "shop") goExitShop();
      else goExitHouse();
      return;
    }
    if (currentScene === "shop" && hitProp && (hitProp.kind === "counter" || hitProp.kind === "shopSign")) {
      if (!pipDone && hasCopperToGive()) {
        talkPip();
        return;
      }
      openShop();
      return;
    }
    if (currentScene === "overworld" && nimVisible() && tx === nim.tx && ty === nim.ty) {
      goTalkNim();
      return;
    }
    if (currentScene === "overworld" && folkAt(tx, ty)) {
      goTalkFolk(folkAt(tx, ty));
      return;
    }
    if (currentScene === "overworld" && carOccupies(tx, ty)) {
      goTapCar();
      return;
    }
    if (currentScene === "overworld" && hitProp && (hitProp.kind === "statue" || hitProp.kind === "fountain" || hitProp.kind === "townHouseA" || hitProp.kind === "townHouseB")) {
      goLandmark(hitProp);
      return;
    }
    if (hitProp && hitProp.kind === "note") {
      goReadNote();
      return;
    }
    if (hitProp && hitProp.kind === "mailbox") {
      goMail();
      return;
    }
    if (hitProp && isCollectible(hitProp)) {
      goCollect(hitProp);
      return;
    }
    if (inBounds(tx, ty) && lootAtTile(tx, ty).length) {
      goCollectLootAt(tx, ty);
      return;
    }
    if (hitProp && hitProp.kind === "swordPedestal") {
      goTakeSword(hitProp);
      return;
    }
    if (hitProp && hitProp.kind === "moonAltar") {
      goPeakAltar(hitProp);
      return;
    }
    if (currentScene === "mine") {
      var tapMon = monsterAt(tx, ty);
      if (tapMon && tapMon.hp > 0) {
        goFight(tapMon);
        return;
      }
    }
    if (hitProp && isPickablePlant(hitProp)) {
      goPickPlant(hitProp);
      return;
    }
    if (hitProp && isSliceable(hitProp)) {
      goCutGrass(hitProp);
      return;
    }
    if (harvest) {
      goHarvest(harvest);
      return;
    }
    if (cell(tx, ty) === "p" && cropIsReady(crops[tx + "," + ty])) {
      goPickCrop(tx, ty);
      return;
    }
    if (selectedSlot === SLOT_SEED && cell(tx, ty) === "p" && !crops[tx + "," + ty]) {
      goPlant(tx, ty);
      return;
    }
    if (selectedSlot === SLOT_SHOVEL && shovelOwned && canDigOn(tx, ty)) {
      goDig(tx, ty);
      return;
    }
    if (selectedSlot === SLOT_SHOVEL && currentScene === "overworld") {
      highlight = { tx: tx, ty: ty };
      slotShake = 180;
      return;
    }
    if (selectedSlot === SLOT_FLOWER && (inventory.flower || 0) > 0 && (cell(tx, ty) === "g" || cell(tx, ty) === "m")) {
      highlight = { tx: tx, ty: ty };
      if (isNear(player.tx, player.ty, tx, ty) || (player.tx === tx && player.ty === ty)) {
        tryPlantFlower(tx, ty);
        return;
      }
      var fdest = nearestAdjacent(tx, ty);
      if (fdest) {
        pending = { type: "plantFlower", tx: tx, ty: ty };
        startWalk(player, findPath(player.tx, player.ty, fdest.tx, fdest.ty), 3.5);
      }
      return;
    }
    if ((selectedSlot === SLOT_WOOD || selectedSlot === SLOT_STONE) && canBuildOn(tx, ty)) {
      goBuild(tx, ty);
      return;
    }
    if ((selectedSlot === SLOT_WOOD || selectedSlot === SLOT_STONE) && currentScene === "overworld") {
      highlight = { tx: tx, ty: ty };
      slotShake = 180;
      return;
    }
    if (swordEquipped() && (isNear(player.tx, player.ty, tx, ty) || (player.tx === tx && player.ty === ty))) {
      if (currentScene === "mine" || currentScene === "overworld") {
        swingAtFacing();
        return;
      }
    }
    goWalk(tx, ty);
  }

  function loop(ts) {
    if (!lastTs) lastTs = ts;
    var dt = ts - lastTs;
    if (dt > 64) dt = 64;
    lastTs = ts;
    ctx.imageSmoothingEnabled = false;
    updateSleep(dt);
    updateFaint(dt);
    updateLineNote(dt);
    if (!uiPaused()) {
      updateSwordArc(dt);
      updateArrows(dt);
      if (player.hitting) {
        updateHit(dt);
      } else if (player.arc > 0) {
        /* locked in the sword arc */
      } else if (player.moving || (player.path && player.path.length)) {
        if (advanceWalk(player, dt)) {
          arrive();
          tryKeyboardStep();
        }
      } else {
        if (player.swing > 0) player.swing -= dt;
        tryKeyboardStep();
      }
      updateChicken(dt);
      updateTownFolk(dt);
      updateNim(dt);
      updateCar(dt);
      updateMonsters(dt);
      if (iFrames > 0) iFrames -= dt;
      updatePickups(dt);
      updateGroundLoot(dt);
      updateFx(dt);
      tick += dt;
    }
    if (shopMsgT > 0) shopMsgT -= dt;
    if (craftMsgT > 0) craftMsgT -= dt;
    if (chestMsgT > 0) chestMsgT -= dt;
    updateClock(dt);
    updateToasts(dt);
    tickMusic();
    drawWorld(ctx, dt);
    requestAnimationFrame(loop);
  }

  function paintLoading() {
    ctx.imageSmoothingEnabled = false;
    ctx.fillStyle = C.grassMid;
    ctx.fillRect(0, 0, VIEW_W, VIEW_H);
    woodPanel(ctx, 86, 86, 148, 20);
    drawText(ctx, "LOADING FARM", 96, 92, C.parch);
  }

  function paintMissing() {
    ctx.imageSmoothingEnabled = false;
    ctx.fillStyle = C.letterbox;
    ctx.fillRect(0, 0, VIEW_W, VIEW_H);
    drawText(ctx, "ART MISSING", 8, 8, C.parch);
  }

  paintLoading();
  loadSave();
  applyScene("overworld");
  applyRestore();
  persistSave();
  updateCamera();
  paintHudFaces();
  if (isStandalone()) enterFill();
  else resize();
  window.addEventListener("resize", resize);
  if (window.visualViewport) {
    window.visualViewport.addEventListener("resize", resize);
    window.visualViewport.addEventListener("scroll", resize);
  }
  document.addEventListener("fullscreenchange", onFsChange);
  document.addEventListener("webkitfullscreenchange", onFsChange);
  function bindHudBtn(btn, fn) {
    if (!btn) return;
    btn.addEventListener("pointerdown", function (e) {
      e.preventDefault();
      e.stopPropagation();
      fn();
    });
    btn.addEventListener("click", function (e) {
      e.preventDefault();
      e.stopPropagation();
    });
  }
  bindHudBtn(fsBtn, function () {
    if (fillMode) leaveFill();
    else enterFull();
  });
  bindHudBtn(rlBtn, function () {
    playSfx("ui");
    reloadFarm();
  });
  bindHudBtn(sfxBtn, function () {
    if (!sfxMuted) playSfx("ui");
    sfxMuted = !sfxMuted;
    audioMuted = sfxMuted && musicMuted;
    if (!sfxMuted) {
      unlockAudio();
      playSfx("ui");
    }
    paintHudFaces();
    persistSave();
  });
  bindHudBtn(musBtn, function () {
    musicMuted = !musicMuted;
    audioMuted = sfxMuted && musicMuted;
    if (!musicMuted) unlockAudio();
    tickOverworldBgm(wantedTune());
    paintHudFaces();
    persistSave();
  });
  document.addEventListener("keydown", function (e) {
    unlockAudio();
    var mk = moveKey(e);
    if (mk) {
      e.preventDefault();
      if (e.repeat) return;
      dropMoveKey(mk.id);
      kbHeld.push(mk);
      takeKeyboard();
      return;
    }
    if (hasActionTool() && !e.repeat && (e.code === "Space" || e.code === "KeyJ" || e.key === " " || e.key === "j" || e.key === "J")) {
      if (e.target && (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA")) return;
      e.preventDefault();
      startSwordSwing();
      return;
    }
    if ((e.key === "Escape" || e.key === "Esc") && fillMode) {
      e.preventDefault();
      leaveFill();
    }
  });
  document.addEventListener("keyup", function (e) {
    var mk = moveKey(e);
    if (!mk) return;
    e.preventDefault();
    dropMoveKey(mk.id);
  });
  window.addEventListener("blur", clearMoveKeys);
  document.addEventListener("touchstart", function (e) {
    if (!fillMode || !e.touches || !e.touches[0]) return;
    swipeStartY = e.touches[0].clientY < 56 ? e.touches[0].clientY : null;
  }, { passive: true });
  document.addEventListener("touchend", function (e) {
    if (swipeStartY == null || !e.changedTouches || !e.changedTouches[0]) return;
    var dy = e.changedTouches[0].clientY - swipeStartY;
    swipeStartY = null;
    if (dy > 70) leaveFill();
  }, { passive: true });
  document.addEventListener("visibilitychange", function () {
    if (document.hidden) {
      persistSave();
      clearMoveKeys();
      audioTune = "";
      if (overworldBgm && !overworldBgm.paused) overworldBgm.pause();
    } else if (audioUnlocked && audioCtx && audioCtx.state === "suspended" && (!sfxMuted || !musicMuted)) {
      audioCtx.resume();
    }
  });
  window.addEventListener("pagehide", persistSave);
  function unlockFromGesture() { unlockAudio(); }
  document.addEventListener("pointerdown", unlockFromGesture, true);
  document.addEventListener("touchstart", unlockFromGesture, true);
  canvas.addEventListener("pointerdown", tap, { passive: true });
  document.addEventListener("touchmove", function (e) {
    e.preventDefault();
  }, { passive: false });
  document.addEventListener("gesturestart", function (e) {
    e.preventDefault();
  });
  document.addEventListener("dblclick", function (e) {
    e.preventDefault();
  });
  checkFreshBuild();
  Assets.load().then(function () {
    requestAnimationFrame(loop);
  }).catch(function () {
    paintMissing();
  });
})();
  </script>
</body>
</html>
