<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#2A1A10">
  <meta name="format-detection" content="telephone=no">
  <title>Moondrop Mountain</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      overscroll-behavior: none;
      -webkit-text-size-adjust: 100%;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none;
      user-select: none;
      background: #2A1A10;
    }
    body {
      position: fixed;
      inset: 0;
    }
    #frame {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #2A1A10;
    }
    #game {
      display: block;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      -ms-interpolation-mode: nearest-neighbor;
      background: #5FBF22;
    }
  </style>
</head>
<body>
  <div id="frame">
    <canvas id="game" width="320" height="192" role="application" aria-label="Moondrop Mountain"></canvas>
  </div>
  <script>
(function () {
  "use strict";

  var VIEW_W = 320;
  var VIEW_H = 192;
  var TILE = 16;
  var COLS = 20;
  var ROWS = 12;

  var C = {
    sky: "#8EC8E8",
    grassHi: "#8FD42A",
    grassMid: "#5FBF22",
    grassSh: "#2F7A14",
    grassDp: "#1E5A12",
    dirtHi: "#F0B428",
    dirtMid: "#D49420",
    dirtSh: "#A86C14",
    till: "#B56F29",
    tillSh: "#6D4427",
    tillOut: "#3E2410",
    water: "#4A96C8",
    waterDp: "#2E6A96",
    waterFm: "#A8D4E8",
    stone: "#8A8A7A",
    stoneHi: "#B0B0A0",
    stoneSh: "#5A5A4E",
    woodHi: "#E8B060",
    woodMid: "#C47A38",
    woodSh: "#7A3E18",
    woodOut: "#3D1A0C",
    roof: "#C45A38",
    roofHi: "#E07850",
    roofSh: "#8B2E1C",
    parch: "#F3D2A3",
    uiText: "#3A2210",
    gold: "#8B1A1A",
    energy: "#6BCB3C",
    energyEmpty: "#3A4A20",
    slot: "#8B5A28",
    bevelDk: "#5B2B2A",
    leaf: "#4A9A28",
    flower: "#E8C84A",
    blossom: "#E8A0A8",
    door: "#5A3A22",
    glass: "#7AB8C8",
    letterbox: "#2A1A10",
    skin: "#F0C090"
  };

  /* 5x7 bitmasks, bit4 = left */
  var FONT = {
    " ": [0,0,0,0,0,0,0],
    "A": [0x0E,0x11,0x11,0x1F,0x11,0x11,0x11],
    "B": [0x1E,0x11,0x11,0x1E,0x11,0x11,0x1E],
    "C": [0x0E,0x11,0x10,0x10,0x10,0x11,0x0E],
    "D": [0x1E,0x11,0x11,0x11,0x11,0x11,0x1E],
    "E": [0x1F,0x10,0x10,0x1E,0x10,0x10,0x1F],
    "F": [0x1F,0x10,0x10,0x1E,0x10,0x10,0x10],
    "G": [0x0E,0x11,0x10,0x17,0x11,0x11,0x0E],
    "H": [0x11,0x11,0x11,0x1F,0x11,0x11,0x11],
    "I": [0x1F,0x04,0x04,0x04,0x04,0x04,0x1F],
    "J": [0x01,0x01,0x01,0x01,0x11,0x11,0x0E],
    "K": [0x11,0x12,0x14,0x18,0x14,0x12,0x11],
    "L": [0x10,0x10,0x10,0x10,0x10,0x10,0x1F],
    "M": [0x11,0x1B,0x15,0x15,0x11,0x11,0x11],
    "N": [0x11,0x19,0x15,0x13,0x11,0x11,0x11],
    "O": [0x0E,0x11,0x11,0x11,0x11,0x11,0x0E],
    "P": [0x1E,0x11,0x11,0x1E,0x10,0x10,0x10],
    "Q": [0x0E,0x11,0x11,0x11,0x15,0x12,0x0D],
    "R": [0x1E,0x11,0x11,0x1E,0x14,0x12,0x11],
    "S": [0x0F,0x10,0x10,0x0E,0x01,0x01,0x1E],
    "T": [0x1F,0x04,0x04,0x04,0x04,0x04,0x04],
    "U": [0x11,0x11,0x11,0x11,0x11,0x11,0x0E],
    "V": [0x11,0x11,0x11,0x11,0x11,0x0A,0x04],
    "W": [0x11,0x11,0x11,0x15,0x15,0x1B,0x11],
    "X": [0x11,0x11,0x0A,0x04,0x0A,0x11,0x11],
    "Y": [0x11,0x11,0x0A,0x04,0x04,0x04,0x04],
    "Z": [0x1F,0x01,0x02,0x04,0x08,0x10,0x1F],
    "1": [0x04,0x0C,0x04,0x04,0x04,0x04,0x0E],
    "'": [0x04,0x04,0x08,0x00,0x00,0x00,0x00],
    "·": [0x00,0x00,0x00,0x04,0x00,0x00,0x00],
    ".": [0x00,0x00,0x00,0x00,0x00,0x04,0x04],
    "!": [0x04,0x04,0x04,0x04,0x04,0x00,0x04]
  };

  var canvas = document.getElementById("game");
  var ctx = canvas.getContext("2d");
  var scale = 3;
  var assets = {};
  var highlight = null;
  var ripples = [];
  var selectedSlot = 0;
  var tick = 0;
  var lastTs = 0;
  var dialogue = false;
  var crops = {};
  var pending = null;
  var solid = null;
  var player = {
    tx: 14, ty: 6,
    x: 14 * 16 + 8,
    y: 6 * 16 + 14,
    face: "down",
    frame: 0,
    moving: false,
    path: [],
    stepFrom: null,
    stepT: 0,
    anim: 0
  };
  var chicken = {
    tx: 8, ty: 8,
    x: 8 * 16 + 8,
    y: 8 * 16 + 14,
    face: "right",
    frame: 0,
    path: [],
    stepFrom: null,
    stepT: 0,
    idle: 400,
    anim: 0,
    react: 0
  };
  var npc = {
    tx: 10, ty: 5,
    x: 10 * 16 + 8,
    y: 5 * 16 + 14,
    face: "right",
    frame: 0
  };

  /* Ground: g grass, d dirt path, p tilled, w water */
  var GROUND = [
    "gggggggggggggggggggg",
    "gggggggggggggggggggg",
    "gggggggggggggggggggg",
    "gggggggggggggggggggg",
    "gggggggggggggggggggg",
    "ggggggggggggddddgggg",
    "gggggppgggggddddgggg",
    "gggggppgggggdddggggg",
    "gggggppggggdddgggggg",
    "ggggggggggdddggggggg",
    "gggggggggdddgggggggg",
    "ggggggggddgggggggggg"
  ];

  var PROPS = [
    { kind: "tree", tx: 2, ty: 3 },
    { kind: "house", tx: 13, ty: 1 },
    { kind: "well", tx: 18, ty: 4 },
    { kind: "mailbox", tx: 16, ty: 5 },
    { kind: "crate", tx: 12, ty: 4 },
    { kind: "pond", tx: 1, ty: 9 },
    { kind: "rock", tx: 8, ty: 3 },
    { kind: "rock", tx: 18, ty: 10 },
    { kind: "rock", tx: 11, ty: 11 },
    { kind: "weed", tx: 4, ty: 4 },
    { kind: "weed", tx: 10, ty: 2 },
    { kind: "weed", tx: 12, ty: 5 },
    { kind: "weed", tx: 19, ty: 7 },
    { kind: "weed", tx: 9, ty: 6 },
    { kind: "fenceH", tx: 4, ty: 5 },
    { kind: "fenceH", tx: 5, ty: 5 },
    { kind: "fenceH", tx: 6, ty: 5 },
    { kind: "fenceL", tx: 4, ty: 6 },
    { kind: "fenceL", tx: 4, ty: 7 },
    { kind: "fenceL", tx: 4, ty: 8 },
    { kind: "fenceR", tx: 7, ty: 5 },
    { kind: "fenceR", tx: 7, ty: 6 },
    { kind: "fenceR", tx: 7, ty: 7 },
    { kind: "fenceR", tx: 7, ty: 8 }
  ];

  function make(w, h) {
    var c = document.createElement("canvas");
    c.width = w;
    c.height = h;
    var g = c.getContext("2d");
    g.imageSmoothingEnabled = false;
    return { c: c, g: g };
  }

  function px(g, x, y, color) {
    g.fillStyle = color;
    g.fillRect(x, y, 1, 1);
  }

  function fill(g, x, y, w, h, color) {
    g.fillStyle = color;
    g.fillRect(x, y, w, h);
  }

  function hash(x, y, s) {
    var n = (x * 374761393 + y * 668265263 + s * 1274126177) | 0;
    n = (n ^ (n >>> 13)) * 1274126177;
    return ((n >>> 0) % 1000) / 1000;
  }

  function cell(tx, ty) {
    if (ty < 0 || ty >= ROWS || tx < 0 || tx >= COLS) return "g";
    return GROUND[ty].charAt(tx);
  }

  function buildGrass(v) {
    var o = make(TILE, TILE);
    var g = o.g;
    fill(g, 0, 0, 16, 16, C.grassMid);
    var i, x, y, r;
    for (i = 0; i < 22; i++) {
      r = hash(v, i, 11);
      x = (hash(v, i, 3) * 16) | 0;
      y = (hash(v, i, 7) * 16) | 0;
      if (r < 0.38) px(g, x, y, C.grassHi);
      else if (r < 0.62) px(g, x, y, C.grassSh);
      else if (r < 0.72) px(g, x, y, C.grassDp);
    }
    /* short blades */
    var blades = [
      [2, 4], [7, 2], [12, 6], [4, 10], [10, 12], [14, 3], [1, 13], [8, 8]
    ];
    for (i = 0; i < blades.length; i++) {
      if (hash(v, i, 21) < 0.55 + v * 0.08) {
        x = (blades[i][0] + v) & 15;
        y = blades[i][1];
        px(g, x, y, C.grassHi);
        px(g, x, y + 1, C.grassSh);
      }
    }
    function tuft(x, y) {
      px(g, x, y, C.grassHi);
      px(g, x + 1, y, C.grassMid);
      px(g, x, y + 1, C.grassSh);
      px(g, x - 1, y + 1, C.grassSh);
      px(g, x + 1, y + 1, C.grassDp);
    }
    if (v === 0) { tuft(3, 3); tuft(11, 9); }
    if (v === 1) {
      tuft(6, 5); tuft(12, 12);
      px(g, 5, 6, C.flower);
      px(g, 13, 11, C.blossom);
    }
    if (v === 2) { tuft(2, 10); tuft(9, 2); }
    if (v === 3) {
      tuft(8, 8); tuft(14, 4);
      px(g, 9, 4, C.flower);
    }
    return o.c;
  }

  function buildDirt() {
    var o = make(TILE, TILE);
    var g = o.g;
    fill(g, 0, 0, 16, 16, C.dirtMid);
    var i, x, y, r;
    for (i = 0; i < 16; i++) {
      r = hash(9, i, 4);
      x = (hash(9, i, 1) * 16) | 0;
      y = (hash(9, i, 2) * 16) | 0;
      if (r < 0.4) px(g, x, y, C.dirtHi);
      else if (r < 0.7) px(g, x, y, C.dirtSh);
    }
    return o.c;
  }

  function buildTill() {
    var o = make(TILE, TILE);
    var g = o.g;
    fill(g, 0, 0, 16, 16, C.till);
    fill(g, 0, 0, 16, 1, C.tillOut);
    fill(g, 0, 15, 16, 1, C.tillOut);
    fill(g, 0, 0, 1, 16, C.tillOut);
    fill(g, 15, 0, 1, 16, C.tillOut);
    var rows = [3, 7, 11];
    var i, x;
    for (i = 0; i < rows.length; i++) {
      fill(g, 2, rows[i], 12, 1, C.tillSh);
      fill(g, 2, rows[i] + 1, 12, 1, C.tillOut);
      for (x = 3; x < 14; x += 3) px(g, x, rows[i] - 1, C.dirtSh);
    }
    px(g, 4, 5, C.dirtHi);
    px(g, 11, 9, C.dirtHi);
    return o.c;
  }

  function buildPond() {
    var o = make(36, 32);
    var g = o.g;
    var x, y, dx, dy, d;
    /* irregular pond, not a square window */
    for (y = 0; y < 32; y++) {
      for (x = 0; x < 36; x++) {
        dx = (x - 18) / 15.2;
        dy = (y - 16) / 12.4;
        d = dx * dx + dy * dy + 0.12 * Math.sin(x * 0.7) * Math.cos(y * 0.5);
        if (d < 1.18) {
          if (d > 0.92) px(g, x, y, C.dirtSh);
          else if (d > 0.78) px(g, x, y, (x + y) % 3 ? C.dirtMid : C.grassSh);
          else if (d > 0.55) px(g, x, y, C.water);
          else px(g, x, y, C.waterDp);
        }
      }
    }
    px(g, 12, 13, C.waterFm);
    px(g, 13, 13, C.waterFm);
    px(g, 21, 18, C.waterFm);
    px(g, 16, 20, C.waterFm);
    px(g, 24, 12, C.water);
    /* tiny lily — original oval, not a Stardew pad */
    fill(g, 14, 16, 4, 2, C.leaf);
    px(g, 13, 16, C.grassDp);
    px(g, 18, 16, C.grassDp);
    px(g, 15, 15, C.grassHi);
    return o.c;
  }

  function blob(g, cx, cy, rx, ry, fillC, shC, hiC, outC) {
    var x, y, dx, dy;
    for (y = -ry - 1; y <= ry + 1; y++) {
      for (x = -rx - 1; x <= rx + 1; x++) {
        dx = x / (rx + 0.2);
        dy = y / (ry + 0.2);
        if (dx * dx + dy * dy <= 1.05) {
          var edge = dx * dx + dy * dy > 0.78;
          var hi = dx < -0.15 && dy < -0.1 && !edge;
          var sh = dx > 0.25 || dy > 0.35;
          px(g, cx + x, cy + y, edge ? outC : hi ? hiC : sh ? shC : fillC);
        }
      }
    }
  }

  function buildTree() {
    var o = make(48, 56);
    var g = o.g;
    /* shadow */
    fill(g, 14, 50, 20, 3, "rgba(30,90,18,0.40)");
    fill(g, 16, 49, 16, 1, "rgba(30,90,18,0.28)");
    /* trunk */
    fill(g, 21, 36, 6, 16, C.woodMid);
    fill(g, 21, 36, 2, 16, C.woodHi);
    fill(g, 25, 36, 2, 16, C.woodSh);
    fill(g, 20, 36, 1, 16, C.woodOut);
    fill(g, 27, 36, 1, 16, C.woodOut);
    px(g, 23, 40, C.woodOut);
    px(g, 24, 46, C.woodSh);
    /* cluster canopy — four rounded lumps, not a lollipop */
    blob(g, 24, 14, 13, 10, C.grassMid, C.grassSh, C.grassHi, C.grassDp);
    blob(g, 13, 22, 10, 8, C.grassMid, C.grassSh, C.grassHi, C.grassDp);
    blob(g, 35, 21, 10, 8, C.grassMid, C.grassSh, C.grassHi, C.grassDp);
    blob(g, 24, 28, 11, 7, C.grassSh, C.grassDp, C.grassMid, C.grassDp);
    /* a few leaf holes / highlights */
    px(g, 18, 12, C.grassHi);
    px(g, 19, 12, C.grassHi);
    px(g, 30, 16, C.grassHi);
    px(g, 10, 20, C.grassDp);
    px(g, 38, 24, C.grassDp);
    return o.c;
  }

  function buildHouse() {
    var o = make(80, 64);
    var g = o.g;
    var x, y, half, x0, x1;

    /* ground shadow */
    fill(g, 8, 59, 66, 5, "rgba(30,90,18,0.38)");

    /* chimney LEFT — stone, original placement */
    fill(g, 14, 2, 9, 20, C.stone);
    fill(g, 14, 2, 9, 2, C.stoneHi);
    fill(g, 14, 2, 1, 20, C.stoneSh);
    fill(g, 22, 2, 1, 20, C.woodOut);
    fill(g, 15, 1, 7, 2, C.stoneSh);
    fill(g, 16, 0, 5, 2, C.stone);
    px(g, 17, 2, C.stoneHi);
    px(g, 19, 8, C.stoneSh);
    px(g, 16, 14, C.stoneSh);
    /* chimney lip */
    fill(g, 13, 8, 11, 2, C.stoneSh);

    /* gable roof */
    for (y = 6; y < 32; y++) {
      half = 8 + ((y - 6) * 30 / 26);
      x0 = Math.round(40 - half);
      x1 = Math.round(40 + half);
      fill(g, x0, y, x1 - x0, 1, (y % 5 === 0) ? C.roofSh : C.roof);
      if ((y + 2) % 5 === 0) {
        for (x = x0 + 2; x < x1 - 1; x += 4) px(g, x, y, C.roofHi);
      }
      px(g, x0, y, C.woodOut);
      px(g, x1 - 1, y, C.woodOut);
    }
    /* ridge */
    fill(g, 36, 5, 8, 2, C.roofSh);
    fill(g, 38, 4, 4, 2, C.roofHi);
    /* eaves */
    fill(g, 4, 31, 72, 3, C.woodSh);
    fill(g, 4, 31, 72, 1, C.woodHi);
    fill(g, 4, 33, 72, 1, C.woodOut);

    /* front wall planks */
    fill(g, 8, 34, 64, 26, C.woodMid);
    for (y = 36; y < 58; y += 4) {
      fill(g, 8, y, 64, 1, C.woodSh);
      fill(g, 8, y + 1, 64, 1, C.woodHi);
    }
    fill(g, 8, 34, 1, 26, C.woodOut);
    fill(g, 71, 34, 1, 26, C.woodOut);

    /* foundation sill */
    fill(g, 7, 58, 66, 4, C.stone);
    fill(g, 7, 58, 66, 1, C.stoneHi);
    fill(g, 7, 61, 66, 1, C.stoneSh);
    px(g, 12, 59, C.stoneSh);
    px(g, 28, 60, C.stoneSh);
    px(g, 50, 59, C.stoneHi);
    px(g, 64, 60, C.stoneSh);

    /* windows */
    function windowAt(wx, wy) {
      fill(g, wx - 1, wy - 1, 12, 12, C.woodOut);
      fill(g, wx, wy, 10, 10, C.glass);
      fill(g, wx, wy, 10, 1, C.woodHi);
      fill(g, wx + 4, wy, 2, 10, C.woodOut);
      fill(g, wx, wy + 4, 10, 2, C.woodOut);
      px(g, wx + 1, wy + 1, C.parch);
      /* flower box */
      fill(g, wx - 1, wy + 10, 12, 3, C.woodSh);
      fill(g, wx - 1, wy + 10, 12, 1, C.woodHi);
      px(g, wx + 1, wy + 9, C.leaf);
      px(g, wx + 3, wy + 9, C.blossom);
      px(g, wx + 5, wy + 9, C.leaf);
      px(g, wx + 7, wy + 9, C.flower);
      px(g, wx + 8, wy + 9, C.leaf);
    }
    windowAt(14, 40);
    windowAt(56, 40);

    /* centered Dutch door — split leaf, diamond pane */
    fill(g, 33, 42, 14, 20, C.woodOut);
    fill(g, 34, 43, 12, 9, C.door);
    fill(g, 34, 53, 12, 8, C.woodMid);
    fill(g, 34, 52, 12, 1, C.woodOut);
    fill(g, 34, 43, 12, 1, C.woodHi);
    /* diamond pane */
    px(g, 40, 45, C.glass);
    px(g, 39, 46, C.glass); px(g, 40, 46, C.parch); px(g, 41, 46, C.glass);
    px(g, 40, 47, C.glass);
    /* knob */
    px(g, 44, 55, C.woodHi);
    px(g, 44, 48, C.woodHi);

    /* two-step stoop */
    fill(g, 32, 60, 16, 3, C.stone);
    fill(g, 34, 62, 12, 2, C.stoneHi);

    return o.c;
  }

  function buildWell() {
    var o = make(16, 28);
    var g = o.g;
    fill(g, 2, 24, 12, 3, "rgba(30,90,18,0.35)");
    /* roof */
    fill(g, 2, 0, 12, 2, C.roofSh);
    for (var y = 2; y < 8; y++) {
      var inset = Math.floor((y - 2) / 2);
      fill(g, 1 + inset, y, 14 - inset * 2, 1, (y % 2) ? C.roof : C.roofSh);
    }
    /* posts */
    fill(g, 3, 8, 2, 10, C.woodMid);
    fill(g, 11, 8, 2, 10, C.woodMid);
    fill(g, 3, 8, 1, 10, C.woodHi);
    fill(g, 12, 8, 1, 10, C.woodSh);
    /* beam */
    fill(g, 3, 8, 10, 2, C.woodSh);
    /* bucket */
    fill(g, 7, 11, 3, 4, C.woodMid);
    fill(g, 7, 11, 3, 1, C.woodHi);
    /* stone cylinder */
    fill(g, 2, 17, 12, 8, C.stone);
    fill(g, 3, 16, 10, 2, C.stoneHi);
    fill(g, 4, 18, 8, 5, C.waterDp);
    fill(g, 2, 17, 12, 1, C.woodOut);
    px(g, 6, 20, C.water);
    px(g, 9, 21, C.waterFm);
    return o.c;
  }

  function buildMailbox() {
    var o = make(14, 20);
    var g = o.g;
    fill(g, 3, 17, 8, 2, "rgba(30,90,18,0.35)");
    fill(g, 6, 10, 2, 9, C.woodMid);
    fill(g, 6, 10, 1, 9, C.woodHi);
    /* rounded wood box, slot, teal flag */
    fill(g, 2, 3, 10, 8, C.woodMid);
    fill(g, 3, 2, 8, 2, C.woodHi);
    fill(g, 2, 3, 1, 8, C.woodOut);
    fill(g, 11, 3, 1, 8, C.woodOut);

  function buildSolid() {
    var y, x, i;
    solid = [];
    for (y = 0; y < ROWS; y++) {
      solid[y] = [];
      for (x = 0; x < COLS; x++) solid[y][x] = false;
    }
    function block(tx, ty) {
      if (tx >= 0 && ty >= 0 && tx < COLS && ty < ROWS) solid[ty][tx] = true;
    }
    for (y = 1; y <= 4; y++) {
      for (x = 13; x <= 17; x++) block(x, y);
    }
    block(2, 3);
    block(1, 9); block(2, 9); block(1, 10); block(2, 10);
    block(18, 4);
    block(8, 3); block(18, 10); block(11, 11);
    var fences = [[4, 5], [5, 5], [6, 5], [4, 6], [4, 7], [4, 8], [7, 5], [7, 6], [7, 7], [7, 8]];
    for (i = 0; i < fences.length; i++) block(fences[i][0], fences[i][1]);
    block(npc.tx, npc.ty);
  }

  function inBounds(tx, ty) {
    return tx >= 0 && ty >= 0 && tx < COLS && ty < ROWS;
  }

  function walkable(tx, ty) {
    return inBounds(tx, ty) && !solid[ty][tx];
  }

  function chickenOk(tx, ty) {
    if (!walkable(tx, ty)) return false;
    var ch = cell(tx, ty);
    return ch === "g" || ch === "d";
  }

  function tileCenterX(tx) { return tx * TILE + 8; }
  function tileFootY(ty) { return ty * TILE + 14; }

  function findPath(sx, sy, ex, ey) {
    if (!walkable(ex, ey)) return [];
    if (sx === ex && sy === ey) return [];
    var q = [[sx, sy]];
    var came = {};
    function key(x, y) { return x + "," + y; }
    came[key(sx, sy)] = null;
    var dirs = [[0, -1], [0, 1], [-1, 0], [1, 0]];
    var head = 0;
    var i, cur, nx, ny, nk, path, node, k;
    while (head < q.length) {
      cur = q[head++];
      if (cur[0] === ex && cur[1] === ey) {
        path = [];
        k = key(ex, ey);
        while (came[k]) {
          node = came[k];
          path.push({ tx: node[2], ty: node[3] });
          k = node[0] + "," + node[1];
        }
        path.reverse();
        return path;
      }
      for (i = 0; i < 4; i++) {
        nx = cur[0] + dirs[i][0];
        ny = cur[1] + dirs[i][1];
        nk = key(nx, ny);
        if (came[nk] !== undefined) continue;
        if (!walkable(nx, ny)) continue;
        came[nk] = [cur[0], cur[1], nx, ny];
        q.push([nx, ny]);
      }
    }
    return [];
  }

  function faceToward(who, tx, ty) {
    var dx = tx - who.tx;
    var dy = ty - who.ty;
    if (Math.abs(dx) > Math.abs(dy)) who.face = dx > 0 ? "right" : "left";
    else if (dy !== 0) who.face = dy > 0 ? "down" : "up";
  }

  function startWalk(who, path, speed) {
    who.x = tileCenterX(who.tx);
    who.y = tileFootY(who.ty);
    who.path = path || [];
    who.speed = speed;
    who.stepT = 0;
    who.anim = 0;
    if (who.path.length) {
      who.stepFrom = { tx: who.tx, ty: who.ty };
      who.moving = true;
      faceToward(who, who.path[0].tx, who.path[0].ty);
    } else {
      who.moving = false;
      who.frame = 0;
    }
  }

  function advanceWalk(who, dt) {
    if (!who.path || !who.path.length) {
      who.moving = false;
      who.frame = 0;
      return false;
    }
    var dest = who.path[0];
    var speed = who.speed || 1.7;
    who.stepT += (dt / 1000) * speed;
    if (who.stepT >= 1) {
      who.tx = dest.tx;
      who.ty = dest.ty;
      who.x = tileCenterX(who.tx);
      who.y = tileFootY(who.ty);
      who.path.shift();
      who.stepT = 0;
      if (who.path.length) {
        who.stepFrom = { tx: who.tx, ty: who.ty };
        faceToward(who, who.path[0].tx, who.path[0].ty);
      } else {
        who.moving = false;
        who.frame = 0;
        return true;
      }
    } else {
      var fx = tileCenterX(who.stepFrom.tx);
      var fy = tileFootY(who.stepFrom.ty);
      who.x = fx + (tileCenterX(dest.tx) - fx) * who.stepT;
      who.y = fy + (tileFootY(dest.ty) - fy) * who.stepT;
      who.moving = true;
    }
    who.anim += dt;
    if (who.anim > 180) {
      who.anim = 0;
      who.frame = who.frame ? 0 : 1;
    }
    return false;
  }

  function isNear(ax, ay, bx, by) {
    return Math.abs(ax - bx) + Math.abs(ay - by) <= 1;
  }

  function nearestAdjacent(tx, ty) {
    var dirs = [[0, 1], [0, -1], [-1, 0], [1, 0]];
    var best = null, bestD = 999, i, nx, ny, d;
    for (i = 0; i < 4; i++) {
      nx = tx + dirs[i][0];
      ny = ty + dirs[i][1];
      if (!walkable(nx, ny)) continue;
      d = Math.abs(nx - player.tx) + Math.abs(ny - player.ty);
      if (d < bestD) {
        bestD = d;
        best = { tx: nx, ty: ny };
      }
    }
    return best;
  }

  function plantAt(tx, ty) {
    var k = tx + "," + ty;
    if (cell(tx, ty) !== "p") return;
    if (crops[k]) return;
    crops[k] = "sprout";
  }

  function arrive() {
    if (!pending) return;
    var act = pending;
    pending = null;
    if (act.type === "plant") {
      if (isNear(player.tx, player.ty, act.tx, act.ty)) {
        plantAt(act.tx, act.ty);
        faceToward(player, act.tx, act.ty);
      }
    } else if (act.type === "talk") {
      if (isNear(player.tx, player.ty, npc.tx, npc.ty)) {
        faceToward(player, npc.tx, npc.ty);
        faceToward(npc, player.tx, player.ty);
        dialogue = true;
      }
    }
  }

  function goTalk() {
    highlight = { tx: npc.tx, ty: npc.ty };
    if (isNear(player.tx, player.ty, npc.tx, npc.ty)) {
      pending = null;
      startWalk(player, [], 1.7);
      faceToward(player, npc.tx, npc.ty);
      faceToward(npc, player.tx, player.ty);
      dialogue = true;
      return;
    }
    var dest = nearestAdjacent(npc.tx, npc.ty);
    if (!dest) return;
    pending = { type: "talk" };
    startWalk(player, findPath(player.tx, player.ty, dest.tx, dest.ty), 1.7);
  }

  function goPlant(tx, ty) {
    if (isNear(player.tx, player.ty, tx, ty)) {
      pending = null;
      plantAt(tx, ty);
      faceToward(player, tx, ty);
      return;
    }
    var dest = walkable(tx, ty) ? { tx: tx, ty: ty } : nearestAdjacent(tx, ty);
    if (!dest) return;
    var path = findPath(player.tx, player.ty, dest.tx, dest.ty);
    if (!path.length) return;
    pending = { type: "plant", tx: tx, ty: ty };
    startWalk(player, path, 1.7);
  }

  function goWalk(tx, ty) {
    pending = null;
    if (!walkable(tx, ty)) return;
    startWalk(player, findPath(player.tx, player.ty, tx, ty), 1.7);
  }

  function updateChicken(dt) {
    if (chicken.react > 0) chicken.react -= dt;
    chicken.anim += dt;
    if (chicken.anim > 280) {
      chicken.anim = 0;
      chicken.frame = chicken.frame ? 0 : 1;
    }
    if (chicken.path && chicken.path.length) {
      advanceWalk(chicken, dt);
      return;
    }
    chicken.idle -= dt;
    if (chicken.idle > 0) return;
    chicken.idle = 900 + Math.random() * 2200;
    var dirs = [[0, -1], [0, 1], [-1, 0], [1, 0]];
    var tries, d, nx, ny;
    for (tries = 0; tries < 8; tries++) {
      d = dirs[(Math.random() * 4) | 0];
      nx = chicken.tx + d[0];
      ny = chicken.ty + d[1];
      if (chickenOk(nx, ny)) {
        startWalk(chicken, [{ tx: nx, ty: ny }], 1.3);
        return;
      }
    }
  }

  function drawShadow(g, x, y, hw) {
    var ix = Math.round(x);
    var iy = Math.round(y);
    fill(g, ix - hw, iy - 2, hw * 2, 3, "rgba(30,90,18,0.40)");
    fill(g, ix - hw + 2, iy - 3, hw * 2 - 4, 1, "rgba(30,90,18,0.22)");
  }

  function drawPlayer(g) {
    var bob = (player.moving && player.frame) ? -1 : 0;
    drawShadow(g, player.x, player.y, 5);
    g.drawImage(assets.player[player.face][player.frame], Math.round(player.x) - 8, Math.round(player.y) - 28 + bob);
  }

  function drawNpc(g) {
    var face = assets.npc[npc.face] ? npc.face : "down";
    drawShadow(g, npc.x, npc.y, 5);
    g.drawImage(assets.npc[face][0], Math.round(npc.x) - 8, Math.round(npc.y) - 28);
  }

  function drawChickenSpr(g) {
    var bob = chicken.frame ? -1 : 0;
    var hop = chicken.react > 0 ? -3 : 0;
    var face = chicken.face === "left" ? "left" : "right";
    drawShadow(g, chicken.x, chicken.y, 4);
    g.drawImage(assets.chicken[face][chicken.frame], Math.round(chicken.x) - 8, Math.round(chicken.y) - 14 + bob + hop);
  }

  function drawActors(g) {
    var list = [];
    var i;
    for (i = 0; i < PROPS.length; i++) {
      list.push({ foot: propFoot(PROPS[i]), kind: "prop", p: PROPS[i] });
    }
    list.push({ foot: player.y, kind: "player" });
    list.push({ foot: chicken.y, kind: "chicken" });
    list.push({ foot: npc.y, kind: "npc" });
    list.sort(function (a, b) { return a.foot - b.foot; });
    for (i = 0; i < list.length; i++) {
      if (list[i].kind === "prop") drawProp(g, list[i].p);
      else if (list[i].kind === "player") drawPlayer(g);
      else if (list[i].kind === "chicken") drawChickenSpr(g);
      else drawNpc(g);
    }
  }

  function drawDialogue(g) {
    if (!dialogue) return;
    var x = 16, y = 116, w = 288, h = 50;
    woodPanel(g, x, y, w, h);
    fill(g, x + 4, y + 4, w - 8, h - 8, C.parch);
    woodPanel(g, x + 8, y - 6, 62, 11);
    drawText(g, "NEIGHBOR", x + 12, y - 3, C.parch);
    drawText(g, "HI! WELCOME TO", x + 10, y + 12, C.uiText);
    drawText(g, "MOONDROP MOUNTAIN.", x + 10, y + 22, C.uiText);
  }

  function hitSprite(p, x, y, w, h, ox, oy) {
    var left = x - ox;
    var top = y - oy;
    return p.x >= left && p.x < left + w && p.y >= top && p.y < top + h;
  }


  function buildAssets() {
    assets.grass = [buildGrass(0), buildGrass(1), buildGrass(2), buildGrass(3)];
    assets.dirt = buildDirt();
    assets.till = buildTill();
    assets.pond = buildPond();
    assets.tree = buildTree();
    assets.house = buildHouse();
    assets.well = buildWell();
    assets.mailbox = buildMailbox();
    assets.crate = buildCrate();
    assets.rock = [buildRock(0), buildRock(1)];
    assets.weed = [buildWeed(0), buildWeed(1)];
    assets.fenceH = buildFenceH();
    assets.fenceL = buildFenceL();
    assets.fenceR = buildFenceR();
    assets.seed = buildSeed();
    assets.sprout = buildSprout();
    function packPerson(kind) {
      var right0 = buildPerson(kind, "right", 0);
      var right1 = buildPerson(kind, "right", 1);
      return {
        down: [buildPerson(kind, "down", 0), buildPerson(kind, "down", 1)],
        up: [buildPerson(kind, "up", 0), buildPerson(kind, "up", 1)],
        right: [right0, right1],
        left: [flipH(right0), flipH(right1)]
      };
    }
    assets.player = packPerson("player");
    assets.npc = packPerson("npc");
    var ch0 = buildChicken(0);
    var ch1 = buildChicken(1);
    assets.chicken = { right: [ch0, ch1], left: [flipH(ch0), flipH(ch1)] };
  }

  function drawText(g, str, x, y, color) {
    g.fillStyle = color;
    var i, r, c, bits, ch;
    for (i = 0; i < str.length; i++) {
      ch = str.charAt(i);
      bits = FONT[ch] || FONT[" "];
      for (r = 0; r < 7; r++) {
        for (c = 0; c < 5; c++) {
          if (bits[r] & (0x10 >> c)) {
            g.fillRect(x + i * 6 + c, y + r, 1, 1);
          }
        }
      }
    }
  }

  function textWidth(str) {
    return str.length * 6 - 1;
  }

  function woodPanel(g, x, y, w, h) {
    fill(g, x, y, w, h, C.woodMid);
    fill(g, x, y, w, 1, C.woodHi);
    fill(g, x, y, 1, h, C.woodHi);
    fill(g, x, y + h - 1, w, 1, C.bevelDk);
    fill(g, x + w - 1, y, 1, h, C.bevelDk);
    fill(g, x + 1, y + 1, w - 2, 1, C.woodHi);
    fill(g, x + 1, y + h - 2, w - 2, 1, C.woodSh);
  }

  function grassIndex(tx, ty) {
    return ((tx * 3 + ty * 7) >>> 0) % 4;
  }

  function drawDirtTile(g, tx, ty, dx, dy) {
    g.drawImage(assets.dirt, dx, dy);
    /* jagged grass bites on edges */
    var n = cell(tx, ty - 1) === "g";
    var s = cell(tx, ty + 1) === "g";
    var e = cell(tx + 1, ty) === "g";
    var w = cell(tx - 1, ty) === "g";
    var i, ox, col;
    if (n) {
      for (i = 0; i < 16; i++) {
        ox = (hash(tx, ty, i + 40) < 0.45) ? 2 : 1;
        col = hash(tx, i, 2) < 0.5 ? C.grassMid : C.grassHi;
        fill(g, dx + i, dy, 1, ox, col);
        if (hash(tx, ty, i) < 0.25) px(g, dx + i, dy + ox, C.grassSh);
      }
    }
    if (s) {
      for (i = 0; i < 16; i++) {
        ox = (hash(tx, ty, i + 80) < 0.4) ? 2 : 1;
        col = hash(tx, i, 5) < 0.5 ? C.grassMid : C.grassSh;
        fill(g, dx + i, dy + 16 - ox, 1, ox, col);
      }
    }
    if (w) {
      for (i = 0; i < 16; i++) {
        ox = (hash(tx, ty, i + 120) < 0.4) ? 2 : 1;
        col = hash(ty, i, 3) < 0.5 ? C.grassMid : C.grassHi;
        fill(g, dx, dy + i, ox, 1, col);
      }
    }
    if (e) {
      for (i = 0; i < 16; i++) {
        ox = (hash(tx, ty, i + 160) < 0.4) ? 2 : 1;
        col = hash(ty, i, 8) < 0.5 ? C.grassMid : C.grassSh;
        fill(g, dx + 16 - ox, dy + i, ox, 1, col);
      }
    }
  }


  function propFoot(p) {
    if (p.kind === "house") return p.ty * TILE + 64;
    if (p.kind === "tree") return p.ty * TILE + 24;
    if (p.kind === "well") return p.ty * TILE + 28;
    if (p.kind === "mailbox") return p.ty * TILE + 20;
    if (p.kind === "pond") return p.ty * TILE + 20;
    if (p.kind === "crate") return p.ty * TILE + 14;
    return p.ty * TILE + TILE;
  }

  function drawProp(g, p) {
    var x = p.tx * TILE;
    var y = p.ty * TILE;
    if (p.kind === "house") {
      g.drawImage(assets.house, x, y);
    } else if (p.kind === "tree") {
      g.drawImage(assets.tree, x - 16, y - 40);
    } else if (p.kind === "well") {
      g.drawImage(assets.well, x, y - 12);
    } else if (p.kind === "mailbox") {
      g.drawImage(assets.mailbox, x + 2, y - 4);
    } else if (p.kind === "crate") {
      g.drawImage(assets.crate, x + 1, y + 2);
    } else if (p.kind === "pond") {
      g.drawImage(assets.pond, x - 2, y);
      if (((tick / 700) | 0) % 2) {
        px(g, x + 18, y + 11, C.waterFm);
        px(g, x + 10, y + 19, C.waterFm);
      }
    } else if (p.kind === "rock") {
      g.drawImage(assets.rock[(p.tx + p.ty) & 1], x, y);
    } else if (p.kind === "weed") {
      g.drawImage(assets.weed[(p.tx + p.ty) & 1], x, y);
    } else if (p.kind === "fenceH") {
      g.drawImage(assets.fenceH, x, y);
    } else if (p.kind === "fenceL") {
      g.drawImage(assets.fenceL, x, y);
    } else if (p.kind === "fenceR") {
      g.drawImage(assets.fenceR, x, y);
    }
  }

  function strokeCircle(g, cx, cy, r, color) {
    g.fillStyle = color;
    var a, x, y;
    for (a = 0; a < 360; a += 10) {
      x = Math.round(cx + Math.cos(a * Math.PI / 180) * r);
      y = Math.round(cy + Math.sin(a * Math.PI / 180) * r);
      g.fillRect(x, y, 1, 1);
    }
  }

  function drawHUD(g) {
    /* title plaque — widened for MOONDROP MOUNTAIN */
    woodPanel(g, 4, 4, 114, 13);
    drawText(g, "MOONDROP MOUNTAIN", 8, 7, C.parch);

    /* day plaque */
    woodPanel(g, 206, 4, 110, 21);
    fill(g, 210, 8, 7, 7, C.flower);
    fill(g, 212, 10, 3, 3, C.parch);
    px(g, 209, 11, C.flower);
    px(g, 217, 11, C.flower);
    px(g, 213, 7, C.flower);
    drawText(g, "DAY 1", 220, 8, C.uiText);
    drawText(g, "SPRING · MORNING", 210, 16, C.parch);

    /* hotbar */
    var slots = 10;
    var slot = 18;
    var gap = 1;
    var barW = slots * slot + (slots - 1) * gap;
    var bx = ((VIEW_W - barW) / 2) | 0;
    var by = VIEW_H - 22;
    woodPanel(g, bx - 3, by - 3, barW + 6, 24);
    var i, sx, sy, sel;
    for (i = 0; i < slots; i++) {
      sx = bx + i * (slot + gap);
      sy = by;
      sel = i === selectedSlot;
      fill(g, sx, sy, slot, slot, sel ? C.woodHi : C.woodSh);
      fill(g, sx + 1, sy + 1, slot - 2, slot - 2, C.slot);
      fill(g, sx + 2, sy + 2, slot - 4, slot - 4, sel ? "#6A4420" : "#5A3818");
      if (sel) {
        fill(g, sx, sy, slot, 1, C.parch);
        fill(g, sx, sy, 1, slot, C.parch);
      }
      if (i === 0) {
        g.drawImage(assets.seed, sx + 1, sy + 1);
      }
    }

    /* energy */
    var ex = VIEW_W - 16;
    var ey = VIEW_H - 70;
    woodPanel(g, ex - 2, ey - 10, 14, 56);
    drawText(g, "E", ex + 2, ey - 8, C.parch);
    fill(g, ex + 1, ey + 2, 8, 40, C.energyEmpty);
    fill(g, ex + 1, ey + 2, 8, 40, C.energy);
    fill(g, ex + 1, ey + 2, 8, 1, C.grassHi);
    fill(g, ex + 1, ey + 2, 1, 40, C.grassHi);
  }

  function drawWorld(g, dt) {
    var tx, ty, ch, dx, dy;

    for (ty = 0; ty < ROWS; ty++) {
      for (tx = 0; tx < COLS; tx++) {
        ch = cell(tx, ty);
        dx = tx * TILE;
        dy = ty * TILE;
        if (ch === "d") drawDirtTile(g, tx, ty, dx, dy);
        else if (ch === "p") {
          g.drawImage(assets.till, dx, dy);
          if (crops[tx + "," + ty]) g.drawImage(assets.sprout, dx, dy);
        }
        else g.drawImage(assets.grass[grassIndex(tx, ty)], dx, dy);
      }
    }

    if (highlight) {
      g.fillStyle = "rgba(243,210,163,0.32)";
      g.fillRect(highlight.tx * TILE, highlight.ty * TILE, TILE, TILE);
      g.fillStyle = "rgba(243,210,163,0.7)";
      g.fillRect(highlight.tx * TILE, highlight.ty * TILE, TILE, 1);
      g.fillRect(highlight.tx * TILE, highlight.ty * TILE, 1, TILE);
      g.fillRect(highlight.tx * TILE, highlight.ty * TILE + 15, TILE, 1);
      g.fillRect(highlight.tx * TILE + 15, highlight.ty * TILE, 1, TILE);
    }

    var i, rp, life, r, alpha;
    for (i = ripples.length - 1; i >= 0; i--) {
      rp = ripples[i];
      rp.age += dt;
      life = rp.age / 520;
      if (life >= 1) {
        ripples.splice(i, 1);
        continue;
      }
      r = 2 + life * 16;
      alpha = 1 - life;
      strokeCircle(g, rp.x, rp.y, r, "rgba(243,210,163," + (alpha * 0.85).toFixed(2) + ")");
      if (r > 5) {
        strokeCircle(g, rp.x, rp.y, r - 3, "rgba(232,176,96," + (alpha * 0.45).toFixed(2) + ")");
      }
    }

    drawActors(g);
    drawHUD(g);
    drawDialogue(g);
  }

  function resize() {
    var vv = window.visualViewport;
    var w = (vv && vv.width) ? vv.width : window.innerWidth;
    var h = (vv && vv.height) ? vv.height : window.innerHeight;
    scale = Math.floor(Math.min(w / VIEW_W, h / VIEW_H));
    if (scale < 1) scale = 1;
    if (scale > 6) scale = 6;
    canvas.style.width = (VIEW_W * scale) + "px";
    canvas.style.height = (VIEW_H * scale) + "px";
    ctx.imageSmoothingEnabled = false;
  }

  function pointFromEvent(e) {
    var src = e;
    if (e.changedTouches && e.changedTouches[0]) src = e.changedTouches[0];
    else if (e.touches && e.touches[0]) src = e.touches[0];
    var rect = canvas.getBoundingClientRect();
    return {
      x: (src.clientX - rect.left) / rect.width * VIEW_W,
      y: (src.clientY - rect.top) / rect.height * VIEW_H
    };
  }

  function tap(e) {
    var p = pointFromEvent(e);
    if (p.x < 0 || p.y < 0 || p.x >= VIEW_W || p.y >= VIEW_H) return;

    if (dialogue) {
      dialogue = false;
      return;
    }

    var slots = 10;
    var slot = 18;
    var gap = 1;
    var barW = slots * slot + (slots - 1) * gap;
    var bx = ((VIEW_W - barW) / 2) | 0;
    var by = VIEW_H - 22;
    if (p.y >= by - 3 && p.y <= by + 18 && p.x >= bx && p.x <= bx + barW) {
      var idx = ((p.x - bx) / (slot + gap)) | 0;
      if (idx >= 0 && idx < slots) selectedSlot = idx;
      return;
    }

    if (hitSprite(p, npc.x, npc.y, 16, 32, 8, 28)) {
      goTalk();
      return;
    }
    if (hitSprite(p, chicken.x, chicken.y, 16, 16, 8, 14)) {
      chicken.react = 420;
      chicken.idle = 500;
      return;
    }

    var tx = Math.floor(p.x / TILE);
    var ty = Math.floor(p.y / TILE);
    if (tx < 0 || ty < 0 || tx >= COLS || ty >= ROWS) return;
    highlight = { tx: tx, ty: ty };
    ripples.push({
      x: tx * TILE + 8,
      y: ty * TILE + 8,
      age: 0
    });
    if (tx === npc.tx && ty === npc.ty) {
      goTalk();
      return;
    }
    if (tx === chicken.tx && ty === chicken.ty) {
      chicken.react = 420;
      chicken.idle = 500;
      return;
    }
    if (selectedSlot === 0 && cell(tx, ty) === "p" && !crops[tx + "," + ty]) {
      goPlant(tx, ty);
      return;
    }
    goWalk(tx, ty);
  }

  function loop(ts) {
    if (!lastTs) lastTs = ts;
    var dt = ts - lastTs;
    if (dt > 64) dt = 64;
    lastTs = ts;
    ctx.imageSmoothingEnabled = false;
    if (!dialogue) {
      if (player.moving || (player.path && player.path.length)) {
        if (advanceWalk(player, dt)) arrive();
      }
      updateChicken(dt);
      tick += dt;
    }
    drawWorld(ctx, dt);
    requestAnimationFrame(loop);
  }

  buildAssets();
  buildSolid();
  resize();
  window.addEventListener("resize", resize);
  if (window.visualViewport) {
    window.visualViewport.addEventListener("resize", resize);
    window.visualViewport.addEventListener("scroll", resize);
  }
  canvas.addEventListener("pointerdown", tap, { passive: true });
  document.addEventListener("touchmove", function (e) {
    e.preventDefault();
  }, { passive: false });
  document.addEventListener("gesturestart", function (e) {
    e.preventDefault();
  });
  document.addEventListener("dblclick", function (e) {
    e.preventDefault();
  });
  requestAnimationFrame(loop);
})();
  </script>
</body>
</html>
